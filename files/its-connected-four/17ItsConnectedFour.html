<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Its Connected Four</title><style> :root { --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.85); --border-color: rgba(255, 255, 255, 0.1); --accent-color: #38bdf8; --accent-hover: #0ea5e9; --text-color: #f8fafc; --p1-color: #f43f5e; /* Kırmızı / Pembe */ --p2-color: #facc15; /* Sarı */ --board-bg: #1d4ed8; --slot-bg: #0f172a; } * { box-sizing: border-box; user-select: none; -webkit-user-select: none; } body { margin: 0; padding: 0; background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; } .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 520px; padding: 15px; gap: 12px; } /* Ana Menü Ekranı */ .menu-screen { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 16px; } h1 { margin: 0 0 10px 0; font-size: clamp(1.8rem, 7vw, 2.6rem); letter-spacing: 1px; color: var(--accent-color); text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); text-align: center; } .menu-btn { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; } .menu-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(56, 189, 248, 0.2); } .menu-btn:active { transform: translateY(0); } /* Oyun Ekranı */ .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; } .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; font-size: 1.05rem; font-weight: 600; } .status-text { color: var(--accent-color); } /* Connect Four Oyun Tahtası (7 sütun x 6 satır) */ .board { display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); gap: 6px; width: 100%; background: var(--board-bg); padding: 10px; border-radius: 16px; border: 3px solid #1e40af; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); aspect-ratio: 7 / 6; cursor: pointer; } .cell { background: var(--slot-bg); border-radius: 50%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 6px rgba(0,0,0,0.6); } .disc { width: 85%; height: 85%; border-radius: 50%; position: absolute; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 4px 6px rgba(0,0,0,0.3); } .disc.p1 { background: radial-gradient(circle at 30% 30%, #fb7185, var(--p1-color)); } .disc.p2 { background: radial-gradient(circle at 30% 30%, #fde047, var(--p2-color)); } .game-footer-btns { display: flex; gap: 10px; width: 100%; } .action-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; } .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-color); } /* Kazanma / Beraberlik Modalı */ .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.active { opacity: 1; pointer-events: auto; } .modal { background: #1e293b; border: 2px solid var(--accent-color); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 350px; width: 90%; transform: scale(0.8); transition: transform 0.3s ease; } .modal-overlay.active .modal { transform: scale(1); } .modal h2 { color: var(--accent-color); margin-top: 0; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); } .modal p { margin: 0 0 20px 0; font-size: 1.2rem; color: #cbd5e1; } .modal-btn-group { display: flex; gap: 10px; } .modal button { flex: 1; background: var(--accent-color); color: #0f172a; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; } .modal button:hover { background: var(--accent-hover); } .confetti { position: absolute; width: 8px; height: 8px; background-color: #f1c40f; animation: fall linear forwards; z-index: 1999; border-radius: 50%; } @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } } /* Telif Yazısı */ .footer-credit { position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.35); pointer-events: none; letter-spacing: 1px; font-family: sans-serif; } </style></head><body><div class="game-wrapper"><div id="menuScreen" class="menu-screen"><h1>Its Connected Four</h1><button class="menu-btn" onclick="startGame('bot')">Bot Mode</button><button class="menu-btn" onclick="startGame('pvp')">1v1 Mode</button></div><div id="gameScreen" class="game-screen"><div class="game-header"><span id="statusText" class="status-text">Turn: Red</span><span id="modeText">Bot Mode</span></div><div class="board" id="board"></div><div class="game-footer-btns"><button class="action-btn" onclick="resetGame()">Restart</button><button class="action-btn" onclick="backToMenu()">Menu</button></div></div></div><div class="modal-overlay" id="resultModal"><div class="modal"><h2 id="modalTitle">Red Wins!</h2><p id="modalDesc">Magnificent victory!</p><div class="modal-btn-group"><button onclick="resetGame()">Play Again</button><button onclick="backToMenu()" style="background: rgba(255,255,255,0.1); color: #fff;">Menu</button></div></div></div><div class="footer-credit">Powered by SGame Studios -- SGame Studios ©2026</div><script> const ROWS = 6; const COLS = 7; let board = []; let currentPlayer = 1; // 1: Kırmızı (Red), 2: Sarı (Yellow) let gameMode = ''; let isGameActive = false; const menuScreen = document.getElementById('menuScreen'); const gameScreen = document.getElementById('gameScreen'); const statusText = document.getElementById('statusText'); const modeText = document.getElementById('modeText'); const boardEl = document.getElementById('board'); const resultModal = document.getElementById('resultModal'); const modalTitle = document.getElementById('modalTitle'); const modalDesc = document.getElementById('modalDesc'); // Web Audio API ses efektleri const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playSound(type) { if (audioCtx.state === 'suspended') { audioCtx.resume(); } const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); if (type === 'drop') { osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.12); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12); osc.start(); osc.stop(audioCtx.currentTime + 0.12); } else if (type === 'win') { const notes = [523.25, 659.25, 783.99, 1046.50]; notes.forEach((freq, index) => { let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle'; o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1); g.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.3); o.start(audioCtx.currentTime + index * 0.1); o.stop(audioCtx.currentTime + index * 0.1 + 0.3); }); } else if (type === 'draw') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(250, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } } function startGame(mode) { gameMode = mode; menuScreen.style.display = 'none'; gameScreen.style.display = 'flex'; modeText.innerText = mode === 'bot' ? 'Bot Mode' : '1v1 Mode'; resetGame(); } function backToMenu() { gameScreen.style.display = 'none'; menuScreen.style.display = 'flex'; resultModal.classList.remove('active'); isGameActive = false; } function resetGame() { board = Array(ROWS).fill(null).map(() => Array(COLS).fill(0)); currentPlayer = 1; isGameActive = true; statusText.innerText = "Turn: Red"; resultModal.classList.remove('active'); renderBoard(); } function renderBoard() { boardEl.innerHTML = ''; for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS; c++) { const cell = document.createElement('div'); cell.className = 'cell'; cell.dataset.col = c; if (board[r][c] !== 0) { const disc = document.createElement('div'); disc.className = `disc ${board[r][c] === 1 ? 'p1' : 'p2'}`; cell.appendChild(disc); } cell.onclick = () => handleColumnClick(c); boardEl.appendChild(cell); } } } function handleColumnClick(col) { if (!isGameActive) return; // Sütundaki boş en alt satırı bul let row = -1; for (let r = ROWS - 1; r >= 0; r--) { if (board[r][col] === 0) { row = r; break; } } if (row === -1) return; // Sütun dolu makeMove(row, col, currentPlayer); playSound('drop'); if (checkWin(currentPlayer)) { triggerGameOver(currentPlayer === 1 ? 'Red' : 'Yellow', 'win'); return; } if (checkBoardFull()) { triggerGameOver('Draw', 'draw'); return; } currentPlayer = currentPlayer === 1 ? 2 : 1; statusText.innerText = `Turn: ${currentPlayer === 1 ? 'Red' : 'Yellow'}`; if (gameMode === 'bot' && currentPlayer === 2 && isGameActive) { isGameActive = false; setTimeout(() => { botMove(); }, 450); } } function makeMove(row, col, player) { board[row][col] = player; renderBoard(); } function checkBoardFull() { return board[0].every(cell => cell !== 0); } function checkWin(player) { // Yatay kontrol for (let r = 0; r < ROWS; r++) { for (let c = 0; c < COLS - 3; c++) { if (board[r][c] === player && board[r][c+1] === player && board[r][c+2] === player && board[r][c+3] === player) return true; } } // Dikey kontrol for (let r = 0; r < ROWS - 3; r++) { for (let c = 0; c < COLS; c++) { if (board[r][c] === player && board[r+1][c] === player && board[r+2][c] === player && board[r+3][c] === player) return true; } } // Çapraz (sağ aşağı) for (let r = 0; r < ROWS - 3; r++) { for (let c = 0; c < COLS - 3; c++) { if (board[r][c] === player && board[r+1][c+1] === player && board[r+2][c+2] === player && board[r+3][c+3] === player) return true; } } // Çapraz (sol aşağı) for (let r = 0; r < ROWS - 3; r++) { for (let c = 3; c < COLS; c++) { if (board[r][c] === player && board[r+1][c-1] === player && board[r+2][c-2] === player && board[r+3][c-3] === player) return true; } } return false; } function triggerGameOver(winner, type) { isGameActive = false; if (type === 'win') { playSound('win'); modalTitle.innerText = `${winner} Wins!`; modalDesc.innerText = "Magnificent victory!"; triggerConfetti(); } else { playSound('draw'); modalTitle.innerText = "It's a Draw!"; modalDesc.innerText = "Great tactical match!"; } resultModal.classList.add('active'); } function triggerConfetti() { for (let i = 0; i < 60; i++) { const confetti = document.createElement('div'); confetti.className = 'confetti'; confetti.style.left = Math.random() * 100 + 'vw'; confetti.style.backgroundColor = ['#f43f5e', '#facc15', '#38bdf8', '#2ecc71', '#a855f7'][Math.floor(Math.random() * 5)]; confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's'; confetti.style.animationDelay = (Math.random() * 0.5) + 's'; document.body.appendChild(confetti); setTimeout(() => confetti.remove(), 3500); } } // Akıllı Connect Four Yapay Zekası (Heuristik / Skor Tabanlı Mantık) function botMove() { let bestCol = getBestColumn(); if (bestCol !== -1) { let row = -1; for (let r = ROWS - 1; r >= 0; r--) { if (board[r][bestCol] === 0) { row = r; break; } } makeMove(row, bestCol, 2); playSound('drop'); if (checkWin(2)) { triggerGameOver('Yellow', 'win'); return; } if (checkBoardFull()) { triggerGameOver('Draw', 'draw'); return; } currentPlayer = 1; statusText.innerText = "Turn: Red"; } isGameActive = true; } function getBestColumn() { // 1. Bot kazanabiliyorsa hamleyi yap for (let c = 0; c < COLS; c++) { let r = getAvailableRow(c); if (r !== -1) { board[r][c] = 2; if (checkWin(2)) { board[r][c] = 0; return c; } board[r][c] = 0; } } // 2. Oyuncu kazanacaksa engelle for (let c = 0; c < COLS; c++) { let r = getAvailableRow(c); if (r !== -1) { board[r][c] = 1; if (checkWin(1)) { board[r][c] = 0; return c; } board[r][c] = 0; } } // 3. Ortaya yakın sütunlara öncelik ver ve puanla let validCols = []; for (let c = 0; c < COLS; c++) { if (getAvailableRow(c) !== -1) validCols.push(c); } if (validCols.length === 0) return -1; // Merkez sütunu (3) tercih et let colScores = validCols.map(c => { let score = 0; if (c === 3) score += 5; else if (c === 2 || c === 4) score += 3; else score += 1; return { col: c, score: score }; }); colScores.sort((a, b) => b.score - a.score); return colScores[0].col; } function getAvailableRow(col) { for (let r = ROWS - 1; r >= 0; r--) { if (board[r][col] === 0) return r; } return -1; } </script></body></html>
