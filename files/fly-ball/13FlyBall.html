<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Fly Ball</title><style> :root { --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.85); --border-color: rgba(255, 255, 255, 0.1); --accent-color: #38bdf8; --accent-hover: #0ea5e9; --text-color: #f8fafc; } * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; } body { margin: 0; padding: 0; background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; } .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 480px; padding: 15px; gap: 12px; } .menu-screen { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 16px; } h1 { margin: 0 0 10px 0; font-size: clamp(2rem, 8vw, 3rem); letter-spacing: 2px; color: var(--accent-color); text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); text-align: center; } .menu-btn { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; } .menu-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(56, 189, 248, 0.2); } .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; } .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; font-size: 1.05rem; font-weight: 600; } .status-text { color: var(--accent-color); } canvas { background: #1e293b; border-radius: 12px; border: 2px solid var(--border-color); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4); width: 100%; max-width: 450px; aspect-ratio: 3 / 4; display: block; } .game-footer-btns { display: flex; gap: 10px; width: 100%; } .action-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; } .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-color); } .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.active { opacity: 1; pointer-events: auto; } .modal { background: #1e293b; border: 2px solid var(--accent-color); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 350px; width: 90%; transform: scale(0.8); transition: transform 0.3s ease; } .modal-overlay.active .modal { transform: scale(1); } .modal h2 { color: var(--accent-color); margin-top: 0; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); } .modal p { margin: 0 0 20px 0; font-size: 1.2rem; color: #cbd5e1; } .modal-btn-group { display: flex; gap: 10px; } .modal button { flex: 1; background: var(--accent-color); color: #0f172a; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; } .modal button:hover { background: var(--accent-hover); } .footer-credit { position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.35); pointer-events: none; letter-spacing: 1px; font-family: sans-serif; } </style></head><body><div class="game-wrapper"><div id="menuScreen" class="menu-screen"><h1>Fly Ball</h1><button class="menu-btn" onclick="startGame()">Start Game</button></div><div id="gameScreen" class="game-screen"><div class="game-header"><span id="levelText" class="status-text">Level: 1</span><span id="scoreText">Score: 0</span><span id="livesText">Lives: 3</span></div><canvas id="gameCanvas" width="400" height="533"></canvas><div class="game-footer-btns"><button class="action-btn" onclick="resetGame()">Restart</button><button class="action-btn" onclick="backToMenu()">Menu</button></div></div></div><div class="modal-overlay" id="resultModal"><div class="modal"><h2 id="modalTitle">Victory!</h2><p id="modalDesc">Amazing reflexes!</p><div class="modal-btn-group" id="modalBtnGroup"><button onclick="nextLevel()" id="nextLevelBtn">Next Level</button><button onclick="backToMenu()" style="background: rgba(255,255,255,0.1); color: #fff;">Menu</button></div></div></div><div class="footer-credit">Powered by SGame Studios -- SGame Studios ©2026</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const menuScreen = document.getElementById('menuScreen'); const gameScreen = document.getElementById('gameScreen'); const levelText = document.getElementById('levelText'); const scoreText = document.getElementById('scoreText'); const livesText = document.getElementById('livesText'); const resultModal = document.getElementById('resultModal'); const modalTitle = document.getElementById('modalTitle'); const modalDesc = document.getElementById('modalDesc'); const nextLevelBtn = document.getElementById('nextLevelBtn'); let score = 0; let lives = 3; let currentLevel = 1; let isGameRunning = false; let animationFrameId = null; let balls = []; let balloons = []; let paddle = { width: 80, height: 12, x: (canvas.width - 80) / 2, y: canvas.height - 25, dx: 8 }; // Level Düzenleri (Sütun x Satır) const levelsConfig = [ { cols: 4, rows: 3 }, // Level 1 (4*3) { cols: 6, rows: 5 }, // Level 2 (6*5) { cols: 8, rows: 7 } // Level 3 (8*7) ]; let brickColumnCount = 4; let brickRowCount = 3; let bricks = []; function initBricks() { let config = levelsConfig[currentLevel - 1] || levelsConfig[levelsConfig.length - 1]; brickColumnCount = config.cols; brickRowCount = config.rows; const availableWidth = canvas.width - 40; const brickPadding = 6; const brickWidth = (availableWidth - (brickPadding * (brickColumnCount - 1))) / brickColumnCount; const brickHeight = 18; const brickOffsetTop = 45; const brickOffsetLeft = 20; bricks = []; const colors = ['#f43f5e', '#facc15', '#38bdf8', '#2ecc71', '#a855f7', '#fb923c', '#e879f9']; for (let c = 0; c < brickColumnCount; c++) { bricks[c] = []; for (let r = 0; r < brickRowCount; r++) { bricks[c][r] = { x: (c * (brickWidth + brickPadding)) + brickOffsetLeft, y: (r * (brickHeight + brickPadding)) + brickOffsetTop, width: brickWidth, height: brickHeight, status: 1, color: colors[r % colors.length] }; } } } let rightPressed = false; let leftPressed = false; document.addEventListener('keydown', (e) => { if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true; else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true; }); document.addEventListener('keyup', (e) => { if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false; else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false; }); canvas.addEventListener('touchmove', (e) => { let touchX = e.touches[0].clientX; let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let canvasX = (touchX - rect.left) * scaleX; paddle.x = canvasX - paddle.width / 2; if (paddle.x < 0) paddle.x = 0; if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width; e.preventDefault(); }, { passive: false }); canvas.addEventListener('mousemove', (e) => { let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let canvasX = (e.clientX - rect.left) * scaleX; paddle.x = canvasX - paddle.width / 2; if (paddle.x < 0) paddle.x = 0; if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width; }); const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playSound(freq, duration, type = 'sine') { if (audioCtx.state === 'suspended') audioCtx.resume(); let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); osc.start(); osc.stop(audioCtx.currentTime + duration); } function startGame() { menuScreen.style.display = 'none'; gameScreen.style.display = 'flex'; resultModal.classList.remove('active'); score = 0; lives = 3; currentLevel = 1; startLevel(); } function startLevel() { balls = []; balloons = []; levelText.innerText = `Level: ${currentLevel}`; scoreText.innerText = `Score: ${score}`; livesText.innerText = `Lives: ${lives}`; initBricks(); resetBallAndPaddle(); isGameRunning = true; cancelAnimationFrame(animationFrameId); loop(); } function nextLevel() { currentLevel++; if (currentLevel > levelsConfig.length) { currentLevel = levelsConfig.length; } resultModal.classList.remove('active'); startLevel(); } function resetGame() { startGame(); } function backToMenu() { isGameRunning = false; cancelAnimationFrame(animationFrameId); gameScreen.style.display = 'none'; menuScreen.style.display = 'flex'; resultModal.classList.remove('active'); } function resetBallAndPaddle() { balls = [{ x: canvas.width / 2, y: canvas.height - 50, radius: 8, dx: 3, dy: -3.5 }]; paddle.x = (canvas.width - paddle.width) / 2; } function spawnBalloon(x, y) { if (Math.random() < 0.20) { const types = ['+1', '+2', '+3', '2x']; const type = types[Math.floor(Math.random() * types.length)]; balloons.push({ x: x, y: y, radius: 14, dy: 1.5, type: type }); } } function applyBalloonEffect(type) { playSound(900, 0.2, 'triangle'); if (type === '+1') { balls.push({ x: paddle.x + paddle.width / 2, y: paddle.y - 10, radius: 8, dx: 2, dy: -3.5 }); } else if (type === '+2') { for (let i = 0; i < 2; i++) { balls.push({ x: paddle.x + paddle.width / 2, y: paddle.y - 10, radius: 8, dx: (i === 0 ? 2.5 : -2.5), dy: -3.5 }); } } else if (type === '+3') { for (let i = 0; i < 3; i++) { balls.push({ x: paddle.x + paddle.width / 2, y: paddle.y - 10, radius: 8, dx: (i === 0 ? 3 : i === 1 ? -3 : 1), dy: -3.5 }); } } else if (type === '2x') { let currentBalls = [...balls]; currentBalls.forEach(b => { balls.push({ x: b.x, y: b.y, radius: 8, dx: -b.dx, dy: b.dy }); }); } } function checkWinCondition() { let activeBricks = 0; for (let c = 0; c < brickColumnCount; c++) { for (let r = 0; r < brickRowCount; r++) { if (bricks[c][r].status === 1) { activeBricks++; } } } return activeBricks === 0; } function collisionDetection() { for (let c = 0; c < brickColumnCount; c++) { for (let r = 0; r < brickRowCount; r++) { let b = bricks[c][r]; if (b.status === 1) { for (let ball of balls) { if (ball.x + ball.radius > b.x && ball.x - ball.radius < b.x + b.width && ball.y + ball.radius > b.y && ball.y - ball.radius < b.y + b.height) { let overlapLeft = ball.x + ball.radius - b.x; let overlapRight = b.x + b.width - (ball.x - ball.radius); let overlapTop = ball.y + ball.radius - b.y; let overlapBottom = b.y + b.height - (ball.y - ball.radius); let minOverlapX = Math.min(overlapLeft, overlapRight); let minOverlapY = Math.min(overlapTop, overlapBottom); if (minOverlapX < minOverlapY) { ball.dx = -ball.dx; } else { ball.dy = -ball.dy; } b.status = 0; score += 10; scoreText.innerText = `Score: ${score}`; playSound(650, 0.08); spawnBalloon(b.x + b.width / 2, b.y + b.height / 2); if (checkWinCondition()) { triggerLevelComplete(); } break; } } } } } } function update() { if (!isGameRunning) return; if (rightPressed && paddle.x < canvas.width - paddle.width) { paddle.x += paddle.dx; } else if (leftPressed && paddle.x > 0) { paddle.x -= paddle.dx; } for (let i = balls.length - 1; i >= 0; i--) { let ball = balls[i]; ball.x += ball.dx; ball.y += ball.dy; if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.dx = -ball.dx; playSound(320, 0.05); } else if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.dx = -ball.dx; playSound(320, 0.05); } if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.dy = -ball.dy; playSound(320, 0.05); } else if (ball.y + ball.radius >= paddle.y && ball.y <= paddle.y + paddle.height && ball.x >= paddle.x && ball.x <= paddle.x + paddle.width) { let hitPoint = ball.x - (paddle.x + paddle.width / 2); ball.dx = hitPoint * 0.16; ball.dy = -Math.abs(ball.dy); playSound(450, 0.08); } else if (ball.y - ball.radius > canvas.height) { balls.splice(i, 1); } } if (balls.length === 0) { lives--; livesText.innerText = `Lives: ${lives}`; playSound(150, 0.3, 'sawtooth'); if (lives <= 0) { triggerGameOver(false); } else { resetBallAndPaddle(); } } for (let i = balloons.length - 1; i >= 0; i--) { let bal = balloons[i]; bal.y += bal.dy; if (bal.y + bal.radius >= paddle.y && bal.y - bal.radius <= paddle.y + paddle.height && bal.x + bal.radius >= paddle.x && bal.x - bal.radius <= paddle.x + paddle.width) { applyBalloonEffect(bal.type); balloons.splice(i, 1); } else if (bal.y - bal.radius > canvas.height) { balloons.splice(i, 1); } } collisionDetection(); } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Tuğlalar for (let c = 0; c < brickColumnCount; c++) { for (let r = 0; r < brickRowCount; r++) { let b = bricks[c][r]; if (b.status === 1) { ctx.beginPath(); ctx.rect(b.x, b.y, b.width, b.height); ctx.fillStyle = b.color; ctx.fill(); ctx.closePath(); } } } // Toplar balls.forEach(ball => { ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fillStyle = '#38bdf8'; ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 10; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0; }); // Balonlar balloons.forEach(bal => { ctx.beginPath(); ctx.arc(bal.x, bal.y, bal.radius, 0, Math.PI * 2); ctx.fillStyle = '#ec4899'; ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 12; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bal.type, bal.x, bal.y); }); // Raket ctx.beginPath(); ctx.rect(paddle.x, paddle.y, paddle.width, paddle.height); ctx.fillStyle = '#f43f5e'; ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 10; ctx.fill(); ctx.closePath(); ctx.shadowBlur = 0; } function loop() { if (!isGameRunning) return; update(); draw(); animationFrameId = requestAnimationFrame(loop); } function triggerLevelComplete() { isGameRunning = false; cancelAnimationFrame(animationFrameId); playSound(850, 0.4); if (currentLevel < levelsConfig.length) { modalTitle.innerText = `Level ${currentLevel} Completed!`; modalDesc.innerText = `Score: ${score}`; nextLevelBtn.style.display = 'block'; nextLevelBtn.innerText = "Next Level"; } else { modalTitle.innerText = "Victory!"; modalDesc.innerText = `You completed all levels! Final Score: ${score}`; nextLevelBtn.style.display = 'none'; } resultModal.classList.add('active'); } function triggerGameOver(isWin) { isGameRunning = false; cancelAnimationFrame(animationFrameId); modalTitle.innerText = "Game Over"; modalDesc.innerText = `Final Score: ${score}`; nextLevelBtn.style.display = 'none'; playSound(200, 0.4, 'sawtooth'); resultModal.classList.add('active'); } </script></body></html>
