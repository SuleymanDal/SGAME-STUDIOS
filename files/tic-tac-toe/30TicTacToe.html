<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Tic Tac Toe</title><style> :root { --bg-color: #0f172a; --panel-bg: rgba(30, 41, 59, 0.7); --border-color: rgba(255, 255, 255, 0.1); --accent-color: #38bdf8; --accent-hover: #0ea5e9; --text-color: #f8fafc; --x-color: #f43f5e; --o-color: #38bdf8; } * { box-sizing: border-box; user-select: none; -webkit-user-select: none; } body { margin: 0; padding: 0; background: radial-gradient(circle at center, #1e293b 0%, var(--bg-color) 100%); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; } .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 450px; padding: 20px; gap: 15px; } /* Ana Menü Ekranı */ .menu-screen { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 16px; } h1 { margin: 0 0 10px 0; font-size: clamp(2rem, 8vw, 2.8rem); letter-spacing: 2px; color: var(--accent-color); text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); text-align: center; } .menu-btn { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; } .menu-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(56, 189, 248, 0.2); } .menu-btn:active { transform: translateY(0); } /* Oyun Ekranı */ .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; gap: 15px; } .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; font-size: 1.1rem; font-weight: 600; } .status-text { color: var(--accent-color); } .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; aspect-ratio: 1 / 1; background: rgba(15, 23, 42, 0.5); padding: 10px; border-radius: 16px; border: 2px solid var(--border-color); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); } .cell { background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: clamp(3rem, 15vw, 4.5rem); font-weight: bold; cursor: pointer; transition: background 0.2s, transform 0.1s; } .cell:hover { background: rgba(255, 255, 255, 0.05); border-color: rgba(255, 255, 255, 0.2); } .cell:active { transform: scale(0.95); } .cell.x { color: var(--x-color); text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); } .cell.o { color: var(--o-color); text-shadow: 0 0 15px rgba(56, 189, 248, 0.4); } .game-footer-btns { display: flex; gap: 10px; width: 100%; } .action-btn { flex: 1; padding: 12px; font-size: 1rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; } .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-color); } /* Kazanma / Beraberlik Modalı */ .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.active { opacity: 1; pointer-events: auto; } .modal { background: #1e293b; border: 2px solid var(--accent-color); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 350px; width: 90%; transform: scale(0.8); transition: transform 0.3s ease; } .modal-overlay.active .modal { transform: scale(1); } .modal h2 { color: var(--accent-color); margin-top: 0; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); } .modal p { margin: 0 0 20px 0; font-size: 1.2rem; color: #cbd5e1; } .modal-btn-group { display: flex; gap: 10px; } .modal button { flex: 1; background: var(--accent-color); color: #0f172a; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; } .modal button:hover { background: var(--accent-hover); } .confetti { position: absolute; width: 8px; height: 8px; background-color: #f1c40f; animation: fall linear forwards; z-index: 1999; border-radius: 50%; } @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(105vh) rotate(720deg); opacity: 0; } } /* Telif Yazısı */ .footer-credit { position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.35); pointer-events: none; letter-spacing: 1px; font-family: sans-serif; } </style></head><body><div class="game-wrapper"><div id="menuScreen" class="menu-screen"><h1>Tic Tac Toe</h1><button class="menu-btn" onclick="startGame('bot')">Bot Mode</button><button class="menu-btn" onclick="startGame('pvp')">1v1 Mode</button></div><div id="gameScreen" class="game-screen"><div class="game-header"><span id="statusText" class="status-text">Turn: X</span><span id="modeText">Bot Mode</span></div><div class="board" id="board"><div class="cell" onclick="handleCellClick(0)"></div><div class="cell" onclick="handleCellClick(1)"></div><div class="cell" onclick="handleCellClick(2)"></div><div class="cell" onclick="handleCellClick(3)"></div><div class="cell" onclick="handleCellClick(4)"></div><div class="cell" onclick="handleCellClick(5)"></div><div class="cell" onclick="handleCellClick(6)"></div><div class="cell" onclick="handleCellClick(7)"></div><div class="cell" onclick="handleCellClick(8)"></div></div><div class="game-footer-btns"><button class="action-btn" onclick="resetGame()">Restart</button><button class="action-btn" onclick="backToMenu()">Menu</button></div></div></div><div class="modal-overlay" id="resultModal"><div class="modal"><h2 id="modalTitle">X Wins!</h2><p id="modalDesc">Congratulations on the victory!</p><div class="modal-btn-group"><button onclick="resetGame()">Play Again</button><button onclick="backToMenu()" style="background: rgba(255,255,255,0.1); color: #fff;">Menu</button></div></div></div><div class="footer-credit">Powered by SGame Studios -- SGame Studios ©2026</div><script> let board = ['', '', '', '', '', '', '', '', '']; let currentPlayer = 'X'; let gameMode = ''; let isGameActive = false; const menuScreen = document.getElementById('menuScreen'); const gameScreen = document.getElementById('gameScreen'); const statusText = document.getElementById('statusText'); const modeText = document.getElementById('modeText'); const resultModal = document.getElementById('resultModal'); const modalTitle = document.getElementById('modalTitle'); const modalDesc = document.getElementById('modalDesc'); const cells = document.querySelectorAll('.cell'); const winningConditions = [ [0, 1, 2], [3, 4, 5], [6, 7, 8], // Yatay [0, 3, 6], [1, 4, 7], [2, 5, 8], // Dikey [0, 4, 8], [2, 4, 6] // Çapraz ]; // Web Audio API ile Konfeti/Kazanma ve Tıklama Ses Efektleri const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playSound(type) { if (audioCtx.state === 'suspended') { audioCtx.resume(); } const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); if (type === 'click') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); osc.start(); osc.stop(audioCtx.currentTime + 0.08); } else if (type === 'win') { // Neşeli arpej ses efekti const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6 notes.forEach((freq, index) => { let o = audioCtx.createOscillator(); let g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type = 'triangle'; o.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1); g.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1); g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.3); o.start(audioCtx.currentTime + index * 0.1); o.stop(audioCtx.currentTime + index * 0.1 + 0.3); }); } else if (type === 'draw') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } } function startGame(mode) { gameMode = mode; menuScreen.style.display = 'none'; gameScreen.style.display = 'flex'; modeText.innerText = mode === 'bot' ? 'Bot Mode' : '1v1 Mode'; resetGame(); } function backToMenu() { gameScreen.style.display = 'none'; menuScreen.style.display = 'flex'; resultModal.classList.remove('active'); isGameActive = false; } function resetGame() { board = ['', '', '', '', '', '', '', '', '']; currentPlayer = 'X'; isGameActive = true; statusText.innerText = "Turn: X"; resultModal.classList.remove('active'); cells.forEach(cell => { cell.innerText = ''; cell.className = 'cell'; }); } function handleCellClick(index) { if (!isGameActive || board[index] !== '') return; playSound('click'); makeMove(index, currentPlayer); if (checkWin(currentPlayer)) { triggerGameOver(currentPlayer, 'win'); return; } if (board.every(cell => cell !== '')) { triggerGameOver('Draw', 'draw'); return; } currentPlayer = currentPlayer === 'X' ? 'O' : 'X'; statusText.innerText = `Turn: ${currentPlayer}`; if (gameMode === 'bot' && currentPlayer === 'O' && isGameActive) { isGameActive = false; setTimeout(() => { botMove(); }, 400); } } function makeMove(index, player) { board[index] = player; cells[index].innerText = player; cells[index].classList.add(player.toLowerCase()); } function checkWin(player) { return winningConditions.some(condition => { return condition.every(index => board[index] === player); }); } function triggerGameOver(winner, type) { isGameActive = false; if (type === 'win') { playSound('win'); modalTitle.innerText = `${winner} Wins!`; modalDesc.innerText = "Magnificent victory!"; triggerConfetti(); } else { playSound('draw'); modalTitle.innerText = "It's a Draw!"; modalDesc.innerText = "Great match by both sides!"; } resultModal.classList.add('active'); } function triggerConfetti() { for (let i = 0; i < 60; i++) { const confetti = document.createElement('div'); confetti.className = 'confetti'; confetti.style.left = Math.random() * 100 + 'vw'; confetti.style.backgroundColor = ['#f43f5e', '#38bdf8', '#f1c40f', '#2ecc71', '#a855f7'][Math.floor(Math.random() * 5)]; confetti.style.animationDuration = (Math.random() * 2 + 1.5) + 's'; confetti.style.animationDelay = (Math.random() * 0.5) + 's'; document.body.appendChild(confetti); setTimeout(() => confetti.remove(), 3500); } } function botMove() { let bestScore = -Infinity; let bestMove; for (let i = 0; i < board.length; i++) { if (board[i] === '') { board[i] = 'O'; let score = minimax(board, 0, false); board[i] = ''; if (score > bestScore) { bestScore = score; bestMove = i; } } } if (bestMove !== undefined) { playSound('click'); makeMove(bestMove, 'O'); if (checkWin('O')) { triggerGameOver('O', 'win'); return; } if (board.every(cell => cell !== '')) { triggerGameOver('Draw', 'draw'); return; } currentPlayer = 'X'; statusText.innerText = "Turn: X"; } isGameActive = true; } function minimax(newBoard, depth, isMaximizing) { if (checkWinForState(newBoard, 'O')) return 10 - depth; if (checkWinForState(newBoard, 'X')) return depth - 10; if (newBoard.every(cell => cell !== '')) return 0; if (isMaximizing) { let maxScore = -Infinity; for (let i = 0; i < newBoard.length; i++) { if (newBoard[i] === '') { newBoard[i] = 'O'; let score = minimax(newBoard, depth + 1, false); newBoard[i] = ''; maxScore = Math.max(score, maxScore); } } return maxScore; } else { let minScore = Infinity; for (let i = 0; i < newBoard.length; i++) { if (newBoard[i] === '') { newBoard[i] = 'X'; let score = minimax(newBoard, depth + 1, true); newBoard[i] = ''; minScore = Math.min(score, minScore); } } return minScore; } } function checkWinForState(currBoard, player) { return winningConditions.some(condition => { return condition.every(index => currBoard[index] === player); }); } </script></body></html>
