<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SnakeToSnake</title><style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body { background-color: #0b0f19; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; } .container { display: flex; flex-direction: column; align-items: center; background: #111827; border: 2px solid #1e3a8a; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(30, 58, 138, 0.3); } h1 { color: #60a5fa; margin-bottom: 10px; font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(96, 165, 250, 0.5); } .scoreboard { display: flex; gap: 20px; margin-bottom: 15px; font-size: 16px; background: #1f2937; padding: 8px 16px; border-radius: 8px; border: 1px solid #374151; } .scoreboard span { color: #93c5fd; font-weight: bold; } canvas { background-color: #030712; border: 2px solid #1e40af; border-radius: 8px; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8); } .controls-info { margin-top: 15px; font-size: 13px; color: #9ca3af; text-align: center; } .btn { margin-top: 15px; background-color: #2563eb; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.4); } .btn:hover { background-color: #1d4ed8; transform: translateY(-2px); } .btn:active { transform: translateY(0); } </style></head><body><div class="container"><h1>SnakeToSnake</h1><div class="scoreboard"><div>Score: <span id="score">0</span></div><div>High Score: <span id="highScore">0</span></div><div>Level: <span id="level">1</span></div></div><canvas id="gameCanvas" width="400" height="400"></canvas><button class="btn" id="startBtn">Start / Restart Game</button><div class="controls-info"> Use Arrow Keys or W, A, S, D to move. </div></div><script> const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d"); const scoreEl = document.getElementById("score"); const highScoreEl = document.getElementById("highScore"); const levelEl = document.getElementById("level"); const startBtn = document.getElementById("startBtn"); const tileCount = 8; const gridSize = canvas.width / tileCount; let snake = []; let food = { x: 0, y: 0, type: 'normal' }; let dx = gridSize; let dy = 0; let score = 0; let highScore = localStorage.getItem("snakeHighScore") || 0; let level = 1; let gameInterval = null; let isRunning = false; let changingDirection = false; highScoreEl.innerText = highScore; const foodTypes = { normal: { color: "#ef4444", points: 10 }, gold: { color: "#facc15", points: 50 }, speed: { color: "#3b82f6", points: 20 } }; function resetGame() { snake = [ { x: 3 * gridSize, y: 3 * gridSize }, { x: 2 * gridSize, y: 3 * gridSize }, { x: 1 * gridSize, y: 3 * gridSize } ]; score = 0; level = 1; dx = gridSize; dy = 0; scoreEl.innerText = score; levelEl.innerText = level; spawnFood(); isRunning = true; if (gameInterval) clearInterval(gameInterval); gameInterval = setInterval(gameLoop, 220); } function gameLoop() { changingDirection = false; clearCanvas(); drawGrid(); moveSnake(); if (checkGameOver()) { endGame(); return; } drawFood(); drawSnake(); } function clearCanvas() { ctx.fillStyle = "#030712"; ctx.fillRect(0, 0, canvas.width, canvas.height); } function drawGrid() { ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 0.5; for (let i = 0; i < tileCount; i++) { ctx.beginPath(); ctx.moveTo(i * gridSize, 0); ctx.lineTo(i * gridSize, canvas.height); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i * gridSize); ctx.lineTo(canvas.width, i * gridSize); ctx.stroke(); } } function drawSnake() { snake.forEach((part, index) => { ctx.fillStyle = index === 0 ? "#60a5fa" : "#1d4ed8"; ctx.shadowBlur = index === 0 ? 10 : 0; ctx.shadowColor = "#60a5fa"; ctx.beginPath(); ctx.roundRect(part.x, part.y, gridSize - 2, gridSize - 2, 4); ctx.fill(); ctx.shadowBlur = 0; }); } function moveSnake() { const head = { x: snake[0].x + dx, y: snake[0].y + dy }; snake.unshift(head); if (head.x === food.x && head.y === food.y) { score += foodTypes[food.type].points; scoreEl.innerText = score; if (score > highScore) { highScore = score; highScoreEl.innerText = highScore; localStorage.setItem("snakeHighScore", highScore); } let newLevel = Math.floor(score / 100) + 1; if (newLevel !== level) { level = newLevel; levelEl.innerText = level; adjustSpeed(); } spawnFood(); } else { snake.pop(); } } function spawnFood() { food.x = Math.floor(Math.random() * tileCount) * gridSize; food.y = Math.floor(Math.random() * tileCount) * gridSize; snake.forEach(part => { if (part.x === food.x && part.y === food.y) { spawnFood(); } }); let rand = Math.random(); if (rand < 0.7) { food.type = 'normal'; } else if (rand < 0.9) { food.type = 'gold'; } else { food.type = 'speed'; } } function drawFood() { const currentFoodType = foodTypes[food.type]; ctx.fillStyle = currentFoodType.color; ctx.shadowBlur = 12; ctx.shadowColor = currentFoodType.color; ctx.beginPath(); ctx.arc(food.x + gridSize / 2, food.y + gridSize / 2, gridSize / 2 - 3, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0; } function checkGameOver() { const head = snake[0]; if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height) { return true; } for (let i = 1; i < snake.length; i++) { if (snake[i].x === head.x && snake[i].y === head.y) { return true; } } return false; } function adjustSpeed() { let newSpeed = Math.max(100, 220 - (level - 1) * 20); clearInterval(gameInterval); gameInterval = setInterval(gameLoop, newSpeed); } function endGame() { isRunning = false; clearInterval(gameInterval); ctx.fillStyle = "rgba(3, 7, 18, 0.85)"; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#ef4444"; ctx.font = "bold 30px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 15); ctx.fillStyle = "#93c5fd"; ctx.font = "16px 'Segoe UI'"; ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20); } document.addEventListener("keydown", changeDirection); function changeDirection(event) { if (!isRunning || changingDirection) return; const keyPressed = event.keyCode; const goingUp = dy === -gridSize; const goingDown = dy === gridSize; const goingRight = dx === gridSize; const goingLeft = dx === -gridSize; if ((keyPressed === 37 || keyPressed === 65) && !goingRight) { dx = -gridSize; dy = 0; changingDirection = true; } if ((keyPressed === 38 || keyPressed === 87) && !goingDown) { dx = 0; dy = -gridSize; changingDirection = true; } if ((keyPressed === 39 || keyPressed === 68) && !goingLeft) { dx = gridSize; dy = 0; changingDirection = true; } if ((keyPressed === 40 || keyPressed === 83) && !goingUp) { dx = 0; dy = gridSize; changingDirection = true; } } startBtn.addEventListener("click", resetGame); clearCanvas(); ctx.fillStyle = "#60a5fa"; ctx.font = "bold 22px 'Segoe UI'"; ctx.textAlign = "center"; ctx.fillText("SnakeToSnake", canvas.width / 2, canvas.height / 2 - 20); ctx.fillStyle = "#9ca3af"; ctx.font = "14px 'Segoe UI'"; ctx.fillText("Click button to start", canvas.width / 2, canvas.height / 2 + 20); </script></body></html>
