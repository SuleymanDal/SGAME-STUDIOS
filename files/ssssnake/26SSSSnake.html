<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>SSSSnake</title><style> * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; } body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d1117; color: #ffffff; } #game-container { position: relative; width: 100vw; height: 100vh; } canvas { display: block; width: 100%; height: 100%; background: radial-gradient(circle, #161b22 0%, #0d1117 100%); } .hud { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; } .hud-card { background: rgba(22, 27, 34, 0.85); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 10px 16px; border-radius: 12px; margin-bottom: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4); } .hud-title { font-size: 0.75rem; color: #8b949e; text-transform: uppercase; letter-spacing: 0.05em; } .hud-value { font-size: 1.5rem; font-weight: 700; color: #10b981; } .leaderboard { position: absolute; top: 15px; right: 15px; width: 200px; z-index: 10; pointer-events: none; } .leaderboard-title { font-size: 0.85rem; font-weight: 700; color: #f0f6fc; margin-bottom: 6px; text-align: center; } .leaderboard-list { list-style: none; font-size: 0.8rem; } .leaderboard-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.05); } .leaderboard-item.player { color: #3b82f6; font-weight: 700; } .active-effects { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; pointer-events: none; } .effect-badge { background: rgba(0, 0, 0, 0.7); border: 1px solid rgba(255, 255, 255, 0.2); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; gap: 6px; } .overlay { position: absolute; inset: 0; background: rgba(13, 17, 23, 0.88); backdrop-filter: blur(12px); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; text-align: center; } .overlay h1 { font-size: 4rem; font-weight: 900; background: linear-gradient(135deg, #10b981, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; letter-spacing: -0.05em; } .overlay p { color: #8b949e; margin-bottom: 25px; max-width: 420px; font-size: 0.95rem; line-height: 1.5; } .input-group { margin-bottom: 20px; } .input-group input { background: rgba(22, 27, 34, 0.8); border: 1px solid rgba(255, 255, 255, 0.2); padding: 12px 20px; border-radius: 8px; color: white; font-size: 1rem; outline: none; text-align: center; } .input-group input:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); } .btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px 36px; font-size: 1.1rem; font-weight: 700; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); transition: transform 0.1s, box-shadow 0.2s; } .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); } .btn:active { transform: translateY(1px); } .hidden { display: none !important; } #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; z-index: 10; display: none; } .joystick-base { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 50%; position: relative; } .joystick-stick { width: 50px; height: 50px; background: rgba(16, 185, 129, 0.8); border-radius: 50%; position: absolute; top: 35px; left: 35px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4); } #boost-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, #ef4444, #dc2626); border: 2px solid rgba(255, 255, 255, 0.3); color: white; font-weight: bold; display: none; justify-content: center; align-items: center; z-index: 10; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.5); } </style></head><body><div id="game-container"><canvas id="gameCanvas"></canvas><div class="hud"><div class="hud-card"><div class="hud-title">Score</div><div class="hud-value" id="score-val">10</div></div><div class="hud-card"><div class="hud-title">Kills</div><div class="hud-value" id="kills-val" style="color: #3b82f6;">0</div></div></div><div class="hud-card leaderboard"><div class="leaderboard-title">Top Slitherers</div><ul class="leaderboard-list" id="leaderboard-list"></ul></div><div class="active-effects" id="effects-bar"></div><div class="overlay" id="start-overlay"><h1>SSSSnake</h1><p>Collect special food items, use speed boost carefully (drains your score!), cut off opponents, and dominate the arena.</p><div class="input-group"><input type="text" id="player-name" placeholder="Enter Nickname" maxlength="12" value="Player1"></div><button class="btn" id="start-btn">PLAY NOW</button></div><div class="overlay hidden" id="death-overlay"><h1 style="background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip: text;">DEFEATED</h1><p id="death-stats">Your final score was 0 with 0 kills.</p><button class="btn" id="restart-btn">PLAY AGAIN</button></div><div id="joystick-zone"><div class="joystick-base"><div class="joystick-stick" id="joystick-handle"></div></div></div><div id="boost-btn">BOOST</div></div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let isMobile = false; let isPlaying = false; let camera = { x: 0, y: 0 }; const WORLD_SIZE = 3200; let animationFrameId; const scoreVal = document.getElementById('score-val'); const killsVal = document.getElementById('kills-val'); const leaderboardList = document.getElementById('leaderboard-list'); const startOverlay = document.getElementById('start-overlay'); const deathOverlay = document.getElementById('death-overlay'); const deathStats = document.getElementById('death-stats'); const playerNameInput = document.getElementById('player-name'); const effectsBar = document.getElementById('effects-bar'); if ('ontouchstart' in window || navigator.maxTouchPoints > 0) { isMobile = true; document.getElementById('joystick-zone').style.display = 'block'; document.getElementById('boost-btn').style.display = 'flex'; } function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resizeCanvas); resizeCanvas(); let player; let snakes = []; let foods = []; const BOT_NAMES = ['Viper', 'Python', 'Anaconda', 'Slinky', 'Kaa', 'Mamba', 'Cobra', 'Hydra', 'Naga']; const COLORS = ['#10b981', '#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#06b6d4', '#14b8a6']; const FOOD_TYPES = { NORMAL: { type: 'NORMAL', value: 1, radius: 4, color: '#10b981', symbol: '' }, SUPER: { type: 'SUPER', value: 5, radius: 7, color: '#f59e0b', symbol: '★' }, SPEED: { type: 'SPEED', value: 2, radius: 6, color: '#3b82f6', symbol: '⚡' }, MAGNET: { type: 'MAGNET', value: 2, radius: 6, color: '#8b5cf6', symbol: '🧲' }, MULTIPLIER: { type: 'MULTIPLIER', value: 3, radius: 6, color: '#ec4899', symbol: '2x' }, SHIELD: { type: 'SHIELD', value: 2, radius: 6, color: '#06b6d4', symbol: '🛡' } }; class Food { constructor(x, y, forcedType = null) { this.x = x || Math.random() * WORLD_SIZE; this.y = y || Math.random() * WORLD_SIZE; if (forcedType) { this.config = forcedType; } else { const rand = Math.random(); if (rand < 0.70) this.config = FOOD_TYPES.NORMAL; else if (rand < 0.82) this.config = FOOD_TYPES.SUPER; else if (rand < 0.88) this.config = FOOD_TYPES.SPEED; else if (rand < 0.92) this.config = FOOD_TYPES.MAGNET; else if (rand < 0.96) this.config = FOOD_TYPES.MULTIPLIER; else this.config = FOOD_TYPES.SHIELD; } this.value = this.config.value; this.radius = this.config.radius; this.color = this.config.color; this.symbol = this.config.symbol; this.pulse = Math.random() * Math.PI; } draw() { this.pulse += 0.05; const r = this.radius + Math.sin(this.pulse) * 0.8; const screenX = this.x - camera.x + canvas.width / 2; const screenY = this.y - camera.y + canvas.height / 2; if (screenX < -20 || screenX > canvas.width + 20 || screenY < -20 || screenY > canvas.height + 20) return; ctx.save(); ctx.beginPath(); ctx.arc(screenX, screenY, Math.max(1, r), 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = this.symbol ? 12 : 6; ctx.fill(); if (this.symbol) { ctx.fillStyle = "#ffffff"; ctx.font = "bold 9px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(this.symbol, screenX, screenY); } ctx.restore(); } } class Snake { constructor(name, x, y, isBot = true, color = '#10b981') { this.name = name; this.x = x; this.y = y; this.isBot = isBot; this.color = color; this.angle = Math.random() * Math.PI * 2; this.baseSpeed = 3; this.speed = 3; this.boostSpeed = 6.5; this.isBoosting = false; this.turnSpeed = 0.08; this.radius = 12; this.score = 15; this.kills = 0; this.body = []; this.history = []; this.isDead = false; this.effects = { magnet: 0, multiplier: 0, speed: 0, shield: 0 }; for (let i = 0; i < this.score * 3; i++) { this.history.push({ x: this.x - i * 2, y: this.y }); } } update() { if (this.isDead) return; if (this.effects.magnet > 0) this.effects.magnet--; if (this.effects.multiplier > 0) this.effects.multiplier--; if (this.effects.speed > 0) this.effects.speed--; if (this.effects.shield > 0) this.effects.shield--; let currentBaseSpeed = this.effects.speed > 0 ? this.baseSpeed * 1.4 : this.baseSpeed; // FIXED BOOST LOGIC: // Strictly drains score and spawns non-pickable / non-score food or simple particle trail so boost NEVER increases score if (this.isBoosting && this.score > 5) { this.speed = this.boostSpeed; const drainRate = 0.25; // Deducts score fast this.score = Math.max(5, this.score - drainRate); } else { this.speed = currentBaseSpeed; this.isBoosting = false; } if (this.isBot) { this.updateBotAI(); } this.x += Math.cos(this.angle) * this.speed; this.y += Math.sin(this.angle) * this.speed; if (this.x < 0 || this.x > WORLD_SIZE || this.y < 0 || this.y > WORLD_SIZE) { this.die(); return; } this.history.unshift({ x: this.x, y: this.y }); const targetLength = Math.floor(this.score * 3); while (this.history.length > targetLength) { this.history.pop(); } this.body = []; const step = 3; for (let i = 0; i < this.history.length; i += step) { this.body.push(this.history[i]); } const pullRadius = this.effects.magnet > 0 ? 250 : this.radius + 15; for (let i = foods.length - 1; i >= 0; i--) { const f = foods[i]; const dist = Math.hypot(this.x - f.x, this.y - f.y); if (this.effects.magnet > 0 && dist < pullRadius) { f.x += (this.x - f.x) * 0.1; f.y += (this.y - f.y) * 0.1; } if (dist < this.radius + f.radius) { let gain = f.value; if (this.effects.multiplier > 0) gain *= 2; this.score += gain; if (f.config.type === 'MAGNET') this.effects.magnet = 300; if (f.config.type === 'MULTIPLIER') this.effects.multiplier = 300; if (f.config.type === 'SPEED') this.effects.speed = 250; if (f.config.type === 'SHIELD') this.effects.shield = 350; foods.splice(i, 1); } } } updateBotAI() { if (this.score > 40 && Math.random() < 0.01) { this.isBoosting = !this.isBoosting; } let nearestFood = null; let minDist = 250; for (let f of foods) { let d = Math.hypot(this.x - f.x, this.y - f.y); if (d < minDist) { minDist = d; nearestFood = f; } } if (nearestFood) { let targetAngle = Math.atan2(nearestFood.y - this.y, nearestFood.x - this.x); let diff = targetAngle - this.angle; diff = Math.atan2(Math.sin(diff), Math.cos(diff)); this.angle += Math.sign(diff) * Math.min(Math.abs(diff), this.turnSpeed); } else if (Math.random() < 0.03) { this.angle += (Math.random() - 0.5) * 1.2; } } draw() { if (this.isDead) return; if (this.effects.shield > 0) { const screenX = this.x - camera.x + canvas.width / 2; const screenY = this.y - camera.y + canvas.height / 2; ctx.save(); ctx.beginPath(); ctx.arc(screenX, screenY, this.radius + 8, 0, Math.PI * 2); ctx.strokeStyle = '#06b6d4'; ctx.lineWidth = 3; ctx.shadowColor = '#06b6d4'; ctx.shadowBlur = 10; ctx.stroke(); ctx.restore(); } for (let i = this.body.length - 1; i >= 0; i--) { const pt = this.body[i]; const screenX = pt.x - camera.x + canvas.width / 2; const screenY = pt.y - camera.y + canvas.height / 2; if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) continue; ctx.save(); ctx.beginPath(); ctx.arc(screenX, screenY, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.shadowColor = this.color; ctx.shadowBlur = i === 0 ? 12 : 0; ctx.fill(); ctx.restore(); } if (this.body.length > 0) { const head = this.body[0]; const screenX = head.x - camera.x + canvas.width / 2; const screenY = head.y - camera.y + canvas.height / 2; ctx.save(); ctx.translate(screenX, screenY); ctx.rotate(this.angle); ctx.fillStyle = "#ffffff"; ctx.beginPath(); ctx.arc(4, -5, 3.5, 0, Math.PI * 2); ctx.arc(4, 5, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = "#000000"; ctx.beginPath(); ctx.arc(5, -5, 1.8, 0, Math.PI * 2); ctx.arc(5, 5, 1.8, 0, Math.PI * 2); ctx.fill(); ctx.restore(); ctx.fillStyle = "#ffffff"; ctx.font = "11px sans-serif"; ctx.textAlign = "center"; ctx.fillText(this.name, screenX, screenY - this.radius - 8); } } die() { if (this.isDead) return; if (this.effects.shield > 0) { this.effects.shield = 0; this.angle += Math.PI; return; } this.isDead = true; for (let pt of this.body) { if (Math.random() < 0.7) { foods.push(new Food( pt.x + (Math.random() - 0.5) * 12, pt.y + (Math.random() - 0.5) * 12, FOOD_TYPES.SUPER )); } } if (this === player) { endGame(); } else { setTimeout(() => { const index = snakes.indexOf(this); if (index !== -1) { snakes[index] = new Snake( BOT_NAMES[Math.floor(Math.random() * BOT_NAMES.length)], Math.random() * WORLD_SIZE, Math.random() * WORLD_SIZE, true, COLORS[Math.floor(Math.random() * COLORS.length)] ); } }, 2500); } } } function checkCollisions() { for (let snake of snakes) { if (snake.isDead) continue; for (let other of snakes) { if (other.isDead || snake === other) continue; for (let pt of other.body) { const dist = Math.hypot(snake.x - pt.x, snake.y - pt.y); if (dist < snake.radius + other.radius * 0.8) { snake.die(); if (!snake.isDead) break; other.kills++; break; } } } } } let mouseX = window.innerWidth / 2; let mouseY = window.innerHeight / 2; window.addEventListener('mousemove', (e) => { if (!isMobile && isPlaying && player) { mouseX = e.clientX; mouseY = e.clientY; const dx = mouseX - canvas.width / 2; const dy = mouseY - canvas.height / 2; player.angle = Math.atan2(dy, dx); } }); window.addEventListener('mousedown', () => { if (!isMobile && player) player.isBoosting = true; }); window.addEventListener('mouseup', () => { if (!isMobile && player) player.isBoosting = false; }); window.addEventListener('keydown', (e) => { if (e.code === 'Space' && player) player.isBoosting = true; }); window.addEventListener('keyup', (e) => { if (e.code === 'Space' && player) player.isBoosting = false; }); const joystickZone = document.getElementById('joystick-zone'); const joystickHandle = document.getElementById('joystick-handle'); const boostBtn = document.getElementById('boost-btn'); let touchId = null; let joyCenter = { x: 0, y: 0 }; joystickZone.addEventListener('touchstart', (e) => { const touch = e.changedTouches[0]; touchId = touch.identifier; const rect = joystickZone.getBoundingClientRect(); joyCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 }; }); joystickZone.addEventListener('touchmove', (e) => { for (let touch of e.changedTouches) { if (touch.identifier === touchId) { const dx = touch.clientX - joyCenter.x; const dy = touch.clientY - joyCenter.y; const dist = Math.min(Math.hypot(dx, dy), 40); const angle = Math.atan2(dy, dx); joystickHandle.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`; if (player && !player.isDead) { player.angle = angle; } } } }); const resetJoystick = () => { joystickHandle.style.transform = 'translate(0px, 0px)'; }; joystickZone.addEventListener('touchend', resetJoystick); joystickZone.addEventListener('touchcancel', resetJoystick); boostBtn.addEventListener('touchstart', (e) => { e.preventDefault(); if (player) player.isBoosting = true; }); boostBtn.addEventListener('touchend', (e) => { e.preventDefault(); if (player) player.isBoosting = false; }); function drawGrid() { ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)'; ctx.lineWidth = 1; const gridSize = 50; const startX = Math.floor((camera.x - canvas.width / 2) / gridSize) * gridSize; const endX = startX + canvas.width + gridSize * 2; const startY = Math.floor((camera.y - canvas.height / 2) / gridSize) * gridSize; const endY = startY + canvas.height + gridSize * 2; for (let x = startX; x < endX; x += gridSize) { const screenX = x - camera.x + canvas.width / 2; ctx.beginPath(); ctx.moveTo(screenX, 0); ctx.lineTo(screenX, canvas.height); ctx.stroke(); } for (let y = startY; y < endY; y += gridSize) { const screenY = y - camera.y + canvas.height / 2; ctx.beginPath(); ctx.moveTo(0, screenY); ctx.lineTo(canvas.width, screenY); ctx.stroke(); } ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 6; const minX = 0 - camera.x + canvas.width / 2; const maxX = WORLD_SIZE - camera.x + canvas.width / 2; const minY = 0 - camera.y + canvas.height / 2; const maxY = WORLD_SIZE - camera.y + canvas.height / 2; ctx.strokeRect(minX, minY, maxX - minX, maxY - minY); } function updateHUD() { scoreVal.innerText = Math.floor(player.score); killsVal.innerText = player.kills; const sorted = [...snakes].sort((a, b) => b.score - a.score).slice(0, 5); leaderboardList.innerHTML = ''; sorted.forEach((s) => { const li = document.createElement('li'); li.className = 'leaderboard-item' + (s === player ? ' player' : ''); li.innerHTML = `<span>${s.name}</span><span>${Math.floor(s.score)}</span>`; leaderboardList.appendChild(li); }); effectsBar.innerHTML = ''; if (player.effects.magnet > 0) effectsBar.innerHTML += `<div class="effect-badge" style="color: #8b5cf6;">🧲 Magnet</div>`; if (player.effects.multiplier > 0) effectsBar.innerHTML += `<div class="effect-badge" style="color: #ec4899;">2x Multiplier</div>`; if (player.effects.speed > 0) effectsBar.innerHTML += `<div class="effect-badge" style="color: #3b82f6;">⚡ Speed</div>`; if (player.effects.shield > 0) effectsBar.innerHTML += `<div class="effect-badge" style="color: #06b6d4;">🛡 Shield</div>`; } function gameLoop() { if (!isPlaying) return; camera.x += (player.x - camera.x) * 0.1; camera.y += (player.y - camera.y) * 0.1; ctx.clearRect(0, 0, canvas.width, canvas.height); drawGrid(); while (foods.length < 350) { foods.push(new Food()); } for (let f of foods) f.draw(); snakes.forEach(s => s.update()); checkCollisions(); snakes.forEach(s => s.draw()); updateHUD(); animationFrameId = requestAnimationFrame(gameLoop); } function startGame() { const pName = playerNameInput.value.trim() || 'Player1'; player = new Snake(pName, WORLD_SIZE / 2, WORLD_SIZE / 2, false, '#10b981'); camera = { x: player.x, y: player.y }; snakes = [player]; foods = []; for (let i = 0; i < 12; i++) { snakes.push(new Snake( BOT_NAMES[i % BOT_NAMES.length], Math.random() * WORLD_SIZE, Math.random() * WORLD_SIZE, true, COLORS[i % COLORS.length] )); } startOverlay.classList.add('hidden'); deathOverlay.classList.add('hidden'); isPlaying = true; gameLoop(); } function endGame() { isPlaying = false; cancelAnimationFrame(animationFrameId); deathStats.innerText = `Your final score was ${Math.floor(player.score)} with ${player.kills} kills.`; deathOverlay.classList.remove('hidden'); } document.getElementById('start-btn').addEventListener('click', startGame); document.getElementById('restart-btn').addEventListener('click', startGame); </script></body></html>
