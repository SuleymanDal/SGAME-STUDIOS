<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Blovk Drop </title><style> * { box-sizing: border-box; } body { background-color: #121214; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: white; font-family: 'Segoe UI', sans-serif; touch-action: manipulation; } #menuScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; gap: 15px; } #menuScreen h1 { color: #ff0055; margin-bottom: 20px; font-size: 40px; } #game-container { position: relative; border: 3px solid #333; background: #000; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); } canvas { display: block; border-radius: 5px; } .ui-box { margin-top: 15px; display: flex; gap: 15px; justify-content: center; } .btn { background-color: #2a2a35; color: #fff; border: 2px solid #444; padding: 15px 30px; font-size: 24px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 0 #111; user-select: none; } .btn:active { background-color: #ff0055; transform: translateY(3px); box-shadow: 0 1px 0 #111; } .btn-diff { width: 250px; font-size: 20px; font-weight: bold; border-color: #ff0055; } </style></head><body><div id="menuScreen"><h1>BLOVK DROP</h1><button class="btn btn-diff" onclick="startGame(0.98)">EASY</button><button class="btn btn-diff" onclick="startGame(0.965)">NORMAL</button><button class="btn btn-diff" onclick="startGame(0.95)">HARD</button><button class="btn btn-diff" onclick="startGame(0.925)">EXTREME</button></div><div class="header"><div style="font-size: 18px; font-weight: bold; color: #00ffff; margin-bottom: 5px;">SCORE: <span id="score">0</span></div></div><div id="game-container"><canvas id="gameCanvas"></canvas></div><div class="ui-box"><button id="btnLeft" class="btn">⬅️</button><button id="btnRotate" class="btn">🔄</button><button id="btnRight" class="btn">➡️</button></div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const ROWS = 20, COLS = 10, BLOCK_SIZE = 25; canvas.width = COLS * BLOCK_SIZE; canvas.height = ROWS * BLOCK_SIZE; ctx.scale(BLOCK_SIZE, BLOCK_SIZE); let board = Array.from({length: ROWS}, () => Array(COLS).fill(0)); let player = { pos: {x: 3, y: 0}, matrix: null }; let score = 0, gameInterval = null, dropInterval = 500, currentMultiplier = 0.98; const SHAPES = [[],[ [1,1,1,1] ], [[2,0,0],[2,2,2]], [[0,0,3],[3,3,3]], [[4,4],[4,4]], [[0,5,5],[5,5,0]], [[0,6,0],[6,6,6]], [[7,7,0],[0,7,7]] ]; const COLORS = [null, '#00ffff', '#0000ff', '#ff7f00', '#ffff00', '#00ff00', '#800080', '#ff0000']; function draw() { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, COLS, ROWS); board.forEach((row, y) => row.forEach((val, x) => { if(val) { ctx.fillStyle = COLORS[val]; ctx.fillRect(x, y, 1, 1); }})); if(player.matrix) player.matrix.forEach((row, y) => row.forEach((val, x) => { if(val) { ctx.fillStyle = COLORS[val]; ctx.fillRect(x + player.pos.x, y + player.pos.y, 1, 1); }})); } function collide(player, board) { return player.matrix.some((row, y) => row.some((val, x) => val !== 0 && (board[y + player.pos.y] && board[y + player.pos.y][x + player.pos.x]) !== 0)); } function arenaSweep() { for (let y = ROWS - 1; y >= 0; y--) { if (board[y].every(cell => cell !== 0)) { board.splice(y, 1); board.unshift(new Array(COLS).fill(0)); score += 100; document.getElementById('score').innerText = score; y++; } } } function rotate() { const m = player.matrix; const rotated = m[0].map((_, i) => m.map(row => row[i]).reverse()); const oldMatrix = player.matrix; player.matrix = rotated; if (collide(player, board)) player.matrix = oldMatrix; } function playerDrop() { player.pos.y++; if (collide(player, board)) { player.pos.y--; player.matrix.forEach((row, y) => row.forEach((val, x) => { if(val) board[y + player.pos.y][x + player.pos.x] = val; })); arenaSweep(); // Hızlandırma if (dropInterval > 80) { dropInterval *= currentMultiplier; clearInterval(gameInterval); gameInterval = setInterval(playerDrop, dropInterval); } playerReset(); } draw(); } function playerReset() { player.matrix = SHAPES[Math.floor(Math.random() * (SHAPES.length - 1)) + 1]; player.pos = {x: 3, y: 0}; if (collide(player, board)) { clearInterval(gameInterval); document.getElementById('menuScreen').style.display = 'flex'; document.getElementById('menuScreen').querySelector('h1').innerText = "GAME OVER"; } } function startGame(multiplier) { board = Array.from({length: ROWS}, () => Array(COLS).fill(0)); score = 0; dropInterval = 500; currentMultiplier = multiplier; document.getElementById('score').innerText = '0'; document.getElementById('menuScreen').style.display = 'none'; playerReset(); if (gameInterval) clearInterval(gameInterval); gameInterval = setInterval(playerDrop, dropInterval); draw(); } document.getElementById('btnLeft').addEventListener('click', () => { player.pos.x--; if(collide(player, board)) player.pos.x++; draw(); }); document.getElementById('btnRight').addEventListener('click', () => { player.pos.x++; if(collide(player, board)) player.pos.x--; draw(); }); document.getElementById('btnRotate').addEventListener('click', () => { rotate(); draw(); }); draw(); </script></body></html>
