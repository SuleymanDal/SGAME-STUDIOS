<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Trogger</title><style> body { margin: 0; background-color: #1a1a1a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; } h1 { margin: 0 0 10px 0; font-size: clamp(24px, 5vw, 36px); color: #4CAF50; text-shadow: 2px 2px #000; letter-spacing: 3px; } #gameContainer { position: relative; display: flex; justify-content: center; align-items: center; } canvas { background-color: #2b2b2b; border: 4px solid #444; border-radius: 10px; width: 95vw; max-width: 900px; aspect-ratio: 4 / 3; box-shadow: 0 0 25px rgba(0, 0, 0, 0.7); } #menu { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; z-index: 10; } #menu h2 { color: #fff; margin-bottom: 20px; font-size: clamp(18px, 4vw, 24px); } .btn { color: #fff; border: none; padding: 12px 24px; margin: 6px; font-size: 16px; font-family: inherit; font-weight: bold; border-radius: 6px; cursor: pointer; width: 220px; text-transform: uppercase; transition: transform 0.1s, background 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); } .btn:hover { transform: scale(1.05); } .btn.basit { background: #4CAF50; } .btn.orta { background: #FF9800; } .btn.zor { background: #F44336; } .btn.imkansiz { background: #9C27B0; } .footer { position: absolute; bottom: 15px; opacity: 0.3; font-size: clamp(10px, 3vw, 14px); user-select: none; text-align: center; width: 100%; font-family: sans-serif; } </style></head><body><h1>TROGGER</h1><div id="gameContainer"><canvas id="gameCanvas" width="800" height="600"></canvas><div id="menu"><h2 id="menuTitle">ZORLUK SEÇ</h2><button class="btn basit" onclick="startGame(3)">Basit (3 Şerit)</button><button class="btn orta" onclick="startGame(5)">Orta (5 Şerit)</button><button class="btn zor" onclick="startGame(10)">Zor (10 Şerit)</button><button class="btn imkansiz" onclick="startGame(15)">İmkansız (15 Şerit)</button></div></div><div class="footer">Powered by SGame Studios -- SGame Studios ©2026</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const menu = document.getElementById('menu'); const menuTitle = document.getElementById('menuTitle'); let animReq; let gameState = 'MENU'; let laneCount = 3; let rows = 5; let tileSize = 0; let player = { x: 0, y: 0, targetX: 0, targetY: 0 }; let obstacles = []; // KONTROLLER (KLAVYE) let canMove = true; document.addEventListener('keydown', e => { if (gameState !== 'PLAYING' || !canMove) return; let moved = false; let cols = Math.floor(canvas.width / tileSize); if ((e.key === 'ArrowUp' || e.key === 'w') && player.targetY > 0) { player.targetY -= 1; moved = true; } else if ((e.key === 'ArrowDown' || e.key === 's') && player.targetY < rows - 1) { player.targetY += 1; moved = true; } else if ((e.key === 'ArrowLeft' || e.key === 'a') && player.targetX > 0) { player.targetX -= 1; moved = true; } else if ((e.key === 'ArrowRight' || e.key === 'd') && player.targetX < cols - 1) { player.targetX += 1; moved = true; } if (moved) canMove = false; }); document.addEventListener('keyup', () => canMove = true); // KONTROLLER (MOBİL SWIPE) let touchStartX = 0; let touchStartY = 0; canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: false }); canvas.addEventListener('touchend', e => { if (gameState !== 'PLAYING') return; let dx = e.changedTouches[0].clientX - touchStartX; let dy = e.changedTouches[0].clientY - touchStartY; let cols = Math.floor(canvas.width / tileSize); if (Math.abs(dx) > Math.abs(dy)) { if (dx > 30 && player.targetX < cols - 1) player.targetX += 1; else if (dx < -30 && player.targetX > 0) player.targetX -= 1; } else { if (dy > 30 && player.targetY < rows - 1) player.targetY += 1; else if (dy < -30 && player.targetY > 0) player.targetY -= 1; } }); function startGame(lanes) { laneCount = lanes; rows = laneCount + 2; tileSize = canvas.height / rows; let cols = Math.floor(canvas.width / tileSize); player.targetX = Math.floor(cols / 2); player.targetY = rows - 1; player.x = player.targetX * tileSize; player.y = player.targetY * tileSize; obstacles = []; const colors = ['#E53935', '#1E88E5', '#FDD835', '#D81B60', '#FB8C00', '#8E24AA', '#00ACC1']; for (let r = 1; r <= laneCount; r++) { let y = r * tileSize; let direction = r % 2 === 0 ? 1 : -1; // Şerit sayısı arttıkça hız dengeli olsun diye ayarlama let speed = (Math.random() * 1.2 + 1.2) * (1 + (laneCount * 0.03)); // Araç sıkışıklığını önlemek için her şeritte max 2 araç ve aralarında güvenli mesafe let carCount = laneCount > 10 ? 2 : (Math.random() > 0.5 ? 2 : 3); let spacing = canvas.width / carCount; let color = colors[r % colors.length]; for (let i = 0; i < carCount; i++) { let w = tileSize * 1.8; // Araç boyutu let x = i * spacing + (Math.random() * (spacing - w)); obstacles.push({ x, y, width: w, height: tileSize * 0.75, speed, direction, color }); } } menu.style.display = 'none'; gameState = 'PLAYING'; if (animReq) cancelAnimationFrame(animReq); loop(); } function endGame(won) { gameState = won ? 'WIN' : 'GAMEOVER'; menu.style.display = 'flex'; menuTitle.innerText = won ? "KAZANDIN! 🎉" : "EZİLDİN! 💥"; menuTitle.style.color = won ? "#4CAF50" : "#F44336"; } function update() { if (gameState !== 'PLAYING') return; player.x += (player.targetX * tileSize - player.x) * 0.35; player.y += (player.targetY * tileSize - player.y) * 0.35; let pRect = { x: player.x + tileSize * 0.25, y: player.y + tileSize * 0.25, w: tileSize * 0.5, h: tileSize * 0.5 }; for (let obs of obstacles) { obs.x += obs.speed * obs.direction; if (obs.direction === 1 && obs.x > canvas.width) obs.x = -obs.width; else if (obs.direction === -1 && obs.x + obs.width < 0) obs.x = canvas.width; let cRect = { x: obs.x + 2, y: obs.y + tileSize * 0.12, w: obs.width - 4, h: obs.height }; if (pRect.x < cRect.x + cRect.w && pRect.x + pRect.w > cRect.x && pRect.y < cRect.y + cRect.h && pRect.y + pRect.h > cRect.y) { endGame(false); } } if (player.targetY === 0) { endGame(true); } } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Güvenli Bölgeler (Çimen / Başlangıç-Bitiş) ctx.fillStyle = '#2e7d32'; ctx.fillRect(0, 0, canvas.width, tileSize); ctx.fillRect(0, canvas.height - tileSize, canvas.width, tileSize); // Çim dokusu detayları ctx.fillStyle = '#388e3c'; for(let i=0; i<canvas.width; i+=40) { ctx.fillRect(i + 10, 5, 8, 8); ctx.fillRect(i + 25, canvas.height - tileSize + 10, 8, 8); } // Yol ve Kesikli Şerit Çizgileri for (let i = 1; i < rows - 1; i++) { ctx.fillStyle = '#222'; ctx.fillRect(0, i * tileSize, canvas.width, tileSize); ctx.strokeStyle = '#666'; ctx.lineWidth = 2; ctx.setLineDash([15, 15]); ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(canvas.width, i * tileSize); ctx.stroke(); ctx.setLineDash([]); } // Detaylı Araçlar for (let obs of obstacles) { let rx = obs.x; let ry = obs.y + tileSize * 0.12; let rw = obs.width; let rh = obs.height; // Gövde ctx.fillStyle = obs.color; ctx.beginPath(); ctx.roundRect(rx, ry, rw, rh, 8); ctx.fill(); // Camlar ctx.fillStyle = 'rgba(0, 0, 0, 0.4)'; if (obs.direction === 1) { ctx.fillRect(rx + rw * 0.55, ry + 4, rw * 0.25, rh - 8); } else { ctx.fillRect(rx + rw * 0.2, ry + 4, rw * 0.25, rh - 8); } // Tekerlekler ctx.fillStyle = '#111'; ctx.fillRect(rx + rw * 0.15, ry - 3, 12, 5); ctx.fillRect(rx + rw * 0.65, ry - 3, 12, 5); ctx.fillRect(rx + rw * 0.15, ry + rh - 2, 12, 5); ctx.fillRect(rx + rw * 0.65, ry + rh - 2, 12, 5); // Farlar ctx.fillStyle = '#ffeb3b'; if (obs.direction === 1) { ctx.fillRect(rx + rw - 4, ry + 5, 4, 6); ctx.fillRect(rx + rw - 4, ry + rh - 11, 4, 6); } else { ctx.fillRect(rx, ry + 5, 4, 6); ctx.fillRect(rx, ry + rh - 11, 4, 6); } } // Kurbağa (Trogger) let px = player.x + tileSize / 2; let py = player.y + tileSize / 2; let r = tileSize * 0.35; // Gövde ctx.fillStyle = '#66bb6a'; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill(); // Sırt Deseni ctx.fillStyle = '#81c784'; ctx.beginPath(); ctx.arc(px, py, r * 0.6, 0, Math.PI * 2); ctx.fill(); // Gözler ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px - r*0.5, py - r*0.6, r*0.35, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px + r*0.5, py - r*0.6, r*0.35, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(px - r*0.5, py - r*0.6, r*0.15, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(px + r*0.5, py - r*0.6, r*0.15, 0, Math.PI*2); ctx.fill(); } function loop() { update(); draw(); animReq = requestAnimationFrame(loop); } draw(); </script></body></html>
