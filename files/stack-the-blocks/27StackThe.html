<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Stack the Blocks</title><style> body { margin: 0; padding: 0; overflow: hidden; /* Colorful and patterned background */ background: repeating-linear-gradient( 45deg, #ffecd2, #ffecd2 20px, #fcb69f 20px, #fcb69f 40px ); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; /* Prevents scrolling on mobile */ } canvas { display: block; width: 100vw; height: 100vh; } #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; } #score { margin-top: 10vh; font-size: 80px; font-weight: 900; color: #fff; text-shadow: 3px 3px 0px #ff7b54, -1px -1px 0px #ff7b54; transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); } #msg { margin-top: 20px; font-size: 24px; font-weight: bold; color: #fff; background: rgba(255, 123, 84, 0.9); padding: 12px 24px; border-radius: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); } </style></head><body><div id="ui-layer"><div id="score">0</div><div id="msg">Tap anywhere to stack!</div></div><canvas id="gameCanvas"></canvas><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const scoreEl = document.getElementById('score'); const msgEl = document.getElementById('msg'); function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize(); let blocks = []; let debris = []; let score = 0; let state = 'playing'; let scrollY = 0; let targetScrollY = 0; const BLOCK_HEIGHT = 45; // OYUNCUYU ZEKİ/YETENEKLİ HİSSETTİREN KISIM BURASI (Tolerans artırıldı) const SNAP_TOLERANCE = 18; // 5'ten 18'e çıkarıldı. Blok 18 piksel dışarıda olsa bile tam oturacak. function initGame() { blocks = []; debris = []; score = 0; state = 'playing'; scrollY = 0; targetScrollY = 0; scoreEl.innerText = score; msgEl.style.display = 'none'; let startWidth = Math.min(canvas.width * 0.7, 400); // Base Block blocks.push({ x: canvas.width / 2 - startWidth / 2, y: canvas.height - 150, w: startWidth, h: BLOCK_HEIGHT, color: 'hsl(0, 70%, 60%)', moving: false }); spawnBlock(); } function spawnBlock() { const prev = blocks[blocks.length - 1]; const isLeft = blocks.length % 2 === 0; const hue = (blocks.length * 15) % 360; const color = `hsl(${hue}, 80%, 65%)`; const speed = (4.5 + (score * 0.15)) * (isLeft ? 1 : -1); blocks.push({ x: isLeft ? -prev.w : canvas.width, y: prev.y - BLOCK_HEIGHT, w: prev.w, h: BLOCK_HEIGHT, color: color, moving: true, speed: speed }); if (blocks.length > 5) { targetScrollY += BLOCK_HEIGHT; } } window.addEventListener('pointerdown', (e) => { if (state === 'gameover') { initGame(); return; } const current = blocks[blocks.length - 1]; const prev = blocks[blocks.length - 2]; current.moving = false; const currentRight = current.x + current.w; const prevRight = prev.x + prev.w; const overlapLeft = Math.max(current.x, prev.x); const overlapRight = Math.min(currentRight, prevRight); let overlapWidth = overlapRight - overlapLeft; // SNAP MECHANIC: Forgiveness zone for players if (Math.abs(current.x - prev.x) <= SNAP_TOLERANCE) { current.x = prev.x; current.w = prev.w; overlapWidth = prev.w; // Bigger and more satisfying "Perfect" animation scoreEl.style.transform = 'scale(1.5)'; setTimeout(() => scoreEl.style.transform = 'scale(1)', 150); } if (overlapWidth > 0) { const overhangLeft = current.x < prev.x ? prev.x - current.x : 0; const overhangRight = currentRight > prevRight ? currentRight - prevRight : 0; if (overhangLeft > 0 && Math.abs(current.x - prev.x) > SNAP_TOLERANCE) { debris.push({ x: current.x, y: current.y, w: overhangLeft, h: BLOCK_HEIGHT, color: current.color, vx: -2, vy: 0 }); } if (overhangRight > 0 && Math.abs(current.x - prev.x) > SNAP_TOLERANCE) { debris.push({ x: prevRight, y: current.y, w: overhangRight, h: BLOCK_HEIGHT, color: current.color, vx: 2, vy: 0 }); } if (Math.abs(current.x - prev.x) > SNAP_TOLERANCE) { current.x = overlapLeft; current.w = overlapWidth; } score++; scoreEl.innerText = score; spawnBlock(); } else { state = 'gameover'; msgEl.innerText = "Game Over! Tap to restart."; msgEl.style.display = 'block'; debris.push({ x: current.x, y: current.y, w: current.w, h: BLOCK_HEIGHT, color: current.color, vx: current.speed > 0 ? 2 : -2, vy: 0 }); blocks.pop(); } }); function update() { requestAnimationFrame(update); scrollY += (targetScrollY - scrollY) * 0.1; ctx.clearRect(0, 0, canvas.width, canvas.height); for (let b of blocks) { if (b.moving) { b.x += b.speed; if (b.x > canvas.width - b.w || b.x < 0) { b.speed *= -1; b.x = Math.max(0, Math.min(b.x, canvas.width - b.w)); } } ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y + scrollY, b.w, b.h); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 3; ctx.strokeRect(b.x, b.y + scrollY, b.w, b.h); } for (let i = debris.length - 1; i >= 0; i--) { let d = debris[i]; d.vy += 0.8; d.x += d.vx; d.y += d.vy; ctx.fillStyle = d.color; ctx.fillRect(d.x, d.y + scrollY, d.w, d.h); if (d.y > canvas.height + targetScrollY + 200) { debris.splice(i, 1); } } } initGame(); update(); </script></body></html>
