<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>STOCK GO BRRRR</title><style> * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial', sans-serif; user-select: none; } body { background-color: #0b0f19; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; overflow: hidden; } .container { width: 100%; max-width: 850px; background: #111827; border-radius: 16px; padding: 20px; box-shadow: 0 10px 35px rgba(0, 0, 0, 0.7); border: 3px solid #1f2937; display: flex; flex-direction: column; gap: 15px; position: relative; } .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #374151; padding-bottom: 10px; } .title { font-size: 2rem; font-weight: 900; color: #facc15; text-shadow: 2px 2px #b45309; } .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .stat-box { background: #030712; padding: 10px 14px; border-radius: 8px; border: 1px solid #1f2937; text-align: center; } .stat-label { font-size: 0.75rem; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; } .stat-value { font-size: 1.3rem; font-weight: bold; margin-top: 2px; } .chart-container { position: relative; width: 100%; height: 320px; background: #000000; border-radius: 12px; overflow: hidden; border: 2px solid #1f2937; } canvas { width: 100%; height: 100%; display: block; } .ticker-text { position: absolute; top: 10px; left: 10px; font-size: 0.9rem; font-weight: bold; color: #38bdf8; background: rgba(17, 24, 39, 0.85); padding: 4px 10px; border-radius: 6px; border: 1px solid #374151; z-index: 2; } .controls { display: flex; gap: 12px; } .btn { flex: 1; padding: 16px; font-size: 1.4rem; font-weight: 900; border: none; border-radius: 12px; cursor: pointer; transition: transform 0.05s, filter 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.5); text-transform: uppercase; } .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.5); } .btn-buy { background: #22c55e; color: #052e16; box-shadow: 0 6px 0 #15803d; } .btn-sell { background: #ef4444; color: #450a0a; box-shadow: 0 6px 0 #b91c1c; } /* Overlay */ .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(3, 7, 18, 0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 16px; z-index: 10; gap: 15px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; } .overlay.active { opacity: 1; pointer-events: auto; } .game-over-title { font-size: 4rem; color: #ef4444; font-weight: 900; text-align: center; text-shadow: 4px 4px 0px #000; animation: shake 0.3s infinite; } .game-over-subtitle { font-size: 1.2rem; color: #9ca3af; text-align: center; padding: 0 20px; } .btn-restart { background: #3b82f6; color: #ffffff; padding: 14px 28px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0 #1d4ed8; margin-top: 10px; } .btn-restart:hover { background: #2563eb; } @keyframes shake { 0% { transform: translate(2px, 2px) rotate(0deg); } 20% { transform: translate(-3px, 0px) rotate(-1deg); } 40% { transform: translate(3px, 2px) rotate(1deg); } 60% { transform: translate(-3px, 1px) rotate(0deg); } 80% { transform: translate(-1px, -2px) rotate(1deg); } 100% { transform: translate(2px, 1px) rotate(-1deg); } } .floating-text { position: absolute; font-weight: 900; font-size: 1.3rem; pointer-events: none; animation: floatUp 0.6s forwards; z-index: 20; text-shadow: 1px 1px 2px black; } @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.2); } } </style></head><body><div class="container"><div class="header"><div class="title">STOCK GO BRRRR</div></div><div class="stats-grid"><div class="stat-box"><div class="stat-label">Cash Balance</div><div class="stat-value" id="balance-val" style="color: #38bdf8;">$1,000.00</div></div><div class="stat-box"><div class="stat-label">Shares Held</div><div class="stat-value" id="shares-val" style="color: #facc15;">0</div></div><div class="stat-box"><div class="stat-label">Market Price</div><div class="stat-value" id="price-val" style="color: #22c55e;">$100.00</div></div><div class="stat-box"><div class="stat-label">Avg Buy Price</div><div class="stat-value" id="avg-val" style="color: #9ca3af;">$0.00</div></div><div class="stat-box"><div class="stat-label">Current Value</div><div class="stat-value" id="holding-val" style="color: #e2e8f0;">$0.00</div></div><div class="stat-box"><div class="stat-label">Unrealized P/L</div><div class="stat-value" id="pl-val" style="color: #9ca3af;">$0.00 (0%)</div></div></div><div class="chart-container" id="chart-box"><div class="ticker-text" id="status-text">MARKET ACTIVE ⚡</div><canvas id="stockChart"></canvas></div><div class="controls"><button class="btn btn-buy" id="buy-btn">BUY BUY BUY! 🚀</button><button class="btn btn-sell" id="sell-btn">SELL EVERYTHING! 💥</button></div><div class="overlay" id="game-over-modal"><div class="game-over-title">Skill issue.</div><div class="game-over-subtitle" id="game-over-reason">You got wiped out.</div><button class="btn-restart" id="restart-btn">Try Again</button></div></div><script> // Game State let balance = 1000; let shares = 0; let totalInvestedCost = 0; let avgBuyPrice = 0; let price = 100; let basePrice = 100; // Baseline reference price let priceHistory = [100]; const maxDataPoints = 60; let isGameOver = false; // Balanced Market Engine States let momentum = 0; let trendTimer = 0; // Elements const balanceEl = document.getElementById('balance-val'); const sharesEl = document.getElementById('shares-val'); const priceEl = document.getElementById('price-val'); const avgEl = document.getElementById('avg-val'); const holdingEl = document.getElementById('holding-val'); const plEl = document.getElementById('pl-val'); const statusText = document.getElementById('status-text'); const canvas = document.getElementById('stockChart'); const ctx = canvas.getContext('2d'); const modal = document.getElementById('game-over-modal'); const modalReason = document.getElementById('game-over-reason'); const buyBtn = document.getElementById('buy-btn'); const sellBtn = document.getElementById('sell-btn'); const restartBtn = document.getElementById('restart-btn'); function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; } window.addEventListener('resize', resizeCanvas); resizeCanvas(); function formatMoney(num) { return '$' + num.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); } function drawChart() { ctx.clearRect(0, 0, canvas.width, canvas.height); if (priceHistory.length < 2) return; let min = Math.min(...priceHistory); let max = Math.max(...priceHistory); // Padding to ensure graph never hits hard top/bottom borders let margin = (max - min) * 0.15 || 5; min -= margin; max += margin; const stepX = canvas.width / (maxDataPoints - 1); // Average Buy Line if (shares > 0 && avgBuyPrice > 0) { const avgY = canvas.height - ((avgBuyPrice - min) / (max - min)) * canvas.height; ctx.beginPath(); ctx.setLineDash([5, 5]); ctx.strokeStyle = '#facc15'; ctx.lineWidth = 2; ctx.moveTo(0, avgY); ctx.lineTo(canvas.width, avgY); ctx.stroke(); ctx.setLineDash([]); } // Price Line ctx.beginPath(); ctx.lineWidth = 4; const isUp = priceHistory[priceHistory.length - 1] >= priceHistory[priceHistory.length - 2]; const lineColor = isUp ? '#22c55e' : '#ef4444'; ctx.strokeStyle = lineColor; for (let i = 0; i < priceHistory.length; i++) { const x = i * stepX; const y = canvas.height - ((priceHistory[i] - min) / (max - min)) * canvas.height; if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); } ctx.stroke(); // Fill Gradient ctx.lineTo((priceHistory.length - 1) * stepX, canvas.height); ctx.lineTo(0, canvas.height); ctx.closePath(); const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height); gradient.addColorStop(0, isUp ? 'rgba(34, 197, 94, 0.35)' : 'rgba(239, 68, 68, 0.35)'); gradient.addColorStop(1, 'rgba(0, 0, 0, 0)'); ctx.fillStyle = gradient; ctx.fill(); } // Balanced Market Dynamics Engine function updateMarket() { if (isGameOver) return; // Trend direction switcher (%50 Bullish / %50 Bearish) if (trendTimer <= 0) { let direction = Math.random() > 0.5 ? 1 : -1; let intensity = Math.random() * 0.04 + 0.01; // 1% to 5% trend strength momentum = direction * intensity; trendTimer = Math.floor(Math.random() * 15) + 8; // Hold trend for 8-22 ticks if (direction > 0) { statusText.innerText = "BULLISH BUYING PRESSURE 🚀"; } else { statusText.innerText = "BEARISH SELLING PRESSURE 📉"; } } trendTimer--; // Random Noise (-3% to +3%) let noise = (Math.random() - 0.5) * 0.06; // Oversold / Overbought Reversion (Elastic Band Effect) let bounce = 0; if (price < basePrice * 0.4) { // Price dropped too low relative to base -> Strong Recovery Pull bounce = 0.05; statusText.innerText = "🔥 OVERSOLD! DIP BUYERS RUSHING IN!"; } else if (price > basePrice * 3) { // Price grew too high -> Profit Taking Pullback bounce = -0.03; statusText.innerText = "⚠️ OVERBOUGHT! PROFIT TAKING!"; } // Calculate new price let totalChangePercent = momentum + noise + bounce; price += price * totalChangePercent; // Keep price reasonable & update basePrice dynamically on ATH if (price < 1) price = 1; if (price > basePrice * 2) basePrice = price; priceHistory.push(price); if (priceHistory.length > maxDataPoints) { priceHistory.shift(); } const isUp = priceHistory.length > 1 && price >= priceHistory[priceHistory.length - 2]; priceEl.style.color = isUp ? '#22c55e' : '#ef4444'; priceEl.innerText = formatMoney(price); updateStats(); drawChart(); checkGameOver(); } // Buy Action buyBtn.addEventListener('click', (e) => { if (isGameOver) return; if (balance >= price) { const amountToBuy = Math.floor(balance / price); if (amountToBuy <= 0) return; const cost = amountToBuy * price; shares += amountToBuy; balance -= cost; totalInvestedCost += cost; avgBuyPrice = totalInvestedCost / shares; updateStats(); showFloatingText(e.clientX, e.clientY, `+${amountToBuy} BUY!`, '#22c55e'); } else { showFloatingText(e.clientX, e.clientY, "NO CASH!", '#ef4444'); } }); // Sell Action sellBtn.addEventListener('click', (e) => { if (isGameOver) return; if (shares > 0) { const revenue = shares * price; const profit = revenue - totalInvestedCost; balance += revenue; const color = profit >= 0 ? '#22c55e' : '#ef4444'; const sign = profit >= 0 ? '+' : ''; showFloatingText(e.clientX, e.clientY, `${sign}${formatMoney(profit)}`, color); shares = 0; totalInvestedCost = 0; avgBuyPrice = 0; updateStats(); } else { showFloatingText(e.clientX, e.clientY, "NO SHARES!", '#ef4444'); } }); function updateStats() { balanceEl.innerText = formatMoney(balance); sharesEl.innerText = shares.toLocaleString(); avgEl.innerText = shares > 0 ? formatMoney(avgBuyPrice) : "$0.00"; const currentValue = shares * price; holdingEl.innerText = formatMoney(currentValue); if (shares > 0) { const unPnl = currentValue - totalInvestedCost; const pnlPercent = ((price - avgBuyPrice) / avgBuyPrice) * 100; const sign = unPnl >= 0 ? '+' : ''; plEl.innerText = `${sign}${formatMoney(unPnl)} (${sign}${pnlPercent.toFixed(1)}%)`; plEl.style.color = unPnl >= 0 ? '#22c55e' : '#ef4444'; } else { plEl.innerText = "$0.00 (0%)"; plEl.style.color = "#9ca3af"; } } function showFloatingText(x, y, text, color) { const el = document.createElement('div'); el.className = 'floating-text'; el.innerText = text; el.style.color = color; el.style.left = `${x - 30}px`; el.style.top = `${y - 30}px`; document.body.appendChild(el); setTimeout(() => { el.remove(); }, 600); } function checkGameOver() { const netWorth = balance + (shares * price); if (netWorth < 1) { triggerGameOver("Your portfolio got completely vaporized."); } } function triggerGameOver(reason) { isGameOver = true; modalReason.innerText = reason; modal.classList.add('active'); } restartBtn.addEventListener('click', () => { balance = 1000; shares = 0; totalInvestedCost = 0; avgBuyPrice = 0; price = 100; basePrice = 100; priceHistory = [100]; momentum = 0; trendTimer = 0; isGameOver = false; updateStats(); modal.classList.remove('active'); }); // Loop Speed (130ms) setInterval(updateMarket, 130); </script></body></html>
