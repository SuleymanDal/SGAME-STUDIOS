<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Tac-Man</title><style> body { margin: 0; background-color: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; /* Mobilde kaydırmayı engeller */ } h1 { margin: 0 0 10px 0; font-size: clamp(24px, 5vw, 36px); color: #ffeb3b; text-shadow: 2px 2px #ff0000; letter-spacing: 3px; } canvas { background-color: #000; border: 4px solid #1919A6; border-radius: 10px; max-width: 95vw; max-height: 70vh; object-fit: contain; box-shadow: 0 0 20px rgba(25, 25, 166, 0.5); } .footer { position: absolute; bottom: 15px; opacity: 0.3; font-size: clamp(10px, 3vw, 14px); user-select: none; text-align: center; width: 100%; font-family: sans-serif; } #restartBtn { display: none; margin-top: 15px; padding: 10px 20px; font-size: 18px; font-weight: bold; background: #ffeb3b; color: #000; border: none; border-radius: 5px; cursor: pointer; text-transform: uppercase; } #restartBtn:hover { background: #fff; } </style></head><body><h1>TAC-MAN</h1><canvas id="gameCanvas" width="380" height="420"></canvas><button id="restartBtn" onclick="initGame()">Tekrar Oyna</button><div class="footer">Powered by SGame Studios -- SGame Studios ©2026</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const restartBtn = document.getElementById('restartBtn'); const tileSize = 20; const rows = 21; const cols = 19; // 1 = Duvar, 0 = Yem, 2 = Boşluk (Tünel vs.) const initialMap = [ "1111111111111111111", "1000000001000000001", "1011011101011101101", "1000000000000000001", "1011010111110101101", "1000010001000100001", "1111011121211101111", "2221012222222101222", "1111012112112101111", "2222022122212202222", // Row 9: Tünel Hizası "1111012111112101111", "2221012222222101222", "1111012111112101111", "1000000001000000001", "1011011101011101101", "1001000000000001001", "1101010111110101011", "1000010001000100001", "1011111101011111101", "1000000000000000001", "1111111111111111111" ]; let map, score, totalDots, gameOver, gameWon, animReq; let player, ghosts; // Oyun Başlatma / Sıfırlama Fonksiyonu function initGame() { restartBtn.style.display = 'none'; cancelAnimationFrame(animReq); map = initialMap.map(row => row.split('').map(Number)); score = 0; totalDots = 0; gameOver = false; gameWon = false; // Yemleri say for (let r = 0; r < rows; r++) { for (let c = 0; c < cols; c++) { if (map[r][c] === 0) totalDots++; } } player = { x: 9 * tileSize, y: 15 * tileSize, speed: 2, dir: { x: 0, y: 0 }, nextDir: { x: 0, y: 0 }, angle: 0 }; ghosts = [ { x: 9 * tileSize, y: 7 * tileSize, color: '#FF0000', dir: { x: 1, y: 0 }, speed: 2 }, // Blinky (Kırmızı) { x: 8 * tileSize, y: 9 * tileSize, color: '#FFB8FF', dir: { x: 0, y: -1 }, speed: 2 }, // Pinky (Pembe) { x: 10 * tileSize, y: 9 * tileSize, color: '#00FFFF', dir: { x: 0, y: -1 }, speed: 2 } // Inky (Mavi) ]; loop(); } // --- KONTROLLER --- // 1. Klavye document.addEventListener('keydown', e => { if (e.key === 'ArrowUp' || e.key === 'w') player.nextDir = { x: 0, y: -1 }; if (e.key === 'ArrowDown' || e.key === 's') player.nextDir = { x: 0, y: 1 }; if (e.key === 'ArrowLeft' || e.key === 'a') player.nextDir = { x: -1, y: 0 }; if (e.key === 'ArrowRight' || e.key === 'd') player.nextDir = { x: 1, y: 0 }; }); // 2. Mobil Kaydırma (Swipe) let touchStartX = 0; let touchStartY = 0; document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY; }, { passive: false }); document.addEventListener('touchend', e => { let dx = e.changedTouches[0].clientX - touchStartX; let dy = e.changedTouches[0].clientY - touchStartY; if (Math.abs(dx) > Math.abs(dy)) { if (dx > 30) player.nextDir = { x: 1, y: 0 }; else if (dx < -30) player.nextDir = { x: -1, y: 0 }; } else { if (dy > 30) player.nextDir = { x: 0, y: 1 }; else if (dy < -30) player.nextDir = { x: 0, y: -1 }; } }); // Duvar Çarpışma Kontrolü function isWall(x, y) { let col = Math.floor(x / tileSize); let row = Math.floor(y / tileSize); // Tünel istisnası if (row === 9 && (col < 0 || col >= cols)) return false; if (col < 0 || col >= cols || row < 0 || row >= rows) return true; return map[row][col] === 1; } // Obje merkeze oturdu mu? (Dönüş yapabilmek için ızgara merkezinde olmalı) function atIntersection(x, y) { return x % tileSize === 0 && y % tileSize === 0; } function update() { if (gameOver || gameWon) return; // --- TAC-MAN HAREKETİ --- if (atIntersection(player.x, player.y)) { // İstediği yönde duvar yoksa, o yöne dön if (player.nextDir.x !== 0 || player.nextDir.y !== 0) { let nextX = player.x + player.nextDir.x * tileSize; let nextY = player.y + player.nextDir.y * tileSize; if (!isWall(nextX, nextY)) { player.dir = player.nextDir; } } // Gittiği yönde duvar varsa dur let forwardX = player.x + player.dir.x * tileSize; let forwardY = player.y + player.dir.y * tileSize; if (isWall(forwardX, forwardY)) { player.dir = { x: 0, y: 0 }; } } player.x += player.dir.x * player.speed; player.y += player.dir.y * player.speed; // Tünelden geçiş if (player.x < -tileSize) player.x = canvas.width; if (player.x > canvas.width) player.x = -tileSize; // Yem Yeme let centerCol = Math.floor((player.x + tileSize / 2) / tileSize); let centerRow = Math.floor((player.y + tileSize / 2) / tileSize); if (centerRow >= 0 && centerRow < rows && centerCol >= 0 && centerCol < cols) { if (map[centerRow][centerCol] === 0) { map[centerRow][centerCol] = 2; // Yendi (boşluk yap) score += 10; totalDots--; if (totalDots === 0) gameWon = true; } } // --- HAYALET YZ MANTIĞI --- ghosts.forEach(ghost => { if (atIntersection(ghost.x, ghost.y)) { let possibleDirs = []; const dirs = [{x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}]; dirs.forEach(d => { // Geriye dönmeyi engelle (sıkışmadıkça) if (d.x === -ghost.dir.x && d.y === -ghost.dir.y && (ghost.dir.x !== 0 || ghost.dir.y !== 0)) return; let nextX = ghost.x + d.x * tileSize; let nextY = ghost.y + d.y * tileSize; if (!isWall(nextX, nextY)) { possibleDirs.push(d); } }); // Eğer çıkmaz sokaktaysa geri dön, aksi halde rastgele yön seç if (possibleDirs.length > 0) { let randomDir = possibleDirs[Math.floor(Math.random() * possibleDirs.length)]; ghost.dir = randomDir; } else { ghost.dir = { x: -ghost.dir.x, y: -ghost.dir.y }; // Tam geri dön } } ghost.x += ghost.dir.x * ghost.speed; ghost.y += ghost.dir.y * ghost.speed; // Hayalet Tünel Geçişi if (ghost.x < -tileSize) ghost.x = canvas.width; if (ghost.x > canvas.width) ghost.x = -tileSize; // Çarpışma Kontrolü (Tac-Man ile Hayalet) let dist = Math.hypot(player.x - ghost.x, player.y - ghost.y); if (dist < tileSize - 5) { gameOver = true; } }); // Yön açısını ayarlama (Çizim için) if (player.dir.x === 1) player.angle = 0; else if (player.dir.x === -1) player.angle = Math.PI; else if (player.dir.y === 1) player.angle = Math.PI / 2; else if (player.dir.y === -1) player.angle = -Math.PI / 2; } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Labirent Çizimi for (let r = 0; r < rows; r++) { for (let c = 0; c < cols; c++) { if (map[r][c] === 1) { ctx.fillStyle = '#1919A6'; ctx.fillRect(c * tileSize, r * tileSize, tileSize, tileSize); } else if (map[r][c] === 0) { ctx.fillStyle = '#FFB8AE'; ctx.beginPath(); ctx.arc(c * tileSize + tileSize / 2, r * tileSize + tileSize / 2, 3, 0, Math.PI * 2); ctx.fill(); } } } // Tac-Man Çizimi (Ağız Animasyonlu) let mouthOpen = Math.abs(Math.sin(Date.now() / 150)) * 0.5; // Açılıp kapanma açısı ctx.fillStyle = '#ffeb3b'; ctx.save(); ctx.translate(player.x + tileSize / 2, player.y + tileSize / 2); ctx.rotate(player.angle); ctx.beginPath(); ctx.arc(0, 0, tileSize / 2 - 2, mouthOpen, Math.PI * 2 - mouthOpen); ctx.lineTo(0, 0); ctx.fill(); ctx.restore(); // Hayaletleri Çiz ghosts.forEach(ghost => { ctx.fillStyle = ghost.color; ctx.beginPath(); let gx = ghost.x + tileSize / 2; let gy = ghost.y + tileSize / 2; // Üst yarım daire ctx.arc(gx, gy, tileSize / 2 - 2, Math.PI, 0); // Alt ayaklar ctx.lineTo(gx + tileSize / 2 - 2, gy + tileSize / 2 - 2); ctx.lineTo(gx + tileSize / 6, gy + tileSize / 4); ctx.lineTo(gx, gy + tileSize / 2 - 2); ctx.lineTo(gx - tileSize / 6, gy + tileSize / 4); ctx.lineTo(gx - tileSize / 2 + 2, gy + tileSize / 2 - 2); ctx.fill(); // Gözler ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(gx - 4, gy - 2, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(gx + 4, gy - 2, 3, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#00f'; ctx.beginPath(); ctx.arc(gx - 4 + ghost.dir.x*2, gy - 2 + ghost.dir.y*2, 1.5, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(gx + 4 + ghost.dir.x*2, gy - 2 + ghost.dir.y*2, 1.5, 0, Math.PI*2); ctx.fill(); }); // Skor Çizimi ctx.fillStyle = '#fff'; ctx.font = '16px Courier New'; ctx.fillText('SCORE: ' + score, 10, 20); // Oyun Bitti / Kazanıldı Ekranı if (gameOver) { ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#f00'; ctx.font = 'bold 40px Courier New'; ctx.textAlign = 'center'; ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2); ctx.textAlign = 'left'; restartBtn.style.display = 'block'; } else if (gameWon) { ctx.fillStyle = 'rgba(0, 0, 0, 0.7)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#0f0'; ctx.font = 'bold 40px Courier New'; ctx.textAlign = 'center'; ctx.fillText('YOU WIN!', canvas.width / 2, canvas.height / 2); ctx.textAlign = 'left'; restartBtn.style.display = 'block'; } } function loop() { update(); draw(); if (!gameOver && !gameWon) { animReq = requestAnimationFrame(loop); } } // Oyunu başlat initGame(); </script></body></html>
