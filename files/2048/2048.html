<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <style>
    :root {
      --bg-color: #120a05;
      --board-bg: #261206;
      --tile-empty: #3a1d0d;
      --orange-main: #ff6600;
      --orange-light: #ff9933;
      --orange-glow: rgba(255, 102, 0, 0.4);
      --text-light: #fff0e6;
    }

    * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-color);
      color: var(--text-light);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; overflow: hidden;
      touch-action: none; /* Sayfa kaymasını engeller */
    }

    .game-container { width: 90vw; max-width: 420px; display: flex; flex-direction: column; gap: 15px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    h1 { font-size: 3rem; font-weight: 900; color: var(--orange-main); text-shadow: 0 0 12px var(--orange-glow); letter-spacing: 2px; }
    .stats { display: flex; gap: 10px; }
    .stat-box { background: var(--board-bg); border: 1px solid var(--orange-main); border-radius: 8px; padding: 6px 12px; display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 1.2rem; box-shadow: 0 0 8px var(--orange-glow); }
    .controls { display: flex; justify-content: flex-end; }
    button { background: var(--orange-main); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 1.4rem; cursor: pointer; transition: transform 0.1s; box-shadow: 0 0 10px var(--orange-glow); }
    button:active { transform: scale(0.95); }

    .board {
      width: 100%; height: 90vw; max-height: 420px;
      background: var(--board-bg); border-radius: 12px; padding: 12px;
      display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px;
      position: relative; border: 2px solid var(--orange-main); box-shadow: 0 0 25px var(--orange-glow);
      touch-action: none;
    }

    .cell { background: var(--tile-empty); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 1.6rem; font-weight: bold; transition: all 0.1s ease-in-out; }
    
    .val-2    { color: #ffaa80; }
    .val-4    { color: #ff9966; }
    .val-8    { color: #ff8533; }
    .val-16   { color: #ff771a; }
    .val-32   { color: #ffffff; }
    .val-64   { color: #ffffff; text-shadow: 0 0 8px var(--orange-main); }
    .val-128  { color: #ffffff; }
    .val-256  { color: #ffffff; }
    .val-512  { color: #ffffff; }
    .val-1024 { color: #ffffff; }
    .val-2048 { color: #ffffff; box-shadow: inset 0 0 20px var(--orange-main); }

    .overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 10, 5, 0.9); border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px; font-size: 4rem; opacity: 0; pointer-events: none; }
    .overlay.active { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>

  <div class="game-container">
    <header>
      <h1>2048</h1>
      <div class="stats">
        <div class="stat-box">🎯 <span id="current-max">2</span></div>
        <div class="stat-box">🏆 <span id="best-max">2</span></div>
      </div>
    </header>

    <div class="controls">
      <button id="restart-btn">🔄</button>
    </div>

    <div class="board" id="board">
      <div class="overlay" id="overlay">
        <span>💥</span>
        <button id="retry-btn">🔄</button>
      </div>
    </div>
  </div>

  <script>
    let board = Array(4).fill().map(() => Array(4).fill(0));
    const currentMaxEl = document.getElementById('current-max');
    const bestMaxEl = document.getElementById('best-max');
    const boardEl = document.getElementById('board');
    const overlayEl = document.getElementById('overlay');
    const restartBtn = document.getElementById('restart-btn');
    const retryBtn = document.getElementById('retry-btn');

    let bestVal = parseInt(localStorage.getItem('2048_best_tile') || 2);
    bestMaxEl.textContent = bestVal;

    function initGame() {
      board = Array(4).fill().map(() => Array(4).fill(0));
      overlayEl.classList.remove('active');
      addRandomTile();
      addRandomTile();
      updateStats();
      render();
    }

    function updateStats() {
      let currentMax = 0;
      board.forEach(row => row.forEach(val => { if(val > currentMax) currentMax = val; }));
      
      currentMaxEl.textContent = currentMax;

      if (currentMax > bestVal) {
        bestVal = currentMax;
        localStorage.setItem('2048_best_tile', bestVal);
        bestMaxEl.textContent = bestVal;
      }
    }

    function addRandomTile() {
      let emptyCells = [];
      for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(board[r][c] === 0) emptyCells.push({r, c});
      if(emptyCells.length > 0) {
        let {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const cells = boardEl.querySelectorAll('.cell');
      cells.forEach(c => c.remove());
      for(let r=0; r<4; r++) {
        for(let c=0; c<4; c++) {
          let val = board[r][c];
          let cell = document.createElement('div');
          cell.className = 'cell' + (val ? ` val-${val}` : '');
          cell.textContent = val ? val : '';
          boardEl.appendChild(cell);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(val => val !== 0);
      for(let i=0; i<arr.length-1; i++) {
        if(arr[i] === arr[i+1]) {
          arr[i] *= 2;
          arr[i+1] = 0;
        }
      }
      arr = arr.filter(val => val !== 0);
      while(arr.length < 4) arr.push(0);
      return arr;
    }

    function rotate() {
      let newBoard = Array(4).fill().map(() => Array(4).fill(0));
      for(let r=0; r<4; r++) for(let c=0; c<4; c++) newBoard[c][3-r] = board[r][c];
      board = newBoard;
    }

    function move(dir) { // 0:Left, 1:Down, 2:Right, 3:Up
      for(let i=0; i<dir; i++) rotate();
      let moved = false;
      for(let r=0; r<4; r++) {
        let newRow = slide(board[r]);
        if(newRow.join(',') !== board[r].join(',')) moved = true;
        board[r] = newRow;
      }
      for(let i=0; i<(4-dir)%4; i++) rotate();
      
      if(moved) {
        addRandomTile();
        updateStats();
        render();
        checkGameOver();
      }
    }

    function checkGameOver() {
      for(let r=0; r<4; r++) for(let c=0; c<4; c++) if(board[r][c] === 0) return;
      for(let r=0; r<4; r++) for(let c=0; c<3; c++) if(board[r][c] === board[r][c+1]) return;
      for(let c=0; c<4; c++) for(let r=0; r<3; r++) if(board[r][c] === board[r+1][c]) return;
      overlayEl.classList.add('active');
    }

    // Klavye Tuş Kontrolleri
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowLeft') move(0);
      if(e.key === 'ArrowDown') move(1);
      if(e.key === 'ArrowRight') move(2);
      if(e.key === 'ArrowUp') move(3);
    });

    // Dokunmatik Kaydırma (Swipe) Kontrolleri
    let startX = 0, startY = 0;

    boardEl.addEventListener('touchstart', e => {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
    }, { passive: true });

    boardEl.addEventListener('touchend', e => {
      let diffX = e.changedTouches[0].clientX - startX;
      let diffY = e.changedTouches[0].clientY - startY;

      // Yanlışlıkla dokunmaları engellemek için minimum hassasiyet (20px)
      if (Math.abs(diffX) > 20 || Math.abs(diffY) > 20) {
        if (Math.abs(diffX) > Math.abs(diffY)) {
          move(diffX > 0 ? 2 : 0); // Sağ / Sol
        } else {
          move(diffY > 0 ? 1 : 3); // Aşağı / Yukarı
        }
      }
    }, { passive: true });

    restartBtn.addEventListener('click', initGame);
    retryBtn.addEventListener('click', initGame);
    initGame();
  </script>
</body>
</html>
