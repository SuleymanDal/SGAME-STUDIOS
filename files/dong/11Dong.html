<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Dong</title><style> body { margin: 0; background-color: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; touch-action: none; } h1 { margin: 0 0 10px 0; font-family: monospace; font-size: clamp(24px, 5vw, 32px); letter-spacing: 5px; } canvas { background-color: #000; border: 2px solid #fff; width: 95vw; max-width: 800px; aspect-ratio: 2 / 1; cursor: crosshair; } .footer { position: absolute; bottom: 15px; opacity: 0.3; font-size: clamp(10px, 3vw, 14px); user-select: none; text-align: center; width: 100%; } </style></head><body><h1>DONG</h1><canvas id="gameCanvas" width="800" height="400"></canvas><div class="footer">Powered by SGame Studios -- SGame Studios ©2026</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const player = { x: 20, y: 150, width: 10, height: 100, score: 0 }; const ai = { x: 770, y: 150, width: 10, height: 100, speed: 6, score: 0 }; // Başlangıç hızları const startSpeedX = 6; const startSpeedY = 6; const ball = { x: 400, y: 200, radius: 8, dx: startSpeedX, dy: startSpeedY }; let upPressed = false; let downPressed = false; // 1. KLAVYE KONTROLLERİ document.addEventListener('keydown', e => { if (e.key === 'ArrowUp') upPressed = true; if (e.key === 'ArrowDown') downPressed = true; }); document.addEventListener('keyup', e => { if (e.key === 'ArrowUp') upPressed = false; if (e.key === 'ArrowDown') downPressed = false; }); // 2. FARE (MOUSE) KONTROLLERİ canvas.addEventListener('mousemove', e => { const rect = canvas.getBoundingClientRect(); const scaleY = canvas.height / rect.height; player.y = (e.clientY - rect.top) * scaleY - (player.height / 2); sınırlarıKoru(player); }); // 3. MOBİL (DOKUNMATİK) KONTROLLER canvas.addEventListener('touchmove', handleTouch, { passive: false }); canvas.addEventListener('touchstart', handleTouch, { passive: false }); function handleTouch(e) { e.preventDefault(); const rect = canvas.getBoundingClientRect(); const scaleY = canvas.height / rect.height; player.y = (e.touches[0].clientY - rect.top) * scaleY - (player.height / 2); sınırlarıKoru(player); } // Raketin ekrandan çıkmasını engelleme function sınırlarıKoru(obj) { if (obj.y < 0) obj.y = 0; if (obj.y > canvas.height - obj.height) obj.y = canvas.height - obj.height; } function resetBall() { ball.x = canvas.width / 2; ball.y = canvas.height / 2; // Yönü koru ama hızı sıfırla let dirX = ball.dx > 0 ? 1 : -1; let dirY = ball.dy > 0 ? 1 : -1; ball.dx = -dirX * startSpeedX; // Kaybeden tarafa at ball.dy = (Math.random() > 0.5 ? 1 : -1) * startSpeedY; // Rastgele Y yönü } function vurusEfektiYarat(paddleY, paddleHeight) { // Top raketin neresine çarptı? (Ortaya yakınsa düz, kenarlara yakınsa çapraz gider) let carpmaNoktasi = (ball.y - (paddleY + paddleHeight / 2)) / (paddleHeight / 2); ball.dy = carpmaNoktasi * 8; // Max 8 hızında Y ekseni değişimi (Falso) // Hızı %5 artır (Maksimum hız limiti koyuyoruz ki ışınlanmasın) if (Math.abs(ball.dx) < 18) { ball.dx *= 1.05; } } function update() { // Oyuncu Hareketi (Klavye için) if (upPressed) player.y -= 7; if (downPressed) player.y += 7; sınırlarıKoru(player); // --- YENİ AKILLI AI MANTIĞI --- let aiTargetY; if (ball.dx > 0) { // Top bota doğru geliyorsa topun hizasına git aiTargetY = ball.y; } else { // Top oyuncuya gidiyorsa merkeze dönüp pozisyon al aiTargetY = canvas.height / 2; } let aiCenter = ai.y + ai.height / 2; // Titremeyi önlemek için hedef ile bot arasında mesafe kontrolü (Deadzone) if (Math.abs(aiTargetY - aiCenter) > ai.speed) { if (aiTargetY > aiCenter) { ai.y += ai.speed; } else { ai.y -= ai.speed; } } else { // Çok yakınsa direkt hedefe otur (Titreme yapmaz) ai.y = aiTargetY - ai.height / 2; } sınırlarıKoru(ai); // ----------------------------- // Top Hareketi ball.x += ball.dx; ball.y += ball.dy; // Duvar Çarpışması (Alt ve Üst kenarlar) if (ball.y - ball.radius < 0) { ball.y = ball.radius; ball.dy *= -1; } else if (ball.y + ball.radius > canvas.height) { ball.y = canvas.height - ball.radius; ball.dy *= -1; } // Raket Çarpışması let hitPlayer = ball.x - ball.radius < player.x + player.width && ball.y > player.y && ball.y < player.y + player.height; let hitAI = ball.x + ball.radius > ai.x && ball.y > ai.y && ball.y < ai.y + ai.height; if (hitPlayer) { ball.dx = Math.abs(ball.dx); ball.x = player.x + player.width + ball.radius; vurusEfektiYarat(player.y, player.height); } else if (hitAI) { ball.dx = -Math.abs(ball.dx); ball.x = ai.x - ball.radius; vurusEfektiYarat(ai.y, ai.height); } // Skor Kontrolü if (ball.x < 0) { ai.score++; resetBall(); } else if (ball.x > canvas.width) { player.score++; resetBall(); } } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); // Raketler ctx.fillStyle = '#fff'; ctx.fillRect(player.x, player.y, player.width, player.height); ctx.fillRect(ai.x, ai.y, ai.width, ai.height); // Top ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2); ctx.fill(); // Skor ctx.font = '32px monospace'; ctx.fillStyle = '#aaa'; // Skor rengini biraz soluk yaptım ki top rahat görünsün ctx.fillText(player.score, canvas.width / 4, 50); ctx.fillText(ai.score, (canvas.width / 4) * 3, 50); // Orta Kesik Çizgi ctx.setLineDash([10, 15]); ctx.beginPath(); ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height); ctx.strokeStyle = '#555'; // Ağ çizgisini de biraz koyulaştırdım ctx.stroke(); ctx.setLineDash([]); } function loop() { update(); draw(); requestAnimationFrame(loop); } // Oyunu Başlat loop(); </script></body></html>
