<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Square Game</title><style> body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; background-color: #2c3e50; color: #ecf0f1; margin-top: 40px; margin-bottom: 20px; } h1 { margin-bottom: 15px; } #game-board { display: grid; grid-template-columns: repeat(10, 45px); grid-template-rows: repeat(10, 45px); gap: 2px; background-color: #34495e; padding: 5px; border-radius: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); } .cell { width: 45px; height: 45px; background-color: #ecf0f1; color: #2c3e50; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; cursor: default; user-select: none; border-radius: 3px; transition: background-color 0.2s; } /* Geçilen kareler: Koyu siyah zemin, tam beyaz metin */ .cell.visited { background-color: #000000; color: #ffffff; } /* O an bulunulan kare */ .cell.current { background-color: #2980b9; color: white; } /* Gidilebilecek (geçerli) kareler: Açık yeşil */ .cell.valid { background-color: lightgreen; cursor: pointer; color: #2c3e50; } .cell.valid:hover { background-color: #76d7c4; transform: scale(1.05); } #info-panel { margin-top: 20px; text-align: center; } #status { font-size: 20px; font-weight: bold; margin-bottom: 10px; } button { padding: 10px 20px; font-size: 16px; background-color: #e74c3c; color: white; border: none; border-radius: 5px; cursor: pointer; transition: background-color 0.3s; } button:hover { background-color: #c0392b; } /* Hafif şeffaf telif hakkı yazısı */ #footer { margin-top: 40px; font-size: 14px; color: rgba(236, 240, 241, 0.4); /* Şeffaf beyaz/gri */ text-align: center; user-select: none; } </style></head><body><h1>Square Game</h1><div id="game-board"></div><div id="info-panel"><div id="status">Next Step: 1</div><button onclick="initGame()">Restart Game</button></div><div id="footer"> Powered By SGame Studios - ©SGame Studios - 2026 </div><script> const boardSize = 10; let board = []; let currentR = 0; let currentC = 0; let moveCount = 1; const boardElement = document.getElementById('game-board'); const statusElement = document.getElementById('status'); function initGame() { board = Array.from({ length: boardSize }, () => Array(boardSize).fill(0)); currentR = 0; currentC = 0; moveCount = 1; board[currentR][currentC] = moveCount; renderBoard(); } function getValidMoves(r, c) { const moves = []; // YATAY VE DİKEY HAREKETLER (2 boşluk atlanarak -> 3 birim mesafe) const orthogonalMoves = [ { dr: -3, dc: 0 }, { dr: 3, dc: 0 }, { dr: 0, dc: -3 }, { dr: 0, dc: 3 } ]; // ÇAPRAZ HAREKETLER (1 boşluk atlanarak -> 2 birim mesafe) const diagonalMoves = [ { dr: -2, dc: -2 }, { dr: -2, dc: 2 }, { dr: 2, dc: -2 }, { dr: 2, dc: 2 } ]; const allPossibleMoves = [...orthogonalMoves, ...diagonalMoves]; for (const move of allPossibleMoves) { const newR = r + move.dr; const newC = c + move.dc; if (newR >= 0 && newR < boardSize && newC >= 0 && newC < boardSize) { if (board[newR][newC] === 0) { moves.push({ r: newR, c: newC }); } } } return moves; } function makeMove(r, c) { moveCount++; currentR = r; currentC = c; board[currentR][currentC] = moveCount; renderBoard(); } function renderBoard() { boardElement.innerHTML = ''; const validMoves = getValidMoves(currentR, currentC); if (validMoves.length === 0 && moveCount < boardSize * boardSize) { statusElement.innerText = `Game Over! No valid moves left. Score: ${moveCount}`; statusElement.style.color = "#e74c3c"; } else if (moveCount === boardSize * boardSize) { statusElement.innerText = `Awesome! You filled the board. Score: 100`; statusElement.style.color = "lightgreen"; } else { statusElement.innerText = `Next Step: ${moveCount + 1}`; statusElement.style.color = "#ecf0f1"; } for (let r = 0; r < boardSize; r++) { for (let c = 0; c < boardSize; c++) { const cell = document.createElement('div'); cell.classList.add('cell'); if (board[r][c] > 0) { cell.innerText = board[r][c]; cell.classList.add('visited'); if (r === currentR && c === currentC) { cell.classList.add('current'); } } const isValid = validMoves.some(m => m.r === r && m.c === c); if (isValid) { cell.classList.add('valid'); cell.onclick = () => makeMove(r, c); } boardElement.appendChild(cell); } } } window.onload = initGame; </script></body></html>
