<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blast Field</title><style> * { box-sizing: border-box; } body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e2f; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 10px; } h1 { margin: 0 0 5px 0; color: #ff5252; text-transform: uppercase; letter-spacing: 2px; font-size: 1.8rem; text-align: center; } .subtitle { font-size: 0.85rem; color: #a2a2c2; margin-bottom: 15px; text-align: center; } .difficulty-selector { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; justify-content: center; } .diff-btn { background-color: #2a2a40; color: #a2a2c2; border: 1px solid #3b3b58; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px; cursor: pointer; } .diff-btn.active { background-color: #ff5252; color: white; border-color: #ff5252; font-weight: bold; } .score-board { display: flex; gap: 15px; margin-bottom: 12px; font-size: 0.95rem; background: #2a2a40; padding: 8px 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); } .controls { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; } button.action-btn, button.reset-btn { background-color: #ff5252; color: white; border: none; padding: 8px 16px; font-size: 0.9rem; font-weight: bold; border-radius: 5px; cursor: pointer; } #mode-toggle { background-color: #3b3b58; border: 1px solid #5c5c8a; } .grid { display: grid; width: min(90vw, 420px); height: min(90vw, 420px); gap: 2px; background-color: #2a2a40; padding: 8px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); } .cell { background-color: #3b3b58; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; user-select: none; border-radius: 2px; transition: background-color 0.1s; } .cell:hover { background-color: #4c4c70; } .cell.revealed { background-color: #222233; cursor: default; } .cell.mine { background-color: #d9534f; } .cell.flagged { background-color: #f0ad4e; } .c1 { color: #5bc0de; } .c2 { color: #5cb85c; } .c3 { color: #f0ad4e; } .c4 { color: #d9534f; } .c5 { color: #e9ecef; } .c6 { color: #17a2b8; } .c7 { color: #ffc107; } .c8 { color: #6c757d; } </style></head><body><h1>Blast Field</h1><div class="subtitle">Flagging an empty square ends the game!</div><div class="difficulty-selector"><button class="diff-btn" onclick="setDifficulty('easy')">Easy (8x8)</button><button class="diff-btn active" onclick="setDifficulty('normal')">Normal (12x12)</button><button class="diff-btn" onclick="setDifficulty('hard')">Hard (20x20)</button><button class="diff-btn" onclick="setDifficulty('extreme')">Extreme (35x35)</button></div><div class="score-board"><div>Mines: <span id="mines-count">20</span></div><div>Status: <span id="game-status">Playing</span></div></div><div class="controls"><button class="reset-btn" onclick="initGame()">New Game</button><button class="action-btn" id="mode-toggle" onclick="toggleMobileMode()">Mode: Dig ⛏️</button></div><div class="grid" id="grid"></div><script> const difficulties = { easy: { width: 8, height: 8, mines: 10 }, normal: { width: 12, height: 12, mines: 20 }, hard: { width: 20, height: 20, mines: 55 }, extreme: { width: 35, height: 35, mines: 140 } }; let currentDiffKey = 'normal'; let width = 12, height = 12, mineCount = 20; let board = [], minesLeft = 20, isGameOver = false, revealedCount = 0, mobileAction = 'dig'; const gridElement = document.getElementById('grid'); const minesCountElement = document.getElementById('mines-count'); const gameStatusElement = document.getElementById('game-status'); const modeToggleBtn = document.getElementById('mode-toggle'); function setDifficulty(diff) { currentDiffKey = diff; width = difficulties[diff].width; height = difficulties[diff].height; mineCount = difficulties[diff].mines; document.querySelectorAll('.diff-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active'); initGame(); } function toggleMobileMode() { mobileAction = (mobileAction === 'dig') ? 'flag' : 'dig'; modeToggleBtn.innerText = mobileAction === 'dig' ? "Mode: Dig ⛏️" : "Mode: Flag 🚩"; modeToggleBtn.style.backgroundColor = mobileAction === 'dig' ? "#3b3b58" : "#f0ad4e"; } function initGame() { gridElement.innerHTML = ''; gridElement.style.gridTemplateColumns = `repeat(${width}, 1fr)`; gridElement.style.gridTemplateRows = `repeat(${height}, 1fr)`; board = []; minesLeft = mineCount; isGameOver = false; revealedCount = 0; minesCountElement.innerText = minesLeft; gameStatusElement.innerText = "Playing"; gameStatusElement.style.color = "#ffffff"; let totalCells = width * height; let minesArray = Array(mineCount).fill(true); let emptyArray = Array(totalCells - mineCount).fill(false); let gameArray = emptyArray.concat(minesArray).sort(() => Math.random() - 0.5); for (let i = 0; i < totalCells; i++) { const cell = document.createElement('div'); cell.classList.add('cell'); cell.setAttribute('id', i); cell.style.fontSize = width > 20 ? '0.5rem' : '0.9rem'; cell.addEventListener('click', () => handleCellClick(cell)); cell.addEventListener('contextmenu', (e) => { e.preventDefault(); addFlag(cell); }); gridElement.appendChild(cell); board.push({ id: i, element: cell, mine: gameArray[i], revealed: false, flagged: false, total: 0 }); } // Mükemmel Sayı Hesaplama (Koordinat Tabanlı) for (let i = 0; i < totalCells; i++) { if (board[i].mine) continue; let r = Math.floor(i / width); let c = i % width; let count = 0; for (let dr = -1; dr <= 1; dr++) { for (let dc = -1; dc <= 1; dc++) { let nr = r + dr, nc = c + dc; if (nr >= 0 && nr < height && nc >= 0 && nc < width) { if (board[nr * width + nc].mine) count++; } } } board[i].total = count; } } function handleCellClick(cell) { if (isGameOver) return; if (mobileAction === 'flag') addFlag(cell); else clickCell(cell); } function addFlag(cell) { if (isGameOver) return; const index = parseInt(cell.id); if (board[index].revealed) return; if (!board[index].flagged) { // KURAL: Eğer boş yere bayrak konulursa oyun biter if (!board[index].mine) { cell.style.backgroundColor = "#ff0000"; cell.innerText = "❌"; gameOver(cell, "Wrong Flag!"); return; } board[index].flagged = true; cell.classList.add('flagged'); cell.innerText = '🚩'; minesLeft--; } else { board[index].flagged = false; cell.classList.remove('flagged'); cell.innerText = ''; minesLeft++; } minesCountElement.innerText = minesLeft; } function clickCell(cell) { const index = parseInt(cell.id); if (board[index].revealed || board[index].flagged) return; if (board[index].mine) { gameOver(cell, "Game Over!"); return; } revealCell(index); checkWin(); } function revealCell(index) { const cellData = board[index]; if (cellData.revealed || cellData.flagged) return; cellData.revealed = true; cellData.element.classList.add('revealed'); revealedCount++; if (cellData.total > 0) { cellData.element.innerText = cellData.total; cellData.element.classList.add('c' + cellData.total); } else { let r = Math.floor(index / width); let c = index % width; for (let dr = -1; dr <= 1; dr++) { for (let dc = -1; dc <= 1; dc++) { let nr = r + dr, nc = c + dc; if (nr >= 0 && nr < height && nc >= 0 && nc < width) { revealCell(nr * width + nc); } } } } } function gameOver(cell, msg) { isGameOver = true; gameStatusElement.innerText = msg; gameStatusElement.style.color = "#ff5252"; board.forEach(item => { if (item.mine) { item.element.classList.add('mine', 'revealed'); item.element.innerText = '💣'; } }); } function checkWin() { if (revealedCount === (width * height) - mineCount) { isGameOver = true; gameStatusElement.innerText = "You Won!"; gameStatusElement.style.color = "#5cb85c"; } } initGame(); </script></body></html>
