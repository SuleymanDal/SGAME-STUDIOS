<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Blast Field</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --container-bg: rgba(30, 41, 59, 0.85);
            --text-color: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 420px;
            background: var(--container-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title h1 {
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ef4444, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
            line-height: 1.1;
        }

        .title p {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .controls-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 8px;
        }

        .select-diff {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
        }

        .btn {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            border: none;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.8rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(239, 68, 68, 0.6);
        }

        .status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            background: rgba(15, 23, 42, 0.7);
            padding: 8px 14px;
            border-radius: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            font-weight: 700;
            font-size: 0.85rem;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #facc15;
        }

        /* Mayın Tarlası Izgarası (Grid) */
        .minefield {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
            width: 100%;
            background: #0f172a;
            border: 3px solid #334155;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 12px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #334155;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            transition: background 0.1s;
        }

        .cell:hover {
            background: #475569;
        }

        .cell.revealed {
            background: #1e293b;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .cell.mine {
            background: #ef4444 !important;
        }

        .cell.flagged {
            color: #facc15;
        }

        /* Sayı Renkleri */
        .c-1 { color: #38bdf8; }
        .c-2 { color: #34d399; }
        .c-3 { color: #f87171; }
        .c-4 { color: #c084fc; }
        .c-5 { color: #fbbf24; }
        .c-6 { color: #2dd4bf; }
        .c-7 { color: #f472b6; }
        .c-8 { color: #94a3b8; }

        .mobile-flag-toggle {
            background: rgba(51, 65, 85, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
            transition: background 0.2s;
        }

        .mobile-flag-toggle.active {
            background: #ca8a04;
            border-color: #facc15;
        }

        .message {
            font-size: 0.85rem;
            font-weight: 600;
            color: #34d399;
            min-height: 20px;
            text-align: center;
            margin-bottom: 5px;
        }

        .footer-credit {
            margin-top: 5px;
            font-size: 0.7rem;
            color: #64748b;
            letter-spacing: 0.5px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Header -->
        <div class="header">
            <div class="title">
                <h1>Blast Field</h1>
                <p>Minesweeper Game</p>
            </div>
            <button class="btn" onclick="initGame()">Restart</button>
        </div>

        <!-- Controls / Difficulty -->
        <div class="controls-top">
            <select id="difficulty" class="select-diff" onchange="initGame()">
                <option value="easy">Easy (9x9 - 10)</option>
                <option value="medium" selected>Medium (9x9 - 15)</option>
                <option value="hard">Hard (9x9 - 22)</option>
            </select>
        </div>

        <!-- Status Bar -->
        <div class="status-bar">
            <div class="status-item">💣 <span id="mine-count">15</span></div>
            <div class="status-item">⏱️ <span id="timer">000</span></div>
        </div>

        <!-- Mobile Flag Toggle Button -->
        <button id="flag-mode-btn" class="mobile-flag-toggle" onclick="toggleFlagMode()">Flag Mode: OFF 🚩</button>

        <!-- Minefield Grid -->
        <div class="minefield" id="minefield"></div>

        <!-- Message Box -->
        <div class="message" id="message">Left click to dig, Right click for flag</div>

        <!-- SGame Copyright -->
        <div class="footer-credit">
            © 2026 SGame. All rights reserved.
        </div>
    </div>

    <script>
        const gridEl = document.getElementById('minefield');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const messageEl = document.getElementById('message');
        const diffSelect = document.getElementById('difficulty');
        const flagModeBtn = document.getElementById('flag-mode-btn');

        const rows = 9;
        const cols = 9;
        let mineCount = 15;

        let board = [];
        let revealedCount = 0;
        let gameOver = false;
        let gameStarted = false;
        let timer = 0;
        let timerInterval = null;
        let flagMode = false;

        function toggleFlagMode() {
            flagMode = !flagMode;
            if (flagMode) {
                flagModeBtn.classList.add('active');
                flagModeBtn.textContent = 'Flag Mode: ON 🚩';
            } else {
                flagModeBtn.classList.remove('active');
                flagModeBtn.textContent = 'Flag Mode: OFF ⛏️';
            }
        }

        function initGame() {
            let diff = diffSelect.value;
            if (diff === 'easy') mineCount = 10;
            else if (diff === 'medium') mineCount = 15;
            else if (diff === 'hard') mineCount = 22;

            mineCountEl.textContent = mineCount;
            gridEl.innerHTML = '';
            board = [];
            revealedCount = 0;
            gameOver = false;
            gameStarted = false;
            flagMode = false;
            flagModeBtn.classList.remove('active');
            flagModeBtn.textContent = 'Flag Mode: OFF ⛏️';
            clearInterval(timerInterval);
            timer = 0;
            timerEl.textContent = '000';
            messageEl.textContent = 'Left click to dig, Right click for flag';

            gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

            for (let r = 0; r < rows; r++) {
                let row = [];
                for (let c = 0; c < cols; c++) {
                    let cellData = {
                        r, c,
                        mine: false,
                        revealed: false,
                        flagged: false,
                        neighborMines: 0
                    };
                    row.push(cellData);

                    let cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    cellEl.dataset.r = r;
                    cellEl.dataset.c = c;

                    // Sol Tıklama (Açma)
                    cellEl.addEventListener('click', (e) => {
                        e.preventDefault();
                        handleCellClick(r, c);
                    });

                    // Sağ Tıklama (Bayrak)
                    cellEl.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        handleCellRightClick(r, c);
                    });

                    gridEl.appendChild(cellEl);
                }
                board.push(row);
            }
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timer++;
                if (timer > 999) timer = 999;
                timerEl.textContent = timer.toString().padStart(3, '0');
            }, 1000);
        }

        function placeMines(firstR, firstC) {
            let placed = 0;
            while (placed < mineCount) {
                let r = Math.floor(Math.random() * rows);
                let c = Math.floor(Math.random() * cols);
                // İlk tıklanan yere ve etrafına mayın koyma
                if (!board[r][c].mine && (Math.abs(r - firstR) > 1 || Math.abs(c - firstC) > 1)) {
                    board[r][c].mine = true;
                    placed++;
                }
            }

            // Komşu mayın sayılarını hesapla
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (!board[r][c].mine) {
                        let count = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                let nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].mine) {
                                    count++;
                                }
                            }
                        }
                        board[r][c].neighborMines = count;
                    }
                }
            }
        }

        function handleCellClick(r, c) {
            if (gameOver || board[r][c].revealed) return;

            // Eğer bayrak modu açıksa tıklama bayrak koysun/kaldırsın
            if (flagMode) {
                handleCellRightClick(r, c);
                return;
            }

            if (board[r][c].flagged) return;

            if (!gameStarted) {
                gameStarted = true;
                placeMines(r, c);
                startTimer();
            }

            if (board[r][c].mine) {
                revealAllMines();
                gameOver = true;
                clearInterval(timerInterval);
                messageEl.textContent = '💥 Boom! Game Over!';
                return;
            }

            revealCell(r, c);
            checkWinCondition();
        }

        function handleCellRightClick(r, c) {
            if (gameOver || board[r][c].revealed) return;

            let cell = board[r][c];
            cell.flagged = !cell.flagged;

            let cellEl = getCellElement(r, c);
            if (cell.flagged) {
                cellEl.textContent = '🚩';
                cellEl.classList.add('flagged');
            } else {
                cellEl.textContent = '';
                cellEl.classList.remove('flagged');
            }
        }

        function revealCell(r, c) {
            let cell = board[r][c];
            if (cell.revealed || cell.flagged) return;

            cell.revealed = true;
            revealedCount++;

            let cellEl = getCellElement(r, c);
            cellEl.classList.add('revealed');

            if (cell.neighborMines > 0) {
                cellEl.textContent = cell.neighborMines;
                cellEl.classList.add(`c-${cell.neighborMines}`);
            } else {
                // Etrafta mayın yoksa boşlukları otomatik aç (Flood fill)
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        let nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                            revealCell(nr, nc);
                        }
                    }
                }
            }
        }

        function revealAllMines() {
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    if (board[r][c].mine) {
                        let cellEl = getCellElement(r, c);
                        cellEl.textContent = '💣';
                        cellEl.classList.add('mine');
                    }
                }
            }
        }

        function checkWinCondition() {
            if (revealedCount === (rows * cols - mineCount)) {
                gameOver = true;
                clearInterval(timerInterval);
                messageEl.textContent = `🎉 Awesome! You won in ${timer}s!`;
                
                // Kalan tüm mayınlara otomatik bayrak at
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < cols; c++) {
                        if (board[r][c].mine) {
                            let cellEl = getCellElement(r, c);
                            cellEl.textContent = '🚩';
                        }
                    }
                }
            }
        }

        function getCellElement(r, c) {
            return gridEl.children[r * cols + c];
        }

        // Oyunu Başlat
        initGame();
    </script>
</body>
</html>
