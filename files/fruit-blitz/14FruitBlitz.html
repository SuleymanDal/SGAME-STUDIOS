<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Fruit Blitz</title><style> * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; } body { overflow: hidden; background: radial-gradient(circle at center, #2b2b2b 0%, #111 100%); font-family: 'Segoe UI', Tahoma, sans-serif; touch-action: none; } canvas { display: block; width: 100vw; height: 100vh; } #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; } .hud { position: absolute; top: 20px; font-size: 24px; font-weight: bold; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); background: rgba(0,0,0,0.3); padding: 10px 20px; border-radius: 15px; } #score-display { left: 20px; color: #4cd964; font-size: 28px; } #lives-display { right: 20px; letter-spacing: 5px; } #game-over { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; display: none; background: rgba(20, 20, 20, 0.95); padding: 50px; border-radius: 20px; box-shadow: 0 10px 50px rgba(0,0,0,0.8); pointer-events: auto; color: white; border: 2px solid #333; } #game-over h1 { color: #ff3b30; font-size: 50px; margin-bottom: 15px; } #game-over p { font-size: 24px; color: #ccc; margin-bottom: 30px; } #restart-btn { background: #ff9500; color: white; border: none; padding: 15px 40px; font-size: 22px; font-weight: bold; border-radius: 10px; cursor: pointer; transition: 0.2s; box-shadow: 0 5px 15px rgba(255,149,0,0.4); } #restart-btn:hover { background: #ffaa33; transform: scale(1.05); } </style></head><body><canvas id="gameCanvas"></canvas><div id="ui-layer"><div id="score-display"><span id="score">0.0</span>s</div><div id="lives-display"><span id="lives">❤️❤️❤️❤️❤️</span></div><div id="game-over"><h1>GAME OVER</h1><p>Survival Time: <br><strong id="final-score" style="font-size: 40px; color: #4cd964;">0.0s</strong></p><button id="restart-btn" onclick="resetGame()">Play Again</button></div></div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let width, height; function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize(); // Gelişmiş Web Audio API - Mega Nükleer Patlama Sesi const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playMegaNukeSound() { if (audioCtx.state === 'suspended') { audioCtx.resume(); } let duration = 3.5; // Daha uzun ses let bufferSize = audioCtx.sampleRate * duration; let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); let output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) { output[i] = (Math.random() * 2 - 1); } let whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = buffer; // Çok katmanlı filtreleme ile derin ve devasa patlama hissi let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(600, audioCtx.currentTime); filter.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + duration); let gain = audioCtx.createGain(); gain.gain.setValueAtTime(3.0, audioCtx.currentTime); // Çok daha yüksek ses gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration); whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); whiteNoise.start(); } let startTime = 0; let survivalTime = 0; let lives = 5; let isGameOver = false; let shapes = []; let particles = []; let shockwaves = []; // Görsel dev patlama dalgaları için let blade = []; let isSwiping = false; const fruitColors = ['#ff3b30', '#4cd964', '#ffcc00', '#5ac8fa', '#af52de', '#ff9500']; function getCentroid(pts) { let x = 0, y = 0; for(let p of pts) { x += p.x; y += p.y; } return { x: x / pts.length, y: y / pts.length }; } function distToSegmentSquared(p, v, w) { let l2 = (w.x - v.x)**2 + (w.y - v.y)**2; if (l2 === 0) return (p.x - v.x)**2 + (p.y - v.y)**2; let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2; t = Math.max(0, Math.min(1, t)); return (p.x - (v.x + t * (w.x - v.x)))**2 + (p.y - (v.y + t * (w.y - v.y)))**2; } class Polygon { constructor(x, y, vertices, color, vx, vy, isCut = false) { this.x = x; this.y = y; this.vertices = vertices; this.color = color; this.vx = vx; this.vy = vy; this.angle = Math.random() * Math.PI * 2; this.vAngle = (Math.random() - 0.5) * 0.15; this.isCut = isCut; this.isBomb = false; this.updateRadius(); } updateRadius() { this.radius = 0; for(let v of this.vertices) { let d = Math.sqrt(v.x*v.x + v.y*v.y); if(d > this.radius) this.radius = d; } } update(gravityMultiplier) { this.vy += 0.25 * gravityMultiplier; this.x += this.vx; this.y += this.vy; this.angle += this.vAngle; } draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath(); ctx.moveTo(this.vertices[0].x, this.vertices[0].y); for(let i=1; i<this.vertices.length; i++) { ctx.lineTo(this.vertices[i].x, this.vertices[i].y); } ctx.closePath(); ctx.fillStyle = this.color; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = 'rgba(0,0,0,0.2)'; ctx.stroke(); if (this.isCut) { ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fill(); } ctx.restore(); } } class Bomb extends Polygon { constructor(x, y, radius, vx, vy) { let verts = []; for(let i=0; i<Math.PI*2; i+=0.5) { verts.push({x: Math.cos(i)*radius, y: Math.sin(i)*radius}); } super(x, y, verts, '#111', vx, vy); this.isBomb = true; this.radius = radius; } draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fillStyle = '#1a0000'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = '#ff3b30'; ctx.stroke(); ctx.rotate(-this.angle); ctx.font = `${this.radius * 1.2}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('☢️', 0, 0); ctx.restore(); } } // Devasa Patlama Dalgası (Shockwave) Sınıfı class Shockwave { constructor(x, y) { this.x = x; this.y = y; this.radius = 10; this.maxRadius = Math.max(width, height) * 0.8; this.life = 1; this.decay = 0.015; // Uzun süren genişleme } update() { this.radius += (this.maxRadius - this.radius) * 0.08; this.life -= this.decay; } draw() { ctx.save(); ctx.globalAlpha = Math.max(0, this.life); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.lineWidth = 15 * this.life; ctx.strokeStyle = '#ffaa00'; ctx.stroke(); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius * 0.7, 0, Math.PI * 2); ctx.lineWidth = 25 * this.life; ctx.strokeStyle = '#ff2200'; ctx.stroke(); ctx.restore(); } } class Particle { constructor(x, y, color, isMassive = false) { this.x = x; this.y = y; let speed = isMassive ? 35 : 22; this.vx = (Math.random() - 0.5) * speed; this.vy = (Math.random() - 0.5) * speed; this.radius = isMassive ? (Math.random() * 10 + 4) : (Math.random() * 6 + 2); this.color = color; this.life = 1; this.decay = isMassive ? 0.012 : (Math.random() * 0.03 + 0.02); } update() { this.vy += 0.35; this.x += this.vx; this.y += this.vy; this.life -= this.decay; } draw() { ctx.globalAlpha = Math.max(0, this.life); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.globalAlpha = 1; } } function createSplash(x, y, color, count = 20) { for (let i = 0; i < count; i++) particles.push(new Particle(x, y, color)); } function createMegaNukeExplosion(x, y) { playMegaNukeSound(); shockwaves.push(new Shockwave(x, y)); // Devasa renk skalasıyla dev parçacık fırtınası let nukeColors = ['#ff3b30', '#ff9500', '#ffcc00', '#ffffff', '#ff4500']; for (let i = 0; i < 150; i++) { let col = nukeColors[Math.floor(Math.random() * nukeColors.length)]; particles.push(new Particle(x, y, col, true)); } } function spawnShape(speedMult) { let radius = Math.random() * 15 + 40; let x = Math.random() * (width - radius * 2) + radius; let y = height + radius; let targetX = width / 2; let vx = (targetX - x) * (Math.random() * 0.02 + 0.008); let vy = -(Math.random() * 4 + 15) * (1 + (speedMult-1)*0.2); if (Math.random() < 0.2) { shapes.push(new Bomb(x, y, radius, vx, vy)); } else { let verts = []; let pointsCount = 10; for(let i=0; i<pointsCount; i++) { let angle = (i / pointsCount) * Math.PI * 2; let rVar = radius + (Math.random() * 12 - 6); verts.push({x: Math.cos(angle)*rVar, y: Math.sin(angle)*rVar}); } let color = fruitColors[Math.floor(Math.random() * fruitColors.length)]; shapes.push(new Polygon(x, y, verts, color, vx, vy, false)); } } function processSlice(A, B) { for (let i = shapes.length - 1; i >= 0; i--) { let shape = shapes[i]; let d2 = distToSegmentSquared({x: shape.x, y: shape.y}, A, B); if (d2 > shape.radius * shape.radius) continue; if (shape.isBomb) { createMegaNukeExplosion(shape.x, shape.y); shapes.splice(i, 1); loseLife(); continue; } if (shape.radius < 18) continue; let tx = -shape.x, ty = -shape.y; let cos = Math.cos(-shape.angle), sin = Math.sin(-shape.angle); let lA = { x: (A.x+tx)*cos - (A.y+ty)*sin, y: (A.x+tx)*sin + (A.y+ty)*cos }; let lB = { x: (B.x+tx)*cos - (B.y+ty)*sin, y: (B.x+tx)*sin + (B.y+ty)*cos }; let Nx = lA.y - lB.y, Ny = lB.x - lA.x; let len = Math.sqrt(Nx*Nx + Ny*Ny); if (len === 0) continue; Nx /= len; Ny /= len; let C = -(Nx * lA.x + Ny * lA.y); let poly1 = [], poly2 = []; let crossed = false; for(let j=0; j<shape.vertices.length; j++) { let v1 = shape.vertices[j]; let v2 = shape.vertices[(j+1)%shape.vertices.length]; let d1 = Nx * v1.x + Ny * v1.y + C; let d2 = Nx * v2.x + Ny * v2.y + C; if (d1 >= 0) poly1.push(v1); if (d1 <= 0) poly2.push(v1); if (d1 * d2 < 0) { crossed = true; let t = d1 / (d1 - d2); let ipt = { x: v1.x + t*(v2.x-v1.x), y: v1.y + t*(v2.y-v1.y) }; poly1.push(ipt); poly2.push(ipt); } } if (crossed && poly1.length >= 3 && poly2.length >= 3) { createSplash(shape.x, shape.y, shape.color, 15); shapes.splice(i, 1); let c1 = getCentroid(poly1); for(let v of poly1) { v.x -= c1.x; v.y -= c1.y; } let c2 = getCentroid(poly2); for(let v of poly2) { v.x -= c2.x; v.y -= c2.y; } let wCos = Math.cos(shape.angle), wSin = Math.sin(shape.angle); let wx1 = shape.x + c1.x*wCos - c1.y*wSin; let wy1 = shape.y + c1.x*wSin + c1.y*wCos; let wx2 = shape.x + c2.x*wCos - c2.y*wSin; let wy2 = shape.y + c2.x*wSin + c2.y*wCos; let bladeDirX = B.x - A.x; let bladeDirY = B.y - A.y; let bladeLen = Math.hypot(bladeDirX, bladeDirY) || 1; bladeDirX /= bladeLen; bladeDirY /= bladeLen; let splitForce = 8; let p1 = new Polygon(wx1, wy1, poly1, shape.color, shape.vx + bladeDirX*splitForce + (Math.random()-0.5)*3, shape.vy + bladeDirY*splitForce + (Math.random()-0.5)*3, true); let p2 = new Polygon(wx2, wy2, poly2, shape.color, shape.vx - bladeDirX*splitForce + (Math.random()-0.5)*3, shape.vy - bladeDirY*splitForce + (Math.random()-0.5)*3, true); p1.angle = shape.angle; p2.angle = shape.angle; p1.vAngle = (Math.random() - 0.5) * 0.4; p2.vAngle = (Math.random() - 0.5) * 0.4; shapes.push(p1, p2); } } } function drawBlade() { if (blade.length < 2) return; ctx.beginPath(); ctx.moveTo(blade[0].x, blade[0].y); for (let i = 1; i < blade.length; i++) ctx.lineTo(blade[i].x, blade[i].y); ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.shadowBlur = 25; ctx.shadowColor = '#00f2fe'; ctx.stroke(); ctx.shadowBlur = 0; } function handleInputStart(x, y) { if (isGameOver) return; isSwiping = true; blade = [{x, y}]; } function handleInputMove(x, y) { if (!isSwiping || isGameOver) return; let lastPoint = blade[blade.length - 1]; blade.push({x, y}); if (blade.length > 12) blade.shift(); processSlice(lastPoint, {x, y}); } function handleInputEnd() { isSwiping = false; } canvas.addEventListener('mousedown', e => handleInputStart(e.clientX, e.clientY)); canvas.addEventListener('mousemove', e => handleInputMove(e.clientX, e.clientY)); window.addEventListener('mouseup', handleInputEnd); canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInputStart(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false}); canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInputMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive: false}); window.addEventListener('touchend', handleInputEnd); function loseLife() { lives--; updateLivesUI(); if (lives <= 0) { isGameOver = true; document.getElementById('final-score').innerText = survivalTime.toFixed(1) + "s"; document.getElementById('game-over').style.display = 'block'; } } function updateLivesUI() { let hearts = ''; for(let i=0; i<5; i++) { hearts += i < lives ? '❤️' : '🖤'; } document.getElementById('lives').innerText = hearts; } function resetGame() { startTime = Date.now(); survivalTime = 0; lives = 5; shapes = []; particles = []; shockwaves = []; blade = []; isGameOver = false; updateLivesUI(); document.getElementById('game-over').style.display = 'none'; lastSpawn = 0; animate(); } let lastSpawn = 0; function animate() { if (isGameOver) return; requestAnimationFrame(animate); survivalTime = (Date.now() - startTime) / 1000; document.getElementById('score').innerText = survivalTime.toFixed(1); let speedMult = 1 + (survivalTime / 20); ctx.clearRect(0, 0, width, height); lastSpawn++; let spawnRate = Math.max(15, 75 - (survivalTime * 1.5)); if (lastSpawn > spawnRate) { let count = Math.random() > 0.75 ? 2 : 1; for(let i=0; i<count; i++) spawnShape(speedMult); lastSpawn = 0; } // Şok Dalgalarını Çiz (Dev Patlama Görseli) for (let i = shockwaves.length - 1; i >= 0; i--) { let sw = shockwaves[i]; sw.update(); sw.draw(); if (sw.life <= 0) shockwaves.splice(i, 1); } for (let i = shapes.length - 1; i >= 0; i--) { let s = shapes[i]; s.update(speedMult); s.draw(); // Sadece KESİLMEMİŞ MEYVELER yere düşerse can gider (Bomba düşerse gitmez) if (s.y > height + s.radius * 2 && s.vy > 0) { if (!s.isCut && !s.isBomb) { loseLife(); } shapes.splice(i, 1); } } for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.update(); p.draw(); if (p.life <= 0) particles.splice(i, 1); } if (blade.length > 0 && !isSwiping) blade.shift(); drawBlade(); } resetGame(); </script></body></html>
