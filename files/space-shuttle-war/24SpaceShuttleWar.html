<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Space Shuttle War</title><style> :root { --bg-color: #030712; --panel-bg: rgba(17, 24, 39, 0.85); --border-color: rgba(255, 255, 255, 0.1); --accent-color: #38bdf8; --accent-hover: #0ea5e9; --text-color: #f8fafc; } * { box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: none; } body { margin: 0; padding: 0; background: radial-gradient(circle at center, #111827 0%, var(--bg-color) 100%); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; } .game-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 480px; padding: 15px; gap: 12px; } .menu-screen { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 16px; } h1 { margin: 0 0 10px 0; font-size: clamp(1.8rem, 7vw, 2.6rem); letter-spacing: 2px; color: var(--accent-color); text-shadow: 0 0 20px rgba(56, 189, 248, 0.4); text-align: center; } .menu-btn { width: 100%; padding: 16px; font-size: 1.2rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 2px solid var(--border-color); border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.2s ease; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; } .menu-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-color); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(56, 189, 248, 0.2); } .game-screen { display: none; flex-direction: column; align-items: center; width: 100%; gap: 12px; } .game-header { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 5px; font-size: 1.05rem; font-weight: 600; } .status-text { color: var(--accent-color); } .canvas-container { position: relative; width: 100%; max-width: 450px; aspect-ratio: 3 / 4; background: #020617; border-radius: 12px; border: 2px solid var(--border-color); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4), inset 0 0 30px rgba(56, 189, 248, 0.05); overflow: hidden; } canvas { width: 100%; height: 100%; display: block; } .game-footer-btns { display: flex; gap: 10px; width: 100%; } .action-btn { flex: 1; padding: 10px; font-size: 0.95rem; font-weight: bold; color: #fff; background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: all 0.2s; } .action-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-color); } .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; } .modal-overlay.active { opacity: 1; pointer-events: auto; } .modal { background: #111827; border: 2px solid var(--accent-color); padding: 30px; border-radius: 16px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.5); max-width: 350px; width: 90%; transform: scale(0.8); transition: transform 0.3s ease; } .modal-overlay.active .modal { transform: scale(1); } .modal h2 { color: var(--accent-color); margin-top: 0; font-size: 2.2rem; margin-bottom: 10px; text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); } .modal p { margin: 0 0 20px 0; font-size: 1.2rem; color: #cbd5e1; } .modal-btn-group { display: flex; gap: 10px; } .modal button { flex: 1; background: var(--accent-color); color: #0f172a; border: none; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; } .modal button:hover { background: var(--accent-hover); } .footer-credit { position: absolute; bottom: 8px; left: 0; width: 100%; text-align: center; font-size: 11px; color: rgba(255, 255, 255, 0.35); pointer-events: none; letter-spacing: 1px; font-family: sans-serif; } </style></head><body><div class="game-wrapper"><div id="menuScreen" class="menu-screen"><h1>Space Shuttle War</h1><button class="menu-btn" onclick="startGame()">Start Game</button></div><div id="gameScreen" class="game-screen"><div class="game-header"><span id="levelText" class="status-text">Level: 1</span><span id="scoreText">Score: 0</span><span id="livesText">Lives: 3</span></div><div class="canvas-container"><canvas id="gameCanvas" width="400" height="533"></canvas></div><div class="game-footer-btns"><button class="action-btn" onclick="resetGame()">Restart</button><button class="action-btn" onclick="backToMenu()">Menu</button></div></div></div><div class="modal-overlay" id="resultModal"><div class="modal"><h2 id="modalTitle">Victory!</h2><p id="modalDesc">Sector secured!</p><div class="modal-btn-group" id="modalBtnGroup"><button onclick="nextLevel()" id="nextLevelBtn">Next Level</button><button onclick="backToMenu()" style="background: rgba(255,255,255,0.1); color: #fff;">Menu</button></div></div></div><div class="footer-credit">All Rights Reserved © 2026 SGame Studios</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); const menuScreen = document.getElementById('menuScreen'); const gameScreen = document.getElementById('gameScreen'); const levelText = document.getElementById('levelText'); const scoreText = document.getElementById('scoreText'); const livesText = document.getElementById('livesText'); const resultModal = document.getElementById('resultModal'); const modalTitle = document.getElementById('modalTitle'); const modalDesc = document.getElementById('modalDesc'); const nextLevelBtn = document.getElementById('nextLevelBtn'); let score = 0; let lives = 3; let currentLevel = 1; let isGameRunning = false; let animationFrameId = null; let player = { width: 44, height: 32, x: canvas.width / 2 - 22, y: canvas.height - 50, dx: 6 }; let bullets = []; let enemyBullets = []; let enemies = []; let particles = []; let stars = []; for (let i = 0; i < 60; i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 2 + 0.5, speed: Math.random() * 1.5 + 0.5, alpha: Math.random() }); } let enemyDirection = 1; let enemySpeed = 0.8; const levelsConfig = [ { cols: 4, rows: 3 }, // Level 1 { cols: 6, rows: 5 }, // Level 2 { cols: 8, rows: 7 } // Level 3 ]; let enemyColumnCount = 4; let enemyRowCount = 3; function initEnemies() { let config = levelsConfig[currentLevel - 1] || levelsConfig[levelsConfig.length - 1]; enemyColumnCount = config.cols; enemyRowCount = config.rows; enemies = []; const enemyWidth = 32; const enemyHeight = 22; const paddingX = 12; const paddingY = 10; const totalWidth = (enemyColumnCount * enemyWidth) + ((enemyColumnCount - 1) * paddingX); const offsetX = (canvas.width - totalWidth) / 2; const offsetY = 45; const colors = ['#f43f5e', '#facc15', '#38bdf8', '#2ecc71', '#a855f7', '#fb923c', '#e879f9']; for (let c = 0; c < enemyColumnCount; c++) { for (let r = 0; r < enemyRowCount; r++) { enemies.push({ x: offsetX + c * (enemyWidth + paddingX), y: offsetY + r * (enemyHeight + paddingY), width: enemyWidth, height: enemyHeight, status: 1, color: colors[r % colors.length] }); } } // Sadece yatay hız seviyeye göre artar, dikeyde aşağı inme (yaklaşma) kaldırılmıştır. enemySpeed = 0.8 + (currentLevel * 0.35); enemyDirection = 1; } function createExplosion(x, y, color) { for (let i = 0; i < 14; i++) { let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 3.5 + 1; particles.push({ x: x, y: y, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed, radius: Math.random() * 2.5 + 1, color: color, alpha: 1, decay: Math.random() * 0.03 + 0.02 }); } } let rightPressed = false; let leftPressed = false; let spacePressed = false; let lastShotTime = 0; document.addEventListener('keydown', (e) => { if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = true; else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = true; else if (e.key === ' ' || e.key === 'Spacebar') { spacePressed = true; shootBullet(); } }); document.addEventListener('keyup', (e) => { if (e.key === 'Right' || e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rightPressed = false; else if (e.key === 'Left' || e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') leftPressed = false; else if (e.key === ' ' || e.key === 'Spacebar') spacePressed = false; }); function getCanvasCoords(clientX, clientY) { let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height; return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY }; } canvas.addEventListener('touchmove', (e) => { let coords = getCanvasCoords(e.touches[0].clientX, e.touches[0].clientY); player.x = coords.x - player.width / 2; if (player.x < 0) player.x = 0; if (player.x + player.width > canvas.width) player.x = canvas.width - player.width; e.preventDefault(); }, { passive: false }); canvas.addEventListener('touchstart', (e) => { shootBullet(); e.preventDefault(); }, { passive: false }); canvas.addEventListener('mousemove', (e) => { let coords = getCanvasCoords(e.clientX, e.clientY); player.x = coords.x - player.width / 2; if (player.x < 0) player.x = 0; if (player.x + player.width > canvas.width) player.x = canvas.width - player.width; }); canvas.addEventListener('mousedown', (e) => { shootBullet(); }); // Web Audio API ile gelişmiş, canlı ses efektleri const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playLaserSound() { try { if (audioCtx.state === 'suspended') audioCtx.resume(); let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.1, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1); } catch(e) {} } function playExplosionSound() { try { if (audioCtx.state === 'suspended') audioCtx.resume(); let bufferSize = audioCtx.sampleRate * 0.25; let buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); let data = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) { data[i] = Math.random() * 2 - 1; } let noise = audioCtx.createBufferSource(); noise.buffer = buffer; let filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(500, audioCtx.currentTime); filter.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.25); let gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25); noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(); } catch(e) {} } function playHitSound() { try { if (audioCtx.state === 'suspended') audioCtx.resume(); let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(180, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.25, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.3); } catch(e) {} } function startGame() { menuScreen.style.display = 'none'; gameScreen.style.display = 'flex'; resultModal.classList.remove('active'); score = 0; lives = 3; currentLevel = 1; startLevel(); } function startLevel() { bullets = []; enemyBullets = []; particles = []; levelText.innerText = `Level: ${currentLevel}`; scoreText.innerText = `Score: ${score}`; livesText.innerText = `Lives: ${lives}`; initEnemies(); player.x = (canvas.width - player.width) / 2; isGameRunning = true; cancelAnimationFrame(animationFrameId); loop(); } function nextLevel() { currentLevel++; if (currentLevel > levelsConfig.length) { currentLevel = levelsConfig.length; } resultModal.classList.remove('active'); startLevel(); } function resetGame() { startGame(); } function backToMenu() { isGameRunning = false; cancelAnimationFrame(animationFrameId); gameScreen.style.display = 'none'; menuScreen.style.display = 'flex'; resultModal.classList.remove('active'); } function shootBullet() { if (!isGameRunning) return; let now = Date.now(); if (now - lastShotTime > 200) { bullets.push({ x: player.x + player.width / 2 - 3, y: player.y, width: 6, height: 14, dy: -9 }); playLaserSound(); lastShotTime = now; } } function enemyShoot() { let activeEnemies = enemies.filter(e => e.status === 1); if (activeEnemies.length === 0) return; if (Math.random() < 0.035 + (currentLevel * 0.01)) { let shooter = activeEnemies[Math.floor(Math.random() * activeEnemies.length)]; enemyBullets.push({ x: shooter.x + shooter.width / 2 - 2, y: shooter.y + shooter.height, width: 5, height: 12, dy: 4.5 + (currentLevel * 0.4) }); } } function update() { if (!isGameRunning) return; stars.forEach(star => { star.y += star.speed; if (star.y > canvas.height) { star.y = 0; star.x = Math.random() * canvas.width; } }); for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.dx; p.y += p.dy; p.alpha -= p.decay; if (p.alpha <= 0) { particles.splice(i, 1); } } if (rightPressed && player.x < canvas.width - player.width) { player.x += player.dx; } else if (leftPressed && player.x > 0) { player.x -= player.dx; } for (let i = bullets.length - 1; i >= 0; i--) { let b = bullets[i]; b.y += b.dy; if (b.y < 0) { bullets.splice(i, 1); } } for (let i = enemyBullets.length - 1; i >= 0; i--) { let eb = enemyBullets[i]; eb.y += eb.dy; if (eb.x + eb.width > player.x && eb.x < player.x + player.width && eb.y + eb.height > player.y && eb.y < player.y + player.height) { enemyBullets.splice(i, 1); createExplosion(player.x + player.width/2, player.y + player.height/2, '#38bdf8'); lives--; livesText.innerText = `Lives: ${lives}`; playHitSound(); if (lives <= 0) { triggerGameOver(); } continue; } if (eb.y > canvas.height) { enemyBullets.splice(i, 1); } } // Düşmanların yalnızca yatayda hareket etmesi sağlanmıştır. Kenara çarpınca aşağı kayma (y konumu değişimi) tamamen kaldırıldı. let hitEdge = false; let activeCount = 0; enemies.forEach(e => { if (e.status === 1) { activeCount++; e.x += enemySpeed * enemyDirection; if (e.x + e.width >= canvas.width - 10 || e.x <= 10) { hitEdge = true; } } }); if (hitEdge) { enemyDirection *= -1; } enemyShoot(); for (let i = bullets.length - 1; i >= 0; i--) { let b = bullets[i]; let hit = false; for (let e of enemies) { if (e.status === 1 && b.x + b.width > e.x && b.x < e.x + e.width && b.y + b.height > e.y && b.y < e.y + e.height) { e.status = 0; hit = true; score += 25; scoreText.innerText = `Score: ${score}`; createExplosion(e.x + e.width/2, e.y + e.height/2, e.color); playExplosionSound(); break; } } if (hit) { bullets.splice(i, 1); } } if (activeCount === 0) { triggerLevelComplete(); } } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); stars.forEach(star => { ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`; ctx.fillRect(star.x, star.y, star.size, star.size); }); particles.forEach(p => { ctx.save(); ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }); // Gelişmiş Oyuncu Gemisi Çizimi ctx.save(); ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 14; ctx.fillStyle = '#0284c7'; ctx.beginPath(); ctx.moveTo(player.x + player.width / 2, player.y); ctx.lineTo(player.x + player.width, player.y + player.height - 4); ctx.lineTo(player.x + player.width - 6, player.y + player.height); ctx.lineTo(player.x + player.width / 2, player.y + player.height - 8); ctx.fill(); ctx.beginPath(); ctx.moveTo(player.x + player.width / 2, player.y); ctx.lineTo(player.x, player.y + player.height - 4); ctx.lineTo(player.x + 6, player.y + player.height); ctx.lineTo(player.x + player.width / 2, player.y + player.height - 8); ctx.fill(); ctx.fillStyle = '#38bdf8'; ctx.beginPath(); ctx.moveTo(player.x + player.width / 2, player.y - 2); ctx.lineTo(player.x + player.width * 0.72, player.y + player.height); ctx.lineTo(player.x + player.width * 0.28, player.y + player.height); ctx.closePath(); ctx.fill(); // Kokpit Camı Detayı ctx.fillStyle = '#bae6fd'; ctx.beginPath(); ctx.ellipse(player.x + player.width / 2, player.y + player.height * 0.5, 4, 8, 0, 0, Math.PI * 2); ctx.fill(); // İtki Alevi ctx.fillStyle = '#fb923c'; ctx.beginPath(); ctx.moveTo(player.x + player.width * 0.35, player.y + player.height); ctx.lineTo(player.x + player.width * 0.5, player.y + player.height + 12 + Math.random() * 6); ctx.lineTo(player.x + player.width * 0.65, player.y + player.height); ctx.closePath(); ctx.fill(); ctx.restore(); // Gelişmiş Düşman Tasarımı enemies.forEach(e => { if (e.status === 1) { ctx.save(); ctx.shadowColor = e.color; ctx.shadowBlur = 10; ctx.fillStyle = e.color; ctx.beginPath(); ctx.roundRect(e.x, e.y + 4, e.width, e.height - 8, 5); ctx.fill(); // Düşman gözü / detay çizgisi ctx.fillStyle = '#ffffff'; ctx.fillRect(e.x + 6, e.y + e.height / 2 - 2, 4, 4); ctx.fillRect(e.x + e.width - 10, e.y + e.height / 2 - 2, 4, 4); ctx.restore(); } }); // Lazer Mermileri ctx.save(); ctx.shadowColor = '#facc15'; ctx.shadowBlur = 10; ctx.fillStyle = '#fef08a'; bullets.forEach(b => { ctx.beginPath(); ctx.roundRect(b.x, b.y, b.width, b.height, 3); ctx.fill(); }); ctx.restore(); // Düşman Mermileri ctx.save(); ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 10; ctx.fillStyle = '#fb7185'; enemyBullets.forEach(eb => { ctx.beginPath(); ctx.roundRect(eb.x, eb.y, eb.width, eb.height, 3); ctx.fill(); }); ctx.restore(); } function loop() { if (!isGameRunning) return; update(); draw(); animationFrameId = requestAnimationFrame(loop); } function triggerLevelComplete() { isGameRunning = false; cancelAnimationFrame(animationFrameId); if (currentLevel < levelsConfig.length) { modalTitle.innerText = `Level ${currentLevel} Clear!`; modalDesc.innerText = `Score: ${score}`; nextLevelBtn.style.display = 'block'; nextLevelBtn.innerText = "Next Level"; } else { modalTitle.innerText = "Victory!"; modalDesc.innerText = `All sectors secured! Final Score: ${score}`; nextLevelBtn.style.display = 'none'; } resultModal.classList.add('active'); } function triggerGameOver() { isGameRunning = false; cancelAnimationFrame(animationFrameId); modalTitle.innerText = "Game Over"; modalDesc.innerText = `Final Score: ${score}`; nextLevelBtn.style.display = 'none'; playHitSound(); resultModal.classList.add('active'); } </script></body></html>
