<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Flappy Bird</title><style> * { margin: 0; padding: 0; box-sizing: border-box; } html, body { width: 100%; height: 100%; overflow: hidden; background-color: #111; display: flex; justify-content: center; align-items: center; user-select: none; -webkit-user-select: none; touch-action: manipulation; } canvas { background-color: #70c5ce; box-shadow: 0 0 30px rgba(0, 0, 0, 0.8); width: min(100vw, calc(100vh * 9 / 16)); height: min(100vh, calc(100vw * 16 / 9)); aspect-ratio: 9 / 16; border-radius: 8px; } </style></head><body><canvas id="canvas" width="360" height="640"></canvas><script> const canvas = document.getElementById('canvas'); const ctx = canvas.getContext('2d'); let frames = 0; let score = 0; let highScore = localStorage.getItem('fb_hs') || 0; let gameState = 'START'; function action() { if (gameState === 'START') { gameState = 'PLAY'; bird.flap(); } else if (gameState === 'PLAY') { bird.flap(); } else if (gameState === 'GAMEOVER') { resetGame(); gameState = 'START'; } } window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); action(); } }); canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); action(); }); function resetGame() { bird.y = 260; bird.velocity = 0; pipes.reset(); score = 0; frames = 0; } const bird = { x: 80, y: 260, radius: 14, gravity: 0.35, jump: -6.5, velocity: 0, draw() { ctx.save(); ctx.translate(this.x, this.y); let angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity / 10))); ctx.rotate(angle); ctx.fillStyle = '#ffdb3a'; ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.stroke(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(8, -4, 2, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#f75f1c'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(18, 4); ctx.lineTo(10, 8); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#f4c40f'; ctx.beginPath(); ctx.ellipse(-4, 4, 7, 4, Math.PI / 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.restore(); }, flap() { this.velocity = this.jump; }, update() { if (gameState === 'PLAY') { this.velocity += this.gravity; this.y += this.velocity; if (this.y + this.radius >= canvas.height - 80) { this.y = canvas.height - 80 - this.radius; gameOver(); } if (this.y - this.radius <= 0) { this.y = this.radius; this.velocity = 0; } } } }; const pipes = { items: [], gap: 135, dx: 2.2, reset() { this.items = []; }, draw() { this.items.forEach(p => { ctx.fillStyle = '#73bf2e'; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.fillRect(p.x, 0, p.w, p.top); ctx.strokeRect(p.x, 0, p.w, p.top); ctx.fillRect(p.x - 3, p.top - 20, p.w + 6, 20); ctx.strokeRect(p.x - 3, p.top - 20, p.w + 6, 20); let bottomY = p.top + this.gap; let bottomH = canvas.height - 80 - bottomY; ctx.fillRect(p.x, bottomY, p.w, bottomH); ctx.strokeRect(p.x, bottomY, p.w, bottomH); ctx.fillRect(p.x - 3, bottomY, p.w + 6, 20); ctx.strokeRect(p.x - 3, bottomY, p.w + 6, 20); }); }, update() { if (gameState !== 'PLAY') return; if (frames % 100 === 0) { let maxTop = canvas.height - 80 - this.gap - 60; let minTop = 60; let top = Math.floor(Math.random() * (maxTop - minTop + 1) + minTop); this.items.push({ x: canvas.width, top: top, w: 52, passed: false }); } this.items.forEach((p, index) => { p.x -= this.dx; if ( bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + p.w && (bird.y - bird.radius < p.top || bird.y + bird.radius > p.top + this.gap) ) { gameOver(); } if (!p.passed && p.x + p.w < bird.x) { p.passed = true; score++; if (score > highScore) { highScore = score; localStorage.setItem('fb_hs', highScore); } } if (p.x + p.w < 0) { this.items.splice(index, 1); } }); } }; const fg = { h: 80, draw() { ctx.fillStyle = '#ded895'; ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h); ctx.fillStyle = '#73bf2e'; ctx.fillRect(0, canvas.height - this.h, canvas.width, 15); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, canvas.height - this.h); ctx.lineTo(canvas.width, canvas.height - this.h); ctx.stroke(); } }; function gameOver() { gameState = 'GAMEOVER'; } function drawUI() { ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3; if (gameState === 'START') { ctx.font = '900 32px Arial'; ctx.textAlign = 'center'; ctx.strokeText('FLAPPY BIRD', canvas.width / 2, 180); ctx.fillText('FLAPPY BIRD', canvas.width / 2, 180); ctx.font = '48px Arial'; ctx.fillText('👆', canvas.width / 2, 310); ctx.font = '36px Arial'; ctx.fillText('▶️', canvas.width / 2, 390); } if (gameState === 'PLAY') { ctx.font = '900 42px Arial'; ctx.textAlign = 'center'; ctx.strokeText(score, canvas.width / 2, 80); ctx.fillText(score, canvas.width / 2, 80); } if (gameState === 'GAMEOVER') { ctx.font = '52px Arial'; ctx.textAlign = 'center'; ctx.fillText('💥', canvas.width / 2, 180); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(50, 230, 260, 130); ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(50, 230, 260, 130); ctx.fillStyle = '#fff'; ctx.font = '28px Arial'; ctx.textAlign = 'left'; ctx.fillText('🎯 ' + score, 80, 280); ctx.fillText('🏆 ' + highScore, 80, 330); ctx.textAlign = 'center'; ctx.font = '48px Arial'; ctx.fillText('🔄', canvas.width / 2, 430); } } function loop() { ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, canvas.width, canvas.height); pipes.draw(); pipes.update(); fg.draw(); bird.draw(); bird.update(); drawUI(); frames++; requestAnimationFrame(loop); } loop(); </script></body></html>
