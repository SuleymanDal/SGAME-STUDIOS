ckground: rgba(0, 0, 0, 0.75); color: #00ffcc; padding: 10px 20px; border-radius: 8px; font-family: monospace; font-size: 14px; border: 1px solid rgba(0,255,204,0.3); letter-spacing: 1px; display: none; } #settings-btn { position: absolute; top: 20px; right: 20px; pointer-events: auto; background: rgba(255,255,255,0.15); backdrop-filter: blur(5px); color: #fff; border: 1px solid rgba(255,255,255,0.25); padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; } .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a2e 0%, #0a0a10 100%); display: flex; justify-content: center; align-items: center; flex-direction: column; z-index: 20; pointer-events: auto; } #start-screen h1 { color: #fff; font-size: 38px; margin-bottom: 25px; font-weight: 900; text-align: center; line-height: 1.3; } .menu-container { display: flex; flex-direction: column; gap: 15px; width: 320px; align-items: center; } .btn { background: linear-gradient(135deg, #0088ff 0%, #0055cc 100%); color: #fff; border: none; padding: 16px 40px; font-size: 16px; border-radius: 30px; cursor: pointer; font-weight: bold; letter-spacing: 1px; box-shadow: 0 8px 20px rgba(0,136,255,0.4); transition: all 0.2s ease; width: 100%; text-align: center; } .btn:hover { transform: translateY(-2px); } .btn.secondary { background: linear-gradient(135deg, #333 0%, #111 100%); box-shadow: none; border: 1px solid #444; } #multiplayer-panel { display: none; flex-direction: column; gap: 15px; width: 100%; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); } .room-input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 18px; font-family: monospace; letter-spacing: 4px; } .room-info { color: #00ff88; font-family: monospace; text-align: center; margin-top: 5px; font-size: 14px; } #settings-menu { display: none; background: rgba(0,0,0,0.6) !important; backdrop-filter: blur(5px); } .settings-panel { background: #11121a; padding: 40px; border-radius: 20px; width: 360px; color: #fff; border: 1px solid rgba(255,255,255,0.1); } </style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head><body><canvas id="game-canvas"></canvas><div id="ui-layer"><div id="controls-hint"><strong>Gelişmiş Simülasyon Kontrolleri:</strong><br><b style="color:#fff">W</b> — Gaz / İvmelenme<br><b style="color:#fff">S</b> — Fren / Geri Vites<br><b style="color:#fff">A / D</b> — Direksiyon Kontrolü<br><b style="color:#fff">C</b> — Kamera Değiştir | <b style="color:#fff">R</b> — Sıfırla </div><div id="coordinates-hud">X: 0.00 | Y: 0.00 | Z: 0.00</div><button id="settings-btn">Ayarlar</button><div id="speedometer"><div id="speed-value">0</div><div id="speed-unit">km/h</div><div id="rpm-text">900 RPM</div><div id="rpm-container"><div id="rpm-bar"></div></div><div id="gear-display">D1</div></div></div><div id="start-screen" class="overlay"><h1 id="menu-title">HYPER CAR DRIVING MATRIX<br><span style="font-size:18px; color:#0088ff; font-weight:400;">Sonsuz Yol ve Çok Oyunculu LAN Sistemi</span></h1><div class="menu-container" id="main-menu-controls"><button class="btn" id="start-btn">TEK OYUNCULU BAŞLAT</button><button class="btn secondary" id="multi-menu-btn">ÇOK OYUNCULU (LAN)</button><div id="multiplayer-panel"><button class="btn" id="host-btn" style="background: linear-gradient(135deg, #00ff88 0%, #00aa50 100%); box-shadow: 0 8px 20px rgba(0,255,136,0.3);">HOST OL (ODA AÇ)</button><div id="host-code-display" class="room-info" style="display:none; font-size:16px; font-weight:bold;">ODA KODU: <span id="generated-code" style="color:#fff">----</span></div><div style="width:100%; height:1px; background:rgba(255,255,255,0.1); margin:10px 0;"></div><input type="text" id="join-code-input" class="room-input" placeholder="KODU GİR" maxlength="4"><button class="btn secondary" id="join-btn">ODAYA KATIL</button><div id="connection-status" class="room-info" style="color:#aaa;"></div></div></div></div><div id="settings-menu" class="overlay"><div class="settings-panel"><h2 style="margin-bottom:25px; text-align:center;">SİSTEM AYARLARI</h2><div style="margin-bottom:25px;"><label style="display:block; margin-bottom:10px; font-size:14px; color:#bbb;">Motor Ses Seviyesi: <span id="vol-val" style="color:#0088ff">100</span>%</label><input type="range" id="set-volume" min="0" max="100" value="100" style="width:100%;"></div><button class="btn" id="btn-close-settings" style="background:#222; box-shadow:none; width:100%;">Kapat</button></div></div><script> // --- KOD REGISTER HAVUZU --- const _v1 = new THREE.Vector3(); const _v2 = new THREE.Vector3(); const _euler = new THREE.Euler(); const dummy = new THREE.Object3D(); let laggedCamPos = new THREE.Vector3(0, 5, -10); // --- KONFİGÜRASYONLAR --- const CONFIG = { chunkSize: 400, renderRadius: 4, treesPerChunk: 120, car: { mass: 1200, maxSpeed: 420, maxReverseSpeed: 75, length: 4.8, width: 2.0, wheelbase: 2.8, torque: 4200, gears: [4.5, 3.2, 2.4, 1.9, 1.5, 1.2, 1.0, 0.85, 0.72, 0.60, 0.50] }, powertrain: { wheelRadius: 0.38, idleRpm: 900, redlineRpm: 7200 } }; let state = { isRunning: false, cameraMode: 1, volume: 1.0, keys: { w: false, a: false, s: false, d: false }, speed: 0, rpm: 900, gear: 1, steerAngle: 0, isMultiplayer: false, isHost: false, networkConnected: false }; // --- LAN MULTIPLAYER SIMULATED ALTYAPISI --- const NetworkManager = { channel: null, roomCode: '', remotePlayers: {}, init(code, isHost) { state.isMultiplayer = true; state.isHost = isHost; this.roomCode = code; this.channel = new BroadcastChannel('lan_matrix_room_' + code); this.channel.onmessage = (event) => { const data = event.data; if (data.type === 'update' && data.id !== this.myId) { this.updateRemotePlayer(data); } else if (data.type === 'join' && isHost) { this.channel.postMessage({ type: 'welcome', id: this.myId }); } }; this.myId = Math.random().toString(36).substr(2, 9); if (!isHost) { this.channel.postMessage({ type: 'join', id: this.myId }); } }, sendState(pos, heading, velocity, steerAngle) { if (!this.channel) return; this.channel.postMessage({ type: 'update', id: this.myId, x: pos.x, y: pos.y, z: pos.z, h: heading, v: velocity, s: steerAngle }); }, updateRemotePlayer(data) { if (!this.remotePlayers[data.id]) { this.remotePlayers[data.id] = createRemoteVehicleNode(); } const remote = this.remotePlayers[data.id]; remote.targetPosition.set(data.x, data.y, data.z); remote.targetHeading = data.h; remote.velocity = data.v; remote.steerAngle = data.s; }, cleanUp() { if(this.channel) { this.channel.close(); this.channel = null; } for(let id in this.remotePlayers) { scene.remove(this.remotePlayers[id]); } this.remotePlayers = {}; } }; function createRemoteVehicleNode() { const remoteGroup = new THREE.Group(); const bodyMesh = new THREE.Mesh( new THREE.BoxGeometry(CONFIG.car.width, 0.45, CONFIG.car.length), new THREE.MeshStandardMaterial({ color: 0x0088ff, metalness: 0.7, roughness: 0.2 }) ); bodyMesh.position.y = 0.4; bodyMesh.castShadow = true; remoteGroup.add(bodyMesh); const cabinMesh = new THREE.Mesh( new THREE.BoxGeometry(CONFIG.car.width - 0.3, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.1 }) ); cabinMesh.position.set(0, 0.75, -0.1); remoteGroup.add(cabinMesh); remoteGroup.targetPosition = new THREE.Vector3(); remoteGroup.targetHeading = 0; remoteGroup.velocity = 0; remoteGroup.steerAngle = 0; scene.add(remoteGroup); return remoteGroup; } // --- WEBGL VE AYDINLATMA SETUP --- const canvas = document.getElementById('game-canvas'); let renderer, scene, camera, hemiLight, dirLight; function initEngineWebGL() { if(renderer) return; renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.0)); renderer.shadowMap.enabled = true; } function buildSceneComponents() { scene = new THREE.Scene(); scene.background = new THREE.Color(0xa0e0e6); scene.fog = new THREE.FogExp2(0xa0e0e6, 0.001); camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.3, 2000); hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.65); hemiLight.position.set(0, 200, 0); scene.add(hemiLight); dirLight = new THREE.DirectionalLight(0xffffff, 0.8); dirLight.position.set(100, 150, 50); dirLight.castShadow = true; dirLight.shadow.camera.top = 150; dirLight.shadow.camera.bottom = -150; dirLight.shadow.camera.left = -150; dirLight.shadow.camera.right = 150; dirLight.shadow.mapSize.width = 1024; dirLight.shadow.mapSize.height = 1024; scene.add(dirLight); } // --- PROSEDÜREL DÜNYA VE SONSUZ YOL SİSTEMİ --- const stemGeo = new THREE.CylinderGeometry(0.2, 0.35, 4.0, 5); const crownGeo = new THREE.ConeGeometry(2.2, 7.0, 5); const stemMat = new THREE.MeshStandardMaterial({ color: 0x4a3525, roughness: 0.9 }); const crownMat = new THREE.MeshStandardMaterial({ color: 0x1e4620, roughness: 0.8 }); let terrainMesh, groundTex, roadTex; let activeChunks = new Map(); let activeRoadChunks = new Map(); let lastChunkX = NaN, lastChunkZ = NaN; function generateGrassTexture() { const canvasElement = document.createElement('canvas'); canvasElement.width = 64; canvasElement.height = 64; const ctx = canvasElement.getContext('2d'); ctx.fillStyle = '#346b3b'; ctx.fillRect(0, 0, 64, 64); ctx.fillStyle = '#2e5e34'; ctx.fillRect(0, 0, 32, 32); ctx.fillRect(32, 32, 32, 32); const tex = new THREE.CanvasTexture(canvasElement); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(500, 500); return tex; } function generateRoadTexture() { const canvasElement = document.createElement('canvas'); canvasElement.width = 128; canvasElement.height = 512; const ctx = canvasElement.getContext('2d'); ctx.fillStyle = '#222226'; ctx.fillRect(0, 0, 128, 512); ctx.fillStyle = '#ffffff'; ctx.fillRect(4, 0, 4, 512); ctx.fillRect(120, 0, 4, 512); ctx.fillStyle = '#ffffff'; for (let i = 0; i < 512; i += 64) { ctx.fillRect(62, i + 16, 4, 32); } const tex = new THREE.CanvasTexture(canvasElement); tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; return tex; } function buildSimulationWorld() { activeChunks.clear(); activeRoadChunks.clear(); lastChunkX = NaN; lastChunkZ = NaN; groundTex = generateGrassTexture(); terrainMesh = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 0.9 })); terrainMesh.rotateX(-Math.PI / 2); terrainMesh.receiveShadow = true; scene.add(terrainMesh); roadTex = generateRoadTexture(); updateProceduralMap(true); } function seededRandom(cx, cz) { let h = (cx * 374761393) ^ (cz * 668265263); h = Math.sin(h) * 43758.5453123; let seed = h - Math.floor(h); return function() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }; } function updateProceduralMap(forceUpdate = false) { const currentChunkX = Math.floor(vehicleStateVector.pos.x / CONFIG.chunkSize); const currentChunkZ = Math.floor(vehicleStateVector.pos.z / CONFIG.chunkSize); if (!forceUpdate && currentChunkX === lastChunkX && currentChunkZ === lastChunkZ) return; lastChunkX = currentChunkX; lastChunkZ = currentChunkZ; const visibleKeys = new Set(); const startZ = currentChunkZ - CONFIG.renderRadius; const endZ = currentChunkZ + CONFIG.renderRadius; const startX = currentChunkX - CONFIG.renderRadius; const endX = currentChunkX + CONFIG.renderRadius; for (let x = startX; x <= endX; x++) { for (let z = startZ; z <= endZ; z++) { const key = `${x},${z}`; visibleKeys.add(key); if (!activeChunks.has(key)) { generateChunkSector(x, z, key); } if (x === 0 && !activeRoadChunks.has(z)) { generateRoadSegment(z); } } } for (const [key, chunkData] of activeChunks.entries()) { if (!visibleKeys.has(key)) { scene.remove(chunkData.stems, chunkData.crowns); chunkData.stems.dispose(); chunkData.crowns.dispose(); activeChunks.delete(key); } } for (const [zKey, roadMesh] of activeRoadChunks.entries()) { if (zKey < startZ || zKey > endZ) { scene.remove(roadMesh); roadMesh.geometry.dispose(); activeRoadChunks.delete(zKey); } } } function generateRoadSegment(z) { const roadGeo = new THREE.PlaneGeometry(18, CONFIG.chunkSize); const segmentMat = new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.6 }); const mesh = new THREE.Mesh(roadGeo, segmentMat); mesh.rotateX(-Math.PI / 2); mesh.position.set(0, 0.01, (z * CONFIG.chunkSize) + CONFIG.chunkSize / 2); mesh.receiveShadow = true; scene.add(mesh); activeRoadChunks.set(z, mesh); } function generateChunkSector(cx, cz, key) { const instStems = new THREE.InstancedMesh(stemGeo, stemMat, CONFIG.treesPerChunk); const instCrowns = new THREE.InstancedMesh(crownGeo, crownMat, CONFIG.treesPerChunk); instStems.castShadow = true; instCrowns.castShadow = true; const rand = seededRandom(cx, cz); for (let i = 0; i < CONFIG.treesPerChunk; i++) { const px = (cx * CONFIG.chunkSize) + rand() * CONFIG.chunkSize; const pz = (cz * CONFIG.chunkSize) + rand() * CONFIG.chunkSize; if (Math.abs(px) < 16) { dummy.position.set(px, -500, pz); dummy.scale.setScalar(0); dummy.updateMatrix(); instStems.setMatrixAt(i, dummy.matrix); instCrowns.setMatrixAt(i, dummy.matrix); continue; } const scale = 0.8 + rand() * 0.7; const rot = rand() * Math.PI; dummy.position.set(px, 2.0 * scale, pz); dummy.scale.setScalar(scale); dummy.rotation.set(0, rot, 0); dummy.updateMatrix(); instStems.setMatrixAt(i, dummy.matrix); dummy.position.set(px, (4.0 + 2.0) * scale, pz); dummy.updateMatrix(); instCrowns.setMatrixAt(i, dummy.matrix); } instStems.matrixAutoUpdate = false; instCrowns.matrixAutoUpdate = false; scene.add(instStems, instCrowns); activeChunks.set(key, { stems: instStems, crowns: instCrowns }); } function checkSpatialTreeCollisions(posX, posZ) { const cx = Math.floor(posX / CONFIG.chunkSize); const cz = Math.floor(posZ / CONFIG.chunkSize); const boundaryRadius = 2.0; for (let x = cx - 1; x <= cx + 1; x++) { for (let z = cz - 1; z <= cz + 1; z++) { const rand = seededRandom(x, z); for (let i = 0; i < CONFIG.treesPerChunk; i++) { const px = (x * CONFIG.chunkSize) + rand() * CONFIG.chunkSize; const pz = (z * CONFIG.chunkSize) + rand() * CONFIG.chunkSize; if (Math.abs(px) < 16) continue; const dx = posX - px; const dz = posZ - pz; const radialDist = Math.sqrt(dx * dx + dz * dz); if (radialDist < boundaryRadius) { return { x: px, z: pz, dx: dx, dz: dz, dist: radialDist }; } } } } return null; } // --- ARAÇ MODELİ --- let vehicleStateVector = { pos: new THREE.Vector3(0, 0.02, 0), velocity: 0, heading: 0, angularVel: 0 }; let vehicleChassisNode; let frontLeftWheelNode, frontRightWheelNode; let backLeftWheelMesh, backRightWheelMesh; let dashSteeringWheelNode; function constructHyperCar() { vehicleChassisNode = new THREE.Group(); const carBodyVisual = new THREE.Group(); const bodyMesh = new THREE.Mesh( new THREE.BoxGeometry(CONFIG.car.width, 0.45, CONFIG.car.length), new THREE.MeshStandardMaterial({ color: 0xff1133, metalness: 0.7, roughness: 0.2 }) ); bodyMesh.position.y = 0.4; bodyMesh.castShadow = true; bodyMesh.receiveShadow = true; carBodyVisual.add(bodyMesh); const cabinMesh = new THREE.Mesh( new THREE.BoxGeometry(CONFIG.car.width - 0.3, 0.4, 1.8), new THREE.MeshStandardMaterial({ color: 0x111116, roughness: 0.1, metalness: 0.8 }) ); cabinMesh.position.set(0, 0.75, -0.1); cabinMesh.castShadow = true; carBodyVisual.add(cabinMesh); const spoilerWing = new THREE.Mesh( new THREE.BoxGeometry(CONFIG.car.width + 0.1, 0.04, 0.35), new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.6 }) ); spoilerWing.position.set(0, 0.75, -CONFIG.car.length / 2 + 0.15); spoilerWing.castShadow = true; carBodyVisual.add(spoilerWing); dashSteeringWheelNode = new THREE.Mesh(new THREE.TorusGeometry(0.12, 0.02, 4, 8), new THREE.MeshStandardMaterial({ color: 0x111 })); dashSteeringWheelNode.position.set(0.32, 0.7, 0.5); dashSteeringWheelNode.rotation.x = -Math.PI / 5; carBodyVisual.add(dashSteeringWheelNode); vehicleChassisNode.add(carBodyVisual); const tireGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.3, 12); tireGeo.rotateZ(Math.PI / 2); const rubberMat = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.85 }); const sx = CONFIG.car.width / 2 + 0.04; const sz = CONFIG.car.wheelbase / 2; frontLeftWheelNode = new THREE.Group(); frontLeftWheelNode.position.set(sx, 0.38, sz); const flMesh = new THREE.Mesh(tireGeo, rubberMat); flMesh.castShadow = true; frontLeftWheelNode.add(flMesh); vehicleChassisNode.add(frontLeftWheelNode); frontRightWheelNode = new THREE.Group(); frontRightWheelNode.position.set(-sx, 0.38, sz); const frMesh = new THREE.Mesh(tireGeo, rubberMat); frMesh.castShadow = true; frontRightWheelNode.add(frMesh); vehicleChassisNode.add(frontRightWheelNode); backLeftWheelMesh = new THREE.Mesh(tireGeo, rubberMat); backLeftWheelMesh.position.set(sx, 0.38, -sz); backLeftWheelMesh.castShadow = true; vehicleChassisNode.add(backLeftWheelMesh); backRightWheelMesh = new THREE.Mesh(tireGeo, rubberMat); backRightWheelMesh.position.set(-sx, 0.38, -sz); backRightWheelMesh.castShadow = true; vehicleChassisNode.add(backRightWheelMesh); scene.add(vehicleChassisNode); } function resetSimulationCoordinates() { vehicleStateVector.pos.set(0, 0.02, 0); vehicleStateVector.velocity = 0; vehicleStateVector.heading = 0; vehicleStateVector.angularVel = 0; state.speed = 0; state.gear = 1; state.rpm = CONFIG.powertrain.idleRpm; state.steerAngle = 0; laggedCamPos.set(0, 5, -10); if(scene) updateProceduralMap(true); } function triggerGameOverSequence() { state.isRunning = false; if (audioCtx) { if(engineOscillator) { try{ engineOscillator.stop(); } catch(e){} } audioCtx.close(); audioCtx = null; } NetworkManager.cleanUp(); document.getElementById('ui-layer').style.display = 'none'; const menuTitle = document.getElementById('menu-title'); menuTitle.innerHTML = `<span style="color:#ff2222; font-size:44px; font-weight:900;">💥 KAZA YAPTIINIZ!</span><br><span style="font-size:18px; color:#ccc; font-weight:400;">Ağaca yüksek hızla çarptığınız için aracınız pert oldu.</span>`; const startBtn = document.getElementById('start-btn'); startBtn.innerText = "YENİDEN DENE"; document.getElementById('multiplayer-panel').style.display = 'none'; document.getElementById('start-screen').style.display = 'flex'; while(scene.children.length > 0){ scene.remove(scene.children[0]); } } // --- GELİŞMİŞ OYUNCULAR ARASI AABB ÇARPIŞMA TESTİ --- function checkPlayerToPlayerAABBCollisions() { if (!state.isMultiplayer) return; const halfW = CONFIG.car.width / 2; const halfL = CONFIG.car.length / 2; const myMinX = vehicleStateVector.pos.x - halfW, myMaxX = vehicleStateVector.pos.x + halfW; const myMinZ = vehicleStateVector.pos.z - halfL, myMaxZ = vehicleStateVector.pos.z + halfL; for (let id in NetworkManager.remotePlayers) { const remote = NetworkManager.remotePlayers[id]; const rMinX = remote.position.x - halfW, rMaxX = remote.position.x + halfW; const rMinZ = remote.position.z - halfL, rMaxZ = remote.position.z + halfL; const overlapX = Math.min(myMaxX, rMaxX) - Math.max(myMinX, rMinX); const overlapZ = Math.min(myMaxZ, rMaxZ) - Math.max(myMinZ, rMinZ); if (overlapX > 0 && overlapZ > 0) { if (overlapX < overlapZ) { const pushX = overlapX * (vehicleStateVector.pos.x > remote.position.x ? 1 : -1); vehicleStateVector.pos.x += pushX * 0.5; vehicleStateVector.velocity *= -0.4; } else { const pushZ = overlapZ * (vehicleStateVector.pos.z > remote.position.z ? 1 : -1); vehicleStateVector.pos.z += pushZ * 0.5; vehicleStateVector.velocity *= -0.4; } } } } // --- OPTİMİZE EDİLMİŞ AKICI FİZİK MOTORU --- function updateSimulationPhysics(deltaTime) { const profile = CONFIG.car; const numGears = profile.gears.length; const inputForward = state.keys.w; const inputReverse = state.keys.s; if (Math.abs(vehicleStateVector.velocity) < 0.15) { if (inputReverse && state.gear >= 1) { state.gear = -1; vehicleStateVector.velocity = 0; } else if (inputForward && state.gear === -1) { state.gear = 1; vehicleStateVector.velocity = 0; } } let gearRatio = profile.gears[0]; if (state.gear === -1) gearRatio = CONFIG.car.maxReverseSpeed / 18.0; else gearRatio = profile.gears[Math.max(0, state.gear - 1)]; const axleRpm = (Math.abs(vehicleStateVector.velocity) / CONFIG.powertrain.wheelRadius) * 9.549297; let targetEngineRpm = axleRpm * gearRatio * 4.0; if (targetEngineRpm < CONFIG.powertrain.idleRpm) targetEngineRpm = CONFIG.powertrain.idleRpm; state.rpm += (targetEngineRpm - state.rpm) * 15.0 * deltaTime; if (state.gear > 0) { if (state.rpm > 6200 && state.gear < numGears) { state.gear++; state.rpm -= 1400; } else if (state.rpm < 2200 && state.gear > 1) { state.gear--; state.rpm += 1100; } } const accelerating = (state.gear >= 1 && inputForward) || (state.gear === -1 && inputReverse); const decelerationBraking = (state.gear >= 1 && inputReverse) || (state.gear === -1 && inputForward); if (accelerating) { const torqueCurve = 1.2 - Math.pow((state.rpm / CONFIG.powertrain.redlineRpm) - 0.5, 2); const kineticForce = (profile.torque * torqueCurve * gearRatio) / CONFIG.powertrain.wheelRadius; const directionFactor = (state.gear === -1) ? -1 : 1; vehicleStateVector.velocity += (kineticForce / profile.mass) * directionFactor * deltaTime; } else if (decelerationBraking) { vehicleStateVector.velocity -= Math.sign(vehicleStateVector.velocity) * 65.0 * deltaTime; } else { vehicleStateVector.velocity -= Math.sign(vehicleStateVector.velocity) * 8.0 * deltaTime; } // Doğrusal Hava Direnci Sönümlemesi vehicleStateVector.velocity -= vehicleStateVector.velocity * 0.15 * deltaTime; const speedMaxVector = profile.maxSpeed / 3.6; if (vehicleStateVector.velocity > speedMaxVector) vehicleStateVector.velocity = speedMaxVector; if (vehicleStateVector.velocity < -(CONFIG.car.maxReverseSpeed / 3.6)) vehicleStateVector.velocity = -(CONFIG.car.maxReverseSpeed / 3.6); state.speed = Math.abs(vehicleStateVector.velocity * 3.6); let nextX = vehicleStateVector.pos.x + Math.sin(vehicleStateVector.heading) * vehicleStateVector.velocity * deltaTime; let nextZ = vehicleStateVector.pos.z + Math.cos(vehicleStateVector.heading) * vehicleStateVector.velocity * deltaTime; const collisionReport = checkSpatialTreeCollisions(nextX, nextZ); if (collisionReport) { if (state.speed >= 100) { triggerGameOverSequence(); return; } const outNx = collisionReport.dx / collisionReport.dist; const outNz = collisionReport.dz / collisionReport.dist; vehicleStateVector.pos.x = collisionReport.x + outNx * 2.1; vehicleStateVector.pos.z = collisionReport.z + outNz * 2.1; vehicleStateVector.heading += (collisionReport.dx > 0 ? 1 : -1) * 0.3; vehicleStateVector.velocity *= -0.3; } else { vehicleStateVector.pos.x = nextX; vehicleStateVector.pos.z = nextZ; } checkPlayerToPlayerAABBCollisions(); // --- YENİ AKICI VE DİNAMİK DÖNÜŞ SİSTEMİ --- // Hız arttıkça direksiyonun kilitlenmesini engellemek için merkezkaç tepkili hassas sönümleme const steerSpeedFactor = Math.max(0.15, 1.0 - (state.speed / (profile.maxSpeed * 0.8))); const maxSteerLimit = 0.55 * steerSpeedFactor; let targetAngle = 0; if (state.keys.a) targetAngle = maxSteerLimit; if (state.keys.d) targetAngle = -maxSteerLimit; // Yumuşak dönüş geçişi (Interpolation) state.steerAngle += (targetAngle - state.steerAngle) * 10.0 * deltaTime; if (Math.abs(vehicleStateVector.velocity) > 0.05) { // Gerçekçi Ackermann geometrisi simülasyonu const angularCalculation = (vehicleStateVector.velocity * Math.tan(state.steerAngle)) / profile.wheelbase; vehicleStateVector.angularVel += (angularCalculation - vehicleStateVector.angularVel) * 15.0 * deltaTime; vehicleStateVector.heading += vehicleStateVector.angularVel * deltaTime; } else { vehicleStateVector.angularVel = 0; } vehicleChassisNode.position.copy(vehicleStateVector.pos); vehicleChassisNode.rotation.set(0, vehicleStateVector.heading, 0); const wheelRotSpeedVal = (vehicleStateVector.velocity / CONFIG.powertr Context; audioCtx = new AudioCtx(); engineOscillator = audioCtx.createOscillator(); engineOscillator.type = 'sawtooth'; const lowpassFilter = audioCtx.createBiquadFilter(); lowpassFilter.type = 'lowpass'; lowpassFilter.frequency.value = 450; masterGainNode = audioCtx.createGain(); masterGainNode.gain.value = 0.0; engineOscillator.connect(lowpassFilter); lowpassFilter.connect(masterGainNode); masterGainNode.connect(audioCtx.destination); engineOscillator.start(); } function refreshAudioSynthesisPipeline() { if (!audioCtx) return; engineOscillator.frequency.setTargetAtTime(14.0 + (state.rpm / CONFIG.powertrain.redlineRpm) * 220, audioCtx.currentTime, 0.04); const activeInputHold = state.keys.w || state.keys.s; masterGainNode.gain.setTargetAtTime((activeInputHold ? 0.20 : 0.06) * state.volume, audioCtx.currentTime, 0.04); } // --- UI GÖSTERGE PANELİ --- const hudSpeed = document.getElementById('speed-value'); const hudGear = document.getElementById('gear-display'); const hudRpmText = document.getElementById('rpm-text'); const hudRpmBar = document.getElementById('rpm-bar'); const hudCoordinates = document.getElementById('coordinates-hud'); function syncUserInterfaceHUD() { hudSpeed.innerText = Math.floor(state.speed); hudGear.innerText = (state.gear === -1) ? 'R' : 'D' + state.gear; hudRpmText.innerText = Math.floor(state.rpm) + " RPM"; hudRpmBar.style.width = Math.max(0, Math.min(100, ((state.rpm - 900) / 6300) * 100)) + "%"; hudCoordinates.innerText = `X: ${vehicleStateVector.pos.x.toFixed(2)} | Y: ${vehicleStateVector.pos.y.toFixed(2)} | Z: ${vehicleStateVector.pos.z.toFixed(2)}`; } // --- KLAVYE DİNLEYİCİLERİ --- document.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (state.keys.hasOwnProperty(k)) state.keys[k] = true; if (k === 'c') { state.cameraMode = state.cameraMode === 0 ? 1 : 0; if (state.cameraMode === 1) laggedCamPos.copy(camera.position); } if (k === 'r') resetSimulationCoordinates(); if (e.key === 'Escape') toggleSettingsMenu(); }); document.addEventListener('keyup', (e) => { const k = e.key.toLowerCase(); if (state.keys.hasOwnProperty(k)) state.keys[k] = false; }); const settingsMenuOverlay = document.getElementById('settings-menu'); function toggleSettingsMenu() { settingsMenuOverlay.style.display = settingsMenuOverlay.style.display === 'flex' ? 'none' : 'flex'; } document.getElementById('settings-btn').addEventListener('click', toggleSettingsMenu); document.getElementById('btn-close-settings').addEventListener('click', toggleSettingsMenu); document.getElementById('set-volume').addEventListener('input', (e) => { document.getElementById('vol-val').innerText = e.target.value; state.volume = e.target.value / 100; }); // --- MULTIPLAYER UI BUTON KONTROLLERİ --- document.getElementById('multi-menu-btn').addEventListener('click', () => { const panel = document.getElementById('multiplayer-panel'); panel.style.display = panel.style.display === 'flex' ? 'none' : 'flex'; }); document.getElementById('host-btn').addEventListener('click', () => { const randomCode = Math.floor(1000 + Math.random() * 9000).toString(); document.getElementById('generated-code').innerText = randomCode; document.getElementById('host-code-display').style.display = 'block'; NetworkManager.init(randomCode, true); launchSimulationGame(); }); document.getElementById('join-btn').addEventListener('click', () => { const codeInput = document.getElementById('join-code-input').value.trim(); if(codeInput.length === 4) { document.getElementById('connection-status').innerText = "Bağlanılıyor..."; NetworkManager.init(codeInput, false); setTimeout(() => { launchSimulationGame(); }, 600); } else { alert("Lütfen 4 haneli geçerli bir oda kodu girin!"); } }); // --- KARE SÜREKLİLİĞİ VE FIXED TIMESTEP (TAKILMA ÖNLEYİCİ BAŞ DÖNGÜ) --- const clock = new THREE.Clock(); let physicsAccumulator = 0.0; const fixedPhysicsStep = 0.016; // 60Hz Sabit Fizik Adımı (Sıfır Titreme) function mainLoop() { if (!state.isRunning) return; requestAnimationFrame(main
