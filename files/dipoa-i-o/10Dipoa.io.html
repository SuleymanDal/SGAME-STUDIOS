<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>Dipoa.io - ©SGame Studios - 2026</title><style> * { box-sizing: border-box; touch-action: none; } body, html { margin: 0; padding: 0; overflow: hidden; background-color: #1a1a1a; font-family: 'Ubuntu', sans-serif; user-select: none; width: 100vw; height: 100vh; } canvas { display: block; background-color: #c8c8c8; } /* Menüler ve Arayüz */ .overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(26, 26, 26, 0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1000; } .title { font-size: 48px; font-weight: 900; color: #00b2e6; margin-bottom: 20px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; } .input-group { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; } input[type="text"] { padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #555; text-align: center; } input[type="color"] { width: 50px; height: 50px; border: none; border-radius: 8px; cursor: pointer; } .btn { background: #00b2e6; border: none; border-radius: 8px; color: white; font-size: 20px; font-weight: bold; padding: 12px 40px; cursor: pointer; transition: 0.2s; } .btn:hover { background: #008cb4; transform: translateY(-2px); } /* Oyun İçi UI */ #ui { position: absolute; top: 15px; left: 15px; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); pointer-events: none; display: none; z-index: 100; } .ui-text { font-size: 18px; font-weight: bold; margin-bottom: 5px; } /* Skor Tablosu */ #leaderboard { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 8px; color: white; font-size: 14px; pointer-events: none; display: none; min-width: 150px; z-index: 100; } .lb-item { display: flex; justify-content: space-between; margin-bottom: 3px; gap: 10px; } /* Tank Sınıfı Seçimi */ #class-menu { position: absolute; top: 20%; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 10px; display: none; gap: 15px; z-index: 200; text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5); flex-wrap: wrap; justify-content: center; } .class-btn { padding: 10px 20px; font-size: 16px; font-weight: bold; cursor: pointer; border: 2px solid #333; border-radius: 8px; background: #ffe869; } /* Ayarlar (En Üstte) */ #settings-btn { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 101; padding: 8px 20px; font-size: 14px; display: none; } /* Göstergeler */ #bars { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 300px; display: none; flex-direction: column; gap: 5px; z-index: 100; } .bar { width: 100%; height: 16px; background: #555; border: 2px solid #222; border-radius: 8px; position: relative; overflow: hidden; } .bar-inner { height: 100%; transition: width 0.1s; } .bar-text { position: absolute; top:0; left:0; width:100%; text-align:center; font-size: 11px; font-weight: bold; color: white; line-height: 14px; text-shadow: 1px 1px 1px #000; } /* Mobil Kontroller */ #joystick-left, #joystick-right { position: absolute; bottom: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.2); border-radius: 50%; display: none; z-index: 50; border: 2px solid rgba(255,255,255,0.4); } #joystick-left { left: 20px; } #joystick-right { right: 20px; } .knob { position: absolute; top: 50%; left: 50%; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; } /* Duyarlı Tasarım: Dikey (Portrait) ve Yatay (Landscape) Uyumluluğu */ @media (orientation: portrait) { #bars { bottom: 160px; width: 85%; max-width: 280px; } #leaderboard { font-size: 12px; padding: 8px; min-width: 130px; top: 60px; right: 10px; } #ui { top: 10px; left: 10px; font-size: 14px; } #settings-btn { top: 10px; left: 50%; transform: translateX(-50%); padding: 6px 14px; font-size: 12px; } .title { font-size: 36px; } #joystick-left, #joystick-right { width: 100px; height: 100px; bottom: 20px; } .knob { width: 40px; height: 40px; } } </style></head><body><div id="start-screen" class="overlay"><div class="title">DIPOA.IO</div><div class="input-group"><input type="text" id="playerName" placeholder="Adını Gir" maxlength="12" value="Oyuncu"><input type="color" id="playerColor" value="#00b2e6"></div><button class="btn" onclick="startGame()">Oyuna Başla</button><div style="margin-top:20px; color:#aaa; font-size:14px; text-align:center; padding: 0 15px;"> PC: WASD hareket, Fare ile ateş.<br>Mobil: Ekranın iki yanındaki sanal joystikleri kullan. </div></div><div id="death-screen" class="overlay" style="display:none; background: rgba(243, 60, 60, 0.8);"><div class="title" style="color: white; font-size: 60px;">ÖLDÜN!</div><div class="ui-text" id="finalScore" style="font-size: 24px; margin-bottom: 20px;">Skor: 0</div><button class="btn" onclick="respawn()">Yeniden Doğ</button></div><div id="class-menu"><h3 style="margin: 0 0 10px 0; width: 100%;">Seviye 15: Sınıf Seç</h3><button class="class-btn" onclick="chooseClass('twin')">İkiz Namlu<br><span style="font-size:12px; font-weight:normal;">2 Mermi atar</span></button><button class="class-btn" onclick="chooseClass('sniper')">Keskin Nişancı<br><span style="font-size:12px; font-weight:normal;">Hızlı ve güçlü tek mermi</span></button><button class="class-btn" onclick="chooseClass('machine')">Makineli<br><span style="font-size:12px; font-weight:normal;">Çok seri atış</span></button></div><div id="ui"><div class="ui-text" style="color: #00b2e6; font-size: 24px;">DIPOA.IO</div><div class="ui-text" id="scoreDisplay">Skor: 0</div><div class="ui-text" id="levelDisplay">Seviye: 1</div></div><div id="leaderboard"><div style="text-align: center; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid #777; padding-bottom: 3px;">SKOR TABLOSU</div><div id="lb-list"></div></div><button id="settings-btn" class="btn" onclick="toggleSound()">Ses: AÇIK</button><div id="bars"><div class="bar"><div id="hp-bar" class="bar-inner" style="background:#85e37d; width:100%;"></div><div id="hp-text" class="bar-text">100/100</div></div><div class="bar"><div id="xp-bar" class="bar-inner" style="background:#ffe869; width:0%;"></div><div id="xp-text" class="bar-text">XP: 0/100</div></div></div><div id="joystick-left"><div class="knob" id="knob-left"></div></div><div id="joystick-right"><div class="knob" id="knob-right"></div></div><canvas id="gameCanvas"></canvas><script> const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d"); // --- TEMEL DEĞİŞKENLER --- const WORLD_SIZE = 3500; let gameActive = false; let shake = 0; let soundEnabled = true; const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; } window.addEventListener('resize', resize); resize(); // --- SES SİSTEMİ (Web Audio API) --- const AudioContext = window.AudioContext || window.webkitAudioContext; const audioCtx = new AudioContext(); function playSound(type) { if(!soundEnabled || !gameActive) return; if(audioCtx.state === 'suspended') audioCtx.resume(); const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination); const now = audioCtx.currentTime; if (type === 'shoot') { osc.type = 'square'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1); gain.gain.setValueAtTime(0.05, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1); osc.start(now); osc.stop(now + 0.1); } else if (type === 'hit') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.exponentialRampToValueAtTime(50, now + 0.15); gain.gain.setValueAtTime(0.1, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15); osc.start(now); osc.stop(now + 0.15); } else if (type === 'levelup') { osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.setValueAtTime(600, now + 0.1); osc.frequency.setValueAtTime(800, now + 0.2); gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0, now + 0.4); osc.start(now); osc.stop(now + 0.4); } } function toggleSound() { soundEnabled = !soundEnabled; document.getElementById("settings-btn").innerText = "Ses: " + (soundEnabled ? "AÇIK" : "KAPALI"); } // --- GİRDİLER (Inputs) --- const keys = {}; const mouse = { x: 0, y: 0, clicking: false }; const joyMove = { x: 0, y: 0, active: false }; const joyAim = { x: 0, y: 0, active: false }; if (!isMobile) { window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true); window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false); window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }); window.addEventListener('mousedown', () => mouse.clicking = true); window.addEventListener('mouseup', () => mouse.clicking = false); } else { const setupJoystick = (element, knob, outputObj) => { element.style.display = 'block'; let activeTouchId = null; let rect, centerX, centerY; const updateCenter = () => { rect = element.getBoundingClientRect(); centerX = rect.left + rect.width / 2; centerY = rect.top + rect.height / 2; }; element.addEventListener('touchstart', (e) => { e.preventDefault(); if (activeTouchId !== null) return; let touch = e.changedTouches[0]; activeTouchId = touch.identifier; outputObj.active = true; updateCenter(); }); window.addEventListener('touchmove', (e) => { if (!outputObj.active || activeTouchId === null) return; let touch = null; for (let i = 0; i < e.touches.length; i++) { if (e.touches[i].identifier === activeTouchId) { touch = e.touches[i]; break; } } if (!touch) return; e.preventDefault(); let dx = touch.clientX - centerX; let dy = touch.clientY - centerY; let dist = Math.hypot(dx, dy); let maxDist = rect.width / 2; if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; } knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`; outputObj.x = dx / maxDist; outputObj.y = dy / maxDist; }, { passive: false }); window.addEventListener('touchend', (e) => { if (activeTouchId === null) return; let ended = false; for (let i = 0; i < e.changedTouches.length; i++) { if (e.changedTouches[i].identifier === activeTouchId) { ended = true; break; } } if (ended) { activeTouchId = null; outputObj.active = false; outputObj.x = 0; outputObj.y = 0; knob.style.transform = `translate(-50%, -50%)`; } }); }; setTimeout(() => { setupJoystick(document.getElementById('joystick-left'), document.getElementById('knob-left'), joyMove); setupJoystick(document.getElementById('joystick-right'), document.getElementById('knob-right'), joyAim); }, 500); } // --- OYUN NESNELERİ --- const camera = { x: 0, y: 0 }; const bullets = []; const particles = []; const swamps = []; const boxes = []; const entities = []; for(let i=0; i<15; i++) swamps.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, r: Math.random()*150 + 100 }); class Entity { constructor(isPlayer, name, color, x, y) { this.id = Math.random().toString(36).substr(2, 9); this.isBot = !isPlayer && !this.isBoss; this.isPlayer = isPlayer; this.name = name; this.color = color; this.x = x; this.y = y; this.vx = 0; this.vy = 0; this.radius = 24; this.hp = 100; this.maxHp = 100; this.score = 0; this.level = 1; this.xp = 0; this.nextXp = 100; this.baseDmg = 15; this.fireRate = 250; this.speed = 4.5; this.bulletSpeed = 12; this.bulletLife = 65; this.hpRegen = 0.05; this.lastShot = 0; this.tankClass = 'base'; this.isBoss = false; this.target = null; this.angle = 0; } gainXp(amount) { if(this.isBot) amount *= 2.5; // Botlar daha hızlı gelişir this.xp += amount; this.score += Math.floor(amount); while (this.xp >= this.nextXp) { this.xp -= this.nextXp; this.level++; this.nextXp = Math.floor(this.nextXp * 1.3) + 50; // Üstel Can Artışı & Seviye Atlayınca Can Fullenmesi this.maxHp = Math.floor(100 * Math.pow(1.12, this.level - 1)); this.hp = this.maxHp; // Seviyeyle Birlikte Gelişen Özellikler this.hpRegen = 0.05 + (this.level * 0.015); this.baseDmg += 2.5; this.fireRate = Math.max(60, this.fireRate * 0.96); this.bulletSpeed += 0.4; this.bulletLife += 2; if(this.isPlayer) { playSound('levelup'); if (this.level === 15) document.getElementById('class-menu').style.display = 'flex'; } else if (this.isBot && this.level === 15) { const classes = ['twin', 'sniper', 'machine']; this.changeClass(classes[Math.floor(Math.random()*classes.length)]); } } } changeClass(type) { this.tankClass = type; if(type === 'sniper') { this.fireRate *= 2.0; this.baseDmg *= 2.2; this.speed = 3.8; this.bulletSpeed += 8; this.bulletLife += 25; } if(type === 'machine') { this.fireRate *= 0.4; this.baseDmg *= 0.65; } if(this.isPlayer) document.getElementById('class-menu').style.display = 'none'; } shoot(angle) { const now = Date.now(); if (now - this.lastShot > this.fireRate) { this.lastShot = now; let multSpeed = (this.tankClass === 'sniper' ? 1.4 : (this.isBoss ? 0.7 : 1)); let bSpeed = this.bulletSpeed * multSpeed; let bLife = this.bulletLife * (this.tankClass === 'sniper' ? 1.5 : 1); const createBullet = (offsetX, offsetAngle, dmgMult) => { bullets.push({ owner: this.id, isPlayerBot: !this.isBoss, x: this.x + Math.cos(angle)*this.radius*1.5 + Math.cos(angle+Math.PI/2)*offsetX, y: this.y + Math.sin(angle)*this.radius*1.5 + Math.sin(angle+Math.PI/2)*offsetX, vx: Math.cos(angle + offsetAngle) * bSpeed + this.vx*0.3, vy: Math.sin(angle + offsetAngle) * bSpeed + this.vy*0.3, radius: this.isBoss ? 15 : (this.tankClass === 'sniper' ? 12 : 8), damage: this.baseDmg * dmgMult, color: this.color, life: bLife }); }; if (this.tankClass === 'twin') { createBullet(-12, 0, 0.6); createBullet(12, 0, 0.6); } else if (this.tankClass === 'machine') { createBullet(0, (Math.random()-0.5)*0.3, 1); } else if (this.isBoss) { for(let i=0; i<8; i++) createBullet(0, (Math.PI/4)*i, 1); } else { createBullet(0, 0, 1); } if(this.isPlayer) { playSound('shoot'); shake = this.tankClass === 'sniper' ? 8 : 3; } this.vx -= Math.cos(angle)*2; this.vy -= Math.sin(angle)*2; } } update() { let currentSpeed = this.speed; for(let s of swamps) { if(Math.hypot(this.x - s.x, this.y - s.y) < s.r) currentSpeed *= 0.5; } if (this.isPlayer) { let ax = 0, ay = 0; if(isMobile && joyMove.active) { ax = joyMove.x; ay = joyMove.y; } else { if (keys['w']) ay -= 1; if (keys['s']) ay += 1; if (keys['a']) ax -= 1; if (keys['d']) ax += 1; } if(ax !== 0 || ay !== 0) { let mag = Math.hypot(ax, ay); this.vx += (ax/mag) * 0.8; this.vy += (ay/mag) * 0.8; } if(mouse.clicking || (isMobile && joyAim.active)) { let angle = isMobile ? Math.atan2(joyAim.y, joyAim.x) : Math.atan2(mouse.y - (this.y - camera.y), mouse.x - (this.x - camera.x)); this.shoot(angle); } } else { if (!this.target || Math.random() < 0.02) { let closest = null; let minD = 1000; let pool = this.isBoss ? entities : [...entities, ...boxes]; for(let e of pool) { if(e.id !== this.id && (!this.isBoss || e.isPlayer || e.isBot)) { let d = Math.hypot(e.x - this.x, e.y - this.y); if(d < minD) { minD = d; closest = e; } } } this.target = closest || {x: this.x + (Math.random()-0.5)*500, y: this.y + (Math.random()-0.5)*500}; } if(this.target) { let dx = this.target.x - this.x; let dy = this.target.y - this.y; let dist = Math.hypot(dx, dy); this.angle = Math.atan2(dy, dx); if(this.isBoss) { if(dist > 300) { this.vx += Math.cos(this.angle)*0.2; this.vy += Math.sin(this.angle)*0.2; } this.shoot(this.angle); } else { if(dist > 200) { this.vx += Math.cos(this.angle)*0.5; this.vy += Math.sin(this.angle)*0.5; } if(dist < 400) this.shoot(this.angle); } } } // Fizik this.vx *= 0.85; this.vy *= 0.85; let vMag = Math.hypot(this.vx, this.vy); if (vMag > currentSpeed) { this.vx = (this.vx/vMag)*currentSpeed; this.vy = (this.vy/vMag)*currentSpeed; } this.x += this.vx; this.y += this.vy; // En Dış Kırmızı Alan / Duvar Temas Hasarı & Çarpışması let hitWall = false; if (this.x - this.radius <= 0) { this.x = this.radius; this.vx = Math.abs(this.vx) + 2; hitWall = true; } if (this.x + this.radius >= WORLD_SIZE) { this.x = WORLD_SIZE - this.radius; this.vx = -Math.abs(this.vx) - 2; hitWall = true; } if (this.y - this.radius <= 0) { this.y = this.radius; this.vy = Math.abs(this.vy) + 2; hitWall = true; } if (this.y + this.radius >= WORLD_SIZE) { this.y = WORLD_SIZE - this.radius; this.vy = -Math.abs(this.vy) - 2; hitWall = true; } if (hitWall) { this.hp -= 0.5 + (this.level * 0.1); if (this.isPlayer) { shake = 3; playSound('hit'); } spawnParticles(this.x, this.y, '#f33c3c', 2); } // Can yenileme if(this.hp < this.maxHp && !this.isBoss) this.hp = Math.min(this.maxHp, this.hp + this.hpRegen); } draw() { ctx.save(); ctx.translate(this.x, this.y); let drawAngle = this.isPlayer ? (isMobile && joyAim.active ? Math.atan2(joyAim.y, joyAim.x) : Math.atan2(mouse.y - (this.y - camera.y), mouse.x - (this.x - camera.x))) : this.angle; ctx.rotate(drawAngle); ctx.fillStyle = "#999"; ctx.strokeStyle = "#333"; ctx.lineWidth = 4; if(this.isBoss) { } else if(this.tankClass === 'twin') { ctx.fillRect(0, -18, 45, 12); ctx.strokeRect(0, -18, 45, 12); ctx.fillRect(0, 6, 45, 12); ctx.strokeRect(0, 6, 45, 12); } else if(this.tankClass === 'sniper') { ctx.fillRect(0, -8, 65, 16); ctx.strokeRect(0, -8, 65, 16); } else if(this.tankClass === 'machine') { ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(40, -16); ctx.lineTo(40, 16); ctx.lineTo(0, 10); ctx.closePath(); ctx.fill(); ctx.stroke(); } else { ctx.fillRect(0, -10, 42, 20); ctx.strokeRect(0, -10, 42, 20); } ctx.rotate(-drawAngle); ctx.fillStyle = this.color; ctx.strokeStyle = "#333"; if (this.isBoss) { ctx.beginPath(); for(let i=0; i<6; i++) { ctx.lineTo(this.radius * Math.cos(i * Math.PI / 3), this.radius * Math.sin(i * Math.PI / 3)); } ctx.closePath(); ctx.fill(); ctx.stroke(); } else { ctx.beginPath(); ctx.arc(0, 0, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); } ctx.fillStyle = "white"; ctx.font = "bold 14px Arial"; ctx.textAlign = "center"; ctx.fillText(this.name, 0, -this.radius - 15); ctx.fillStyle = "#555"; ctx.fillRect(-20, -this.radius - 10, 40, 6); ctx.fillStyle = this.isBoss ? "#f33c3c" : "#85e37d"; ctx.fillRect(-20, -this.radius - 10, Math.max(0, (this.hp/this.maxHp))*40, 6); ctx.restore(); } } let player; // --- YARDIMCI FONKSİYONLAR --- function spawnParticles(x, y, color, count=10) { for(let i=0; i<count; i++) { let ang = Math.random()*Math.PI*2; let spd = Math.random()*5+2; particles.push({x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, radius: Math.random()*4+2, color, alpha: 1, decay: Math.random()*0.03 + 0.02}); } } function spawnBoxes(count) { for(let i=0; i<count; i++) { let type = Math.random(); let hp, size, xp, color, sides; if(type < 0.6) { hp=20; size=16; xp=30; color="#ffe869"; sides=4; } else if(type < 0.9) { hp=50; size=20; xp=80; color="#fc7677"; sides=3; } else { hp=150; size=28; xp=250; color="#768cfc"; sides=5; } boxes.push({ x: Math.random()*WORLD_SIZE, y: Math.random()*WORLD_SIZE, hp, maxHp: hp, size, xp, color, sides, ang: Math.random()*Math.PI, rot: (Math.random()-0.5)*0.05 }); } } function spawnBot() { let names = ["Terminator", "Shadow", "ProGamer", "Bot_01", "Destroyer", "Ninja", "King", "SniperGod"]; let colors = ["#ff5555", "#55ff55", "#5555ff", "#ffff55", "#ff55ff", "#55ffff"]; let b = new Entity(false, names[Math.floor(Math.random()*names.length)], colors[Math.floor(Math.random()*colors.length)], Math.random()*WORLD_SIZE, Math.random()*WORLD_SIZE); // Botların Seviyesinin Oyuncuya Göre Hızlıca Gelişmesi let startLvl = player ? Math.max(1, Math.floor(player.level * 0.8 + Math.random() * 4)) : 1; for(let l=1; l<startLvl; l++) { b.gainXp(b.nextXp); } entities.push(b); } function spawnBoss() { let boss = new Entity(false, "MEGA BOSS", "#ff0000", WORLD_SIZE/2, WORLD_SIZE/2); boss.isBoss = true; boss.radius = 80; boss.maxHp = 3000; boss.hp = 3000; boss.baseDmg = 40; boss.speed = 1.5; boss.fireRate = 800; boss.xp = 5000; entities.push(boss); } function updateLeaderboard() { let sorted = [...entities].sort((a,b) => b.score - a.score).slice(0, 10); let html = ""; sorted.forEach((e, i) => { let isMe = e.id === player.id; html += `<div class="lb-item" style="${isMe ? 'color:#ffe869;' : ''}"><span>${i+1}. ${e.name}</span><span>${e.score}</span></div>`; }); document.getElementById("lb-list").innerHTML = html; } // --- OYUN DÖNGÜSÜ --- function startGame() { let name = document.getElementById("playerName").value || "Oyuncu"; let color = document.getElementById("playerColor").value; player = new Entity(true, name, color, WORLD_SIZE/2 + (Math.random()*200-100), WORLD_SIZE/2 + (Math.random()*200-100)); entities.length = 0; entities.push(player); bullets.length = 0; particles.length = 0; boxes.length = 0; spawnBoxes(150); for(let i=0; i<8; i++) spawnBot(); document.getElementById("start-screen").style.display = "none"; document.getElementById("ui").style.display = "block"; document.getElementById("leaderboard").style.display = "block"; document.getElementById("bars").style.display = "flex"; document.getElementById("settings-btn").style.display = "block"; gameActive = true; setInterval(updateLeaderboard, 1000); setInterval(() => { if(gameActive && Math.random() < 0.05 && !entities.find(e => e.isBoss)) spawnBoss(); }, 10000); setInterval(() => { if(gameActive && entities.filter(e => e.isBot).length < 10) spawnBot(); }, 4000); } function respawn() { document.getElementById("death-screen").style.display = "none"; startGame(); } function chooseClass(type) { if(player) player.changeClass(type); } function update() { if(!gameActive) return; if(shake > 0) shake *= 0.9; if(shake < 0.5) shake = 0; camera.x += (player.x - canvas.width/2 - camera.x) * 0.1; camera.y += (player.y - canvas.height/2 - camera.y) * 0.1; // Oyuncu, Bot ve Boss Çarpışma (Temas) Hasarı Mekaniği for (let i = 0; i < entities.length; i++) { for (let j = i + 1; j < entities.length; j++) { let e1 = entities[i]; let e2 = entities[j]; let dx = e2.x - e1.x; let dy = e2.y - e1.y; let dist = Math.hypot(dx, dy); let minDist = e1.radius + e2.radius; if (dist < minDist && dist > 0) { let angle = Math.atan2(dy, dx); let overlap = minDist - dist; e1.vx -= Math.cos(angle) * overlap * 0.2; e1.vy -= Math.sin(angle) * overlap * 0.2; e2.vx += Math.cos(angle) * overlap * 0.2; e2.vy += Math.sin(angle) * overlap * 0.2; let dmg1 = 0.3 + (e2.baseDmg * 0.02); let dmg2 = 0.3 + (e1.baseDmg * 0.02); e1.hp -= dmg1; e2.hp -= dmg2; if (e1.isPlayer || e2.isPlayer) { shake = 3; playSound('hit'); spawnParticles((e1.x + e2.x)/2, (e1.y + e2.y)/2, '#ff5555', 2); } } } } for(let i=entities.length-1; i>=0; i--) { let e = entities[i]; e.update(); if(e.hp <= 0) { spawnParticles(e.x, e.y, e.color, e.isBoss ? 50 : 20); if(e.isBoss) { playSound('levelup'); shake = 20; entities.forEach(ent => { if(Math.hypot(ent.x - e.x, ent.y - e.y) < 800 && !ent.isBoss) ent.gainXp(e.xp); }); } if (e.isPlayer) { gameActive = false; document.getElementById("death-screen").style.display = "flex"; document.getElementById("finalScore").innerText = "Skor: " + player.score; document.getElementById("class-menu").style.display = "none"; } else { entities.splice(i, 1); } } } // Kutu Güncelleme ve Temas Hasarı Sistemi for(let i = boxes.length - 1; i >= 0; i--) { let b = boxes[i]; b.ang += b.rot; for(let e of entities) { let dist = Math.hypot(e.x - b.x, e.y - b.y); if (dist < e.radius + b.size) { e.hp -= 0.4; b.hp -= 0.6; if(e.isPlayer) { shake = 2; playSound('hit'); } spawnParticles(e.x, e.y, b.color, 1); let angle = Math.atan2(e.y - b.y, e.x - b.x); e.vx += Math.cos(angle) * 0.6; e.vy += Math.sin(angle) * 0.6; if (b.hp <= 0) { e.gainXp(b.xp); boxes.splice(i, 1); spawnBoxes(1); break; } } } } // Mermi Güncelleme, Menzil Süresi ve Çarpışmalar for(let i=bullets.length-1; i>=0; i--) { let b = bullets[i]; b.x += b.vx; b.y += b.vy; b.life--; let hit = false; if(b.x < 0 || b.x > WORLD_SIZE || b.y < 0 || b.y > WORLD_SIZE || b.life <= 0) hit = true; if(!hit) { for(let j=0; j<entities.length; j++) { let e = entities[j]; if(b.owner !== e.id && Math.hypot(b.x - e.x, b.y - e.y) < b.radius + e.radius) { e.hp -= b.damage; hit = true; if(e.isPlayer) { playSound('hit'); shake = 5; } spawnParticles(b.x, b.y, e.color, 5); if(e.hp <= 0) { let killer = entities.find(ent => ent.id === b.owner); if(killer) killer.gainXp(Math.max(100, e.score/2)); } break; } } } if(!hit) { for(let j=boxes.length-1; j>=0; j--) { let box = boxes[j]; if(Math.hypot(b.x - box.x, b.y - box.y) < b.radius + box.size) { box.hp -= b.damage; hit = true; spawnParticles(b.x, b.y, box.color, 3); if(box.hp <= 0) { let killer = entities.find(ent => ent.id === b.owner); if(killer) killer.gainXp(box.xp); boxes.splice(j, 1); spawnBoxes(1); } break; } } } if(hit) bullets.splice(i, 1); } for(let i=particles.length-1; i>=0; i--) { let p = particles[i]; p.x += p.vx; p.y += p.vy; p.alpha -= p.decay; if(p.alpha <= 0) particles.splice(i, 1); } if(gameActive) { document.getElementById("scoreDisplay").innerText = "Skor: " + player.score; document.getElementById("levelDisplay").innerText = "Seviye: " + player.level + (player.tankClass !== 'base' ? ` (${player.tankClass.toUpperCase()})` : ''); document.getElementById("hp-bar").style.width = Math.max(0, (player.hp/player.maxHp)*100) + "%"; document.getElementById("hp-text").innerText = Math.round(Math.max(0, player.hp)) + "/" + player.maxHp; document.getElementById("xp-bar").style.width = Math.max(0, (player.xp/player.nextXp)*100) + "%"; document.getElementById("xp-text").innerText = "XP: " + Math.round(player.xp) + "/" + player.nextXp; } } function draw() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.save(); let sx = (Math.random()-0.5)*shake; let sy = (Math.random()-0.5)*shake; ctx.translate(-camera.x + sx, -camera.y + sy); ctx.strokeStyle = "#b8b8b8"; ctx.lineWidth = 1; let gridSize = 50; let startX = Math.floor(camera.x / gridSize) * gridSize; let startY = Math.floor(camera.y / gridSize) * gridSize; for(let x=startX; x<camera.x+canvas.width+gridSize; x+=gridSize) { if(x>=0 && x<=WORLD_SIZE) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke(); } } for(let y=startY; y<camera.y+canvas.height+gridSize; y+=gridSize) { if(y>=0 && y<=WORLD_SIZE) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke(); } } ctx.strokeStyle = "#f33c3c"; ctx.lineWidth = 10; ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE); swamps.forEach(s => { ctx.fillStyle = "rgba(40, 100, 40, 0.4)"; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill(); }); boxes.forEach(b => { ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.ang); ctx.fillStyle = b.color; ctx.strokeStyle = "#333"; ctx.lineWidth = 3; ctx.beginPath(); if(b.sides===4) ctx.rect(-b.size, -b.size, b.size*2, b.size*2); else { for(let i=0; i<b.sides; i++) { ctx.lineTo(b.size * 1.2 * Math.cos(i*2*Math.PI/b.sides), b.size * 1.2 * Math.sin(i*2*Math.PI/b.sides)); } } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore(); if(b.hp < b.maxHp) { ctx.fillStyle="#555"; ctx.fillRect(b.x-b.size, b.y-b.size-15, b.size*2, 5); ctx.fillStyle="#85e37d"; ctx.fillRect(b.x-b.size, b.y-b.size-15, (b.hp/b.maxHp)*(b.size*2), 5); } }); particles.forEach(p => { ctx.globalAlpha = p.alpha; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI*2); ctx.fill(); }); ctx.globalAlpha = 1; bullets.forEach(b => { ctx.fillStyle = b.color; ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill(); ctx.stroke(); }); entities.forEach(e => e.draw()); ctx.restore(); } function loop() { update(); draw(); requestAnimationFrame(loop); } loop(); </script></body></html>
