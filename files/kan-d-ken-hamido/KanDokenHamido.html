﻿// ===== DÜNYA MODÜLÜ - DENGE OPTİMİZASYON =====
const World = {
    scene: null,
    spawnRadius: 80,  // Sis nedeniyle kısaltıldı

    init(scene) {
        this.scene = scene;
        
        if (typeof ChunkSystem !== 'undefined') ChunkSystem.init(scene);
        if (typeof Instancing !== 'undefined') Instancing.init(scene);
        
        this.createSky();
        this.createFloor();
        this.createWalls();
        this.createLights();
        this.createInstancedEnvironment();
        this.createFog();
        this.createDistantSilhouettes();
    },

    // 🌌 GRADIENT SKY (güzel görünüm)
    createSky() {
        const skyColor = new THREE.Color(0x3a4a5a);
        this.scene.background = skyColor;
        
        const skyGeo = new THREE.SphereGeometry(400, 24, 16);
        const skyMat = new THREE.ShaderMaterial({
            side: THREE.BackSide,
            uniforms: {
                topColor: { value: new THREE.Color(0x1a2a3a) },
                midColor: { value: new THREE.Color(0x5a6a7a) },
                bottomColor: { value: new THREE.Color(0x8a9aa5) },
                offset: { value: 100 },
                exponent: { value: 0.6 }
            },
            vertexShader: `
                varying vec3 vWorldPosition;
                void main() {
                    vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                    vWorldPosition = worldPosition.xyz;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform vec3 topColor;
                uniform vec3 midColor;
                uniform vec3 bottomColor;
                uniform float offset;
                uniform float exponent;
                varying vec3 vWorldPosition;
                void main() {
                    float h = normalize(vWorldPosition + offset).y;
                    vec3 color;
                    if (h > 0.3) {
                        color = mix(midColor, topColor, pow((h - 0.3) / 0.7, exponent));
                    } else {
                        color = mix(bottomColor, midColor, pow(max(h + 0.2, 0.0) / 0.5, exponent));
                    }
                    gl_FragColor = vec4(color, 1.0);
                }
            `,
            fog: false
        });
        this.scene.add(new THREE.Mesh(skyGeo, skyMat));
    },

    // 🌫️ YOĞUN SİS (uzağı göremezsin)
    createFog() {
        // FogExp2 - yoğun sis (üstel)
        const fogColor = new THREE.Color(0x6a7a85);
        this.scene.fog = new THREE.FogExp2(fogColor, 0.0);
        
        // Sis rengini sky ile uyumlu yap
        this.scene.background = fogColor;
    },

    // 🌱 ZEMİN (canvas texture ile güzel ama hafif)
    createFloor() {
        const geo = new THREE.PlaneGeometry(300, 300);
        
        // Canvas texture (daha hafif)
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        
        // Çim/toprak
        ctx.fillStyle = '#3a4a2a';
        ctx.fillRect(0, 0, 256, 256);
        
        // Yeşil benekler
        for (let i = 0; i < 3000; i++) {
            const x = Math.random() * 256;
            const y = Math.random() * 256;
            const r = 40 + Math.random() * 30;
            const g = 60 + Math.random() * 40;
            const b = 30 + Math.random() * 20;
            ctx.fillStyle = `rgba(${r},${g},${b},${Math.random() * 0.6})`;
            ctx.fillRect(x, y, 2 + Math.random() * 3, 2 + Math.random() * 3);
        }
        
        // Toprak yamaları
        for (let i = 0; i < 10; i++) {
            ctx.fillStyle = `rgba(60, 45, 30, ${Math.random() * 0.3})`;
            ctx.beginPath();
            ctx.arc(Math.random() * 256, Math.random() * 256, Math.random() * 30 + 10, 0, Math.PI * 2);
            ctx.fill();
        }
        
        const texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(20, 20);
        texture.anisotropy = 4;  // 16 → 4 (perf)
        
        const mat = new THREE.MeshStandardMaterial({ 
            map: texture,
            color: 0xffffff,
            roughness: 0.95,
            metalness: 0.02
        });
        
        const floor = new THREE.Mesh(geo, mat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        this.scene.add(floor);
    },

    createWalls() {
        const wallMat = new THREE.MeshStandardMaterial({
            color: 0x5a5a4a,
            roughness: 0.9,
            metalness: 0.05
        });
        const size = 140;
        const height = 15;

        const walls = [
            { pos: [0, height/2, -size], size: [size*2, height, 3] },
            { pos: [0, height/2, size], size: [size*2, height, 3] },
            { pos: [-size, height/2, 0], size: [3, height, size*2] },
            { pos: [size, height/2, 0], size: [3, height, size*2] }
        ];

        walls.forEach(w => {
            const geo = new THREE.BoxGeometry(...w.size);
            const mesh = new THREE.Mesh(geo, wallMat);
            mesh.position.set(...w.pos);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            this.scene.add(mesh);
        });
    },

    // 🌳 INSTANCED ORTAM (güzel + performanslı)

        // ===== AĞAÇLAR =====
        // Gövde - TÜM ağaçlar için 1 draw call

        for (let i = 0; i < 2; i++) {

        // ===== DOĞAL KAYNAKLAR — Tahta, Taş, Çakıl, Kütük =====
        this.spawnNaturalResources();

        console.log('🌳 Instanced ortam hazır (200+ obje, 5 draw call)');
    },

    // Odun yığını (ayrı mesh - tutulabilir)
    createWoodPile(x, z) {
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x4a3018, roughness: 0.9 });
        const woodMatEnd = new THREE.MeshStandardMaterial({ color: 0x6a4a28, roughness: 0.85 });

        const count = 3;
        
        for (let i = 0; i < count; i++) {
            const length = 1.2;
            const radius = 0.1;
            
            const log = new THREE.Mesh(
                new THREE.CylinderGeometry(radius, radius, length, 6),
                [woodMat, woodMatEnd, woodMatEnd]
            );
            
            log.rotation.z = Math.PI / 2;
            log.rotation.y = Math.random() * Math.PI;
            
            const layer = Math.floor(i / 2);
            const posInLayer = i % 2;
            const logX = x + (posInLayer - 0.5) * 0.3;
            const logY = radius + layer * radius * 2 + 0.05;
            const logZ = z;
            
            log.position.set(logX, logY, logZ);
            log.castShadow = true;
            this.scene.add(log);

            if (typeof Pickup !== 'undefined' && Pickup.register) {
                Pickup.register(log, 'log', 2);
            }
        }
    },

    // 💡 IŞIKLAR
    createLights() {
        // Ambient - parlak
        const ambient = new THREE.AmbientLight(0xffffff, 0.5);
        this.scene.add(ambient);

        // Ana güneş (gölgeli ama hafif)
        const sun = new THREE.DirectionalLight(0xfff5e0, 1.4);
        sun.position.set(60, 80, 40);
        sun.castShadow = false;
        sun.shadow.mapSize.width = 512;  // 2048 → 1024
        sun.shadow.mapSize.height = 512;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 80;
        sun.shadow.bias = -0.0008;
        this.scene.add(sun);
        World.sunLight = sun;

        // Hemisphere (doğal)
        const hemi = new THREE.HemisphereLight(0x9ac0e0, 0x4a4a2a, 0.6);
        this.scene.add(hemi);
        // Ek ışık: rim light (kenar aydınlatma)
        const rim = new THREE.DirectionalLight(0x88aaff, 0.4);
        rim.position.set(-40, 30, -40);
        this.scene.add(rim);
    },

    createDistantSilhouettes() {
        // Sis içinde görünen silüetler
        const silhouetteMat = new THREE.MeshBasicMaterial({ 
            color: 0x1a2028, 
            transparent: true, 
            opacity: 0.7,
            fog: true
        });

        for (let i = 0; i < 8; i++) {
            const angle = (i / 8) * Math.PI * 2;
            const radius = 90 + Math.random() * 40;
            const height = 15 + Math.random() * 20;
            
            const geo = new THREE.BoxGeometry(6, height, 6);
            const mesh = new THREE.Mesh(geo, silhouetteMat);
            mesh.position.set(
                Math.cos(angle) * radius,
                height / 2,
                Math.sin(angle) * radius
            );
            this.scene.add(mesh);
        }
    }
};

﻿// ===== SİLAH MERMİSİ / BOMBA DÜŞÜRME =====
const WeaponDrops = {
    scene: null,
    camera: null,
    drops: [],
    ammoChance: 0.20,      // %20 mermi
    grenadeChance: 0.05,   // %5 bomba
    ammoAmount: { pistol: 15, rifle: 30, shotgun: 6 },
    pickupRange: 3.5,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;
        console.log('🔧 WeaponDrops init');
    },

    tryDrop(position) {
        const r = Math.random();
        if (r < this.grenadeChance) {
            this.spawn(position, 'grenade');
        } else if (r < this.grenadeChance + this.ammoChance) {
            // Rastgele silah tipi
            const types = ['pistol', 'rifle', 'shotgun'];
            const type = types[Math.floor(Math.random() * types.length)];
            this.spawn(position, 'ammo', type);
        }
    },

    spawn(position, kind, weaponType) {
        const group = new THREE.Group();

        if (kind === 'ammo') {
            // Mermi kutusu
            const mat = new THREE.MeshStandardMaterial({
                color: 0xffcc00, emissive: 0x664400, emissiveIntensity: 0.5,
                roughness: 0.4, metalness: 0.5
            });
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.2, 0.4), mat);
            group.add(box);
            const labelMat = new THREE.MeshBasicMaterial({ color: 0x222222 });
            const label = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.02, 0.3), labelMat);
            label.position.y = 0.11;
            group.add(label);
        } else if (kind === 'grenade') {
            // Bomba
            const mat = new THREE.MeshStandardMaterial({
                color: 0x2a3a1a, emissive: 0x330000, emissiveIntensity: 0.6,
                roughness: 0.7
            });
            const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.18, 10, 8), mat);
            group.add(sphere);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9 });
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.01, 6, 12), ringMat);
            ring.position.y = 0.15;
            ring.rotation.x = Math.PI / 2;
            group.add(ring);
        }

        group.position.set(
            position.x + (Math.random() - 0.5) * 1.5,
            0.5,
            position.z + (Math.random() - 0.5) * 1.5
        );
        this.scene.add(group);

        this.drops.push({
            mesh: group,
            kind: kind,
            weaponType: weaponType || null,
            spawnTime: performance.now(),
            maxLife: 30000,
            phase: Math.random() * Math.PI * 2
        });

        Effects.addKillFeed(
            kind === 'grenade' ? '💣 Bomba düştü!' :
            ('🔫 ' + (weaponType === 'pistol' ? 'Tabanca' : weaponType === 'rifle' ? 'Taramalı' : 'Pompalı') + ' mermisi!'),
            '#ffcc00'
        );
    },

    update(dt) {
        const now = performance.now();
        const camPos = this.camera ? this.camera.position : Player.position;

        for (let i = this.drops.length - 1; i >= 0; i--) {
            const d = this.drops[i];
            if (!d.mesh) { this.drops.splice(i, 1); continue; }

            // Dönme + zıplama
            d.mesh.rotation.y += dt * 2;
            d.mesh.position.y = 0.4 + Math.sin(now * 0.003 + d.phase) * 0.15;

            // Topla
            const dist = d.mesh.position.distanceTo(camPos);
            if (dist < this.pickupRange) {
                this.pickup(d);
                this.scene.remove(d.mesh);
                this.drops.splice(i, 1);
                continue;
            }

            if (now - d.spawnTime > d.maxLife) {
                this.scene.remove(d.mesh);
                this.drops.splice(i, 1);
            }
        }
    },

    pickup(d) {
        if (d.kind === 'grenade') {
            // El bombası: cooldown'u hemen bitir
            if (typeof Weapons !== 'undefined') {
                const grenDef = Weapons.definitions.find(x => x.isGrenade);
                if (grenDef) {
                    grenDef.ammo = 1;
                    if (Weapons.current && Weapons.current.isGrenade) {
                        const ammoEl = document.getElementById('ammo');
                        if (ammoEl) {
                            ammoEl.textContent = '1';
                            ammoEl.classList.remove('low');
                        }
                    }
                }
            }
            Effects.addKillFeed('💣 Bomba alındı!', '#0f0');
        } else if (d.kind === 'ammo') {
            // Mermi: reserveAmmo yok, doğrudan current silahın ammo'suna ekle
            if (typeof Weapons !== 'undefined') {
                const def = Weapons.definitions.find(x => x.id === d.weaponType);
                if (def) {
                    const add = this.ammoAmount[d.weaponType] || 10;
                    def.reserveAmmo = (def.reserveAmmo || 0) + add;
                    // Eğer aktif silah buysa HUD güncelle
                    if (Weapons.current && Weapons.current.id === d.weaponType) {
                        const ammoEl = document.getElementById('ammo');
                        if (ammoEl) ammoEl.textContent = def.ammo;
                    }
                    Effects.addKillFeed('🔫 +' + add + ' ' + def.name + ' mermisi', '#0f0');
                }
            }
        }
        if (typeof Audio !== 'undefined') Audio.playReload();
    },

    reset() {
        this.drops.forEach(d => { if (d.mesh) this.scene.remove(d.mesh); });
        this.drops = [];
    }
};

const Weapons = {
    camera: null,
    scene: null,

    current: null,
    mesh: null,
    muzzlePoint: null,
    models: {},
    reloading: false,
    lastShot: 0,
    recoilOffset: 0,
    switching: false,
    isFiring: false,
    activeGrenades: [],
    isBareHand: true,
    adsActive: false,
    originalFov: 75,
    adsFov: 45,

    definitions: [
        { id: 'hand', name: 'BOŞ EL', icon: '✋', ammo: 999, magSize: 999, damage: 8, fireRate: 500, spread: 0, pellets: 0, auto: false, range: 2.5, reloadTime: 0, recoilAmount: 0.01, isMelee: true, meleeRange: 2.5, meleeDamage: 15 },
        { id: 'pistol', name: 'TABANCA', icon: '🔫', ammo: 15, magSize: 15, reserveAmmo: 60, damage: 40, fireRate: 250, spread: 0.005, pellets: 1, auto: false, range: 100, reloadTime: 1200, recoilAmount: 0.012, sound: 'pistol' },
        { id: 'rifle', name: 'TARAMALI TÜFEK', icon: '🔫🔫', ammo: 40, magSize: 40, reserveAmmo: 160, damage: 22, fireRate: 70, spread: 0.025, pellets: 1, auto: true, range: 100, reloadTime: 2000, recoilAmount: 0.008, sound: 'rifle' },
        { id: 'shotgun', name: 'POMPALI', icon: '💥', ammo: 8, magSize: 8, reserveAmmo: 32, damage: 35, fireRate: 700, spread: 0.02, pellets: 10, auto: false, range: 60, reloadTime: 2500, recoilAmount: 0.035, sound: 'shotgun', falloff: true, falloffStart: 5, falloffEnd: 45, falloffMin: 0.08 },
        { id: 'grenade', name: 'EL BOMBASI', icon: '💣', ammo: 1, magSize: 1, damage: 0, fireRate: 800, spread: 0, pellets: 0, auto: false, range: 0, reloadTime: 15000, recoilAmount: 0.05, isGrenade: true, explosionRadius: 8, explosionDamage: 200 }
    ],

    init(camera, scene) {
        this.camera = camera;
        this.scene = scene;

        this.definitions.forEach(def => {
            const model = this.createModel(def);
            this.models[def.id] = model;
            model.group.visible = false;
            camera.add(model.group);
        });

        this.currentIndex = 0;
        this.equip(0, true);

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) this.startShooting();
            if (e.button === 2) {
                this.adsActive = true;
                if (Game.camera) { Game.camera.fov = this.adsFov; Game.camera.updateProjectionMatrix(); }
            }
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) this.stopShooting();
            if (e.button === 2) {
                this.adsActive = false;
                if (Game.camera) { Game.camera.fov = this.originalFov; Game.camera.updateProjectionMatrix(); }
            }
        });
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') this.reload();
            if (e.code === 'KeyE') this.nextWeapon();
            if (e.code === 'KeyQ') this.prevWeapon();
            if (e.code === 'Digit1') this.equip(0);
            if (e.code === 'Digit2') this.equip(1);
            if (e.code === 'Digit3') this.equip(2);
            if (e.code === 'Digit4') this.equip(3);
            if (e.code === 'Digit5') this.equip(4);
        });

        this.fireLoop();
    },

    createModel(def) {
        const group = new THREE.Group();
        group.position.set(0.35, -0.35, -0.5);

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6, metalness: 0.5 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.35, metalness: 0.85 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x3a2010, roughness: 0.8 });
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xdcb38a, roughness: 0.75 });
        let muzzleZ = -0.95;

        if (def.id === 'hand') {
            const lHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.15), skinMat);
            lHand.position.set(-0.15, -0.05, -0.35); group.add(lHand);
            const rHand = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.15), skinMat);
            rHand.position.set(0.15, -0.05, -0.35); group.add(rHand);
            muzzleZ = -0.5;
        } else if (def.id === 'pistol') {
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.12, 0.28), bodyMat);
            body.position.set(0, 0, -0.15); group.add(body);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.22, 8), metalMat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.03, -0.38); group.add(barrel);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.14, 0.07), woodMat);
            grip.position.set(0, -0.11, 0); grip.rotation.x = -0.25; group.add(grip);
            muzzleZ = -0.5;
        } else if (def.id === 'rifle') {
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.11, 0.6), bodyMat);
            body.position.set(0, 0, -0.3); group.add(body);
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.55, 12), metalMat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.02, -0.85); group.add(barrel);
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.22, 0.09), bodyMat);
            mag.position.set(0, -0.14, -0.25); group.add(mag);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.055, 0.15, 0.08), woodMat);
            grip.position.set(0, -0.11, -0.05); grip.rotation.x = -0.2; group.add(grip);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.1, 0.2), woodMat);

            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.7, 12), metalMat);
            barrel.rotation.x = Math.PI / 2; barrel.position.set(0, 0.04, -0.85); group.add(barrel);
            const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.5, 10), metalMat);
            tube.rotation.x = Math.PI / 2; tube.position.set(0, -0.06, -0.75); group.add(tube);
            const pump = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.08, 0.22), woodMat);
            pump.position.set(0, -0.06, -0.7); group.add(pump);
            const grip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.16, 0.09), woodMat);
            grip.position.set(0, -0.13, -0.05); grip.rotation.x = -0.2; group.add(grip);
            const stock = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.11, 0.22), woodMat);
            stock.position.set(0, -0.03, 0.15); group.add(stock);
            muzzleZ = -1.2;
        } else if (def.id === 'grenade') {
            const body = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), new THREE.MeshStandardMaterial({ color: 0x2a3a1a, roughness: 0.7 }));
            body.position.set(0, -0.05, -0.15); group.add(body);
            const ring = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.005, 6, 12), metalMat);
            ring.position.set(0, 0.03, -0.15); ring.rotation.x = Math.PI / 2; group.add(ring);
            muzzleZ = -0.15;
        }

        const muzzlePoint = new THREE.Object3D();
        muzzlePoint.position.set(0, 0.02, muzzleZ);
        group.add(muzzlePoint);
        return { group, muzzlePoint };
    },

    equip(index, silent) {
        if (this.switching) return;
        if (index === this.currentIndex && this.current) return;
        if (index < 0 || index >= this.definitions.length) return;

        if (this.current) this.models[this.current.id].group.visible = false;
        this.currentIndex = index;
        this.current = this.definitions[index];
        this.mesh = this.models[this.current.id].group;
        this.muzzlePoint = this.models[this.current.id].muzzlePoint;
        this.mesh.visible = true;
        this.isBareHand = this.current.id === 'hand';
        this.isFiring = false;
        this.reloading = false;

        const ammoEl = document.getElementById('ammo');
        const magEl = document.getElementById('mag');
        const nameEl = document.getElementById('weapon-name');
        if (ammoEl) ammoEl.textContent = this.current.isMelee ? '∞' : this.current.ammo;
        if (magEl) magEl.textContent = this.current.isMelee ? '' : (this.current.reserveAmmo || 0);
        if (magEl) magEl.textContent = this.current.isMelee ? '' : this.current.magSize;
        if (nameEl) nameEl.textContent = this.current.icon + ' ' + this.current.name;

        if (this.current.isGrenade && this.current.ammo <= 0) {
            if (ammoEl) ammoEl.classList.add('low');
        } else {
            if (ammoEl) ammoEl.classList.remove('low');
        }

        if (!silent) {
            this.switching = true;
            const startY = -0.35, downY = -0.7;
            let t = 0;
            const anim = () => {
                t += 0.08;
                if (t < 0.5) this.mesh.position.y = startY - (startY - downY) * (t * 2);
                else if (t < 1) this.mesh.position.y = downY + (startY - downY) * ((t - 0.5) * 2);
                else { this.mesh.position.y = startY; this.switching = false; return; }
                requestAnimationFrame(anim);
            };
            anim();
        }
    },

    nextWeapon() { this.equip((this.currentIndex + 1) % this.definitions.length); },
    prevWeapon() { this.equip((this.currentIndex - 1 + this.definitions.length) % this.definitions.length); },

    startShooting() {
        if (this.switching) return;
        if (this.current && this.current.isMelee) {
            if (typeof Pickup !== 'undefined' && Pickup.heldObject) { Pickup.throw(); return; }
            this.melee();
            return;
        }
        this.isFiring = true;
        if (this.current && !this.current.auto) this.tryShoot();
    },

    stopShooting() { this.isFiring = false; },

    melee() {
        const now = performance.now();
        if (now - this.lastShot < this.current.fireRate) return;
        this.lastShot = now;
        if (Audio.playMelee) Audio.playMelee();
        Effects.shake(0.03);
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        raycaster.far = this.current.meleeRange;
        const targets = Enemy.list.map(e => e.mesh).filter(m => m);
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
            let obj = hits[0].object;
            while (obj.parent && !obj.userData.isEnemy) obj = obj.parent;
            if (obj.userData.isEnemy) {
                const enemy = Enemy.list.find(e => e.mesh === obj);
                if (enemy) Enemy.damage(enemy, this.current.meleeDamage, hits[0].point, 1);
            }
        }
    },

    fireLoop() {
        const loop = () => {
            if (this.isFiring && this.current && this.current.auto && !this.reloading && !this.switching) {
                this.tryShoot();
            }
            requestAnimationFrame(loop);
        };
        requestAnimationFrame(loop);
    },

    tryShoot() {
        if (!this.current) return;
        if (this.current.isMelee) return;
        if (this.reloading || this.switching) return;

        const now = performance.now();
        if (now - this.lastShot < this.current.fireRate) return;

        if (this.current.isGrenade) {
            if (this.current.ammo <= 0) {
                Effects.addKillFeed('💣 Bomba hazır değil!', '#f80');
                return;
            }
        } else if (this.current.ammo <= 0) {
            this.reload();
            return;
        }

        this.lastShot = now;
        this.current.ammo--;

        const ammoEl = document.getElementById('ammo');
        if (ammoEl) {
            ammoEl.textContent = this.current.ammo;
            if (this.current.ammo <= Math.ceil(this.current.magSize * 0.2)) ammoEl.classList.add('low');
            else ammoEl.classList.remove('low');
        }

        if (Audio.playWeapon) Audio.playWeapon(this.current.sound);
        else Audio.playShoot();

        Effects.shake(this.current.recoilAmount * 15);

        const muzzleWorldPos = new THREE.Vector3();
        this.muzzlePoint.getWorldPosition(muzzleWorldPos);

        if (this.current.isGrenade) {
            this.throwGrenade(muzzleWorldPos);
            this.startGrenadeCooldown();
            return;
        }

        Effects.muzzleFlash(muzzleWorldPos);
        Particles.muzzleSmoke(muzzleWorldPos);

        this.recoilOffset = 1;
        Player.pitch += this.current.recoilAmount;
        setTimeout(() => Player.pitch -= this.current.recoilAmount * 0.85, 50);

        const ch = document.getElementById('crosshair');
        if (ch) {
            ch.classList.remove('recoil');
            void ch.offsetWidth;
            ch.classList.add('recoil');
        }

        for (let p = 0; p < this.current.pellets; p++) this.firePellet(muzzleWorldPos, p);
    },

    firePellet(muzzleWorldPos, pelletIndex) {
        const raycaster = new THREE.Raycaster();
        raycaster.setFromCamera(new THREE.Vector2(0, 0), this.camera);
        raycaster.far = this.current.range;
        const spread = this.current.spread;
        if (spread > 0) {
            const spreadX = (Math.random() - 0.5) * 2 * spread;
            const spreadY = (Math.random() - 0.5) * 2 * spread;
            const dir = raycaster.ray.direction.clone();
            dir.x += spreadX; dir.y += spreadY; dir.normalize();
            raycaster.ray.direction.copy(dir);
        }
        const targets = Enemy.list.map(e => e.mesh).filter(m => m);
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
            let obj = hits[0].object;
            while (obj.parent && !obj.userData.isEnemy) obj = obj.parent;
            if (obj.userData.isEnemy) {
                const enemy = Enemy.list.find(e => e.mesh === obj);
                if (enemy) {
                    let damageMult = 1.0;
                    if (this.current.falloff) {
                        const dist = hits[0].distance;
                        if (dist <= this.current.falloffStart) damageMult = 1.0;
                        else if (dist >= this.current.falloffEnd) damageMult = this.current.falloffMin;
                        else {
                            const t = (dist - this.current.falloffStart) / (this.current.falloffEnd - this.current.falloffStart);
                            damageMult = 1.0 - t * (1.0 - this.current.falloffMin);
                        }
                    }
                    Enemy.damage(enemy, this.current.damage * damageMult, hits[0].point, 1);
                }
            }
        }
    },

    throwGrenade(muzzleWorldPos) {
        const dir = new THREE.Vector3();
        this.camera.getWorldDirection(dir);
        const grenade = {
            mesh: new THREE.Mesh(
                new THREE.SphereGeometry(0.12, 10, 8),
                new THREE.MeshStandardMaterial({ color: 0x2a3a1a, roughness: 0.7, metalness: 0.3 })
            ),
            velocity: dir.clone().multiplyScalar(22),
            gravity: -22,
            life: 0,
            fuseTime: 2.5,
            radius: this.current.explosionRadius,
            damage: this.current.explosionDamage
        };
        grenade.mesh.position.copy(muzzleWorldPos);
        grenade.mesh.position.y += 0.3;
        this.scene.add(grenade.mesh);
        this.activeGrenades.push(grenade);
        Effects.addKillFeed('💣 Bomba atıldı!', '#f80');
    },

    updateGrenades(dt) {
        for (let i = this.activeGrenades.length - 1; i >= 0; i--) {
            const g = this.activeGrenades[i];
            g.life += dt;
            g.velocity.y += g.gravity * dt;
            g.mesh.position.addScaledVector(g.velocity, dt);
            if (g.mesh.position.y < 0.12) {
                g.mesh.position.y = 0.12;
                if (g.velocity.y < -1) {
                    g.velocity.y *= -0.3; g.velocity.x *= 0.7; g.velocity.z *= 0.7;
                } else g.velocity.y = 0;
            }
            if (g.life >= g.fuseTime) {
                this.explodeGrenade(g);
                this.scene.remove(g.mesh);
                this.activeGrenades.splice(i, 1);
            }
        }
    },

    explodeGrenade(g) {
        const pos = g.mesh.position.clone();
        const radius = g.radius * 2;   // 2x büyük

        // Görsel MEGA
        Particles.explosion(pos, radius * 1.5);
        try {
            Particles.burst(pos, {
                count: 100, color: 0xff4400, size: 0.5, spread: 2.5,
                speed: 22, gravity: -8, life: 1.5, additive: true
            });
            Particles.burst(pos, {
                count: 50, color: 0xffaa00, size: 0.4, spread: 2.0,
                speed: 16, gravity: -6, life: 1.3, additive: true
            });
        } catch (e) {}

        Effects.shake(1.3);

        const flash = new THREE.PointLight(0xffaa00, 25, 40);
        flash.position.copy(pos);
        this.scene.add(flash);
        let t = 0;
        const fadeFlash = () => {
            t += 0.05;
            flash.intensity = Math.max(0, 25 - t * 50);
            if (t < 0.6) requestAnimationFrame(fadeFlash);
            else this.scene.remove(flash);
        };
        fadeFlash();

        if (Audio.playExplosion) Audio.playExplosion();

        // FİZİK
        if (typeof PhysicsBridge !== 'undefined' && PhysicsBridge.applyExplosion) {
            PhysicsBridge.applyExplosion(pos.x, pos.y, pos.z, 25, radius);
        }

        // ZOMBİLERİ ANINDA ÖLDÜR
        for (let i = Enemy.list.length - 1; i >= 0; i--) {
            const e = Enemy.list[i];
            const dx = e.mesh.position.x - pos.x;
            const dz = e.mesh.position.z - pos.z;
            const d2 = dx*dx + dz*dz;
            if (d2 < radius * radius) {
                Enemy.kill(e, pos, { zone: 'body' });
            }
        }

        // PLAYER hasar + savur
        const dx = Player.position.x - pos.x;
        const dz = Player.position.z - pos.z;
        const pd = Math.sqrt(dx*dx + dz*dz);
        if (pd < radius) {
            const falloff = 1 - (pd / radius);
            const dmg = 30 * falloff;
            if (Player.takeDamage(dmg)) Game.gameOver();

            const pb = PhysicsBridge.getPlayerBody();
            if (pb) {
                const d = pd || 0.01;
                const nx = dx / d, nz = dz / d;
                pb.vx += nx * 18 * falloff;
                pb.vz += nz * 18 * falloff;
                pb.vy += 8 * falloff;
            }
        }
    },

    startGrenadeCooldown() {
        const grenadeDef = this.definitions.find(d => d.isGrenade);
        if (!grenadeDef) return;
        grenadeDef.ammo = 0;
        let remaining = 15;
        if (this.current.isGrenade) {
            const ammoEl = document.getElementById('ammo');
            if (ammoEl) { ammoEl.textContent = remaining; ammoEl.classList.add('low'); }
        }
        const tick = setInterval(() => {
            remaining--;
            if (this.current && this.current.isGrenade) {
                const ammoEl = document.getElementById('ammo');
                if (ammoEl) ammoEl.textContent = remaining;
            }
            if (remaining <= 0) {
                clearInterval(tick);
                grenadeDef.ammo = 1;
                if (this.current && this.current.isGrenade) {
                    const ammoEl = document.getElementById('ammo');
                    if (ammoEl) { ammoEl.textContent = 1; ammoEl.classList.remove('low'); }
                }
                Effects.addKillFeed('💣 Bomba hazır!', '#0f0');
            }
        }, 1000);
    },

    reload() {
        if (!this.current) return;
        if (this.reloading) return;
        if (this.current.isGrenade) return;
        if (this.current.isMelee) return;
        if (this.current.ammo === this.current.magSize) return;
        if ((this.current.reserveAmmo || 0) <= 0) {
            Effects.addKillFeed('Mermi yok!', '#f44');
            return;
        }

        this.reloading = true;
        Audio.playReload();
        Effects.addKillFeed('Sarjor degistiriliyor...', '#0ff');

        let t = 0;
        const anim = () => {
            t += 0.03;
            this.mesh.rotation.x = Math.sin(t * Math.PI) * 0.5;
            this.mesh.position.y = -0.35 - Math.sin(t * Math.PI) * 0.2;
            if (t < 1) requestAnimationFrame(anim);
            else { this.mesh.rotation.x = 0; this.mesh.position.y = -0.35; }
        };
        anim();

        setTimeout(() => {
            const need = this.current.magSize - this.current.ammo;
            const take = Math.min(need, this.current.reserveAmmo || 0);
            this.current.ammo += take;
            this.current.reserveAmmo -= take;

            const ammoEl = document.getElementById('ammo');
            const magEl = document.getElementById('mag');
            if (ammoEl) {
                ammoEl.textContent = this.current.ammo;
                if (this.current.ammo <= Math.ceil(this.current.magSize * 0.2)) ammoEl.classList.add('low');
                else ammoEl.classList.remove('low');
            }
            if (magEl) magEl.textContent = this.current.reserveAmmo || 0;

            this.reloading = false;
        }, this.current.reloadTime);
    },

    update(dt) {
        if (!this.mesh) return;
        let swayX = 0, swayY = 0;
        if (PlayerBody.isMoving && Player.onGround) {
            const now = performance.now() * 0.001;
            const speed = Player.isSprinting ? 1.5 : 1;
            swayX = Math.sin(now * 8 * speed) * 0.015;
            swayY = Math.abs(Math.cos(now * 8 * speed)) * 0.01;
        }
        this.recoilOffset *= 0.85;
        if (!this.switching && !this.reloading) {
            this.mesh.position.x = 0.35 + swayX;
            this.mesh.position.y = -0.35 + swayY - this.recoilOffset * 0.05;
            this.mesh.position.z = -0.5 + this.recoilOffset * 0.1;
            this.mesh.rotation.x = this.recoilOffset * 0.3;
        }
        this.updateGrenades(dt);
    },

    reset() {
        this.definitions.forEach(def => {
            def.ammo = def.magSize;
            // Reserve'i tanımla
            if (def.id === 'pistol') def.reserveAmmo = 60;
            else if (def.id === 'rifle') def.reserveAmmo = 160;
            else if (def.id === 'shotgun') def.reserveAmmo = 32;
        });
        this.activeGrenades.forEach(g => this.scene.remove(g.mesh));
        this.activeGrenades = [];
        if (this.current) this.models[this.current.id].group.visible = false;
        this.currentIndex = 0;
        this.current = null;
        this.equip(0, true);
        this.reloading = false;
        this.switching = false;
        this.isFiring = false;
        this.lastShot = 0;
        this.recoilOffset = 0;
        this.isBareHand = true;
        const ammoEl = document.getElementById('ammo');
        if (ammoEl) ammoEl.classList.remove('low');
    }
};

﻿// ===== SG-PHY KÖPRÜSÜ — self-collision =====
const PhysicsBridge = {
    world: null,
    bodies: {},
    statics: [],
    meshMap: {},
    idCounter: 0,
    _inited: false,
    _playerInited: false,

    init() {
        if (this._inited) return;
        if (typeof phy === 'undefined') {
            console.error('❌ SG-PHY yüklenmedi');
            return;
        }
        this.world = phy.phy3.world3({ gravity: { x: 0, y: -22, z: 0 }, substeps: 1 });
        this._inited = true;
        console.log('🧱 PhysicsBridge hazır');
    },

    addStaticAABB(x, y, z, w, h, d) {
        this.statics.push({
            x: x, y: y, z: z,
            _w: w, _h: h, _d: d,
            w: w, h: h, d: d,
            minX: x - w/2, maxX: x + w/2,
            minY: y - h/2, maxY: y + h/2,
            minZ: z - d/2, maxZ: z + d/2,
            static: true,
            type: 'aabb'
        });
    },

    addTreeCollision(x, z, radius) {
        this.addStaticAABB(x, 2, z, radius * 2, 4, radius * 2);
    },

    addRockCollision(x, y, z, w, h, d) {
        this.addStaticAABB(x, y, z, w, h, d);
    },

    buildStaticWorld() {
        if (!this._inited) return;
        this.addStaticAABB(0, -0.5, 0, 300, 1, 300);
        this.addStaticAABB(0, 7.5, -140, 280, 15, 3);
        this.addStaticAABB(0, 7.5,  140, 280, 15, 3);
        this.addStaticAABB(-140, 7.5, 0, 3, 15, 280);
        this.addStaticAABB( 140, 7.5, 0, 3, 15, 280);
        console.log('🧱 Statik: ' + this.statics.length);
    },

    addPlayer(x, y, z) {
        if (!this._inited) return null;
        if (this.bodies['player']) return this.bodies['player'];
        const b = phy.phy3.body3({
            x: x, y: y, z: z,
            type: 'aabb',
            w: 0.9, h: 1.8, d: 0.9,
            mass: 70, restitution: 0.0
        });
        this.world.add(b);
        b._w = 0.9; b._h = 1.8; b._d = 0.9;
        this.bodies['player'] = b;
        this._playerInited = true;
        console.log('🧍 addPlayer: (' + x.toFixed(2) + ', ' + y.toFixed(2) + ', ' + z.toFixed(2) + ')');
        return b;
    },

    addEnemy(mesh, r, len, mass) {
        r = r || 0.4; len = len || 1.0; mass = mass || 60;
        const yOffset = 0.9;
        const b = phy.phy3.body3({
            x: mesh.position.x,
            y: mesh.position.y + yOffset,
            z: mesh.position.z,
            type: 'aabb',
            w: 0.8, h: 1.8, d: 0.8,
            mass: mass, restitution: 0.0
        });
        this.world.add(b);
        b._w = 0.8; b._h = 1.8; b._d = 0.8;
        const id = 'enemy_' + (this.idCounter++);
        this.bodies[id] = b;
        this.meshMap[id] = { mesh: mesh, yOffset: yOffset };
        mesh.userData.physicsId = id;
        return { id: id, body: b };
    },

    addRagdollPart(x, y, z, w, h, d, mass) {
        mass = mass || 5;
        const b = phy.phy3.body3({
            x: x, y: y, z: z,
            type: 'aabb',
            w: w, h: h, d: d,
            mass: mass, restitution: 0.15
        });
        this.world.add(b);
        b._w = w; b._h = h; b._d = d;
        const id = 'ragdoll_' + (this.idCounter++);
        this.bodies[id] = b;
        return { id: id, body: b };
    },

    remove(id) {
        const b = this.bodies[id];
        if (!b) return;
        try { this.world.remove(b); } catch (e) {}
        delete this.bodies[id];
        delete this.meshMap[id];
    },

    _getAABB(b) {
        const w = b._w !== undefined ? b._w : (b.w || 0.8);
        const h = b._h !== undefined ? b._h : (b.h || 1.8);
        const d = b._d !== undefined ? b._d : (b.d || 0.8);
        return {
            minX: b.x - w/2, maxX: b.x + w/2,
            minY: b.y - h/2, maxY: b.y + h/2,
            minZ: b.z - d/2, maxZ: b.z + d/2,
            w: w, h: h, d: d
        };
    },

    _resolve(b, stat) {
        const a = this._getAABB(b);
        const s = stat;
        if (a.maxX <= s.minX || a.minX >= s.maxX) return false;
        if (a.maxY <= s.minY || a.minY >= s.maxY) return false;
        if (a.maxZ <= s.minZ || a.minZ >= s.maxZ) return false;

        const oX = Math.min(a.maxX, s.maxX) - Math.max(a.minX, s.minX);
        const oY = Math.min(a.maxY, s.maxY) - Math.max(a.minY, s.minY);
        const oZ = Math.min(a.maxZ, s.maxZ) - Math.max(a.minZ, s.minZ);

        if (oY <= oX && oY <= oZ) {
            const cY = (s.minY + s.maxY) / 2;
            if (b.y > cY) {
                b.y = s.maxY + a.h/2;
                b.vy = 0;
                b._grounded = true;
                b.vx = (b.vx || 0) * 0.7;
                b.vz = (b.vz || 0) * 0.7;
            } else {
                b.y = s.minY - a.h/2;
                if (b.vy > 0) b.vy = 0;
            }
        } else if (oX <= oZ) {
            const cX = (s.minX + s.maxX) / 2;
            if (b.x > cX) b.x = s.maxX + a.w/2;
            else b.x = s.minX - a.w/2;
            b.vx = 0;
        } else {
            const cZ = (s.minZ + s.maxZ) / 2;
            if (b.z > cZ) b.z = s.maxZ + a.d/2;
            else b.z = s.minZ - a.d/2;
            b.vz = 0;
        }
        return true;
    },

    step(dt) {
        if (!this._inited) return;
        if (dt > 0.1) dt = 0.1;

        const dyn = [];
        for (const id in this.bodies) {
            const b = this.bodies[id];
            if (!b.static) dyn.push(b);
        }

        // 1) Entegrasyon
        for (const b of dyn) {
            b.vy = (b.vy || 0) + -22 * dt;
            if (b.vy < -20) b.vy = -20;
            if (b.vy > 20) b.vy = 20;
            b.x = (b.x || 0) + (b.vx || 0) * dt;
            b.y = (b.y || 0) + (b.vy || 0) * dt;
            b.z = (b.z || 0) + (b.vz || 0) * dt;
            b._grounded = false;
        }

        // 2) Statik collision
        for (const b of dyn) {
            for (let i = 0; i < this.statics.length; i++) {
                this._resolve(b, this.statics[i]);
            }
        }

        // 3) Grounded olanları DONDUR
        for (const b of dyn) {
            if (b._grounded) {
                b.vx = 0;
                b.vz = 0;
                b.vy = 0;
            }
        }

        // 4) Dinamik-dinamik itme (player ragdoll'u itemez, sadece ragdoll-ragdoll)
        for (let i = 0; i < dyn.length; i++) {
            for (let j = i + 1; j < dyn.length; j++) {
                const a = dyn[i], b = dyn[j];
                if (!a._w || !b._w) continue;
                // Player'ı atla (player hiçbir şeyi itemez — üstünden geçilir)
                if (a === this.bodies['player'] || b === this.bodies['player']) continue;
                const aBox = this._getAABB(a);
                const bBox = this._getAABB(b);
                if (aBox.maxX <= bBox.minX || aBox.minX >= bBox.maxX) continue;
                if (aBox.maxY <= bBox.minY || aBox.minY >= bBox.maxY) continue;
                if (aBox.maxZ <= bBox.minZ || aBox.minZ >= bBox.maxZ) continue;
                // Ragdoll-ragdoll itme
                const dx = a.x - b.x;
                const dz = a.z - b.z;
                const dl = Math.sqrt(dx*dx + dz*dz) || 0.01;
                a.vx = (a.vx || 0) + (dx/dl) * 0.5;
                a.vz = (a.vz || 0) + (dz/dl) * 0.5;
                b.vx = (b.vx || 0) - (dx/dl) * 0.5;
                b.vz = (b.vz || 0) - (dz/dl) * 0.5;
            }
        }

        // 5) Player fail-safe
        const p = this.bodies['player'];
        if (p && p.y < -5) {
            console.warn('⚠️ Player fail-safe');
            p.x = 2; p.y = 0.9; p.z = 5;
            p.vx = 0; p.vy = 0; p.vz = 0;
        }

        // 6) Ragdoll fail-safe
        for (const id in this.bodies) {
            if (!id.startsWith('ragdoll_')) continue;
            const b = this.bodies[id];
            if (b.y < -10 || b.y > 50 || Math.abs(b.x) > 300 || Math.abs(b.z) > 300) {
                this.remove(id);
            }
        }

        this.syncMeshes();
    },

    syncMeshes() {
        for (const id in this.meshMap) {
            const data = this.meshMap[id];
            const b = this.bodies[id];
            if (!b || !data.mesh) continue;
            data.mesh.position.x = b.x;
            data.mesh.position.y = b.y - data.yOffset;
            data.mesh.position.z = b.z;
            const spd = Math.sqrt((b.vx||0)*(b.vx||0) + (b.vz||0)*(b.vz||0));
            if (spd > 0.3) data.mesh.rotation.y = Math.atan2(b.vx, b.vz);
        }
    },

    setPlayerVelocity(vx, vy, vz) {
        const p = this.bodies['player'];
        if (!p) return;
        p.vx = vx;
        if (vy !== undefined) p.vy = vy;
        p.vz = vz;
    },
    getPlayerBody() { return this.bodies['player'] || null; },
    isPlayerGrounded() {
        const p = this.bodies['player'];
        if (!p) return true;
        return (p.y - 0.9) <= 0.15 && Math.abs(p.vy || 0) < 3.0;
    },
    setEnemyVelocity(physicsId, vx, vz) {
        const b = this.bodies[physicsId];
        if (!b) return;
        b.vx = vx;
        b.vz = vz;
    },

    applyExplosion(px, py, pz, force, radius) {
        const r2 = radius * radius;
        for (const id in this.bodies) {
            const b = this.bodies[id];
            if (b.static) continue;
            const dx = b.x - px;
            const dz = b.z - pz;
            const d2 = dx*dx + dz*dz;
            if (d2 > r2 || d2 < 0.01) continue;
            const d = Math.sqrt(d2);
            const falloff = 1 - d / radius;
            const strength = force * falloff;
            const nx = dx / d, nz = dz / d;
            // YATAY 3x, YUKARI 1x
            b.vx = (b.vx || 0) + nx * strength * 3;
            b.vz = (b.vz || 0) + nz * strength * 3;
            b.vy = (b.vy || 0) + strength * 1.0 + 8;
            // Clamp — nükleer için yüksek
            const maxV = 80;
            if (b.vx > maxV) b.vx = maxV;
            if (b.vx < -maxV) b.vx = -maxV;
            if (b.vy > maxV) b.vy = maxV;
            if (b.vy < -maxV) b.vy = -maxV;
            if (b.vz > maxV) b.vz = maxV;
            if (b.vz < -maxV) b.vz = -maxV;
        }
    },

    stats() {
        const p = this.bodies['player'];
        return {
            inited: this._inited,
            statics: this.statics.length,
            player: p ? { x: p.x.toFixed(2), y: p.y.toFixed(2), z: p.z.toFixed(2), vy: (p.vy||0).toFixed(2) } : 'YOK',
            toplam: Object.keys(this.bodies).length
        };
    }
};

﻿// ===== ENT KÖPRÜSÜ (paralel katman) =====
const EntBridge = {
    enabled: false,
    zombieMap: new Map(),
    kamikazeMap: new Map(),

    init() {
        if (typeof ent === 'undefined') {
            console.warn('⚠️ ENT yüklenmedi');
            return;
        }
        this.enabled = true;
        console.log('✅ ENT hazır');
    },

    addZombie(enemyRef) {
        if (!this.enabled) return;
        const e = ent.spawn('zombie', {
            health: enemyRef.health,
            maxHealth: enemyRef.maxHealth,
            x: enemyRef.mesh.position.x,
            y: enemyRef.mesh.position.y,
            z: enemyRef.mesh.position.z,
            physicsId: enemyRef.physicsId || null,
            ref: enemyRef
        });
        this.zombieMap.set(enemyRef, e);
    },

    addKamikaze(kamRef) {
        if (!this.enabled) return;
        const e = ent.spawn('kamikaze', {
            health: kamRef.health,
            x: kamRef.mesh.position.x,
            y: kamRef.mesh.position.y,
            z: kamRef.mesh.position.z,
            triggered: false,
            ref: kamRef
        });
        this.kamikazeMap.set(kamRef, e);
    },

    killZombie(enemyRef) {
        if (!this.enabled) return;
        const e = this.zombieMap.get(enemyRef);
        if (e) { try { e.kill(); } catch (x) {} this.zombieMap.delete(enemyRef); }
    },
    killKamikaze(kamRef) {
        if (!this.enabled) return;
        const e = this.kamikazeMap.get(kamRef);
        if (e) { try { e.kill(); } catch (x) {} this.kamikazeMap.delete(kamRef); }
    },

    sync() {
        if (!this.enabled) return;
        this.zombieMap.forEach((e, ref) => {
            if (!ref.mesh) return;
            e.set('x', ref.mesh.position.x);
            e.set('y', ref.mesh.position.y);
            e.set('z', ref.mesh.position.z);
            e.set('health', ref.health);
        });
        this.kamikazeMap.forEach((e, ref) => {
            if (!ref.mesh) return;
            e.set('x', ref.mesh.position.x);
            e.set('y', ref.mesh.position.y);
            e.set('z', ref.mesh.position.z);
            e.set('health', ref.health);
            e.set('triggered', !!ref.triggered);
        });
    },

    stats() {
        if (!this.enabled) return { enabled: false };
        return {
            enabled: true,
            zombieCount: ent.zombie ? ent.zombie.count() : 0,
            kamikazeCount: ent.kamikaze ? ent.kamikaze.count() : 0,
            total: typeof ent.count !== 'undefined' ? ent.count : 0
        };
    }
};

﻿// ===== ANA OYUN MODÜLÜ — SG-PHY + ENT + SG-SEED =====
const Game = {
    scene: null, camera: null, renderer: null, clock: null,
    running: false, paused: false, pointerLocked: false,
    initialized: false,
    _frameCounter: 0,

    init() {
        try {
            // SG-SEED — deterministik RNG
            if (typeof SGSeed !== 'undefined') {
                window.SGGame = window.SGGame || {};
                SGGame.rng = SGSeed.SeedRandom('arena-1');
                console.log('🎲 SG-SEED rng hazır');
            }

            console.log('🎮 Oyun başlatılıyor...');

            this.scene = new THREE.Scene();
            this.camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                300
            );
            this.camera.position.set(2, 1.7, 5);

            this.renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance',
                stencil: false,
                alpha: false
            });

            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(1.0);
            this.renderer.shadowMap.enabled = false;
            this.renderer.shadowMap.type = THREE.PCFShadowMap;
            this.renderer.shadowMap.autoUpdate = false;
            this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
            this.renderer.toneMappingExposure = 1.15;
            this.renderer.outputEncoding = THREE.sRGBEncoding;

            document.body.appendChild(this.renderer.domElement);

            this.clock = new THREE.Clock();

            // ===== MODÜLLER — SIRA ÖNEMLİ =====
            this._safeInit('Particles', () => Particles.init(this.scene));
            this._safeInit('DamageNumbers', () => DamageNumbers.init(this.scene, this.camera));
            this._safeInit('Effects', () => Effects.init(this.scene, this.camera));
            this._safeInit('Ragdoll', () => Ragdoll.init(this.scene));
            this._safeInit('Decals', () => Decals.init(this.scene));
            this._safeInit('Audio', () => Audio.init());
            this._safeInit('Stats', () => Stats.init());
            this._safeInit('Weather', () => Weather.init(this.scene, this.camera));
            this._safeInit('Inventory', () => Inventory.init());
            this._safeInit('Achievements', () => Achievements.init());
            this._safeInit('Merchant', () => Merchant.init());
            this._safeInit('ChunkSystem', () => ChunkSystem.init(this.scene));
            this._safeInit('Instancing', () => Instancing.init(this.scene));
            this._safeInit('Pickup', () => Pickup.init(this.scene, this.camera));
            this._safeInit('Bushes', () => Bushes.init(this.scene, this.camera));
            this._safeInit('Syringe', () => Syringe.init(this.scene));
            this._safeInit('Syringe.Camera', () => Syringe.setCamera(this.camera));
            this._safeInit('WeaponDrops', () => WeaponDrops.init(this.scene, this.camera));
            this._safeInit('ResourceDrops', () => ResourceDrops.init(this.scene, this.camera));

            // --- SG-PHY: World'den ÖNCE init (static body'ler için) ---
            this._safeInit('PhysicsBridge', () => PhysicsBridge.init());

            // World.init içinde buildStaticWorld çağrılmıyor, biz ayrıca çağırıyoruz
            this._safeInit('World', () => World.init(this.scene));
            this._safeInit('PhysicsBridge.Static', () => PhysicsBridge.buildStaticWorld());

            // --- ENT: World'den sonra, Enemy'den önce ---
            this._safeInit('EntBridge', () => EntBridge.init());

            this._safeInit('Player', () => Player.init(this.camera));
            if (Player._forceBody) Player._forceBody();
            if (Player._forceBody) Player._forceBody();
            this._safeInit('PlayerBody', () => PlayerBody.init(this.camera));
            this._safeInit('Weapons', () => Weapons.init(this.camera, this.scene));
            this._safeInit('Enemy', () => Enemy.init(this.scene));
            this._safeInit('Kamikaze', () => Kamikaze.init(this.scene));
            this._safeInit('Crafting', () => Crafting.init(this.scene, this.camera));
            this._safeInit('Stage', () => Stage.init());

            this.setupControls();
            this.setupButtons();
            window.addEventListener('resize', () => this.onResize());

            this.initialized = true;
            console.log('✅ Oyun hazır');

            this.renderer.render(this.scene, this.camera);
        } catch (err) {
            console.error('❌ Kritik hata:', err);
            this.showError('Oyun başlatılamadı: ' + err.message);
        }
    },

    _safeInit(name, fn) {
        try {
            fn();
            console.log('  ✅ ' + name);
        } catch (err) {
            console.error('  ❌ ' + name + ':', err);
        }
    },

    showError(msg) {
        const div = document.createElement('div');
        div.style.cssText = 'position:fixed;top:20px;left:20px;right:20px;background:#600;color:#fff;padding:20px;font-family:monospace;z-index:9999;border:2px solid #f00;border-radius:8px;';
        div.textContent = '⚠️ ' + msg;
        document.body.appendChild(div);
    },

    setupControls() {
        document.addEventListener('click', (e) => {
            if (this.running && !this.paused && !this.pointerLocked &&
                e.target.tagName !== 'BUTTON' &&
                !Inventory.isOpen && !Crafting.open) {
                try { document.body.requestPointerLock(); } catch (err) {}
            }
        });

        document.addEventListener('pointerlockchange', () => {
            this.pointerLocked = document.pointerLockElement === this.renderer.domElement;
        });document.addEventListener('mousemove', (e) => {if (!this.running || this.paused) return;
            if (Inventory.isOpen || Crafting.open) return;

            let sens = 0.002;
            if (Weapons.adsActive) sens *= 0.5;

            Player.yaw -= e.movementX * sens;
            Player.pitch -= e.movementY * sens;
            Player.pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, Player.pitch));
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Escape' && this.running && !this.paused) this.pause();
            else if (e.code === 'KeyP' && this.running && !e.shiftKey) {
                if (this.paused) this.resume();
                else this.pause();
            }
        });
    },

    setupButtons() {
        ['startBtn', 'restartBtn', 'resumeBtn'].forEach(id => {
            const btn = document.getElementById(id);
            if (!btn) return;
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (id === 'startBtn' || id === 'restartBtn') this.start();
                else this.resume();
            });
        });
    },

    start() {
        if (!this.initialized) return;
        try {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('gameover').style.display = 'none';
            document.getElementById('pause').style.display = 'none';

            Player.reset();
            if (Player._forceBody) Player._forceBody();
            Weapons.reset();
            Enemy.reset();
            Kamikaze.reset();
            Decals.clearAll();
            Particles.clearAll();
            Stats.reset();
            Inventory.reset();
            Syringe.reset();
            Stage.reset();
            Crafting.reset();
            Achievements.reset();

            if (typeof ChunkSystem !== 'undefined') ChunkSystem.reset();

            this.running = true;
            this.paused = false;
            this.clock.start();

            Stage.startStage();
            this.animate();

            // Pointer lock — agresif dene
            const canvas = this.renderer.domElement;
            canvas.focus && canvas.focus();
            setTimeout(() => {
                try {
                    const p = document.body.requestPointerLock();
                    if (p && p.catch) p.catch(e => console.warn('PL red:', e.message));
                } catch (e) { console.warn('PL hata:', e); }
            }, 100);

            try { document.body.requestPointerLock(); } catch (err) {}

            if (Audio.ctx && Audio.ctx.state === 'suspended') Audio.ctx.resume();
            Audio.startAmbient();

            Effects.addKillFeed('🎮 Oyun başladı!', '#0f0');
        } catch (err) {
            console.error(err);
        }
    },

    restart() { this.start(); },

    pause() {
        if (!this.running) return;
        this.paused = true;
        document.getElementById('pause').style.display = 'flex';
        document.exitPointerLock();
    },

    resume() {
        if (!this.running) return;
        this.paused = false;
        document.getElementById('pause').style.display = 'none';
        try { document.body.requestPointerLock(); } catch (err) {}
    },

    gameOver() {
        this.running = false;
        this.paused = false;
        document.getElementById('finalScore').textContent = Enemy.score;
        document.getElementById('finalWave').textContent = Stage.currentStage;
        document.getElementById('gameover').style.display = 'flex';
        document.exitPointerLock();
        Audio.stopAmbient();
    },

    animate() {
        if (!this.running) return;
        requestAnimationFrame(() => this.animate());

        const now = performance.now();

        if (typeof Stats !== 'undefined') Stats.updateFPS(now);

        if (this.paused) {
            this.renderer.render(this.scene, this.camera);
            return;
        }

        const dt = Math.min(this.clock.getDelta(), 0.05);
        this._frameCounter++;

        // Chunk
        if (typeof ChunkSystem !== 'undefined') {
            ChunkSystem.update(Player.position);
        }

        if (this._frameCounter % 30 === 0 && typeof Instancing !== 'undefined') {
            Instancing.hideDistantInstances(Player.position, 200);
        }

        // ===== KRİTİK GÜNCELLEMELER =====
        try { Stage.update(dt); } catch (e) {}
        try { Player.update(dt); } catch (e) {}
        try { Weapons.update(dt); } catch (e) {}

        try { PhysicsBridge.step(dt); } catch (e) {}
        try { EntBridge.sync(); } catch (e) {}

        try { Enemy.update(dt, Player.position); } catch (e) {}
        try { Kamikaze.update(dt, Player.position); } catch (e) {}

        // ===== DÜŞEN ITEMLER — HER FRAME =====
        try { WeaponDrops.update(dt); } catch (e) { if (this._frameCounter % 60 === 0) console.warn('WeaponDrops.update:', e); }
        try { ResourceDrops.update(dt); } catch (e) { if (this._frameCounter % 60 === 0) console.warn('ResourceDrops.update:', e); }

        // ===== AĞIR GÜNCELLEMELER — FRAME ATLAMALI =====
        if (this._frameCounter % 2 === 0) {
            try { Pickup.update(dt * 2); } catch (e) {}
            try { Syringe.update(dt * 2); } catch (e) {}
            try { Decals.update(dt * 2); } catch (e) {}
            try { Weather.update(dt * 2); } catch (e) {}
        }

        if (this._frameCounter % 3 === 0) {
            try { Ragdoll.update(dt * 3); } catch (e) {}
            try { Crafting.update(dt * 3); } catch (e) {}
        }

        try { Particles.update(dt); } catch (e) {}
        try { DamageNumbers.update(dt); } catch (e) {}
        try { Effects.update(); } catch (e) {}

        this.renderer.render(this.scene, this.camera);
    },

    onResize() {
        this.camera.aspect = window.innerWidth / window.innerHeight;
        this.camera.updateProjectionMatrix();
        this.camera.updateMatrixWorld();
        this.renderer.setSize(window.innerWidth, window.innerHeight);
    }
};

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => Game.init());
} else {
    Game.init();
}
