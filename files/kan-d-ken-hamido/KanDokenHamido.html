<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kan Doken Hamido</title>
    <style>
﻿* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: #0f0; }
canvas { display: block; }

#hud { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
#crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; }
.ch-line { position: absolute; background: #0f0; box-shadow: 0 0 4px #0f0, 0 0 8px #0f0; }
.ch-top    { top: 0; left: 50%; width: 2px; height: 10px; transform: translateX(-50%); }
.ch-bottom { bottom: 0; left: 50%; width: 2px; height: 10px; transform: translateX(-50%); }
.ch-left   { left: 0; top: 50%; width: 10px; height: 2px; transform: translateY(-50%); }
.ch-right  { right: 0; top: 50%; width: 10px; height: 2px; transform: translateY(-50%); }
.ch-dot { position: absolute; top: 50%; left: 50%; width: 3px; height: 3px; background: #0f0; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 6px #0f0; }
#crosshair.recoil { animation: recoil 0.1s; }
@keyframes recoil { 0% { transform: translate(-50%, -50%) scale(1.5); } 100% { transform: translate(-50%, -50%) scale(1); } }

#hitmarker { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; color: #ff0; opacity: 0; font-weight: bold; text-shadow: 0 0 6px #ff0; }
#hitmarker.show { animation: hitmark 0.3s; }
@keyframes hitmark { 0% { opacity: 1; transform: translate(-50%, -50%) scale(0.5); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); } }

#info { position: absolute; bottom: 20px; left: 20px; background: rgba(0,0,0,0.75); padding: 15px 20px; border: 2px solid #0f0; border-radius: 8px; text-shadow: 0 0 4px #0f0; display: flex; flex-direction: column; gap: 12px; min-width: 240px; }
.hud-item { display: flex; flex-direction: column; gap: 5px; }
.hud-label { font-size: 14px; color: #0f0; letter-spacing: 2px; }
.hp-bar-container { position: relative; width: 100%; height: 22px; background: rgba(80, 0, 0, 0.6); border: 1px solid #0f0; border-radius: 4px; overflow: hidden; }
.hp-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #f00, #ff6600, #0f0); transition: width 0.3s ease; }
.hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 14px; font-weight: bold; color: #fff; text-shadow: 0 0 4px #000; }

.ammo-display { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
.ammo-current { color: #0f0; }
.ammo-current.low { color: #f00; animation: blink 0.5s infinite; }
.ammo-sep { color: #666; margin: 0 4px; }
.ammo-max { color: #8f8; font-size: 18px; }
@keyframes blink { 50% { opacity: 0.3; } }

#weapon-panel {
    position: absolute; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.8);
    border: 2px solid #0ff;
    border-radius: 8px;
    padding: 10px 25px;
    text-align: center;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
}
#weapon-name {
    font-size: 22px; font-weight: bold;
    color: #0ff; letter-spacing: 3px;
    text-shadow: 0 0 10px #0ff;
    margin-bottom: 3px;
}
#weapon-hint {
    font-size: 11px; color: #8af;
    letter-spacing: 1px;
}

#score-panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.75); padding: 15px 20px; border: 2px solid #0f0; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; min-width: 180px; text-align: right; }
.score-item, .wave-item { display: flex; justify-content: space-between; align-items: center; font-size: 16px; }
.score-label, .wave-label { color: #8f8; letter-spacing: 2px; }
.score-value { color: #ff0; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px #ff0; }
.wave-value { color: #f00; font-size: 22px; font-weight: bold; text-shadow: 0 0 8px #f00; }
.enemies-item { font-size: 13px; color: #8f8; }

#fog-indicator { position: absolute; top: 20px; left: 20px; background: rgba(60, 70, 80, 0.75); border: 2px solid #6a7a85; padding: 8px 15px; border-radius: 8px; color: #aac0d0; font-size: 14px; text-shadow: 0 0 6px #6a7a85; letter-spacing: 2px; font-weight: bold; }

#sprint-indicator { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 18px; color: #0ff; text-shadow: 0 0 8px #0ff; opacity: 0; transition: opacity 0.2s; letter-spacing: 3px; }
#sprint-indicator.active { opacity: 1; }

#kill-feed { position: absolute; top: 120px; right: 20px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.kill-msg { background: rgba(0,0,0,0.8); border-left: 3px solid #f00; padding: 6px 12px; font-size: 14px; color: #ff6; text-shadow: 0 0 4px #f00; animation: killFeed 2.5s forwards; }
@keyframes killFeed { 0% { opacity: 0; transform: translateX(30px); } 15% { opacity: 1; transform: translateX(0); } 85% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(30px); } }

/* 🎮 TEMİZ MENÜ */
#menu, #gameover, #pause { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.9); z-index: 100; }
#menu h1, #gameover h1, #pause h1 { font-size: 90px; margin-bottom: 40px; color: #0f0; text-shadow: 0 0 30px #0f0; letter-spacing: 10px; }
#gameover h1 { color: #f00; text-shadow: 0 0 30px #f00; }
#pause h1 { color: #ff0; text-shadow: 0 0 30px #ff0; font-size: 60px; }
#gameover p, #pause p { font-size: 24px; margin: 10px 0; color: #8f8; }
#gameover span { color: #ff0; font-weight: bold; }

button { margin-top: 20px; padding: 20px 70px; font-size: 28px; background: transparent; color: #0f0; border: 3px solid #0f0; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: bold; transition: all 0.3s; letter-spacing: 3px; }
button:hover { background: #0f0; color: #000; box-shadow: 0 0 40px #0f0; transform: scale(1.05); }

#damage-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 40%, rgba(255,0,0,0.7) 100%); opacity: 0; pointer-events: none; z-index: 5; transition: opacity 0.2s; }
#damage-overlay.active { opacity: 1; }
    </style>

<script>
// ============================================================ 
//  effects.js 
// ============================================================ 
﻿// ===== EFEKT MODÜLÜ (Özellik 6, 8, 17) =====
const Effects = {
    scene: null,
    camera: null,
    particles: [],
    shakeIntensity: 0,
    shakeDecay: 0.9,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;
    },

    // 6. MUZZLE FLASH (namlu alevi)
    muzzleFlash(position) {
        const light = new THREE.PointLight(0xffaa00, 4, 8);
        light.position.copy(position);
        this.scene.add(light);

        // Küçük küre (ateş topu)
        const geo = new THREE.SphereGeometry(0.15, 8, 8);
        const mat = new THREE.MeshBasicMaterial({ color: 0xffdd00, transparent: true, opacity: 1 });
        const flash = new THREE.Mesh(geo, mat);
        flash.position.copy(position);
        this.scene.add(flash);

        // Animasyon
        let life = 0;
        const animate = () => {
            life += 0.15;
            light.intensity = Math.max(0, 4 - life * 20);
            mat.opacity = Math.max(0, 1 - life * 5);
            flash.scale.setScalar(1 + life * 3);
            if (life < 0.3) {
                requestAnimationFrame(animate);
            } else {
                this.scene.remove(light);
                this.scene.remove(flash);
                geo.dispose();
                mat.dispose();
            }
        };
        animate();
    },

    // 8. KAN EFEKTİ (düşmana vurulunca)
    bloodBurst(position) {
        const count = 12;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);
        const velocities = [];

        for (let i = 0; i < count; i++) {
            positions[i*3]     = position.x;
            positions[i*3 + 1] = position.y;
            positions[i*3 + 2] = position.z;

            velocities.push(new THREE.Vector3(
                (Math.random() - 0.5) * 4,
                Math.random() * 3,
                (Math.random() - 0.5) * 4
            ));
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        const mat = new THREE.PointsMaterial({
            color: 0xcc0000, size: 0.15, transparent: true, opacity: 1
        });
        const particles = new THREE.Points(geo, mat);
        this.scene.add(particles);

        const startPos = position.clone();
        let life = 0;
        const animate = () => {
            life += 0.033;
            const posAttr = geo.attributes.position;
            for (let i = 0; i < count; i++) {
                posAttr.array[i*3]     += velocities[i].x * 0.033;
                posAttr.array[i*3 + 1] += velocities[i].y * 0.033;
                posAttr.array[i*3 + 2] += velocities[i].z * 0.033;
                velocities[i].y -= 9.8 * 0.033; // yerçekimi
            }
            posAttr.needsUpdate = true;
            mat.opacity = Math.max(0, 1 - life * 1.5);

            if (life < 0.7) {
                requestAnimationFrame(animate);
            } else {
                this.scene.remove(particles);
                geo.dispose();
                mat.dispose();
            }
        };
        animate();
    },

    // 17. EKRAN SARSINTISI
    shake(intensity) {
        this.shakeIntensity = Math.max(this.shakeIntensity, intensity);
    },

    // Her frame güncelleme
    update() {
        if (this.shakeIntensity > 0.001) {
            const shake = this.shakeIntensity;
            this.camera.position.x += (Math.random() - 0.5) * shake;
            this.camera.position.y += (Math.random() - 0.5) * shake;
            this.camera.rotation.z = (Math.random() - 0.5) * shake * 0.3;
            this.shakeIntensity *= this.shakeDecay;
        } else {
            this.shakeIntensity = 0;
            this.camera.rotation.z = 0;
        }
    },

    // Hitmarker göster (isabet göstergesi)
    showHitmarker() {
        const el = document.getElementById('hitmarker');
        el.classList.remove('show');
        void el.offsetWidth; // reflow
        el.classList.add('show');
    },

    // Kill feed mesajı
    addKillFeed(text, color = '#ff6') {
        const feed = document.getElementById('kill-feed');
        const msg = document.createElement('div');
        msg.className = 'kill-msg';
        msg.textContent = text;
        msg.style.color = color;
        feed.appendChild(msg);
        setTimeout(() => msg.remove(), 2500);
    }
};
 
// ============================================================ 
//  audio.js 
// ============================================================ 
﻿// ===== SES MODÜLÜ - HER SİLAHA AYRI =====
const Audio = {
    ctx: null,
    enabled: true,
    masterVolume: 0.4,
    ambientOsc: null,
    ambientPlaying: false,

    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {
            console.warn('Ses sistemi desteklenmiyor');
            this.enabled = false;
        }
    },

    makeWhiteNoise(duration) {
        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        return source;
    },

    // 🎵 HER SİLAHA AYRI SES
    playWeapon(type) {
        if (!this.enabled || !this.ctx) return;
        if (type === 'pistol') this.playPistol();
        else if (type === 'rifle') this.playRifle();
        else if (type === 'shotgun') this.playShotgun();
        else this.playShoot();
    },

    // 🔫 TABANCA - Keskin, kısa
    playPistol() {
        const t = this.ctx.currentTime;
        const v = this.masterVolume;

        // Kısa sharp crack
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(1200, t);
        osc.frequency.exponentialRampToValueAtTime(200, t + 0.04);
        gain.gain.setValueAtTime(0.3 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.06);

        // Body
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(250, t);
        osc2.frequency.exponentialRampToValueAtTime(80, t + 0.08);
        gain2.gain.setValueAtTime(0.2 * v, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc2.connect(gain2); gain2.connect(this.ctx.destination);
        osc2.start(t); osc2.stop(t + 0.1);
    },

    // 🔫🔫 TARAMALI - Hızlı, tık tık
    playRifle() {
        const t = this.ctx.currentTime;
        const v = this.masterVolume;

        // Kısa click
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(900, t);
        osc.frequency.exponentialRampToValueAtTime(150, t + 0.03);
        gain.gain.setValueAtTime(0.22 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.04);

        // Gürültü
        const noise = this.makeWhiteNoise(0.04);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = 2000;
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.15 * v, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
        noise.connect(filter); filter.connect(nGain); nGain.connect(this.ctx.destination);
        noise.start(t);
    },

    // 💥 POMPALI - Derin, güçlü patlama
    playShotgun() {
        const t = this.ctx.currentTime;
        const v = this.masterVolume;

        // Derin bass boom
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(180, t);
        osc.frequency.exponentialRampToValueAtTime(40, t + 0.25);
        gain.gain.setValueAtTime(0.4 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.3);

        // Geniş gürültü
        const noise = this.makeWhiteNoise(0.2);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(3000, t);
        filter.frequency.exponentialRampToValueAtTime(300, t + 0.2);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.4 * v, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        noise.connect(filter); filter.connect(nGain); nGain.connect(this.ctx.destination);
        noise.start(t);

        // Yüksek crack
        const osc2 = this.ctx.createOscillator();
        const gain2 = this.ctx.createGain();
        osc2.type = 'square';
        osc2.frequency.setValueAtTime(700, t);
        osc2.frequency.exponentialRampToValueAtTime(100, t + 0.05);
        gain2.gain.setValueAtTime(0.25 * v, t);
        gain2.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
        osc2.connect(gain2); gain2.connect(this.ctx.destination);
        osc2.start(t); osc2.stop(t + 0.06);
    },

    // 🥊 YUMRUK SESİ
    playMelee() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const v = this.masterVolume;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + 0.08);
        gain.gain.setValueAtTime(0.15 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.1);
    },

    playShoot() { this.playPistol(); },

    playExplosion() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const v = this.masterVolume;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(80, t);
        osc.frequency.exponentialRampToValueAtTime(25, t + 0.6);
        gain.gain.setValueAtTime(0.4 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.8);

        const noise = this.makeWhiteNoise(0.5);
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(2000, t);
        filter.frequency.exponentialRampToValueAtTime(200, t + 0.5);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.5 * v, t);
        nGain.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        noise.connect(filter); filter.connect(nGain); nGain.connect(this.ctx.destination);
        noise.start(t);
    },

    playReload() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const v = this.masterVolume;
        [0, 0.35, 0.7].forEach((delay, i) => {
            const freq = [600, 500, 900][i];
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, t + delay);
            osc.frequency.exponentialRampToValueAtTime(freq * 0.5, t + delay + 0.08);
            gain.gain.setValueAtTime(0.15 * v, t + delay);
            gain.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.1);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(t + delay); osc.stop(t + delay + 0.1);
        });
    },

    playEnemyDeath() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const v = this.masterVolume;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(100, t + 0.35);
        gain.gain.setValueAtTime(0.15 * v, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + 0.35);
    },

    playZombieGrowl() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const v = this.masterVolume;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();

﻿// ===== PARTİKÜL - OPTİMİZE =====
const Particles = {
    scene: null,
    systems: [],
    maxSystems: 20,  // 🔥 Maks 15 partikül sistemi

    init(scene) {
        this.scene = scene;
    },

    burst(position, options = {}) {
        // Çok fazla sistem varsa en eskisini sil
        if (this.systems.length >= this.maxSystems) {
            const oldest = this.systems.shift();
            this.scene.remove(oldest.points);
            oldest.geo.dispose();
            oldest.mat.dispose();
        }

        const {
            count = 15,  // 🔥 Azaltıldı
            color = 0xffffff, 
            size = 0.15, 
            spread = 5,
            speed = 8, 
            gravity = -15, 
            life = 1.0, 
            fade = true, 
            additive = false
        } = options;

        // Max 20 partikül (perf)
        const actualCount = Math.min(count, 20);

        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(actualCount * 3);
        const velocities = [];

        for (let i = 0; i < actualCount; i++) {
            positions[i*3]     = position.x + (Math.random() - 0.5) * spread;
            positions[i*3 + 1] = position.y + (Math.random() - 0.5) * spread;
            positions[i*3 + 2] = position.z + (Math.random() - 0.5) * spread;

            velocities.push(new THREE.Vector3(
                (Math.random() - 0.5) * speed,
                Math.random() * speed,
                (Math.random() - 0.5) * speed
            ));
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const mat = new THREE.PointsMaterial({
            color: color, size: size, transparent: true, opacity: 1,
            depthWrite: false,
            blending: additive ? THREE.AdditiveBlending : THREE.NormalBlending
        });

        const points = new THREE.Points(geo, mat);
        this.scene.add(points);

        this.systems.push({
            points, geo, mat, velocities, life: 0, maxLife: life,
            gravity, fade
        });
    },

    bloodBurst(position, intensity, isHeadshot) {
        intensity = intensity || 1;
        this.burst(position, {
            count: 20,
            color: 0xaa0000,
            size: 0.12,
            spread: 0.4,
            speed: 6,
            gravity: -20,
            life: 0.9
        });
    },

    muzzleSmoke(position) {
        this.burst(position, {
            count: 5,
            color: 0x999999, 
            size: 0.2, 
            spread: 0.15,
            speed: 2, 
            gravity: 0.5, 
            life: 0.4
        });
    },

    wallImpact(position) {
        this.burst(position, {
            count: 6,
            color: 0xaaaaaa, 
            size: 0.1, 
            spread: 0.15,
            speed: 4, 
            gravity: -10, 
            life: 0.4
        });
    },

    deathExplosion(position, isHeadshot, isHeart) {
        this.burst(position, {
            count: 25,
            color: 0x880000,
            size: 0.25,
            spread: 1.0,
            speed: 7,
            gravity: -15,
            life: 1.3
        });
    },

    groundImpact(position, intensity = 1) {
        this.burst(
            new THREE.Vector3(position.x, 0.1, position.z),
            {
                count: 8, 
                color: 0x8a8a7a,
                size: 0.2, 
                spread: 0.6, 
                speed: 3,
                gravity: -3, 
                life: 0.6
            }
        );
    },

    explosion(position, radius) {
        radius = radius || 3;
        this.burst(position, {
            count: 40, color: 0xffaa00, size: 0.6, spread: radius,
            speed: 18, gravity: -5, life: 1.0, additive: true
        });
        this.burst(position, {
            count: 25, color: 0xff4400, size: 0.5, spread: radius * 0.8,
            speed: 14, gravity: -4, life: 0.9, additive: true
        });
    },

    zombieDecay(position) {
        // Kaldırıldı (perf)
    },

    update(dt) {
        for (let i = this.systems.length - 1; i >= 0; i--) {
            const s = this.systems[i];
            s.life += dt;

            const posAttr = s.geo.attributes.position;
            const count = posAttr.count;

            for (let j = 0; j < count; j++) {
                const v = s.velocities[j];
                v.y += s.gravity * dt;
                v.multiplyScalar(0.98);

                posAttr.array[j*3]     += v.x * dt;
                posAttr.array[j*3 + 1] += v.y * dt;
                posAttr.array[j*3 + 2] += v.z * dt;

                if (posAttr.array[j*3 + 1] < 0.05) {
                    posAttr.array[j*3 + 1] = 0.05;
                    v.y *= -0.2;
                    v.x *= 0.7;
                    v.z *= 0.7;
                }
            }
            posAttr.needsUpdate = true;

            if (s.fade) {
                s.mat.opacity = Math.max(0, 1 - s.life / s.maxLife);
            }

            if (s.life >= s.maxLife) {
                this.scene.remove(s.points);
                s.geo.dispose();
                s.mat.dispose();
                this.systems.splice(i, 1);
            }
        }
    },

    clearAll() {
        this.systems.forEach(s => {
            this.scene.remove(s.points);
            s.geo.dispose();
            s.mat.dispose();
        });
        this.systems = [];
    }
};

﻿// ===== HİTBOX MODÜLÜ (Kafa / Kalp / Vücut) =====
const Hitbox = {
    // Bir noktayı zombinin bölgeleriyle test et
    test(enemy, hitPoint) {
        const enemyPos = enemy.mesh.position;
        const localPoint = new THREE.Vector3().subVectors(hitPoint, enemyPos);

        // Zombi yüksekliği: 0 (zemin) - 2.05 (kafa üstü)
        const y = localPoint.y;

        // KAFA bölgesi: 1.55 - 2.05
        if (y > 1.55 && y <= 2.05) {
            // Kafa X/Z kontrolü (dar)
            const headX = Math.abs(localPoint.x);
            const headZ = Math.abs(localPoint.z);
            if (headX < 0.35 && headZ < 0.35) {
                return {
                    zone: 'head',
                    multiplier: 3.5,
                    label: 'HEADSHOT!',
                    color: 'head'
                };
            }
        }

        // KALP bölgesi: 1.25 - 1.55 (göğsün sol üst kısmı, oyuncu açısına göre)
        if (y > 1.25 && y <= 1.55) {
            const heartX = Math.abs(localPoint.x);
            const heartZ = Math.abs(localPoint.z);
            if (heartX < 0.3 && heartZ < 0.3) {
                // Kalp solda bir nokta (yerel koordinatta -x)
                // Zombi bize bakıyorsa, onun sol göğsü = bizim +x (sağ tarafta olur)
                // Basit tutup göğüs ortasını kalp kabul edelim
                return {
                    zone: 'heart',
                    multiplier: 2.5,
                    label: 'HEARTSHOT!',
                    color: 'heart'
                };
            }
        }

        // VÜCUT (gövde) bölgesi: 0.55 - 1.25
        if (y > 0.55 && y <= 1.25) {
            return {
                zone: 'body',
                multiplier: 1.0,
                label: '',
                color: 'normal'
            };
        }

        // BACAK bölgesi: 0 - 0.55
        if (y <= 0.55) {
            return {
                zone: 'leg',
                multiplier: 0.7,
                label: 'BACAK',
                color: 'normal'
            };
        }

        return {
            zone: 'body',
            multiplier: 1.0,
            label: '',
            color: 'normal'
        };
    }
};

﻿// ===== HASAR SAYILARI MODÜLÜ =====
const DamageNumbers = {
    scene: null,
    camera: null,
    activeNumbers: [],
    canvas: null,
    ctx: null,
    textureCache: {},

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;
        this.canvas = document.createElement('canvas');
        this.canvas.width = 256;
        this.canvas.height = 128;
        this.ctx = this.canvas.getContext('2d');
    },

    // Hasar sayısı göster
    show(position, damage, type = 'normal') {
        const config = {
            normal:   { color: '#ffffff', size: 60, prefix: '',  shadow: '#000000' },
            head:     { color: '#ffcc00', size: 80, prefix: '',  shadow: '#884400' },  // Altın sarısı
            heart:    { color: '#ff2222', size: 90, prefix: '♥', shadow: '#880000' },  // Kırmızı kalp
            critical: { color: '#ff00ff', size: 100, prefix: '★', shadow: '#880088' },
            kill:     { color: '#ff0044', size: 110, prefix: '💀', shadow: '#880022' }
        }[type] || { color: '#ffffff', size: 60, prefix: '', shadow: '#000000' };

        // Canvas ile doku oluştur
        const cacheKey = `${Math.round(damage)}_${type}`;
        let texture = this.textureCache[cacheKey];

        if (!texture) {
            this.ctx.clearRect(0, 0, 256, 128);
            this.ctx.font = `bold ${config.size}px Arial`;
            this.ctx.textAlign = 'center';
            this.ctx.textBaseline = 'middle';
            
            // Gölge
            this.ctx.shadowColor = config.shadow;
            this.ctx.shadowBlur = 10;
            this.ctx.shadowOffsetX = 3;
            this.ctx.shadowOffsetY = 3;

            // Metin
            this.ctx.fillStyle = config.color;
            this.ctx.strokeStyle = '#000000';
            this.ctx.lineWidth = 4;
            
            const text = `${config.prefix}${Math.round(damage)}`;
            this.ctx.strokeText(text, 128, 64);
            this.ctx.fillText(text, 128, 64);

            texture = new THREE.CanvasTexture(this.canvas);
            this.textureCache[cacheKey] = texture;
        }

        // Sprite oluştur
        const mat = new THREE.SpriteMaterial({
            map: texture,
            transparent: true,
            depthTest: false,
            depthWrite: false
        });
        const sprite = new THREE.Sprite(mat);
        sprite.position.copy(position);
        sprite.position.y += 0.3;
        sprite.scale.set(2, 1, 1);
        this.scene.add(sprite);

        this.activeNumbers.push({
            sprite: sprite,
            velocity: new THREE.Vector3(
                (Math.random() - 0.5) * 1.5,
                2.5 + Math.random() * 0.5,
                (Math.random() - 0.5) * 1.5
            ),
            life: 0,
            maxLife: 1.2,
            mat: mat,
            sprite: sprite,
            type: type
        });
    },

    update(dt) {
        for (let i = this.activeNumbers.length - 1; i >= 0; i--) {
            const dn = this.activeNumbers[i];
            dn.life += dt;

            // Yukarı hareket + yerçekimi
            dn.velocity.y -= 4 * dt;
            dn.sprite.position.addScaledVector(dn.velocity, dt);

            // Kameraya doğru bak (billboard)
            dn.sprite.lookAt(this.camera.position);

            // Ölçek animasyonu (küçüldükçe)
            const scale = 2 * (1 - dn.life / dn.maxLife * 0.5);
            dn.sprite.scale.set(scale, scale * 0.5, 1);

            // Solma
            dn.mat.opacity = Math.max(0, 1 - dn.life / dn.maxLife);

            if (dn.life >= dn.maxLife) {
                this.scene.remove(dn.sprite);
                dn.mat.dispose();
                this.activeNumbers.splice(i, 1);
            }
        }
    },

    clearAll() {
        this.activeNumbers.forEach(dn => {
            this.scene.remove(dn.sprite);
            dn.mat.dispose();
        });
        this.activeNumbers = [];
    }
};

﻿// ===== CHUNK SİSTEMİ =====
// Haritayı 40x40'lık kare bölümlere ayırır
// Sadece oyuncu etrafındaki chunk'lar render edilir
const ChunkSystem = {
    chunkSize: 40,           // Her chunk 40x40 metre
    renderDistance: 1,        // Oyuncu etrafında 3 chunk (toplam 7x7=49)
    chunks: {},              // Aktif chunk'lar
    allObjects: [],          // Tüm objelerin listesi (referans)
    playerChunkX: 0,
    playerChunkZ: 0,
    lastUpdate: 0,
    updateInterval: 150,      // 300ms'de bir güncelle

    init(scene) {
        this.scene = scene;
        this.chunks = {};
        console.log('🗺️ Chunk sistemi başladı:', 
            `chunk boyutu=${this.chunkSize}m,`,
            `görüş=${this.renderDistance}`);
    },

    // Objeyi bir chunk'a ata
    register(object, x, z) {
        const cx = Math.floor(x / this.chunkSize);
        const cz = Math.floor(z / this.chunkSize);
        const key = `${cx}_${cz}`;
        
        if (!this.chunks[key]) {
            this.chunks[key] = {
                x: cx,
                z: cz,
                objects: [],
                visible: false,
                distance: 0
            };
        }
        
        const chunk = this.chunks[key];
        chunk.objects.push(object);
        object.userData.chunkKey = key;
        
        // Başlangıçta gizli
        object.visible = false;
        
        return key;
    },

    // Oyuncu pozisyonuna göre görünürlüğü güncelle
    update(playerPos) {
        const now = performance.now();
        if (now - this.lastUpdate < this.updateInterval) return;
        this.lastUpdate = now;

        const px = Math.floor(playerPos.x / this.chunkSize);
        const pz = Math.floor(playerPos.z / this.chunkSize);
        
        // Chunk değişmediyse çık
        if (px === this.playerChunkX && pz === this.playerChunkZ) return;
        
        this.playerChunkX = px;
        this.playerChunkZ = pz;

        const R = this.renderDistance;
        const R2 = R * R;

        // Her chunk için görünürlük hesapla
        for (const key in this.chunks) {
            const chunk = this.chunks[key];
            const dx = chunk.x - px;
            const dz = chunk.z - pz;
            const distSq = dx * dx + dz * dz;
            
            const shouldBeVisible = distSq <= R2;
            
            if (chunk.visible !== shouldBeVisible) {
                chunk.visible = shouldBeVisible;
                chunk.distance = Math.sqrt(distSq);
                
                chunk.objects.forEach(obj => {
                    obj.visible = shouldBeVisible;
                });
            }
        }
    },

    // Tüm objeleri göster (test için)
    showAll() {
        for (const key in this.chunks) {
            const chunk = this.chunks[key];
            chunk.visible = true;
            chunk.objects.forEach(obj => obj.visible = true);
        }
    },

    // İstatistik
    getStats() {
        let total = 0;
        let visible = 0;
        
        for (const key in this.chunks) {
            const chunk = this.chunks[key];
            total += chunk.objects.length;
            if (chunk.visible) visible += chunk.objects.length;
        }
        
        return { total, visible, chunks: Object.keys(this.chunks).length };
    },

    reset() {
        this.chunks = {};
        this.playerChunkX = 0;
        this.playerChunkZ = 0;
    }
};

﻿// ===== INSTANCING SİSTEMİ =====
// Aynı tipte objeler tek draw call ile çizilir
const Instancing = {
    scene: null,
    batches: {},
    transforms: {},  // Her batch için transform listesi

    init(scene) {
        this.scene = scene;
    },

    // Batch başlat
    startBatch(name, geometry, material, maxCount = 100) {
        const mesh = new THREE.InstancedMesh(geometry, material, maxCount);
        mesh.count = 0;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        
        // Chunk için instance matrix'leri dinamik güncellenebilir
        mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        
        this.scene.add(mesh);
        
        this.batches[name] = {
            mesh,
            count: 0,
            maxCount,
            positions: [],  // Her instance için pozisyon
            chunkData: []    // Chunk bilgisi
        };
        
        return this.batches[name];
    },

    // Instance ekle
    addInstance(batchName, position, rotation, scale) {
        const batch = this.batches[batchName];
        if (!batch) return null;
        if (batch.count >= batch.maxCount) return null;
        
        const matrix = new THREE.Matrix4();
        const quat = new THREE.Quaternion();
        quat.setFromEuler(rotation || new THREE.Euler(0, 0, 0));
        
        matrix.compose(
            position,
            quat,
            scale || new THREE.Vector3(1, 1, 1)
        );
        
        batch.mesh.setMatrixAt(batch.count, matrix);
        batch.mesh.instanceMatrix.needsUpdate = true;
        
        const index = batch.count;
        batch.count++;
        batch.mesh.count = batch.count;
        
        batch.positions.push(position.clone());
        batch.chunkData.push({
            position: position.clone(),
            rotation: rotation ? rotation.clone() : new THREE.Euler(0, 0, 0),
            scale: scale ? scale.clone() : new THREE.Vector3(1, 1, 1),
            index: index,
            visible: true
        });
        
        return index;
    },

    // InstancedMesh için chunk gizleme (custom)
    // Basit yaklaşım: fog dışındaki instance'ları scale(0) yap
    hideDistantInstances(playerPos, maxDistance) {
    const maxDistSq = maxDistance * maxDistance;
    const tempMatrix = new THREE.Matrix4();
    const tempQuat = new THREE.Quaternion();
    const zeroScale = new THREE.Vector3(0, 0, 0);
    const oneVec = new THREE.Vector3(1, 1, 1);
    
    Object.keys(this.batches).forEach(name => {
        const batch = this.batches[name];
        let needsUpdate = false;
        
        for (let i = 0; i < batch.chunkData.length; i++) {
            const data = batch.chunkData[i];
            const dx = data.position.x - playerPos.x;
            const dz = data.position.z - playerPos.z;
            const distSq = dx * dx + dz * dz;
            
            const shouldBeVisible = distSq <= maxDistSq;
            
            if (data.visible !== shouldBeVisible) {
                data.visible = shouldBeVisible;
                needsUpdate = true;
                
                if (shouldBeVisible) {
                    tempQuat.setFromEuler(data.rotation);
                    tempMatrix.compose(data.position, tempQuat, data.scale);
                } else {
                    tempMatrix.makeScale(0, 0, 0);
                }
                
                batch.mesh.setMatrixAt(data.index, tempMatrix);
            }
        }
        
        if (needsUpdate) {
            batch.mesh.instanceMatrix.needsUpdate = true;
        }
    });
},

    getStats() {
        let total = 0;
        let batches = 0;
        Object.keys(this.batches).forEach(name => {
            total += this.batches[name].count;
            batches++;
        });
        return { totalInstances: total, batchCount: batches };
    },

    reset() {
        Object.keys(this.batches).forEach(name => {
            const batch = this.batches[name];
            this.scene.remove(batch.mesh);
            batch.mesh.geometry.dispose();
            batch.mesh.material.dispose();
        });
        this.batches = {};
    }
};

﻿// ===== RAGDOLL — görsel bütün, fizik parçalı =====
const Ragdoll = {
    scene: null,
    activeRagdolls: [],
    maxRagdolls: 4,

    init(scene) {
        this.scene = scene;
    },

    createFromEnemy(enemy, hitPoint, impulseDir, impulseStrength) {
        if (typeof PhysicsBridge === 'undefined' || !PhysicsBridge._inited) return;
        if (this.activeRagdolls.length >= this.maxRagdolls) {
            const old = this.activeRagdolls.shift();
            this.remove(old);
        }

        const pos = enemy.mesh.position.clone();
        // Orijinal zombi mesh'ini SAKLA — görsel bütün kalacak
        const zombieMesh = enemy.mesh;

        const ragdoll = {
            parts: [],
            joints: [],
            age: 0,
            held: false,
            zombieMesh: zombieMesh
        };

        // 10 fizik parça — görünmez, sadece collision/tutma
        const partsData = [
            { name: 'head',      w: 0.5,  h: 0.5,  d: 0.5, dx: 0,     dy: 1.75, dz: 0,    mass: 3 },
            { name: 'torso',     w: 0.7,  h: 0.9,  d: 0.4, dx: 0,     dy: 1.1,  dz: 0,    mass: 8 },
            { name: 'lUpperArm', w: 0.2,  h: 0.45, d: 0.2, dx: -0.45, dy: 1.25, dz: 0,    mass: 2 },
            { name: 'rUpperArm', w: 0.2,  h: 0.45, d: 0.2, dx: 0.45,  dy: 1.25, dz: 0,    mass: 2 },
            { name: 'lLowerArm', w: 0.18, h: 0.4,  d: 0.18, dx: -0.45, dy: 0.85, dz: 0,   mass: 1.5 },
            { name: 'rLowerArm', w: 0.18, h: 0.4,  d: 0.18, dx: 0.45,  dy: 0.85, dz: 0,   mass: 1.5 },
            { name: 'lUpperLeg', w: 0.24, h: 0.5,  d: 0.24, dx: -0.18, dy: 0.55, dz: 0,   mass: 3 },
            { name: 'rUpperLeg', w: 0.24, h: 0.5,  d: 0.24, dx: 0.18,  dy: 0.55, dz: 0,   mass: 3 },
            { name: 'lLowerLeg', w: 0.2,  h: 0.5,  d: 0.2,  dx: -0.18, dy: 0.05, dz: 0,   mass: 2.5 },
            { name: 'rLowerLeg', w: 0.2,  h: 0.5,  d: 0.2,  dx: 0.18,  dy: 0.05, dz: 0,   mass: 2.5 }
        ];

        const center = hitPoint || new THREE.Vector3(pos.x, pos.y + 1, pos.z);
        const dir = impulseDir ? impulseDir.clone().normalize() : new THREE.Vector3(0, 0, 1);

        partsData.forEach(pd => {
            const phys = PhysicsBridge.addRagdollPart(
                pos.x + pd.dx, pos.y + pd.dy, pos.z + pd.dz,
                pd.w, pd.h, pd.d, pd.mass
            );

            const body = phys.body;
            if (body) {
                const toPart = new THREE.Vector3(pd.dx, pd.dy - 1, pd.dz).normalize();
                const strength = (impulseStrength || 4) * 0.3;
                body.vx = Math.max(-5, Math.min(5, dir.x * strength + toPart.x * 1.5 + (Math.random() - 0.5)));
                body.vy = Math.max(-5, Math.min(5, 2 + Math.random() * 1.5));
                body.vz = Math.max(-5, Math.min(5, dir.z * strength + toPart.z * 1.5 + (Math.random() - 0.5)));
            }

            ragdoll.parts.push({
                physicsId: phys.id,
                name: pd.name,
                restX: pd.dx, restY: pd.dy, restZ: pd.dz,
                body: body
            });
        });

        // Eklemler
        const getByName = (n) => ragdoll.parts.find(p => p.name === n);
        const jointPairs = [
            ['torso', 'head'],
            ['torso', 'lUpperArm'], ['lUpperArm', 'lLowerArm'],
            ['torso', 'rUpperArm'], ['rUpperArm', 'rLowerArm'],
            ['torso', 'lUpperLeg'], ['lUpperLeg', 'lLowerLeg'],
            ['torso', 'rUpperLeg'], ['rUpperLeg', 'rLowerLeg']
        ];
        jointPairs.forEach(([a, b]) => {
            const pa = getByName(a), pb = getByName(b);
            if (!pa || !pb) return;
            const dx = pb.restX - pa.restX;
            const dy = pb.restY - pa.restY;
            const dz = pb.restZ - pa.restZ;
            ragdoll.joints.push({
                a: pa, b: pb,
                restDist: Math.sqrt(dx*dx + dy*dy + dz*dz)
            });
        });

        this.activeRagdolls.push(ragdoll);
        return ragdoll;
    },

    update(dt) {
        if (typeof PhysicsBridge === 'undefined') return;

        for (let i = this.activeRagdolls.length - 1; i >= 0; i--) {
            const rd = this.activeRagdolls[i];
            rd.age += dt;

            if (!rd.held) {
                // Eklem kuvveti — parçalar dağılmasın
                rd.joints.forEach(j => {
                    const ba = PhysicsBridge.bodies[j.a.physicsId];
                    const bb = PhysicsBridge.bodies[j.b.physicsId];
                    if (!ba || !bb) return;
                    const dx = bb.x - ba.x;
                    const dy = bb.y - ba.y;
                    const dz = bb.z - ba.z;
                    const dist = Math.sqrt(dx*dx + dy*dy + dz*dz) || 0.01;
                    const diff = dist - j.restDist;
                    const k = 0.15;
                    const fx = (dx / dist) * diff * k;
                    const fy = (dy / dist) * diff * k;
                    const fz = (dz / dist) * diff * k;
                    ba.vx = (ba.vx || 0) + fx;
                    ba.vy = (ba.vy || 0) + fy;
                    ba.vz = (ba.vz || 0) + fz;
                    bb.vx = (bb.vx || 0) - fx;
                    bb.vy = (bb.vy || 0) - fy;
                    bb.vz = (bb.vz || 0) - fz;
                });

                // Görsel zombi mesh — fizik merkezine taşı
                if (rd.zombieMesh && rd.zombieMesh.visible) {
                    let sx = 0, sy = 0, sz = 0, count = 0;
                    rd.parts.forEach(p => {
                        const b = PhysicsBridge.bodies[p.physicsId];
                        if (b) { sx += b.x; sy += b.y; sz += b.z; count++; }
                    });
                    if (count > 0) {
                        rd.zombieMesh.position.x = sx / count;
                        rd.zombieMesh.position.y = (sy / count) - 0.9;
                        rd.zombieMesh.position.z = sz / count;
                        rd.zombieMesh.rotation.x = -Math.PI / 2;
                    }
                }

                // 50m uzaksa sil
                const p0 = PhysicsBridge.bodies[rd.parts[0].physicsId];
                if (p0 && typeof Player !== 'undefined' && Player.position) {
                    const ddx = p0.x - Player.position.x;
                    const ddz = p0.z - Player.position.z;
                    if (ddx*ddx + ddz*ddz > 50*50) {
                        this.remove(rd);
                        this.activeRagdolls.splice(i, 1);
                        continue;
                    }
                }
            }

            if (rd.age > 120) {
                this.remove(rd);
                this.activeRagdolls.splice(i, 1);
            }
        }
    },

    tryGrab(playerPos, playerDir, range) {
        range = range || 3.5;
        let closest = null, closestDist = range;
        for (const rd of this.activeRagdolls) {
            for (const p of rd.parts) {
                const b = PhysicsBridge.bodies[p.physicsId];
                if (!b) continue;
                const dx = b.x - playerPos.x;
                const dy = b.y - (playerPos.y - 0.8);
                const dz = b.z - playerPos.z;
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                if (dist > closestDist) continue;
                const dot = (dx * playerDir.x + dz * playerDir.z) / (dist || 1);
                if (dot < 0.3) continue;
                closestDist = dist;
                closest = { rd: rd, part: p };
            }
        }
        if (closest) {
            closest.rd.held = true;
            closest.rd.heldPart = closest.part;
            if (typeof Effects !== 'undefined') Effects.addKillFeed('✋ Ceset tutuldu', '#0ff');
            return closest.rd;
        }
        return null;
    },

    updateHeld(playerPos, playerDir, holdDist) {
        for (const rd of this.activeRagdolls) {
            if (!rd.held || !rd.heldPart) continue;
            const targetX = playerPos.x + playerDir.x * holdDist;
            const targetY = (playerPos.y - 1.0) + playerDir.y * holdDist;
            const targetZ = playerPos.z + playerDir.z * holdDist;

            const b = PhysicsBridge.bodies[rd.heldPart.physicsId];
            if (b) {
                b.vx = (targetX - b.x) * 8;
                b.vy = (targetY - b.y) * 8;
                b.vz = (targetZ - b.z) * 8;
            }

            rd.parts.forEach(p => {
                if (p === rd.heldPart) return;
                const pb = PhysicsBridge.bodies[p.physicsId];
                const hb = PhysicsBridge.bodies[rd.heldPart.physicsId];
                if (!pb || !hb) return;
                const tx = hb.x + p.restX;
                const ty = hb.y + p.restY;
                const tz = hb.z + p.restZ;
                pb.vx = (pb.vx || 0) + (tx - pb.x) * 4;
                pb.vy = (pb.vy || 0) + (ty - pb.y) * 4;
                pb.vz = (pb.vz || 0) + (tz - pb.z) * 4;
            });

            // Görsel mesh takip
            if (rd.zombieMesh) {
                let sx = 0, sy = 0, sz = 0, count = 0;
                rd.parts.forEach(p => {
                    const pb = PhysicsBridge.bodies[p.physicsId];
                    if (pb) { sx += pb.x; sy += pb.y; sz += pb.z; count++; }
                });
                if (count > 0) {
                    rd.zombieMesh.position.x = sx / count;
                    rd.zombieMesh.position.y = (sy / count) - 0.9;
                    rd.zombieMesh.position.z = sz / count;
                }
            }
        }
    },

    releaseHeld() {
        for (const rd of this.activeRagdolls) {
            rd.held = false;
            rd.heldPart = null;
        }
    },

    remove(ragdoll) {
        if (ragdoll.zombieMesh && this.scene) {
            try { this.scene.remove(ragdoll.zombieMesh); } catch (e) {}
        }
        ragdoll.parts.forEach(p => {
            if (p.physicsId) PhysicsBridge.remove(p.physicsId);
        });
    },

    clearAll() {
        this.activeRagdolls.forEach(r => this.remove(r));
        this.activeRagdolls = [];
    }
};

    toggleView() {

        if (now - this.lastViewSwitch < 300) return;
        this.lastViewSwitch = now;

        if (typeof Vehicle !== 'undefined' && Vehicle.onVehicle) {
            Vehicle.toggleCamera();
            return;
        }

        this.exteriorView = !this.exteriorView;
        if (this.exteriorModel) this.exteriorModel.visible = this.exteriorView;
        if (this.group) this.group.visible = !this.exteriorView;
        Player.exteriorView = this.exteriorView;

        if (typeof Effects !== 'undefined') {
            Effects.addKillFeed(this.exteriorView ? '📷 Dis gorunus' : '📷 Ic gorunus', '#0ff');
        }
    },

    update(dt, isMoving, isSprinting, onGround, verticalVelocity) {
        const now = performance.now() * 0.001;
        this.isMoving = isMoving;

        // Motorda vucut gizle
        if (typeof Vehicle !== 'undefined' && Vehicle.onVehicle) {
            if (this.group) this.group.visible = false;
            if (this.exteriorModel) this.exteriorModel.visible = false;
            return;
        }

        if (!this.parts || !this.parts.lUpperLeg) return;

        // 1. sahis animasyon
        if (isMoving && onGround) {
            const speed = isSprinting ? 12 : 8;
            this.stepPhase += dt * speed;
            const swing = Math.sin(this.stepPhase) * 0.5;

            this.parts.lUpperLeg.rotation.x = swing;
            this.parts.rUpperLeg.rotation.x = -swing;
            this.parts.lLowerLeg.rotation.x = Math.max(0, -Math.sin(this.stepPhase) * 0.5);
            this.parts.rLowerLeg.rotation.x = Math.max(0, Math.sin(this.stepPhase) * 0.5);
            this.parts.lArm.rotation.x = -swing * 0.6;
            this.parts.rArm.rotation.x = swing * 0.3;
            this.parts.torso.rotation.z = Math.sin(this.stepPhase * 0.5) * 0.05;
        } else if (onGround) {
            ['lUpperLeg','rUpperLeg','lLowerLeg','rLowerLeg','lArm','rArm'].forEach(k => {
                if (this.parts[k]) this.parts[k].rotation.x *= 0.9;
            });
            if (this.parts.torso) this.parts.torso.rotation.z *= 0.9;
        } else {
            this.parts.lUpperLeg.rotation.x = -0.3;
            this.parts.rUpperLeg.rotation.x = 0.3;
            this.parts.lLowerLeg.rotation.x = 0.4;
            this.parts.rLowerLeg.rotation.x = 0.2;
            this.parts.lArm.rotation.x = -0.5;
            this.parts.rArm.rotation.x = -0.3;
        }

        // 3. sahis
        if (this.exteriorView) {
            if (this.exteriorModel) {
                this.exteriorModel.position.set(Player.position.x, 0, Player.position.z);
                this.exteriorModel.rotation.y = Player.yaw;

                if (isMoving && onGround) {
                    const swing = Math.sin(this.stepPhase) * 0.3;
                    if (this.exteriorModel.children[3]) this.exteriorModel.children[3].rotation.x = swing;
                    if (this.exteriorModel.children[4]) this.exteriorModel.children[4].rotation.x = -swing;
                }
            }

            const camDist = this.exteriorDistance;
            const camBackX = Math.sin(Player.yaw) * camDist;
            const camBackZ = Math.cos(Player.yaw) * camDist;

            Game.camera.position.set(
                Player.position.x + camBackX,
                this.exteriorHeight,
                Player.position.z + camBackZ
            );

            Game.camera.rotation.order = 'YXZ';
            Game.camera.rotation.y = Player.yaw + Math.PI;
            Game.camera.rotation.x = Player.pitch;
        }
    }
};

﻿// ===== TUTMA / TAŞIMA - DÜZELTİLDİ =====
const Pickup = {
    scene: null,
    camera: null,
    heldObject: null,
    physicsObjects: [],
    holdDistance: 2.2,
    lastThrow: 0,
    throwCooldown: 250,
    grabRange: 4.0,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;

        // Basılı sol tık ile tut
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && typeof Weapons !== 'undefined' && Weapons.isBareHand && !this._heldRagdoll && !this.heldObject) {
                this.startHolding = true;
                this.holdTimer = 0;
            }
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                this.startHolding = false;
                if (this._heldRagdoll) {
                    Ragdoll.releaseHeld();
                    this._heldRagdoll = null;
                    if (typeof Effects !== 'undefined') Effects.addKillFeed('⬇️ Ceset bırakıldı', '#888');
                }
                if (this.heldObject) this.drop();
            }
        });
    },

    

    // 🎯 KALİTELİ TUTMA - Sphere cast
    tryGrab() {
        console.log('🔍 tryGrab çağrıldı, physicsObjects:', this.physicsObjects.length);
        // Önce ragdoll dene
        if (typeof Ragdoll !== 'undefined') {
            const dir = new THREE.Vector3();
            this.camera.getWorldDirection(dir);
            const rd = Ragdoll.tryGrab(this.camera.position, dir, 3.5);
            if (rd) {
                this._heldRagdoll = rd;
                return;
            }
        }
        // Sonra normal obje
        const camDir = new THREE.Vector3();
        this.camera.getWorldDirection(camDir);
        const camPos = this.camera.position.clone();

        let closest = null;
        let closestDist = Infinity;

        // Kameranın önündeki objeleri tara
        for (const obj of this.physicsObjects) {
            if (!obj.mesh || obj.isHeld) continue;

            const objPos = obj.mesh.position.clone();
            const toObj = objPos.clone().sub(camPos);
            const dist = toObj.length();
            
            if (dist > this.grabRange) continue;

            // Kamera yönü ile açı kontrolü
            const angle = camDir.angleTo(toObj);
            if (angle > Math.PI / 3) continue; // 60 dereceden fazla açı

            if (dist < closestDist) {
                closestDist = dist;
                closest = obj;
            }
        }

        if (closest) {
            this.heldObject = closest;
            closest.isHeld = true;
            closest.velocity.set(0, 0, 0);
            closest.angularVelocity.set(0, 0, 0);
            
            Effects.addKillFeed(`✋ Tutuldu! (F: bırak | Sol Tık: fırlat)`, '#0ff');
        } else {
            Effects.addKillFeed('🚫 Yakında obje yok', '#888');
        }
    },

    throw() {
        if (!this.heldObject) return;
        
        const now = performance.now();
        if (now - this.lastThrow < this.throwCooldown) return;
        this.lastThrow = now;

        const obj = this.heldObject;
        const dir = new THREE.Vector3();
        this.camera.getWorldDirection(dir);

        const throwSpeed = 25;
        obj.velocity = dir.clone().multiplyScalar(throwSpeed);
        obj.velocity.y += 3;
        obj.isHeld = false;
        obj.isThrown = true;
        obj.thrownTime = now;

        // Hafif dönme
        obj.angularVelocity.set(
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20,
            (Math.random() - 0.5) * 20
        );

        this.heldObject = null;
        
        Effects.addKillFeed(`💨 ${obj.type === 'log' ? '🪵' : '🪨'} Fırlatıldı!`, '#fa0');
        Effects.shake(0.05);
    },

    drop() {
        if (!this.heldObject) return;
        const obj = this.heldObject;
        
        // Yumuşak bırakma - hafif ileri at
        const dir = new THREE.Vector3();
        this.camera.getWorldDirection(dir);
        obj.velocity = dir.clone().multiplyScalar(2);
        obj.isHeld = false;
        
        this.heldObject = null;
        Effects.addKillFeed('⬇️ Bırakıldı', '#888');
    },

    register(mesh, type, mass) {
        type = type || 'stone'; mass = mass || 1;
        console.log('📦 Register:', type, 'toplam:', this.physicsObjects.length + 1);
        mesh.userData.isPickup = true;
        this.physicsObjects.push({
            mesh: mesh,
            type: type,
            mass: mass,
            velocity: new THREE.Vector3(),
            angularVelocity: new THREE.Vector3(),
            isHeld: false,
            isThrown: false,
            thrownTime: 0,
            physics: true
        });
    },

    update(dt) {
        // Basılı sol tık ile tut
        if (this.startHolding && !this._heldRagdoll && !this.heldObject) {
            this.holdTimer = (this.holdTimer || 0) + dt;
            if (this.holdTimer > 0.3) {
                this.tryGrab();
                this.startHolding = false;
            }
        }
        // Ragdoll tutma
        if (this._heldRagdoll && typeof Ragdoll !== 'undefined') {
            const dir = new THREE.Vector3();
            this.camera.getWorldDirection(dir);
            Ragdoll.updateHeld(this.camera.position, dir, 2.0);
        }
        // Tutulan obje - kameranın önünde
        if (this.heldObject) {
            const dir = new THREE.Vector3();
            this.camera.getWorldDirection(dir);
            const targetPos = this.camera.position.clone()
                .add(dir.multiplyScalar(this.holdDistance));
            targetPos.y = Math.max(0.5, targetPos.y - 0.3);

            // Yumuşak takip
            this.heldObject.mesh.position.lerp(targetPos, 0.4);
            this.heldObject.mesh.rotation.y += dt * 0.8;
        }

        // Fizik güncellemesi
        for (const obj of this.physicsObjects) {
            if (obj.isHeld || !obj.mesh) continue;

            const v = obj.velocity;

            // Yerçekimi
            v.y -= 24 * dt;

            // Hava direnci
            v.multiplyScalar(0.998);

            // Konum
            obj.mesh.position.x += v.x * dt;
            obj.mesh.position.y += v.y * dt;
            obj.mesh.position.z += v.z * dt;

            // Dönme
            obj.mesh.rotation.x += obj.angularVelocity.x * dt;
            obj.mesh.rotation.y += obj.angularVelocity.y * dt;
            obj.mesh.rotation.z += obj.angularVelocity.z * dt;
            obj.angularVelocity.multiplyScalar(0.97);

            // Zemin
            if (obj.mesh.position.y < 0.25) {
                obj.mesh.position.y = 0.25;
                
                if (v.y < -1.5) {
                    v.y = -v.y * 0.4;
                    v.x *= 0.75;
                    v.z *= 0.75;
                    obj.angularVelocity.multiplyScalar(0.7);
                    
                    if (Math.abs(v.y) > 2) {
                        Particles.groundImpact(obj.mesh.position, 0.6);
                        Audio.playBodyImpact();
                    }
                } else {
                    v.y = 0;
                    v.x *= 0.9;
                    v.z *= 0.9;
                    obj.angularVelocity.multiplyScalar(0.85);
                }
            }

            // Fırlatılan obje düşmanlara çarpar
            if (obj.isThrown) {
                const now = performance.now();
                if (now - obj.thrownTime < 3000) {
                    const speed = obj.velocity.length();
                    if (speed > 4) {
                        for (const enemy of Enemy.list) {
                            if (!enemy || !enemy.mesh) continue;
                            const targetPos = enemy.mesh.position.clone();
                            targetPos.y += 1;
                            const dist = obj.mesh.position.distanceTo(targetPos);
                            
                            if (dist < 1.3) {
                                const dmg = (obj.type === 'log' ? 90 : 60) * (speed / 20);
                                Enemy.damage(enemy, dmg, obj.mesh.position.clone(), 1);
                                
                                obj.velocity.multiplyScalar(0.2);
                                obj.isThrown = false;
                                Effects.shake(0.15);
                                Audio.playBodyImpact();
                                Particles.bloodBurst(obj.mesh.position, 1.5);
                                break;
                            }
                        }
                    }
                }
            }

            // Duvar sınırları
            const limit = 195;
            if (Math.abs(obj.mesh.position.x) > limit) {
                obj.mesh.position.x = Math.sign(obj.mesh.position.x) * limit;
                v.x *= -0.4;
            }
            if (Math.abs(obj.mesh.position.z) > limit) {
                obj.mesh.position.z = Math.sign(obj.mesh.position.z) * limit;
                v.z *= -0.4;
            }

            // Çok yavaşladıysa durdur
            if (v.lengthSq() < 0.01 && obj.mesh.position.y <= 0.26) {
                v.set(0, 0, 0);
                obj.angularVelocity.multiplyScalar(0.5);
            }
        }
    },

    onClick() {
        if (this.heldObject) {
            this.throw();
            return true;
        }
        return false;
    },

    clearAll() {
        this.physicsObjects = [];
        this.heldObject = null;
    }
};

const Bushes = {
    scene: null,
    camera: null,
    bushes: [],
    range: 3.0,
    lastBreak: 0,
    breakCooldown: 200,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                if (typeof Vehicle === 'undefined' || !Vehicle.onVehicle) {
                    this.tryBreak();
                }
            }
        });
    },

    create(x, z) {
        const bushMat = new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.28 + Math.random() * 0.08, 0.5, 0.15 + Math.random() * 0.1),
            roughness: 0.95
        });

        const group = new THREE.Group();
        const spheres = 3 + Math.floor(Math.random() * 3);

        for (let i = 0; i < spheres; i++) {
            const size = 0.3 + Math.random() * 0.3;
            const bush = new THREE.Mesh(
                new THREE.IcosahedronGeometry(size, 0),
                bushMat
            );
            bush.position.set(
                (Math.random() - 0.5) * 0.5,
                size * 0.6 + Math.random() * 0.2,
                (Math.random() - 0.5) * 0.5
            );
            bush.castShadow = true;
            group.add(bush);
        }

        group.position.set(x, 0, z);
        group.userData.isBush = true;
        this.scene.add(group);

        this.bushes.push({
            mesh: group,
            originalPos: new THREE.Vector3(x, 0, z),
            health: 1
        });
    },

    tryBreak() {
        const now = performance.now();
        if (now - this.lastBreak < this.breakCooldown) return;

        const camDir = new THREE.Vector3();
        this.camera.getWorldDirection(camDir);
        const camPos = this.camera.position.clone();

        for (const bush of this.bushes) {
            if (!bush.mesh || bush.health <= 0) continue;

            const dist = bush.mesh.position.distanceTo(camPos);
            if (dist > this.range) continue;

            const toBush = bush.mesh.position.clone().sub(camPos).normalize();
            const angle = camDir.angleTo(toBush);
            if (angle > Math.PI / 3) continue;

            this.lastBreak = now;
            this.breakBush(bush);
            return;
        }
    },

    breakBush(bush) {
        if (!bush || !bush.mesh) return;

        const pos = bush.mesh.position.clone();

        if (Audio.playBushBreak) Audio.playBushBreak();

        try {
            Particles.burst(pos, {
                count: 25, color: 0x3a6a2a, size: 0.15, spread: 0.5,
                speed: 4, gravity: -8, life: 1.0
            });
        } catch (e) {}

        if (typeof Achievements !== 'undefined') Achievements.check('bush_cut');

        this.scene.remove(bush.mesh);
        bush.health = 0;

        const idx = this.bushes.indexOf(bush);
        if (idx > -1) this.bushes.splice(idx, 1);

        if (Effects && Effects.addKillFeed) {
            Effects.addKillFeed('🌿 Cali ezildi!', '#8a4');
        }
    },

    update(dt) {},

    reset() {
        for (let i = 0; i < 20; i++) {
            const x = (Math.random() - 0.5) * 380;
            const z = (Math.random() - 0.5) * 380;
            if (Math.sqrt(x*x + z*z) > 15) {
                this.create(x, z);
            }
        }
    },

    clearAll() {
        this.bushes.forEach(b => {
            if (b.mesh) this.scene.remove(b.mesh);
        });
        this.bushes = [];
    }
};

﻿// ===== DECAL - OPTİMİZE =====
const Decals = {
    scene: null,
    bloodDecals: [],
    footprints: [],
    maxBloodDecals: 5,  // 🔥 50 → 15
    maxFootprints: 3,    // 🔥 30 → 10
    lastFootprint: 0,
    footstepCooldown: 800,  // 🔥 400 → 800 (daha az)

    init(scene) {
        this.scene = scene;
    },

    addBlood(position, size = 0.5) {
        // Çok fazla varsa en eskisini sil
        if (this.bloodDecals.length >= this.maxBloodDecals) {
            const old = this.bloodDecals.shift();
            this.scene.remove(old.mesh);
            old.mesh.geometry.dispose();
            old.mesh.material.dispose();
        }

        const geo = new THREE.CircleGeometry(size, 6);  // 8 → 6
        const mat = new THREE.MeshBasicMaterial({
            color: 0x660000,
            transparent: true,
            opacity: 0.7,
            depthWrite: false
        });
        
        const decal = new THREE.Mesh(geo, mat);
        decal.rotation.x = -Math.PI / 2;
        decal.position.set(position.x, 0.02, position.z);
        decal.rotation.z = Math.random() * Math.PI * 2;
        this.scene.add(decal);
        
        this.bloodDecals.push({
            mesh: decal,
            age: 0,
            maxAge: 15  // 30 → 15 saniye
        });
    },

    addFootprint(position, rotation) {
        const now = performance.now();
        if (now - this.lastFootprint < this.footstepCooldown) return;
        this.lastFootprint = now;
        
        if (this.footprints.length >= this.maxFootprints) {
            const old = this.footprints.shift();
            this.scene.remove(old.mesh);
            old.mesh.geometry.dispose();
            old.mesh.material.dispose();
        }
        
        const geo = new THREE.PlaneGeometry(0.15, 0.3);
        const mat = new THREE.MeshBasicMaterial({
            color: 0x2a2a1a,
            transparent: true,
            opacity: 0.4,
            depthWrite: false
        });
        
        const fp = new THREE.Mesh(geo, mat);
        fp.rotation.x = -Math.PI / 2;
        fp.rotation.z = rotation;
        fp.position.set(position.x, 0.01, position.z);
        this.scene.add(fp);
        
        this.footprints.push({
            mesh: fp,
            age: 0,
            maxAge: 5  // 8 → 5
        });
    },

    update(dt) {
        for (let i = this.bloodDecals.length - 1; i >= 0; i--) {
            const d = this.bloodDecals[i];
            d.age += dt;
            
            if (d.age > d.maxAge - 3) {
                d.mesh.material.opacity = Math.max(0, 0.7 * (d.maxAge - d.age) / 3);
            }
            
            if (d.age > d.maxAge) {
                this.scene.remove(d.mesh);
                d.mesh.geometry.dispose();
                d.mesh.material.dispose();
                this.bloodDecals.splice(i, 1);
            }
        }
        
        for (let i = this.footprints.length - 1; i >= 0; i--) {
            const f = this.footprints[i];
            f.age += dt;
            
            if (f.age > f.maxAge) {
                this.scene.remove(f.mesh);
                f.mesh.geometry.dispose();
                f.mesh.material.dispose();
                this.footprints.splice(i, 1);
            }
        }
    },

    clearAll() {
        this.bloodDecals.forEach(d => {
            this.scene.remove(d.mesh);
            d.mesh.geometry.dispose();
            d.mesh.material.dispose();
        });
        this.footprints.forEach(f => {
            this.scene.remove(f.mesh);
            f.mesh.geometry.dispose();
            f.mesh.material.dispose();
        });
        this.bloodDecals = [];
        this.footprints = [];
    }
};

const Weather = {
    scene: null,
    camera: null,
    particles: null,
    particleGeo: null,
    particleCount: 300,  // 🔥 2000 → 300
    currentWeather: 'clear',
    weatherTimer: 0,
    weatherDuration: 60000,
    rainMat: null,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;
        
        this.createParticles();
        this.setWeather('clear');
        
        setInterval(() => this.changeWeather(), this.weatherDuration);
    },

    createParticles() {
        const count = this.particleCount;
        const geo = new THREE.BufferGeometry();
        const positions = new Float32Array(count * 3);

        for (let i = 0; i < count; i++) {
            positions[i*3] = (Math.random() - 0.5) * 150;
            positions[i*3 + 1] = Math.random() * 50 + 10;
            positions[i*3 + 2] = (Math.random() - 0.5) * 150;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

        const mat = new THREE.PointsMaterial({
            color: 0xaabbcc,
            size: 0.15,
            transparent: true,
            opacity: 0,
            depthWrite: false
        });

        const points = new THREE.Points(geo, mat);
        this.scene.add(points);

        this.particles = points;
        this.particleGeo = geo;
        this.rainMat = mat;
    },

    changeWeather() {
        const types = ['clear', 'clear', 'rain', 'clear', 'snow', 'clear'];
        const next = types[Math.floor(Math.random() * types.length)];
        this.setWeather(next);
    },

    setWeather(type) {
        this.currentWeather = type;
        
        Effects.addKillFeed(
            type === 'clear' ? '☀️ Hava açıldı' :
            type === 'rain' ? '🌧️ Yağmur başladı' :
            '❄️ Kar yağışı',
            '#8af'
        );

        if (type === 'rain') {
            this.rainMat.color.setHex(0x6688aa);
            this.rainMat.size = 0.1;
            this.rainMat.opacity = 0.4;
            if (this.scene.fog) {
                this.scene.fog.far = 150;
            }
        } else if (type === 'snow') {
            this.rainMat.color.setHex(0xffffff);
            this.rainMat.size = 0.2;
            this.rainMat.opacity = 0.6;
            if (this.scene.fog) {
                this.scene.fog.far = 170;
            }
        } else {
            this.rainMat.opacity = 0;
            if (this.scene.fog) {
                this.scene.fog.far = 180;
            }
        }
    },

    update(dt) {
        if (!this.particles || !this.particleGeo) return;
        if (this.rainMat.opacity <= 0.01) return;
        
        const posAttr = this.particleGeo.attributes.position;
        const camPos = this.camera.position;
        
        for (let i = 0; i < this.particleCount; i++) {
            posAttr.array[i*3 + 1] -= dt * 30;

            const dx = posAttr.array[i*3] - camPos.x;
            const dz = posAttr.array[i*3 + 2] - camPos.z;
            const distSq = dx * dx + dz * dz;
            
            if (distSq > 80 * 80 || posAttr.array[i*3 + 1] < -2) {
                posAttr.array[i*3] = camPos.x + (Math.random() - 0.5) * 60;
                posAttr.array[i*3 + 1] = camPos.y + 15 + Math.random() * 15;
                posAttr.array[i*3 + 2] = camPos.z + (Math.random() - 0.5) * 60;
            }
        }
        
        posAttr.needsUpdate = true;
    },

    reset() {
        this.setWeather('clear');
    }
};

const Stats = {
    kills: 0,
    headshots: 0,
    heartshots: 0,
    shotsFired: 0,
    shotsHit: 0,
    wavesCompleted: 0,
    totalScore: 0,
    damageDealt: 0,
    fps: 0,
    frames: 0,
    lastFpsTime: 0,
    fpsElement: null,

    init() {
        this.fpsElement = document.createElement('div');
        this.fpsElement.id = 'fps-counter';
        this.fpsElement.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#0f0;padding:5px 12px;border:1px solid #0f0;border-radius:4px;font-family:monospace;font-size:13px;font-weight:bold;z-index:100;pointer-events:none;text-shadow:0 0 4px #0f0;';
        document.body.appendChild(this.fpsElement);

        this.createStatsPanel();

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyP' && e.shiftKey) {
                this.takeScreenshot();
            }
        });
    },

    createStatsPanel() {
        const panel = document.createElement('div');
        panel.id = 'stats-panel';
        panel.style.cssText = 'position:fixed;top:60px;right:20px;background:rgba(0,0,0,0.7);color:#8f8;padding:10px 15px;border:1px solid #0a0;border-radius:6px;font-family:monospace;font-size:12px;z-index:100;display:none;min-width:180px;text-shadow:0 0 4px #0f0;';
        document.body.appendChild(panel);

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Tab') {
                e.preventDefault();
                panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
                this.updateStatsPanel();
            }
        });
    },

    updateStatsPanel() {
        const panel = document.getElementById('stats-panel');
        if (!panel) return;
        if (panel.style.display === 'none') return;

        const accuracy = this.shotsFired > 0 ? ((this.shotsHit / this.shotsFired) * 100).toFixed(1) : '0.0';
        const headshotRate = this.kills > 0 ? ((this.headshots / this.kills) * 100).toFixed(1) : '0.0';

        let html = ''
            + '<div style="color:#0ff;margin-bottom:8px;font-weight:bold;">📊 ISTATISTIKLER</div>'
            + '<div>💀 Kill: <b style="color:#ff0">' + this.kills + '</b></div>'
            + '<div>🎯 Headshot: <b style="color:#ff0">' + this.headshots + '</b> (' + headshotRate + '%)</div>'
            + '<div>💗 Heartshot: <b style="color:#f44">' + this.heartshots + '</b></div>'
            + '<div>🔫 Atis: <b>' + this.shotsFired + '</b></div>'
            + '<div>✅ Isabet: <b>' + this.shotsHit + '</b></div>'
            + '<div>📈 Isabet: <b style="color:#0f0">' + accuracy + '%</b></div>'
            + '<div>💥 Hasar: <b style="color:#fa0">' + Math.round(this.damageDealt) + '</b></div>'
            + '<div>🌊 Dalga: <b>' + this.wavesCompleted + '</b></div>';

        // Chunk bilgisi
        try {
            if (typeof ChunkSystem !== 'undefined' && typeof Instancing !== 'undefined') {
                const cs = ChunkSystem.getStats();
                const is = Instancing.getStats();
                html += '<div style="margin-top:8px;padding-top:8px;border-top:1px solid #0a0;font-size:11px;color:#8af;">'
                    + '<div>🗺️ Chunk: ' + cs.visible + '/' + cs.total + '</div>'
                    + '<div>🎨 Instance: ' + is.totalInstances + '</div></div>';
            }
        } catch (e) {}

        html += '<div style="margin-top:8px;font-size:10px;color:#666;">Tab: Kapat | Shift+P: Screenshot</div>';
        panel.innerHTML = html;
    },

    takeScreenshot() {
        if (!Game.renderer) return;
        try {
            Game.renderer.render(Game.scene, Game.camera);
            const dataURL = Game.renderer.domElement.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = 'zombi-arena-' + Date.now() + '.png';
            link.href = dataURL;
            link.click();
            Effects.addKillFeed('📸 Screenshot kaydedildi!', '#0ff');
        } catch (e) {
            Effects.addKillFeed('⚠️ Screenshot hatasi', '#f00');
        }
    },

    registerKill(isHead, isHeart) {
        this.kills++;
        if (isHead) this.headshots++;
        if (isHeart) this.heartshots++;
        this.updateStatsPanel();
    },

    registerShot() { this.shotsFired++; },
    registerHit() { this.shotsHit++; },
    registerDamage(dmg) { this.damageDealt += dmg; },
    registerWaveComplete() { this.wavesCompleted++; },

    updateFPS(now) {
        this.frames++;
        if (now - this.lastFpsTime >= 1000) {
            this.fps = this.frames;
            this.frames = 0;
            this.lastFpsTime = now;
            if (this.fpsElement) {
                const color = this.fps >= 50 ? '#0f0' : this.fps >= 30 ? '#ff0' : '#f00';
                this.fpsElement.textContent = 'FPS: ' + this.fps;
                this.fpsElement.style.color = color;
            }
        }
    },

    reset() {
        this.kills = 0;
        this.headshots = 0;
        this.heartshots = 0;
        this.shotsFired = 0;
        this.shotsHit = 0;
        this.wavesCompleted = 0;
        this.totalScore = 0;
        this.damageDealt = 0;
        this.updateStatsPanel();
    }
};
