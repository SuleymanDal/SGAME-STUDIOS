﻿// ===== ENVANTER SİSTEMİ =====
const Inventory = {
    items: [],
    maxWeight: 50,
    currentWeight: 0,
    equippedSlot: 0,
    
    // Envanter slotları (silahlar + eşyalar)
    slots: [],
    maxSlots: 8,
    
    // Envanter açık mı
    isOpen: false,
    uiElement: null,

    init() {
        this.createUI();
        
        // Tab veya I tuşu ile aç
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyI') {
                this.toggleUI();
            }
        });
    },

    createUI() {
        // Envanter paneli
        const panel = document.createElement('div');
        panel.id = 'inventory-panel';
        panel.style.cssText = `
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 500px;
            max-height: 70vh;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #0f0;
            border-radius: 12px;
            padding: 20px;
            z-index: 200;
            display: none;
            font-family: 'Courier New', monospace;
            color: #0f0;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.4);
        `;
        panel.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="color: #0ff; margin: 0; letter-spacing: 3px;">🎒 ENVANTER</h2>
                <div style="color: #8f8;">Ağırlık: <span id="inv-weight">0</span>/<span id="inv-max-weight">50</span> kg</div>
            </div>
            <div id="inventory-slots" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;"></div>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #0a0; font-size: 12px; color: #8f8;">
                <div>📌 Kontroller:</div>
                <div>• 1-5: Slot seç</div>
                <div>• E: Eşya kullan</div>
                <div>• I: Envanter aç/kapat</div>
            </div>
        `;
        document.body.appendChild(panel);
        this.uiElement = panel;
    },

    // Eşya ekle
    addItem(item) {
        // Ağırlık kontrolü
        if (this.currentWeight + (item.weight || 0) > this.maxWeight) {
            Effects.addKillFeed('⚖️ Envanter dolu!', '#f80');
            return false;
        }

        // Aynı tip eşya var mı?
        const existing = this.items.find(i => i.id === item.id && i.stackable);
        if (existing) {
            existing.count = (existing.count || 1) + (item.count || 1);
        } else {
            // Boş slot var mı?
            if (this.slots.length >= this.maxSlots) {
                Effects.addKillFeed('📦 Envanter dolu!', '#f80');
                return false;
            }
            this.slots.push(item);
        }

        this.items.push(item);
        this.currentWeight += item.weight || 0;
        this.updateUI();
        
        Effects.addKillFeed(`📦 Alındı: ${item.icon || '📦'} ${item.name}`, '#0f0');
        
        // Başarım kontrolü
        if (typeof Achievements !== 'undefined') {
            Achievements.check('collect_item', { item: item });
        }
        
        return true;
    },

    // Eşya kullan
    useItem(item) {
        if (!item) return false;
        
        if (item.type === 'heal') {
            if (typeof Player !== 'undefined') {
                Player.heal(item.healAmount || 25);
                Effects.addKillFeed(`💊 ${item.name} kullanıldı`, '#0f8');
                return true;
            }
        }
        
        if (item.type === 'weapon') {
            // Silah seç
            if (typeof Weapons !== 'undefined') {
                const weaponIndex = Weapons.definitions.findIndex(w => w.id === item.weaponId);
                if (weaponIndex >= 0) {
                    Weapons.equip(weaponIndex);
                    Effects.addKillFeed(`🔫 ${item.name} kuşanıldı`, '#0ff');
                    return true;
                }
            }
        }
        
        return false;
    },

    // Eşya sil
    removeItem(item, count = 1) {
        const idx = this.slots.indexOf(item);
        if (idx === -1) return false;
        
        if (item.stackable && item.count > count) {
            item.count -= count;
        } else {
            this.slots.splice(idx, 1);
            const itemIdx = this.items.indexOf(item);
            if (itemIdx > -1) this.items.splice(itemIdx, 1);
        }
        
        this.currentWeight -= (item.weight || 0) * count;
        if (this.currentWeight < 0) this.currentWeight = 0;
        
        this.updateUI();
        return true;
    },

    toggleUI() {
        this.isOpen = !this.isOpen;
        this.uiElement.style.display = this.isOpen ? 'block' : 'none';
        this.updateUI();
        
        if (this.isOpen) {
            // Pointer lock bırak
            document.exitPointerLock();
        } else {
            // Pointer lock geri al
            if (typeof Game !== 'undefined' && Game.running) {
                setTimeout(() => {
                    try {
                        Game.renderer.domElement.requestPointerLock();
                    } catch(e) {}
                }, 100);
            }
        }
    },

    updateUI() {
        const slotsDiv = document.getElementById('inventory-slots');
        if (!slotsDiv) return;
        
        let html = '';
        for (let i = 0; i < this.maxSlots; i++) {
            const item = this.slots[i];
            if (item) {
                html += `
                    <div style="
                        background: rgba(0, 100, 0, 0.3);
                        border: 2px solid #0f0;
                        border-radius: 6px;
                        padding: 10px;
                        text-align: center;
                        cursor: pointer;
                        transition: all 0.2s;
                    " title="${item.name} - ${item.weight}kg">
                        <div style="font-size: 28px;">${item.icon || '📦'}</div>
                        <div style="font-size: 11px; margin-top: 5px; color: #8f8;">${item.name}</div>
                        ${item.count && item.count > 1 ? `<div style="color:#ff0; font-size:11px;">x${item.count}</div>` : ''}
                    </div>
                `;
            } else {
                html += `
                    <div style="
                        background: rgba(20, 20, 20, 0.5);
                        border: 2px dashed #333;
                        border-radius: 6px;
                        padding: 10px;
                        text-align: center;
                        min-height: 60px;
                    ">
                        <div style="font-size: 20px; color: #333;">·</div>
                    </div>
                `;
            }
        }
        
        slotsDiv.innerHTML = html;
        
        const weightEl = document.getElementById('inv-weight');
        const maxWeightEl = document.getElementById('inv-max-weight');
        if (weightEl) weightEl.textContent = this.currentWeight.toFixed(1);
        if (maxWeightEl) maxWeightEl.textContent = this.maxWeight;
    },

    reset() {
        this.items = [];
        this.slots = [];
        this.currentWeight = 0;
        this.isOpen = false;
        if (this.uiElement) this.uiElement.style.display = 'none';
        this.updateUI();
    }
};

    unlock(id) {
        if (this.unlocked[id]) return false;

    check(event, data) {
        data = data || {};
        switch(event) {
            case 'kill':
                this.stats.kills++;
                if (this.stats.kills >= 1) this.unlock('first_kill');
                if (this.stats.kills >= 10) this.unlock('kill_10');
                if (this.stats.kills >= 50) this.unlock('kill_50');
                if (this.stats.kills >= 100) this.unlock('kill_100');
                if (this.stats.kills >= 500) this.unlock('kill_500');
                if (this.stats.kills >= 1000) this.unlock('kill_1000');
                if (this.stats.kills >= 5000) this.unlock('kill_5000');
                break;
            case 'headshot':
                this.stats.headshots++;
                this.stats.headshotStreak++;
                if (this.stats.headshotStreak > this.stats.maxHeadshotStreak) this.stats.maxHeadshotStreak = this.stats.headshotStreak;
                if (this.stats.headshots >= 10) this.unlock('headshot_10');
                if (this.stats.headshots >= 50) this.unlock('headshot_50');
                if (this.stats.headshots >= 100) this.unlock('headshot_100');
                if (this.stats.headshots >= 500) this.unlock('headshot_500');
                if (this.stats.maxHeadshotStreak >= 5) this.unlock('headshot_streak');
                break;
            case 'heartshot':
                this.stats.heartshots++;
                if (this.stats.heartshots >= 10) this.unlock('heartshot_10');
                break;
            case 'miss':
                this.stats.headshotStreak = 0;
                this.stats.noMissStreak = 0;
                break;
            case 'hit':
                this.stats.shotsHit++;
                this.stats.noMissStreak++;
                if (this.stats.noMissStreak > this.stats.maxNoMissStreak) this.stats.maxNoMissStreak = this.stats.noMissStreak;
                if (this.stats.shotsFired >= 20) {
                    const acc = (this.stats.shotsHit / this.stats.shotsFired) * 100;
                    if (acc >= 50) this.unlock('accuracy_50');
                    if (acc >= 75) this.unlock('accuracy_75');
                    if (acc >= 90) this.unlock('accuracy_90');
                    if (acc >= 95) this.unlock('accuracy_95');
                }
                if (this.stats.noMissStreak >= 10) this.unlock('no_miss_10');
                break;
            case 'shot':
                this.stats.shotsFired++;
                break;
            case 'wave_complete':
                this.stats.wavesCompleted++;
                const w = data.wave || 0;
                this.stats.maxWave = Math.max(this.stats.maxWave, w);
                if (w >= 1) this.unlock('wave_1');
                if (w >= 3) this.unlock('wave_3');
                if (w >= 5) this.unlock('wave_5');
                if (w >= 10) this.unlock('wave_10');
                if (w >= 15) this.unlock('wave_15');
                if (w >= 20) this.unlock('wave_20');
                if (w >= 30) this.unlock('wave_30');
                if (w >= 40) this.unlock('wave_40');
                if (w >= 50) this.unlock('wave_50');
                break;
            case 'kamikaze_kill':
                this.stats.kamikazeKills++;
                if (this.stats.kamikazeKills >= 1) this.unlock('kamikaze_kill_1');
                if (this.stats.kamikazeKills >= 5) this.unlock('kamikaze_kill_5');
                break;
            case 'chain_explosion':
                this.stats.chainExplosions++;
                if (this.stats.chainExplosions >= 2) this.unlock('chain_explosion_2');
                if (this.stats.chainExplosions >= 3) this.unlock('chain_explosion_3');
                if (this.stats.chainExplosions >= 5) this.unlock('chain_explosion_5');
                break;
            case 'melee_kill':
                this.stats.meleeKills++;
                if (this.stats.meleeKills >= 10) this.unlock('melee_kill');
                if (this.stats.meleeKills >= 50) this.unlock('melee_master');
                break;
            case 'bush_cut':
                this.stats.bushCut++;
                if (this.stats.bushCut >= 50) this.unlock('bush_cutter');
                break;
            case 'syringe_used':
                this.stats.syringesUsed++;
                if (this.stats.syringesUsed >= 10) this.unlock('syringe_master');
                break;
            case 'craft':
                this.stats.craftedItems++;
                if (this.stats.craftedItems >= 1) this.unlock('craft_first');
                if (this.stats.craftedItems >= 10) this.unlock('craft_10');
                if (this.stats.craftedItems >= 50) this.unlock('craft_50');
                if (this.stats.craftedItems >= 100) this.unlock('craft_100');
                if (data.item === 'bandage') this.unlock('bandage_craft');
                if (data.item === 'medkit') this.unlock('medkit_craft');
                if (data.item === 'grenade' && this.stats.craftedItems >= 10) this.unlock('grenade_craft_10');
                break;
            case 'inventory_full':
                this.unlock('inventory_full');
                break;
            case 'collect_item':
                if (data.item) {
                    if (data.item.type === 'weapon') {
                        this.stats.weaponsUsed[data.item.weaponId] = true;
                        if (Object.keys(this.stats.weaponsUsed).length >= 3) this.unlock('collect_all_weapons');
                    }
                    if (data.item.id === 'scrap' || data.item.id === 'copper' || data.item.id === 'powder') {
                        this.stats.resourcesCollected++;
                        if (this.stats.resourcesCollected >= 10) this.unlock('collect_10_resources');
                        if (this.stats.resourcesCollected >= 50) this.unlock('collect_50_resources');
                        if (this.stats.resourcesCollected >= 100) this.unlock('collect_100_resources');
                    }
                    if (data.item.id === 'coin') {
                        this.stats.coinsCollected++;
                        if (this.stats.coinsCollected >= 10) this.unlock('coin_10');
                        if (this.stats.coinsCollected >= 50) this.unlock('coin_50');
                        if (this.stats.coinsCollected >= 100) this.unlock('coin_100');
                        if (this.stats.coinsCollected >= 500) this.unlock('coin_500');
                        if (this.stats.coinsCollected >= 1000) this.unlock('coin_1000');
                    }
                    if (data.item.id === 'bandage') this.stats.bandagesUsed++;
                    if (data.item.id === 'medkit') this.stats.medkitsUsed++;
                }
                break;
            case 'heal':
                this.stats.hpHealed += data.amount || 0;
                if (this.stats.hpHealed >= 100) this.unlock('heal_100');
                break;
            case 'no_damage_wave':
                this.stats.damageFreeWaves++;
                if (this.stats.damageFreeWaves >= 1) this.unlock('no_damage_wave');
                if (this.stats.damageFreeWaves >= 3) this.unlock('no_damage_3wave');
                if (this.stats.damageFreeWaves >= 5) this.unlock('no_damage_5wave');
                if (this.stats.damageFreeWaves >= 10) this.unlock('no_hit_10wave');
                if (this.stats.damageFreeWaves >= 20) this.unlock('no_damage_20wave');
                break;
            case 'damage_taken':
                this.stats.damageTaken += data.amount || 0;
                this.stats.damageFreeWaves = 0;
                break;
            case 'survive_time':
                this.stats.timeAlive = data.time || 0;
                if (this.stats.timeAlive >= 600) this.unlock('survive_10min');
                if (this.stats.timeAlive >= 1800) this.unlock('survive_30min');
                if (this.stats.timeAlive >= 3600) this.unlock('survive_60min');
                break;
            case 'merchant_purchase':
                this.stats.merchantPurchases++;
                if (this.stats.merchantPurchases >= 1) this.unlock('merchant_first');
                if (this.stats.merchantPurchases >= 10) this.unlock('merchant_10');
                if (this.stats.merchantPurchases >= 50) this.unlock('merchant_50');
                if (this.stats.merchantPurchases >= 100) this.unlock('merchant_100');
                break;
            case 'boss_kill':
                this.stats.bossKills++;
                if (this.stats.bossKills >= 1) this.unlock('boss_kill_1');
                if (this.stats.bossKills >= 5) this.unlock('boss_kill_5');
                if (this.stats.bossKills >= 10) this.unlock('boss_kill_10');
                break;
        }
        // Tum basarimlar tamam mi?
        if (Object.keys(this.unlocked).length >= this.list.length - 1) this.unlock('all_achievements');
        if (Object.keys(this.unlocked).length >= this.list.length) this.unlock('legend');
    },

    togglePage() {
        const page = document.getElementById('achievement-page');
        if (!page) return;
        const isOpen = page.style.display === 'block';

﻿// ===== ŞIRINGA SİSTEMİ =====
const Syringe = {
    scene: null,
    drops: [],
    dropChance: 0.15,     // %15 düşürme şansı
    healAmount: 25,
    weight: 0.5,

    init(scene) {
        this.scene = scene;
        
        // E tuşu ile şırınga kullan
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyH') this.useHealing();
        });
    },

    // Zombi ölünce düşürme kontrolü
    tryDrop(position) {
        if (Math.random() > this.dropChance) return;
        
        // Şırınga oluştur
        const group = new THREE.Group();
        
        // Şırınga gövdesi
        const bodyMat = new THREE.MeshStandardMaterial({ 
            color: 0xffffff, transparent: true, opacity: 0.6, roughness: 0.3
        });
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8), bodyMat);
        body.rotation.z = Math.PI / 2;
        body.position.y = 0.15;
        group.add(body);
        
        // Yeşil sıvı
        const liquidMat = new THREE.MeshStandardMaterial({ 
            color: 0x44ff44, emissive: 0x22aa22, emissiveIntensity: 0.5, transparent: true, opacity: 0.8
        });
        const liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.2, 8), liquidMat);
        liquid.rotation.z = Math.PI / 2;
        liquid.position.y = 0.15;
        group.add(liquid);
        
        // İğne
        const needleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
        const needle = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.005, 0.15, 6), needleMat);
        needle.rotation.z = Math.PI / 2;
        needle.position.set(0.22, 0.15, 0);
        group.add(needle);
        
        // Piston
        const piston = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.05, 8), needleMat);
        piston.rotation.z = Math.PI / 2;
        piston.position.set(-0.17, 0.15, 0);
        group.add(piston);
        
        // Yeşil ışık (parlama)
        const light = null;
        
        
        
        // Nabız animasyonu
        const pulse = () => {
            if (light.parent) {
                light.intensity = 0.5 + Math.sin(performance.now() * 0.005) * 0.4;
                requestAnimationFrame(pulse);
            }
        };
        
        
        // Yere koy
        group.position.set(
            position.x + (Math.random() - 0.5) * 1,
            0.5,
            position.z + (Math.random() - 0.5) * 1
        );
        
        this.scene.add(group);
        
        this.drops.push({
            mesh: group,
            spawnTime: performance.now(),
            maxLife: 30000,  // 30 saniye
            collected: false
        });
        
        Effects.addKillFeed('💉 Şırınga düştü!', '#0f8');
    },

    update(dt) {
        const now = performance.now();
        const camPos = this.camera ? this.camera.position : Player.position;
        
        for (let i = this.drops.length - 1; i >= 0; i--) {
            const drop = this.drops[i];
            
            if (!drop.mesh) {
                this.drops.splice(i, 1);
                continue;
            }
            
            // Döndürme
            drop.mesh.rotation.y += dt * 1.5;
            
            // Zıplama (yerde sallanma)
            drop.mesh.position.y = 0.4 + Math.sin(now * 0.003) * 0.1;
            
            // Toplama mesafesi
            const dist = drop.mesh.position.distanceTo(camPos);
            if (dist < 1.5 && !drop.collected) {
                // Topla
                drop.collected = true;
                
                if (typeof Inventory !== 'undefined') {
                    Inventory.addItem({
                        id: 'syringe',
                        name: 'Şırınga',
                        icon: '💉',
                        type: 'heal',
                        healAmount: this.healAmount,
                        weight: this.weight,
                        stackable: true,
                        count: 1
                    });
                }
                
                this.scene.remove(drop.mesh);
                this.drops.splice(i, 1);
                Audio.playReload();
            }
            
            // Zaman aşımı
            if (now - drop.spawnTime > drop.maxLife) {
                this.scene.remove(drop.mesh);
                this.drops.splice(i, 1);
            }
        }
    },

    // H tuşu ile şırınga kullan
    useHealing() {
        if (typeof Inventory === 'undefined') return;
        // Oncelik: medkit > bandaj > siringa
        const order = ['medkit', 'bandage', 'syringe'];
        for (const id of order) {
            const item = Inventory.items.find(i => i.id === id);
            if (item) {
                this.useItem(item);
                return;
            }
        }
        Effects.addKillFeed('Iyilestirme esyasi yok', '#888');
    },

    useItem(item) {
        let heal = 0;
        if (item.id === 'syringe') heal = 25;
        else if (item.id === 'bandage') heal = 25;
        else if (item.id === 'medkit') heal = 75;
        else return;

        if (typeof Player !== 'undefined') {
            Player.heal(heal);
            Effects.addKillFeed(item.icon + ' ' + item.name + ' kullanildi (+' + heal + ' HP)', '#0f8');
            if (typeof Achievements !== 'undefined') {
                if (item.id === 'syringe') Achievements.check('syringe_used');
                Achievements.check('heal', { amount: heal });
            }
        }
        Inventory.removeItem(item, 1);
    },

    // Kamera erişimi için
    setCamera(camera) {
        this.camera = camera;
    },

    reset() {
        this.drops.forEach(d => {
            if (d.mesh) this.scene.remove(d.mesh);
        });
        this.drops = [];
    }
};

﻿// ===== CRAFT SISTEMI (onclick YOK) =====
const Crafting = {
    recipes: [
        { id: 'bandage',      name: 'Bandaj (+25 HP)',    icon: '🩹', costs: { syringe: 2 }, reward: { type: 'item', item: 'bandage', amount: 1 } },
        { id: 'medkit',       name: 'Medkit (+75 HP)',    icon: '🩺', costs: { bandage: 2 }, reward: { type: 'item', item: 'medkit', amount: 1 } },
        { id: 'ammo_pistol',  name: 'Tabanca Mermisi (x10)',  icon: '🔫', costs: { scrap: 2, copper: 1 }, reward: { type: 'ammo', weapon: 'pistol', amount: 10 } },
        { id: 'ammo_rifle',   name: 'Taramali Mermisi (x20)', icon: '🔫🔫', costs: { scrap: 3, copper: 2 }, reward: { type: 'ammo', weapon: 'rifle', amount: 20 } },
        { id: 'ammo_shotgun', name: 'Pompali Mermisi (x6)',   icon: '💥', costs: { scrap: 3, copper: 1 }, reward: { type: 'ammo', weapon: 'shotgun', amount: 6 } },
        { id: 'grenade',      name: 'El Bombasi',             icon: '💣', costs: { scrap: 5, powder: 3, copper: 2 }, reward: { type: 'grenade' } }
    ],
    open: false,
    nearbyTable: null,
    holdTime: 0,
    requiredHold: 1500,
    holdingMouse: false,
    scene: null,
    camera: null,
    uiElement: null,
    progressElement: null,
    _rendering: false,
    _clickBound: false,

    init(scene, camera) {
        this.scene = scene;
        this.camera = camera;
        this.createUI();
        this.createTables();

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !this.open) {
                this.holdingMouse = true;
                this.holdTime = 0;
            }
        });
        document.addEventListener('mouseup', (e) => {
            if (e.button === 0) {
                this.holdingMouse = false;
                this.holdTime = 0;
                this.hideProgress();
            }
        });
    },

    createUI() {
        const panel = document.createElement('div');
        panel.id = 'craft-panel';
        panel.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:750px;max-height:80vh;background:rgba(0,0,0,0.95);border:3px solid #f80;border-radius:12px;padding:25px;z-index:200;display:none;font-family:"Courier New",monospace;color:#f80;box-shadow:0 0 40px rgba(255,136,0,0.5);overflow-y:auto;';
        panel.innerHTML = ''
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'
            + '<h2 style="color:#f80;margin:0;letter-spacing:3px;">🔨 CRAFT</h2>'
            + '<div style="color:#ffdd00;font-size:16px;">🪙 <span id="craft-coin-count">0</span></div>'
            + '<button id="craft-close-btn" style="background:transparent;border:2px solid #f80;color:#f80;padding:8px 20px;cursor:pointer;font-family:inherit;font-size:14px;border-radius:6px;">KAPAT</button>'
            + '</div>'
            + '<div id="craft-recipe-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;"></div>';
        document.body.appendChild(panel);
        this.uiElement = panel;

        // Close button — addEventListener (onclick YOK)
        document.getElementById('craft-close-btn').addEventListener('click', () => this.close());

        const progress = document.createElement('div');
        progress.id = 'craft-progress';
        progress.style.cssText = 'position:fixed;top:60%;left:50%;transform:translate(-50%,-50%);width:200px;height:8px;background:rgba(0,0,0,0.8);border:2px solid #f80;border-radius:4px;z-index:150;display:none;overflow:hidden;';
        progress.innerHTML = '<div id="craft-progress-fill" style="height:100%;width:0%;background:#f80;transition:width 0.05s linear;"></div>';
        document.body.appendChild(progress);
        this.progressElement = progress;
    },

    createTables() {
        this.createTable(10, 0, 20);
    },

    createTable(x, y, z) {
        const group = new THREE.Group();
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x6a4020, roughness: 0.85 });
        const metalMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.4, metalness: 0.8 });
        const top = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.15, 1.2), woodMat);
        top.position.y = 0.9;
        group.add(top);
        const legPositions = [[-0.75, 0.4, -0.5], [0.75, 0.4, -0.5], [-0.75, 0.4, 0.5], [0.75, 0.4, 0.5]];
        for (let i = 0; i < legPositions.length; i++) {
            const p = legPositions[i];
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), woodMat);
            leg.position.set(p[0], p[1], p[2]);
            group.add(leg);
        }
        const hammer = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), metalMat);
        hammer.position.set(0.5, 1.05, 0);
        hammer.rotation.z = Math.PI / 4;
        group.add(hammer);
        group.position.set(x, y, z);
        group.userData.isCraftTable = true;
        this.scene.add(group);
    },

    update(dt) {
        if (!this.camera || !this.scene) return;
        const camPos = this.camera.position;
        let nearest = null;
        let nearestDist = 4.0;

        const children = this.scene.children;
        for (let i = 0; i < children.length; i++) {
            const child = children[i];
            if (child.userData && child.userData.isCraftTable) {
                const dist = child.position.distanceTo(camPos);
                if (dist < nearestDist) { nearest = child; nearestDist = dist; }
            }
        }
        this.nearbyTable = nearest;

        if (this.holdingMouse && this.nearbyTable && !this.open) {
            this.holdTime += dt * 1000;
            this.progressElement.style.display = 'block';
            const fill = document.getElementById('craft-progress-fill');
            if (fill) fill.style.width = Math.min(100, (this.holdTime / this.requiredHold) * 100) + '%';
            if (this.holdTime >= this.requiredHold) {
                this.openCrafting();
                this.holdingMouse = false;
                this.holdTime = 0;
                this.hideProgress();
            }
        } else if (!this.holdingMouse) {
            this.hideProgress();
        }
    },

    hideProgress() {
        if (this.progressElement) {
            this.progressElement.style.display = 'none';
            const fill = document.getElementById('craft-progress-fill');
            if (fill) fill.style.width = '0%';
        }
    },

    openCrafting() {
        if (typeof Weapons !== 'undefined' && !Weapons.isBareHand) {
            if (typeof Effects !== 'undefined') Effects.addKillFeed('Craft icin silahi birak', '#f80');
            this.holdingMouse = false;
            this.holdTime = 0;
            return;
        }
        this.open = true;
        this.uiElement.style.display = 'block';
        document.exitPointerLock();
        this.renderRecipes();
        if (typeof Effects !== 'undefined') Effects.addKillFeed('🔨 Craft acildi', '#f80');
    },

    close() {
        this.open = false;
        if (this.uiElement) this.uiElement.style.display = 'none';
        if (typeof Game !== 'undefined' && Game.running) {
            setTimeout(() => {
                try { Game.renderer.domElement.requestPointerLock(); } catch (e) {}
            }, 100);
        }
    },

    renderRecipes() {
        if (this._rendering) return;
        this._rendering = true;

        try {
            const list = document.getElementById('craft-recipe-list');
            if (!list) { this._rendering = false; return; }

            const coinEl = document.getElementById('craft-coin-count');
            if (coinEl) coinEl.textContent = window.HamidoCoins || 0;

            // Envanter ozet
            let invHtml = '';
            if (typeof Inventory !== 'undefined' && Inventory.items) {
                const grouped = {};
                for (let i = 0; i < Inventory.items.length; i++) {
                    const it = Inventory.items[i];
                    if (!grouped[it.id]) grouped[it.id] = { icon: it.icon || '📦', name: it.name, count: 0 };
                    grouped[it.id].count += (it.count || 1);
                }
                const keys = Object.keys(grouped);
                if (keys.length === 0) {
                    invHtml = '<div style="color:#666;font-size:12px;">Envanter bos</div>';
                } else {
                    for (let i = 0; i < keys.length; i++) {
                        const g = grouped[keys[i]];
                        invHtml += '<span style="display:inline-block;background:rgba(255,136,0,0.15);border:1px solid #f80;border-radius:4px;padding:3px 8px;margin:2px;font-size:12px;color:#f80;">' + g.icon + ' ' + g.name + ': ' + g.count + '</span>';
                    }
                }
            }

            let html = ''
                + '<div style="background:rgba(0,0,0,0.6);border:1px solid #666;border-radius:6px;padding:10px;margin-bottom:15px;grid-column:1/-1;">'
                + '<div style="color:#ff0;font-size:13px;margin-bottom:6px;font-weight:bold;">🎒 ENVANTER</div>'
                + '<div>' + invHtml + '</div>'
                + '</div>';

            const self = this;
            for (let idx = 0; idx < this.recipes.length; idx++) {
                const recipe = this.recipes[idx];
                const costKeys = Object.keys(recipe.costs);
                let costsHtml = '';
                for (let j = 0; j < costKeys.length; j++) {
                    const k = costKeys[j];
                    const item = (typeof ResourceDrops !== 'undefined' && ResourceDrops.items && ResourceDrops.items[k]) || { icon: '?', name: k };
                    const have = self.countMaterial(k);
                    const need = recipe.costs[k];
                    const color = have >= need ? '#0f0' : '#f44';
                    costsHtml += '<span style="color:' + color + ';">' + item.icon + ' ' + item.name + ': ' + have + '/' + need + '</span>';
                    if (j < costKeys.length - 1) costsHtml += ' | ';
                }

                let canCraft = true;
                for (let j = 0; j < costKeys.length; j++) {
                    if (self.countMaterial(costKeys[j]) < recipe.costs[costKeys[j]]) { canCraft = false; break; }
                }

                const borderColor = canCraft ? '#f80' : '#444';
                const btnBg = canCraft ? '#f80' : '#333';
                const btnColor = canCraft ? '#000' : '#666';
                const btnText = canCraft ? 'CRAFT' : 'YETERSIZ';

                html += '<div style="background:rgba(40,20,0,0.6);border:2px solid ' + borderColor + ';border-radius:8px;padding:12px;">'
                    + '<div style="font-size:24px;">' + recipe.icon + '</div>'
                    + '<div style="color:#f80;font-weight:bold;margin:5px 0;">' + recipe.name + '</div>'
                    + '<div style="font-size:11px;color:#888;margin:5px 0;">' + costsHtml + '</div>'
                    + '<button class="craft-btn" data-idx="' + idx + '" ' + (canCraft ? '' : 'disabled') + ' style="width:100%;padding:8px;margin-top:8px;background:' + btnBg + ';color:' + btnColor + ';border:none;border-radius:4px;cursor:' + (canCraft ? 'pointer' : 'default') + ';font-weight:bold;font-family:inherit;">' + btnText + '</button>'
                    + '</div>';
            }

            list.innerHTML = html;

            // For dongusu ile event baglama (onclick YOK)
            const buttons = list.querySelectorAll('.craft-btn');
            for (let i = 0; i < buttons.length; i++) {
                const btn = buttons[i];
                btn.addEventListener('click', function(e) {
                    const idx = parseInt(e.target.dataset.idx);
                    self.craftRecipeByIdx(idx);
                });
            }
        } finally {
            this._rendering = false;
        }
    },

    countMaterial(id) {
        if (typeof Inventory === 'undefined') return 0;
        for (let i = 0; i < Inventory.items.length; i++) {
            if (Inventory.items[i].id === id) return Inventory.items[i].count || 1;
        }
        return 0;
    },

    craftRecipeByIdx(idx) {
        const recipe = this.recipes[idx];
        if (!recipe) return;

        const costKeys = Object.keys(recipe.costs);
        for (let i = 0; i < costKeys.length; i++) {
            const k = costKeys[i];
            if (this.countMaterial(k) < recipe.costs[k]) {
                if (typeof Effects !== 'undefined') Effects.addKillFeed('Yetersiz malzeme', '#f44');
                return;
            }
        }

        for (let i = 0; i < costKeys.length; i++) {
            const k = costKeys[i];
            let need = recipe.costs[k];
            while (need > 0) {
                let found = null;
                for (let j = 0; j < Inventory.items.length; j++) {
                    if (Inventory.items[j].id === k) { found = Inventory.items[j]; break; }
                }
                if (!found) break;
                const take = Math.min(need, found.count || 1);
                Inventory.removeItem(found, take);
                need -= take;
            }
        }

        if (recipe.reward.type === 'item') {
            if (typeof Inventory !== 'undefined') {
                Inventory.addItem({
                    id: recipe.reward.item, name: recipe.name, icon: recipe.icon,
                    type: 'material', weight: 0.2, stackable: true, count: recipe.reward.amount || 1
                });
            }
        } else if (recipe.reward.type === 'ammo') {
            if (typeof Weapons !== 'undefined') {
                const def = Weapons.definitions.find(d => d.id === recipe.reward.weapon);
                if (def) def.reserveAmmo = (def.reserveAmmo || 0) + recipe.reward.amount;
            }
        } else if (recipe.reward.type === 'grenade') {
            if (typeof Weapons !== 'undefined') {
                const grenDef = Weapons.definitions.find(d => d.isGrenade);
                if (grenDef) grenDef.ammo = 1;
            }
        }

        if (typeof Achievements !== 'undefined') {
            Achievements.check('craft', { item: recipe.reward.type === 'item' ? recipe.reward.item : (recipe.reward.type === 'grenade' ? 'grenade' : 'ammo') });
        }
        if (typeof Effects !== 'undefined') Effects.addKillFeed('✅ ' + recipe.name + ' craft edildi', '#0f0');

        const self = this;
        setTimeout(function() { self.renderRecipes(); }, 10);
    },

    reset() {
        this.open = false;
        if (this.uiElement) this.uiElement.style.display = 'none';
        this.holdTime = 0;
        this.holdingMouse = false;
        this._rendering = false;
    }
};

const Merchant = {

    createUI() {

        p.innerHTML = ''
            + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">'
            + '<h2 style="color:#ffdd00;margin:0;letter-spacing:3px;">🏪 TUCCAR</h2>'

        document.body.appendChild(p);

        document.getElementById('merchant-close-btn').addEventListener('click', () => this.close());
    },

    onBreakStart() {

            this.spawnedThisBreak = false;
            return;
        }
        this.spawnedThisBreak = true;
        setTimeout(() => {
            if (typeof Effects !== 'undefined') Effects.addKillFeed('🏪 Tuccar geldi! (E)', '#ffdd00');
        }, 2000);

        if (!this._keyBound) {
            this._keyBound = true;
            document.addEventListener('keydown', (e) => {
                if (e.code === 'KeyE' && this.spawnedThisBreak && typeof Stage !== 'undefined' && Stage.isBreakTime) {
                    this.open();
                }
            });

    onBreakEnd() {
        this.spawnedThisBreak = false;
        this.close();

    open() {
        if (!this.spawnedThisBreak) return;
        this.active = true;
        this.panel.style.display = 'block';

        this.renderItems();
        const coinEl = document.getElementById('merchant-coins');

        try {
            const list = document.getElementById('merchant-items');

            const coins = window.HamidoCoins || 0;

            for (let idx = 0; idx < this.items.length; idx++) {
                const it = this.items[idx];
                const canBuy = coins >= it.price;
                html += '<div style="background:rgba(40,30,0,0.7);border:2px solid ' + (canBuy ? '#ffdd00' : '#444') + ';border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;">'

                    const idx = parseInt(e.target.dataset.idx);
                    self.buyByIdx(idx);
                });
            }
        } finally {
            this._rendering = false;
        }
    },

    buyByIdx(idx) {
        const it = this.items[idx];
        if (!it) return;
        const coins = window.HamidoCoins || 0;
        if (coins < it.price) return;

        window.HamidoCoins = coins - it.price;
        const coinEl = document.getElementById('merchant-coins');
        if (coinEl) coinEl.textContent = window.HamidoCoins;
        const hudCoin = document.getElementById('hamido-coins');
        if (hudCoin) hudCoin.textContent = window.HamidoCoins;

        if (it.ammoType) {
            if (typeof Weapons !== 'undefined') {
                const def = Weapons.definitions.find(d => d.id === it.ammoType);
                if (def) def.reserveAmmo = (def.reserveAmmo || 0) + it.amount;
            }
            if (typeof Effects !== 'undefined') Effects.addKillFeed('+ ' + it.amount + ' ' + it.name, '#0f0');
        } else if (it.id === 'grenade') {
            if (typeof Weapons !== 'undefined') {
                const def = Weapons.definitions.find(d => d.isGrenade);
                if (def) def.ammo = 1;
            }
            if (typeof Effects !== 'undefined') Effects.addKillFeed('Bomba alindi', '#0f0');
        } else {
            if (typeof Inventory !== 'undefined') {
                Inventory.addItem({
                    id: it.id, name: it.name, icon: it.icon,
                    type: 'material', weight: 0.2, stackable: true, count: it.amount || 1
                });
            }
            if (typeof Effects !== 'undefined') Effects.addKillFeed(it.name + ' alindi', '#0f0');
        }

        if (typeof Achievements !== 'undefined') Achievements.check('merchant_purchase');

        const self = this;
        setTimeout(function() { self.renderItems(); }, 10);
    }
};

// 1 stage savaş + 1 dakika hazırlık/ara
const Stage = {

    isBreakTime: false,
    breakTimeRemaining: 0,
    breakDuration: 60,  // 60 saniye ara
    stageActive: false,
    breakOverlay: null,
    breakTimerElement: null,

    init() {
        this.createBreakOverlay();
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyQ' && this.isBreakTime) {
                this.skipBreak();
                Effects.addKillFeed('⏩ Ara zaman atlandı', '#0ff');

        });
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyQ' && this.isBreakTime) {
                this.skipBreak();
                Effects.addKillFeed('⏩ Ara zaman atlandı', '#0ff');
            }
        });

        // Q tuşu — break'i erken bitir
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyQ' && this.isBreakTime) {
                this.skipBreak();
                Effects.addKillFeed('⏩ Ara zaman atlandı', '#0ff');
            }
        });
    },

    createBreakOverlay() {
        // Ara zaman overlay (üstte küçük gösterge)
        const overlay = document.createElement('div');
        overlay.id = 'break-overlay';
        overlay.style.cssText = `
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #0ff;
            border-radius: 10px;
            padding: 15px 40px;
            z-index: 80;
            display: none;
            font-family: 'Courier New', monospace;
            text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.5);
        `;
        overlay.innerHTML = `
            <div style="color: #0ff; font-size: 18px; letter-spacing: 4px; font-weight: bold;">⏸️ ARA ZAMAN</div>
            <div id="break-timer" style="color: #fff; font-size: 36px; font-weight: bold; margin-top: 5px;">1:00</div>
            <div style="color: #8f8; font-size: 12px; margin-top: 5px;">Hazırlan! Sonraki dalga başlıyor...</div>
        `;
        document.body.appendChild(overlay);
        this.breakOverlay = overlay;
        this.breakTimerElement = document.getElementById('break-timer');
    },

    // Stage başlat
    startStage() {
        this.stageActive = true;
        this.isBreakTime = false;
        this.breakOverlay.style.display = 'none';
        if (typeof Enemy !== 'undefined') {
            Enemy.wave = this.currentStage;
            Enemy.startWave();
        }
        Effects.addKillFeed('LEVEL ' + this.currentStage + ' BASLIYOR', '#f00');
    },

    // Stage bitti → Ara zaman başlat
    endStage() {
        this.stageActive = false;
        this.isBreakTime = true;
        this.breakTimeRemaining = this.breakDuration;

        // Kalan zombileri temizle
        if (typeof Enemy !== 'undefined' && Enemy.list) {
            for (let i = Enemy.list.length - 1; i >= 0; i--) {
                const e = Enemy.list[i];
                if (e && e.mesh) {
                    if (e.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(e.physicsId);
                    if (typeof EntBridge !== 'undefined') EntBridge.killZombie(e);
                    if (Enemy.scene) Enemy.scene.remove(e.mesh);
                }
            }
            Enemy.list = [];
        }

        // Kamikazeleri temizle
        if (typeof Kamikaze !== 'undefined' && Kamikaze.list) {
            for (let i = Kamikaze.list.length - 1; i >= 0; i--) {
                const k = Kamikaze.list[i];
                if (k && k.mesh) {
                    if (k.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(k.physicsId);
                    if (typeof EntBridge !== 'undefined') EntBridge.killKamikaze(k);
                    if (Kamikaze.scene) Kamikaze.scene.remove(k.mesh);
                }
            }
            Kamikaze.list = [];
            Kamikaze.currentCount = 0;
        }

        this.breakOverlay.style.display = 'block';
        this.updateTimer();
        if (typeof Merchant !== 'undefined') {
            try { Merchant.onBreakStart(); } catch(e) {}
        }
        
        Effects.addKillFeed(`✅ STAGE ${this.currentStage} BİTTİ!`, '#0f0');
        Effects.addKillFeed(`⏸️ ${this.breakDuration} saniye ara zaman`, '#0ff');
        
        // Başarım
        if (typeof Achievements !== 'undefined') {
            Achievements.check('wave_complete', { wave: this.currentStage });
        }
    },

    // Ara zaman update
    update(dt) {
        if (!this.isBreakTime) return;
        
        this.breakTimeRemaining -= dt;
        
        if (this.breakTimeRemaining <= 0) {
            if (typeof Merchant !== 'undefined') {
            try { Merchant.onBreakEnd(); } catch(e) {}
        }
        this.currentStage++;
            this.startStage();
        } else {
            this.updateTimer();
        }
    },

    updateTimer() {
        if (!this.breakTimerElement) return;
        
        const total = Math.max(0, Math.ceil(this.breakTimeRemaining));
        const mins = Math.floor(total / 60);
        const secs = total % 60;
        this.breakTimerElement.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
    },

    // Ara zamanı erken bitir
    skipBreak() {
        if (this.isBreakTime) {
            this.breakTimeRemaining = 0;
        }
    },

    reset() {
        this.currentStage = 1;
        this.isBreakTime = false;
        this.breakTimeRemaining = 0;
        this.stageActive = false;
        if (this.breakOverlay) this.breakOverlay.style.display = 'none';
    }
};

﻿// ===== KAMİKAZE — SG-PHY + ENT =====
const Kamikaze = {
    scene: null,
    list: [],
    currentCount: 0,
    speed: 8.0,
    health: 40,
    damage: 60,
    explosionRadius: 5,
    triggerDistance: 3.5,
    fuseTime: 1.2,

    init(scene) {
        this.scene = scene;
        this.currentCount = 0;
    },

    calculateCountForWave(wave) {
        if (wave < 2) return 0;
        return wave - 1;
    },

    rng() {
        if (typeof SGGame !== 'undefined' && SGGame.rng) return SGGame.rng.next();
        return Math.random();
    },

    spawn(x, z, wave) {
        const group = new THREE.Group();
        group.userData.isEnemy = true;
        group.userData.isKamikaze = true;

        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff2222, emissive: 0xaa0000, emissiveIntensity: 0.8, roughness: 0.5 });
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a0000, emissive: 0x330000, emissiveIntensity: 0.5, roughness: 0.7 });
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.4, 0.55), bodyMat);
        body.position.y = 0.75;
        body.castShadow = true;
        group.add(body);

        const bomb = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.3, 0.4), darkMat);
        bomb.position.set(0, 1.55, 0);
        group.add(bomb);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), bodyMat);
        head.position.y = 2.05;
        head.castShadow = true;
        group.add(head);

        const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 0.1), eyeMat);
        eye1.position.set(-0.15, 2.1, -0.31);
        group.add(eye1);
        const eye2 = eye1.clone();
        eye2.position.x = 0.15;
        group.add(eye2);

        const lArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.5, 0.22), bodyMat);
        lArm.position.set(-0.6, 1.3, 0);
        group.add(lArm);
        const rArm = lArm.clone();
        rArm.position.x = 0.6;
        group.add(rArm);

        const lLeg = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.55, 0.28), darkMat);
        lLeg.position.set(-0.2, 0.28, 0);
        group.add(lLeg);
        const rLeg = lLeg.clone();
        rLeg.position.x = 0.2;
        group.add(rLeg);

        group.userData.parts = { lLeg, rLeg, lArm, rArm, body, head };
        group.userData.animPhase = this.rng() * Math.PI * 2;
        group.userData.lastBeep = 0;
        group.scale.set(1.5, 1.5, 1.5);
        group.position.set(x, 0, z);
        this.scene.add(group);

        const phys = (typeof PhysicsBridge !== 'undefined' && PhysicsBridge._inited)
            ? PhysicsBridge.addEnemy(group, 0.4, 1.0, 50)
            : null;

        const enemy = {
            mesh: group,
            physicsId: phys ? phys.id : null,
            health: this.health + wave * 5,
            maxHealth: this.health + wave * 5,
            speed: this.speed + wave * 0.2,
            lastAttack: 0,
            walking: true,
            isKamikaze: true,
            triggered: false,
            triggeredTime: 0,
            exploded: false
        };

        this.list.push(enemy);
        this.currentCount++;
        if (typeof EntBridge !== 'undefined') EntBridge.addKamikaze(enemy);
        Effects.addKillFeed('💣 DİKKAT! Kamikaze zombi!', '#f00');
        return enemy;
    },

    update(dt, playerPos) {
        const now = performance.now();

        for (let i = this.list.length - 1; i >= 0; i--) {
            const e = this.list[i];
            if (!e || !e.mesh) continue;

            const targetPos = (typeof Vehicle !== 'undefined' && Vehicle.onVehicle)
                ? Vehicle.mesh.position : playerPos;

            const dir = new THREE.Vector3().subVectors(targetPos, e.mesh.position);
            dir.y = 0;
            const dist = dir.length();
            dir.normalize();

            e.mesh.lookAt(targetPos.x, e.mesh.position.y, targetPos.z);

            if (!e.triggered && dist < this.triggerDistance) {
                e.triggered = true;
                e.triggeredTime = now;
                Effects.addKillFeed('⚠️ PATLAYACAK!', '#f00');
            }

            if (e.triggered) {
                const elapsed = (now - e.triggeredTime) / 1000;
                if (elapsed >= this.fuseTime) {
                    this.explode(e);
                    this.list.splice(i, 1);
                    continue;
                }
                if (e.mesh.userData.parts.body) {
                    const flash = (Math.sin(now * 0.03) > 0) ? 0xffffff : 0xff2222;
                    e.mesh.userData.parts.body.material.emissive.setHex(flash);
                }
            }

            if (dist > 1.2) {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') {
                    PhysicsBridge.setEnemyVelocity(e.physicsId, dir.x * e.speed, dir.z * e.speed);
                } else {
                    e.mesh.position.x += dir.x * e.speed * dt;
                    e.mesh.position.z += dir.z * e.speed * dt;
                }
                const phase = e.mesh.userData.animPhase + now * 0.015;
                const swing = Math.sin(phase) * 0.5;
                if (e.mesh.userData.parts.lLeg) e.mesh.userData.parts.lLeg.rotation.x = swing;
                if (e.mesh.userData.parts.rLeg) e.mesh.userData.parts.rLeg.rotation.x = -swing;
                if (e.mesh.userData.parts.lArm) e.mesh.userData.parts.lArm.rotation.x = -1.5;
                if (e.mesh.userData.parts.rArm) e.mesh.userData.parts.rArm.rotation.x = -1.5;
            } else {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') {
                    PhysicsBridge.setEnemyVelocity(e.physicsId, 0, 0);
                }
            }
        }
    },

    explode(enemy) {
        const pos = enemy.mesh.position.clone();
        pos.y += 0.8;
        const radius = this.explosionRadius * 5;   // 5x (normalde 5 → 25m)

        // === NÜKLEER GÖRSEL ===
        try {
            Particles.explosion(pos, radius * 1.5);
            Particles.burst(pos, {
                count: 300, color: 0xff2200, size: 0.8, spread: 5.0,
                speed: 40, gravity: -6, life: 2.5, additive: true
            });
            Particles.burst(pos, {
                count: 150, color: 0xffaa00, size: 0.6, spread: 3.5,
                speed: 30, gravity: -5, life: 2.0, additive: true
            });
            Particles.burst(pos, {
                count: 100, color: 0xffffff, size: 0.5, spread: 3.0,
                speed: 35, gravity: -4, life: 1.8, additive: true
            });
            Particles.burst(pos, {
                count: 80, color: 0xffff00, size: 0.4, spread: 2.0,
                speed: 25, gravity: -3, life: 1.5, additive: true
            });
        } catch (e) {}

        // Mega ışık + flash
        const light = new THREE.PointLight(0xffaa00, 80, 80);
        light.position.copy(pos);
        this.scene.add(light);
        const light2 = new THREE.PointLight(0xffffff, 60, 60);
        light2.position.copy(pos);
        light2.position.y += 2;
        this.scene.add(light2);
        let t = 0;
        const fadeLight = () => {
            t += 0.04;
            light.intensity = Math.max(0, 80 - t * 100);
            light2.intensity = Math.max(0, 60 - t * 80);
            if (t < 1.2) requestAnimationFrame(fadeLight);
            else { this.scene.remove(light); this.scene.remove(light2); }
        };
        fadeLight();

        Effects.shake(3.0);
        if (Audio.playExplosion) Audio.playExplosion();
        if (Audio.playExplosion) setTimeout(() => Audio.playExplosion(), 150);

        // === FİZİK: 10x güç ===
        if (typeof PhysicsBridge !== 'undefined' && PhysicsBridge.applyExplosion) {
            PhysicsBridge.applyExplosion(pos.x, pos.y, pos.z, 100, radius);
        }

        // === TÜM ZOMBİLER ÖLSÜN (menzilde) ===
        for (let i = Enemy.list.length - 1; i >= 0; i--) {
            const other = Enemy.list[i];
            if (!other || !other.mesh) continue;
            const dx = other.mesh.position.x - pos.x;
            const dz = other.mesh.position.z - pos.z;
            const d2 = dx*dx + dz*dz;
            if (d2 < radius * radius) {
                Enemy.kill(other, pos, { zone: 'body' });
            }
        }

        // Zincirleme kamikaze
        for (const other of this.list) {
            if (other === enemy || !other.mesh) continue;
            const dx = other.mesh.position.x - pos.x;
            const dz = other.mesh.position.z - pos.z;
            if (dx*dx + dz*dz < radius * radius) {
                if (!other.triggered) {
                    other.triggered = true;
                    other.triggeredTime = performance.now() - 700;
                }
            }
        }

        // === PLAYER: 50 can + uzağa fırlat ===
        if (typeof Player !== 'undefined') {
            const dx = Player.position.x - pos.x;
            const dz = Player.position.z - pos.z;
            const pd = Math.sqrt(dx*dx + dz*dz);
            if (pd < radius) {
                if (Player.takeDamage(50)) Game.gameOver();

                const pb = PhysicsBridge.getPlayerBody();
                if (pb) {
                    const d = pd || 0.01;
                    const nx = dx / d, nz = dz / d;
                    const strength = 80 * (1 - pd / radius);
                    pb.vx = nx * strength * 3;
                    pb.vz = nz * strength * 3;
                    pb.vy = 25;
                }
            }
        }

        // Temizlik
        if (enemy.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(enemy.physicsId);
        if (typeof EntBridge !== 'undefined') EntBridge.killKamikaze(enemy);

        this.scene.remove(enemy.mesh);
        this.currentCount--;
        Effects.addKillFeed('NUKLEER PATLAMA!', '#f00');
        if (typeof Stats !== 'undefined') Stats.registerKill(false, false);
    },

    damage(enemy, amount, hitPoint) {
        if (!enemy || !enemy.mesh) return;
        enemy.health -= amount;
        if (hitPoint) {
            try { Particles.bloodBurst(hitPoint, 1, false); } catch (e) {}
        }
        if (enemy.health <= 0) {
            const idx = this.list.indexOf(enemy);
            if (idx > -1) {
                this.list.splice(idx, 1);
                this.currentCount--;
                if (enemy.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(enemy.physicsId);
                if (typeof EntBridge !== 'undefined') EntBridge.killKamikaze(enemy);
                this.scene.remove(enemy.mesh);
                Effects.addKillFeed('💀 Kamikaze öldürüldü!', '#0f0');
                if (typeof Stats !== 'undefined') Stats.registerKill(false, false);
                try { Ragdoll.createFromEnemy(enemy, hitPoint, new THREE.Vector3(0, 1, 0), 10); } catch (e) {}
            }
        }
    },

    spawnForWave(wave) {
        const count = this.calculateCountForWave(wave);
        if (count > 0) Effects.addKillFeed('💣 ' + count + ' kamikaze zombi!', '#f80');
        for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2 + this.rng() * 0.5;
            const radius = 100 + this.rng() * 20;
            this.spawn(Math.cos(angle) * radius, Math.sin(angle) * radius, wave);
        }
        return count;
    },

    reset() {
        this.list.forEach(e => {
            if (e && e.mesh) {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(e.physicsId);
                if (typeof EntBridge !== 'undefined') EntBridge.killKamikaze(e);
                this.scene.remove(e.mesh);
            }
        });
        this.list = [];
        this.currentCount = 0;
    }
};

//  player.js 
// ============================================================ 
﻿// ===== OYUNCU — SG-PHY tabanli =====
const Player = {
    health: 100,
    maxHealth: 100,
    position: new THREE.Vector3(2, 1.7, 5),
    yaw: 0,
    pitch: 0,
    speed: 6,
    sprintSpeed: 11,
    jumpPower: 8,
    keys: {},
    isSprinting: false,
    lastDamageTime: 0,
    eyeHeight: 1.7,
    jumpCooldown: 0,
    isMoving: false,
    onGround: true,
    regenDelay: 10000,
    regenRate: 5,
    regenTimer: 0,
    exteriorView: false,
    _bodyReady: false,
    _startTime: 0,
    _lastFootprintCheck: 0,

    _forceBody() {
        if (typeof PhysicsBridge === 'undefined') return;
        if (!PhysicsBridge._inited) return;
        if (this._bodyReady) return;
        PhysicsBridge.addPlayer(this.position.x, this.position.y - this.eyeHeight + 0.95, this.position.z);
        this._bodyReady = true;
        console.log('🧍 Player body zorla olusturuldu');
    },

    init(camera) {
        this.camera = camera;

        document.addEventListener('keydown', (e) => {
            this.keys[e.code] = true;
            if (e.code === 'KeyC' && typeof PlayerBody !== 'undefined') PlayerBody.toggleView();
            if (e.code === 'KeyR' && !(typeof Vehicle !== 'undefined' && Vehicle.onVehicle)) {
                if (typeof PlayerBody !== 'undefined') PlayerBody.toggleView();
            }
        });
        document.addEventListener('keyup', (e) => this.keys[e.code] = false);

        // Body olustur
        try { this._forceBody(); } catch (e) { console.warn('_forceBody:', e); }
    },

    ensureBody() {
        if (this._bodyReady) return;
        this._forceBody();
    },

    update(dt) {
        if (!this._bodyReady) this._forceBody();

        if (typeof Vehicle !== 'undefined' && Vehicle.onVehicle) {
            if (typeof PlayerBody !== 'undefined') PlayerBody.update(dt, false, false, true, 0);
            this.regenUpdate(dt);
            return;
        }

        const forward = new THREE.Vector3(-Math.sin(this.yaw), 0, -Math.cos(this.yaw));
        const right = new THREE.Vector3(Math.cos(this.yaw), 0, -Math.sin(this.yaw));

        this.isSprinting = (this.keys['ShiftLeft'] || this.keys['ShiftRight']) &&
                          (this.keys['KeyW'] || this.keys['KeyA'] || this.keys['KeyS'] || this.keys['KeyD']);
        const currentSpeed = this.isSprinting ? this.sprintSpeed : this.speed;

        const sprintEl = document.getElementById('sprint-indicator');
        if (sprintEl) {
            if (this.isSprinting && this.onGround) sprintEl.classList.add('active');
            else sprintEl.classList.remove('active');
        }

        const move = new THREE.Vector3();
        if (this.keys['KeyW']) move.add(forward);
        if (this.keys['KeyS']) move.sub(forward);
        if (this.keys['KeyD']) move.add(right);
        if (this.keys['KeyA']) move.sub(right);
        this.isMoving = move.length() > 0;

        const body = PhysicsBridge.getPlayerBody();
        if (body && this._bodyReady) {
            if (this.isMoving) {
                move.normalize().multiplyScalar(currentSpeed);
                PhysicsBridge.setPlayerVelocity(move.x, undefined, move.z);
            } else {
                PhysicsBridge.setPlayerVelocity(0, undefined, 0);
            }

            if (this.keys['Space'] && this.onGround && this.jumpCooldown <= 0) {
                PhysicsBridge.setPlayerVelocity(body.vx, this.jumpPower, body.vz);
                this.onGround = false;
                this.jumpCooldown = 0.2;
                Audio.playJump();
            }
            if (this.jumpCooldown > 0) this.jumpCooldown -= dt;

            this.position.x = body.x;
            this.position.y = body.y + 0.8;
            this.position.z = body.z;
            this.onGround = PhysicsBridge.isPlayerGrounded();

            // FAILSAFE
            if (body.y < -5) {
                console.warn('⚠️ Player dustu, reset');
                body.y = 0.9; body.vy = 0; body.vx = 0; body.vz = 0;
                body.x = 2; body.z = 5;
            }

            if (this.onGround && body.vy < -4) {
                Audio.playLand();
                Effects.shake(0.05);
            }
        }

        // Kamera
        if (this.isMoving && this.onGround) {
            const bobAmount = this.isSprinting ? 0.05 : 0.025;
            const bobY = Math.sin(performance.now() * (this.isSprinting ? 0.015 : 0.01)) * bobAmount;
            this.camera.position.set(this.position.x, this.position.y + bobY, this.position.z);
        } else {
            this.camera.position.copy(this.position);
        }

        this.camera.rotation.order = 'YXZ';
        this.camera.rotation.y = this.yaw;
        this.camera.rotation.x = this.pitch;

        if (typeof PlayerBody !== 'undefined') {
            PlayerBody.update(dt, this.isMoving, this.isSprinting, this.onGround, body ? body.vy : 0);
        }

        // Ayak izi
        if (this.isMoving && this.onGround && typeof Decals !== 'undefined') {
            if (performance.now() - this._lastFootprintCheck > 100) {
                this._lastFootprintCheck = performance.now();
                Decals.addFootprint(this.position, -this.yaw);
            }
        }

        this.regenUpdate(dt);
    },

    regenUpdate(dt) {
        const timeSinceDamage = performance.now() - this.lastDamageTime;
        if (timeSinceDamage > this.regenDelay && this.health < this.maxHealth) {
            this.regenTimer += dt;
            if (this.regenTimer >= 1.0) {
                this.regenTimer = 0;
                this.health = Math.min(this.maxHealth, this.health + this.regenRate);
                const hpBar = document.getElementById('hp-bar');
                const hpText = document.getElementById('health');
                if (hpBar) hpBar.style.width = ((this.health / this.maxHealth) * 100) + '%';
                if (hpText) hpText.textContent = Math.round(this.health);
            }
        } else {
            this.regenTimer = 0;
        }
    },

    takeDamage(amount) {
        this.health -= amount;
        this.lastDamageTime = performance.now();
        this.regenTimer = 0;
        if (typeof Achievements !== 'undefined') Achievements.check('damage_taken', { amount: amount });

        const hpBar = document.getElementById('hp-bar');
        const hpText = document.getElementById('health');
        if (hpBar) hpBar.style.width = Math.max(0, (this.health / this.maxHealth) * 100) + '%';
        if (hpText) hpText.textContent = Math.max(0, Math.round(this.health));

        Effects.shake(0.15);
        Audio.playHurt();

        const overlay = document.getElementById('damage-overlay');
        if (overlay) {
            overlay.classList.add('active');
            setTimeout(() => overlay.classList.remove('active'), 150);
        }
        return this.health <= 0;
    },

    heal(amount) {
        this.health = Math.min(this.maxHealth, this.health + amount);
        const hpBar = document.getElementById('hp-bar');
        const hpText = document.getElementById('health');
        if (hpBar) hpBar.style.width = ((this.health / this.maxHealth) * 100) + '%';

const Enemy = {
    list: [],
    scene: null,
    lastSpawn: 0,
    baseSpeed: 2.5,
    attackRange: 1.8,
    attackCooldown: 1000,
    wave: 1,
    enemiesSpawned: 0,
    enemiesKilled: 0,
    score: 0,
    lastGrowl: 0,
    growlInterval: 3000,
    spawnDelay: 200,
    initialEnemies: 10,
    basePerWave: 4,
    spawnMultiplier: 3.0,
    growthRate: 0.5,
    totalThisWave: 25,
    damageTakenThisWave: false,

    init(scene) {
        this.scene = scene;
    },

    getWaveEnemyCount() {
        const n = this.wave;
        return 2 * n + 18;
    },

    rng() {
        if (typeof SGGame !== 'undefined' && SGGame.rng) return SGGame.rng.next();
        return Math.random();
    },

    spawn() {
        // Kamera arkasında doğur
        let angle, radius, x, z, tries = 0;
        do {
            angle = this.rng() * Math.PI * 2;
            radius = World.spawnRadius + this.rng() * 10;
            x = Math.cos(angle) * radius;
            z = Math.sin(angle) * radius;
            tries++;
            if (typeof Player !== 'undefined' && Player.position && Game.camera) {
                const dx = x - Player.position.x;
                const dz = z - Player.position.z;
                const fwdX = -Math.sin(Player.yaw);
                const fwdZ = -Math.cos(Player.yaw);
                const dot = (dx * fwdX + dz * fwdZ) / (Math.sqrt(dx*dx + dz*dz) || 1);
                if (dot > 0.3) continue;
            }
            break;
        } while (tries < 10);

        const group = ZombieModel.create();
        group.position.set(x, 0, z);
        this.scene.add(group);

        const baseHealth = 300 + (this.wave - 1) * 50;
        const phys = (typeof PhysicsBridge !== 'undefined' && PhysicsBridge._inited)
            ? PhysicsBridge.addEnemy(group, 0.4, 1.0, 60)
            : null;

        const enemyObj = {
            mesh: group,
            physicsId: phys ? phys.id : null,
            health: baseHealth,
            maxHealth: baseHealth,
            speed: this.baseSpeed + (this.wave - 1) * 0.15,
            lastAttack: 0,
            walking: true
        };
        this.list.push(enemyObj);
        this.enemiesSpawned++;
        const el = document.getElementById('enemies');
        if (el) el.textContent = this.list.length + '/' + this.totalThisWave;

        if (typeof EntBridge !== 'undefined') EntBridge.addZombie(enemyObj);
    },

    update(dt, playerPos) {
        const now = performance.now();

        // BREAK sırasında zombi doğmasın
        if (typeof Stage !== 'undefined' && Stage.isBreakTime) {
            return;
        }

        if (this.enemiesSpawned < this.totalThisWave) {
            if (now - this.lastSpawn > this.spawnDelay) {
                this.spawn();
                this.lastSpawn = now;
            }
        }

        if (now - this.lastGrowl > this.growlInterval && this.list.length > 0) {
            Audio.playZombieGrowl();
            this.lastGrowl = now;
        }

        // Dalga bitti mi?
        if (this.enemiesSpawned >= this.totalThisWave && this.list.length === 0) {
            if (typeof Stage !== 'undefined' && Stage.stageActive) {
                if (!this.damageTakenThisWave && typeof Achievements !== 'undefined') {
                    Achievements.check('no_damage_wave');
                }
                this.damageTakenThisWave = false;
                Stage.endStage();
            } else {
                this.nextWave();
            }
        }

        for (let i = this.list.length - 1; i >= 0; i--) {
            const e = this.list[i];
            if (!e || !e.mesh) continue;

            const dir = new THREE.Vector3().subVectors(playerPos, e.mesh.position);
            dir.y = 0;
            const dist = dir.length();
            dir.normalize();

            e.mesh.lookAt(playerPos.x, e.mesh.position.y, playerPos.z);

            if (dist > this.attackRange) {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') {
                    PhysicsBridge.setEnemyVelocity(e.physicsId, dir.x * e.speed, dir.z * e.speed);
                }
                ZombieModel.animateWalk(e.mesh, now * 0.001, e.speed / 2);
            } else {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') {
                    PhysicsBridge.setEnemyVelocity(e.physicsId, 0, 0);
                }
                const parts = e.mesh.userData.parts;
                if (parts) {
                    parts.lUpperArm.rotation.x = -1.3;
                    parts.rUpperArm.rotation.x = -1.3;
                    const attackSwing = Math.sin(now * 0.02) * 0.4;
                    parts.lLowerArm.rotation.x = -0.5 + attackSwing;
                    parts.rLowerArm.rotation.x = -0.5 - attackSwing;
                }
                if (now - e.lastAttack > this.attackCooldown) {
                    e.lastAttack = now;
                    this.damageTakenThisWave = true;
                    if (Player.takeDamage(8)) Game.gameOver();
                }
            }
        }
    },

    damage(enemy, baseDamage, hitPoint, weaponMult) {
        weaponMult = weaponMult || 1;
        if (!enemy || !enemy.mesh) return;

        let zone = { zone: 'body', multiplier: 1.0, label: '', color: 'normal' };
        try {
            if (hitPoint && typeof Hitbox !== 'undefined') zone = Hitbox.test(enemy, hitPoint);
        } catch (e) {}

        const isCritical = this.rng() < 0.10;
        const critMultiplier = isCritical ? 3.0 : 1.0;
        const finalDamage = baseDamage * zone.multiplier * weaponMult * critMultiplier;

        if (typeof Stats !== 'undefined') {
            Stats.registerHit();
            Stats.registerDamage(finalDamage);
        }
        if (typeof Achievements !== 'undefined') {
            Achievements.check('hit');
            if (zone.zone === 'head') Achievements.check('headshot');
            else if (zone.zone === 'heart') Achievements.check('heartshot');
            else Achievements.check('miss');
        }

        if (hitPoint) {
            try { Particles.bloodBurst(hitPoint, zone.zone === 'head' ? 2 : 1, zone.zone === 'head'); } catch (e) {}
            try {
                let numberType = 'normal';
                if (isCritical) numberType = 'critical';
                else if (zone.zone === 'head') numberType = 'head';
                else if (zone.zone === 'heart') numberType = 'heart';
                if (typeof DamageNumbers !== 'undefined') DamageNumbers.show(hitPoint, finalDamage, numberType);
            } catch (e) {}
        }

        const parts = enemy.mesh.userData.parts;
        if (parts) {
            const flashColor = isCritical ? 0xff00ff : zone.zone === 'head' ? 0xffff00 : zone.zone === 'heart' ? 0xff4444 : 0xff8888;
            [parts.head, parts.torso].forEach(p => {
                if (p && p.material) {
                    const orig = p.material.color.getHex();
                    p.material.color.setHex(flashColor);
                    setTimeout(() => { if (p && p.material) p.material.color.setHex(orig); }, 80);
                }
            });
        }

        if (isCritical) Effects.addKillFeed('KRITIK +' + Math.round(finalDamage), '#f0f');
        else if (zone.zone === 'head') Effects.addKillFeed('HEADSHOT +' + Math.round(finalDamage), '#ff0');
        else if (zone.zone === 'heart') Effects.addKillFeed('HEARTSHOT +' + Math.round(finalDamage), '#f44');

        if (isCritical || zone.zone === 'head' || zone.zone === 'heart') Effects.showHitmarker();

        enemy.health -= finalDamage;

        if (enemy.health <= 0) {
            this.kill(enemy, hitPoint, zone);
        }
    },

    kill(enemy, hitPoint, zone) {
        zone = zone || { zone: 'body' };
        const idx = this.list.indexOf(enemy);
        if (idx === -1) return;
        if (!enemy || !enemy.mesh) return;

        const enemyPos = enemy.mesh.position.clone();
        enemyPos.y += 1;
        const isHead = zone.zone === 'head';
        const isHeart = zone.zone === 'heart';

        if (typeof Stats !== 'undefined') Stats.registerKill(isHead, isHeart);
        if (typeof Achievements !== 'undefined') Achievements.check('kill');

        if (typeof Decals !== 'undefined') Decals.addBlood(enemy.mesh.position, isHead ? 0.8 : 0.5);
        if (typeof Syringe !== 'undefined') Syringe.tryDrop(enemy.mesh.position);
        try { if (typeof WeaponDrops !== 'undefined') WeaponDrops.tryDrop(enemy.mesh.position); } catch (e) {}
        try { if (typeof ResourceDrops !== 'undefined') ResourceDrops.tryDrop(enemy.mesh.position); } catch (e) {}

        try {
            Particles.burst(enemyPos, { count: 6, color: 0xaa0000, size: 0.2, spread: 0.5, speed: 4, gravity: -12, life: 0.7 });
        } catch (e) {}

        try {
            if (typeof Ragdoll !== 'undefined') {
                Ragdoll.createFromEnemy(enemy, hitPoint, new THREE.Vector3(0, 0, 1), 4);
            }
        } catch (err) { console.warn('Ragdoll:', err); }

        Audio.playBodyImpact();
        Audio.playEnemyDeath();

        if (enemy.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(enemy.physicsId);
        if (typeof EntBridge !== 'undefined') EntBridge.killZombie(enemy);

        this.list.splice(idx, 1);

        let feedMsg = 'Zombi olduruldu';
        let feedColor = '#ff6';
        if (isHead) { feedMsg = 'HEADSHOT +250'; feedColor = '#ff0'; }
        else if (isHeart) { feedMsg = 'HEARTSHOT +200'; feedColor = '#f44'; }

        this.enemiesKilled++;
        this.score += isHead ? 250 : isHeart ? 200 : 100;

        const en = document.getElementById('enemies');
        if (en) en.textContent = this.list.length + '/' + this.totalThisWave;

        Effects.addKillFeed(feedMsg, feedColor);
    },

    startWave() {
        this.enemiesSpawned = 0;
        this.enemiesKilled = 0;
        this.totalThisWave = 2 * this.wave + 18;
        const w = document.getElementById('wave');
        const e = document.getElementById('enemies');
        if (w) w.textContent = this.wave;
        if (e) e.textContent = '0/' + this.totalThisWave;
        Effects.addKillFeed('LEVEL ' + this.wave + ' - ' + this.totalThisWave + ' ZOMBI', '#ff0');

        // Kamikaze spawn
        if (typeof Kamikaze !== 'undefined') {
            Kamikaze.spawnForWave(this.wave);
        }
    },

    nextWave() {
        this.wave++;
        this.enemiesSpawned = 0;
        this.enemiesKilled = 0;
        this.totalThisWave = 2 * this.wave + 18;
        const w = document.getElementById('wave');
        if (w) w.textContent = this.wave;
        Effects.addKillFeed('LEVEL ' + this.wave + ' - ' + this.totalThisWave + ' ZOMBI', '#ff0');
        Audio.playWaveStart();
        if (typeof Achievements !== 'undefined') Achievements.check('wave_complete', { wave: this.wave });

        if (typeof Kamikaze !== 'undefined') {
            Kamikaze.spawnForWave(this.wave);
        }
    },

    reset() {
        this.list.forEach(e => {
            if (e && e.mesh) {
                if (e.physicsId && typeof PhysicsBridge !== 'undefined') PhysicsBridge.remove(e.physicsId);
                if (typeof EntBridge !== 'undefined') EntBridge.killZombie(e);
                this.scene.remove(e.mesh);
            }
        });
        this.list = [];
        if (typeof Ragdoll !== 'undefined') Ragdoll.clearAll();
        if (typeof Particles !== 'undefined') Particles.clearAll();
        if (typeof DamageNumbers !== 'undefined') DamageNumbers.clearAll();
        this.wave = 1;
        this.enemiesSpawned = 0;
        this.enemiesKilled = 0;
        this.baseSpeed = 2.5;
        this.score = 0;
        this.lastSpawn = 0;
        this.totalThisWave = this.initialEnemies;
        this.damageTakenThisWave = false;
        const w = document.getElementById('wave');
        const s = document.getElementById('score');
        const e = document.getElementById('enemies');
        if (w) w.textContent = 1;
        if (s) s.textContent = 0;
        if (e) e.textContent = '0/' + this.totalThisWave;
    }
};
