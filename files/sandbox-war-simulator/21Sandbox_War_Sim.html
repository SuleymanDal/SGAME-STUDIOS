 color: #8b949e; font-weight: bold; text-align: center; } .unit-count { position: absolute; top: -4px; right: -4px; background: #30363d; color: #fff; border-radius: 50%; width: 14px; height: 14px; font-size: 0.55rem; display: flex; align-items: center; justify-content: center; } #leftPanel .unit-box.active { border-color: var(--red-color, #ff4d4d); background: rgba(255, 77, 77, 0.15); } #rightPanel .unit-box.active { border-color: var(--blue-color, #388bfd); background: rgba(56, 139, 253, 0.15); } .action-box { background: #2d333b; border-color: #444c56; } .icon-triangle { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 10px solid currentColor; } .icon-square { width: 10px; height: 10px; background: currentColor; border-radius: 1px; } .icon-big-square { width: 13px; height: 13px; background: currentColor; border-radius: 2px; } .icon-circle { width: 14px; height: 14px; background: currentColor; border-radius: 50%; } .icon-sniper { width: 2px; height: 12px; background: currentColor; position: relative; } .icon-sniper::after { content: ''; position: absolute; top: 4px; left: -4px; width: 10px; height: 2px; background: currentColor; } #leftPanel .icon-triangle, #leftPanel .icon-square, #leftPanel .icon-big-square, #leftPanel .icon-circle, #leftPanel .icon-sniper { color: var(--red-color, #ff4d4d); } #rightPanel .icon-triangle, #rightPanel .icon-square, #rightPanel .icon-big-square, #rightPanel .icon-circle, #rightPanel .icon-sniper { color: var(--blue-color, #388bfd); } </style></head><body><div id="deviceModal"><h1>SANDBOX WAR SIMULATOR</h1><p>Advanced Tactical Strategy Arena</p><div class="modal-btn-group"><button class="modal-btn" onclick="selectDevice('mobile')">📱 TOUCH / MOBILE</button><button class="modal-btn" onclick="selectDevice('pc')">💻 MOUSE / PC</button></div></div><div id="victoryModal"><div class="victory-card"><div class="victory-title" id="victoryText">RED TEAM WINS!</div><div class="stat-row"><span>Battle Duration:</span><span id="statTime">00:00</span></div><div class="stat-row"><span>Red Remaining:</span><span id="statRedLeft">0</span></div><div class="stat-row"><span>Blue Remaining:</span><span id="statBlueLeft">0</span></div><div class="stat-row"><span>Red Total Damage:</span><span id="statRedDmg">0</span></div><div class="stat-row"><span>Blue Total Damage:</span><span id="statBlueDmg">0</span></div><button class="victory-btn" onclick="closeVictoryModal()">OK</button></div></div><div id="gameContainer"><div id="topBar"><div class="logo-title">SANDBOX WAR</div><div class="top-controls"><select id="mapSelect" onchange="changeMap()"><option value="default">Map: Default</option><option value="desert">Map: Desert</option><option value="canyon">Map: Canyon</option><option value="city">Map: City</option></select><select id="colorSelect" onchange="changeColors()"><option value="default">Color: Red / Blue</option><option value="neon">Color: Orange / Green</option><option value="dark">Color: Purple / Yellow</option></select><button class="btn" onclick="randomizeArmies()">🎲 Random Army</button><button class="btn" onclick="saveLayout()">💾 Save</button><button class="btn" onclick="loadLayout()">📂 Load</button><button class="btn btn-smoke" id="smokeBtn" onclick="toggleSmokeMode()">💨 Smoke Screen</button><button class="btn btn-clear" onclick="clearBoard()">🗑️ Clear</button><button class="btn btn-start" id="startBtn" onclick="toggleBattle()">▶️ START BATTLE</button></div></div><div id="canvasContainer"><div class="side-panel" id="leftPanel"><div class="unit-box action-box" id="red-delete" onclick="selectTool('red', 'delete')" title="Delete Unit"><span style="font-size:1.1rem; color:#f85149;">❌</span></div><div class="unit-box active" onclick="selectTool('red', 'infantry')" id="red-infantry"><div class="icon-triangle"></div><span>Infantry</span><div class="unit-count" id="count-red-infantry">0</div></div><div class="unit-box" onclick="selectTool('red', 'sniper')" id="red-sniper"><div class="icon-sniper"></div><span>Sniper</span><div class="unit-count" id="count-red-sniper">0</div></div><div class="unit-box" onclick="selectTool('red', 'artillery')" id="red-artillery"><div class="icon-square"></div><span>Artillery</span><div class="unit-count" id="count-red-artillery">0</div></div><div class="unit-box" onclick="selectTool('red', 'apc')" id="red-apc"><div class="icon-big-square"></div><span>APC</span><div class="unit-count" id="count-red-apc">0</div></div><div class="unit-box" onclick="selectTool('red', 'tank')" id="red-tank"><div class="icon-circle"></div><span>Tank</span><div class="unit-count" id="count-red-tank">0</div></div><div class="unit-box" onclick="selectTool('red', 'mine')" id="red-mine"><span style="font-size:0.9rem;">💣</span><span>Mine</span><div class="unit-count" id="count-red-mine">0</div></div></div><div class="side-panel" id="rightPanel"><div class="unit-box action-box" id="blue-delete" onclick="selectTool('blue', 'delete')" title="Delete Unit"><span style="font-size:1.1rem; color:#f85149;">❌</span></div><div class="unit-box active" onclick="selectTool('blue', 'infantry')" id="blue-infantry"><div class="icon-triangle"></div><span>Infantry</span><div class="unit-count" id="count-blue-infantry">0</div></div><div class="unit-box" onclick="selectTool('blue', 'sniper')" id="blue-sniper"><div class="icon-sniper"></div><span>Sniper</span><div class="unit-count" id="count-blue-sniper">0</div></div><div class="unit-box" onclick="selectTool('blue', 'artillery')" id="blue-artillery"><div class="icon-square"></div><span>Artillery</span><div class="unit-count" id="count-blue-artillery">0</div></div><div class="unit-box" onclick="selectTool('blue', 'apc')" id="blue-apc"><div class="icon-big-square"></div><span>APC</span><div class="unit-count" id="count-blue-apc">0</div></div><div class="unit-box" onclick="selectTool('blue', 'tank')" id="blue-tank"><div class="icon-circle"></div><span>Tank</span><div class="unit-count" id="count-blue-tank">0</div></div><div class="unit-box" onclick="selectTool('blue', 'mine')" id="blue-mine"><span style="font-size:0.9rem;">💣</span><span>Mine</span><div class="unit-count" id="count-blue-mine">0</div></div></div><canvas id="battleCanvas"></canvas></div></div><script> const canvas = document.getElementById('battleCanvas'); const ctx = canvas.getContext('2d'); let isBattleRunning = false; let selectedRedTool = 'infantry'; let selectedBlueTool = 'infantry'; let redColor = '#ff4d4d'; let blueColor = '#388bfd'; let currentMap = 'default'; let units = []; let projectiles = []; let particles = []; let obstacles = []; let mines = []; let smokes = []; let startTime = 0; let battleTime = 0; let redTotalDamage = 0; let blueTotalDamage = 0; let draggedUnit = null; let isSmokeMode = false; const audioCtx = new (window.AudioContext || window.webkitAudioContext)(); function playSound(type) { if (audioCtx.state === 'suspended') audioCtx.resume(); try { const now = audioCtx.currentTime; if (type === 'infantry_shoot') { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'square'; osc.frequency.setValueAtTime(450, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.04); gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.04); } else if (type === 'sniper_shoot') { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'triangle'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.15); gain.gain.setValueAtTime(0.15, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.15); } else if (type === 'apc_shoot') { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(280, now); osc.frequency.exponentialRampToValueAtTime(80, now + 0.07); gain.gain.setValueAtTime(0.12, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.07); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.07); } else if (type === 'artillery_shoot' || type === 'tank_shoot') { const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, now); osc.frequency.exponentialRampToValueAtTime(30, now + 0.22); gain.gain.setValueAtTime(0.25, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.22); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.22); } else if (type === 'explosion') { const bufferSize = audioCtx.sampleRate * 0.3; const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate); const output = buffer.getChannelData(0); for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1; const whiteNoise = audioCtx.createBufferSource(); whiteNoise.buffer = buffer; const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(600, now); filter.frequency.exponentialRampToValueAtTime(30, now + 0.3); const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.35, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3); whiteNoise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); whiteNoise.start(now); } } catch(e) {} } function resizeCanvas() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; generateMapObstacles(); } window.addEventListener('resize', resizeCanvas); function selectDevice(mode) { document.getElementById('deviceModal').style.display = 'none'; resizeCanvas(); } function changeColors() { const val = document.getElementById('colorSelect').value; if (val === 'default') { redColor = '#ff4d4d'; blueColor = '#388bfd'; } else if (val === 'neon') { redColor = '#ff7b00'; blueColor = '#00e676'; } else if (val === 'dark') { redColor = '#a855f7'; blueColor = '#eab308'; } document.documentElement.style.setProperty('--red-color', redColor); document.documentElement.style.setProperty('--blue-color', blueColor); units.forEach(u => u.color = u.team === 'red' ? redColor : blueColor); } function changeMap() { currentMap = document.getElementById('mapSelect').value; generateMapObstacles(); } function generateMapObstacles() { obstacles = []; const w = canvas.width; const h = canvas.height; if (currentMap === 'desert') { obstacles.push({x: w*0.5, y: h*0.3, r: 40}, {x: w*0.5, y: h*0.7, r: 40}); } else if (currentMap === 'canyon') { obstacles.push({x: w*0.5, y: h*0.2, r: 55}, {x: w*0.5, y: h*0.5, r: 45}, {x: w*0.5, y: h*0.8, r: 55}); } else if (currentMap === 'city') { obstacles.push({x: w*0.35, y: h*0.4, r: 35}, {x: w*0.65, y: h*0.4, r: 35}, {x: w*0.5, y: h*0.65, r: 50}); } } function selectTool(team, tool) { const list = ['infantry', 'sniper', 'artillery', 'apc', 'tank', 'mine', 'delete']; if (team === 'red') { selectedRedTool = tool; list.forEach(t => { const el = document.getElementById(`red-${t}`); if (el) el.classList.toggle('active', t === tool); }); } else { selectedBlueTool = tool; list.forEach(t => { const el = document.getElementById(`blue-${t}`); if (el) el.classList.toggle('active', t === tool); }); } } const UNIT_STATS = { infantry: { hp: 80, maxHp: 80, speed: 1.9, range: 110, cooldown: 24, attackPower: 12, size: 8 }, sniper: { hp: 50, maxHp: 50, speed: 1.4, range: 360, cooldown: 90, attackPower: 65, size: 7 }, artillery: { hp: 70, maxHp: 70, speed: 0.95, range: 280, cooldown: 65, attackPower: 50, size: 10 }, apc: { hp: 180, maxHp: 180, speed: 1.5, range: 150, cooldown: 17, attackPower: 14, size: 13 }, tank: { hp: 320, maxHp: 320, speed: 1.05, range: 180, cooldown: 50, attackPower: 40, size: 16 } }; class Unit { constructor(x, y, team, type) { this.x = x; this.y = y; this.team = team; this.type = type; const stats = UNIT_STATS[type]; this.hp = stats.hp; this.maxHp = stats.maxHp; this.speed = stats.speed; this.range = stats.range; this.cooldownMax = stats.cooldown; this.cooldown = 0; this.attackPower = stats.attackPower; this.size = stats.size; this.color = team === 'red' ? redColor : blueColor; this.angle = team === 'red' ? 0 : Math.PI; this.target = null; } draw() { ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle); ctx.fillStyle = this.color; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1; if (this.type === 'infantry') { ctx.beginPath(); ctx.moveTo(this.size, 0); ctx.lineTo(-this.size / 1.2, -this.size / 1.5); ctx.lineTo(-this.size / 1.2, this.size / 1.5); ctx.closePath(); ctx.fill(); ctx.stroke(); } else if (this.type === 'sniper') { ctx.beginPath(); ctx.moveTo(this.size + 2, 0); ctx.lineTo(-this.size, -this.size / 2); ctx.lineTo(-this.size, this.size / 2); ctx.closePath(); ctx.fill(); ctx.stroke(); } else if (this.type === 'artillery') { const half = this.size / 2; ctx.beginPath(); ctx.rect(-half, -half, this.size, this.size); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#c9d1d9'; ctx.fillRect(0, -2, half + 5, 4); } else if (this.type === 'apc') { const half = this.size / 2; ctx.beginPath(); ctx.rect(-half, -half, this.size, this.size); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -2, half + 6, 4); } else if (this.type === 'tank') { ctx.beginPath(); ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ffffff'; ctx.fillRect(0, -3, this.size / 2 + 7, 6); } ctx.restore(); const barW = this.size * 1.8; const barH = 3; ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(this.x - barW/2, this.y - this.size - 5, barW, barH); ctx.fillStyle = '#2ea043'; ctx.fillRect(this.x - barW/2, this.y - this.size - 5, barW * Math.max(0, (this.hp / this.maxHp)), barH); } update() { if (!isBattleRunning) return; const inSmoke = smokes.some(s => Math.hypot(s.x - this.x, s.y - this.y) < s.r); let closestEnemy = null; let minDist = Infinity; for (let i = 0; i < units.length; i++) { let other = units[i]; if (other.team !== this.team && other.hp > 0) { if (smokes.some(s => Math.hypot(s.x - other.x, s.y - other.y) < s.r)) continue; const dist = Math.hypot(other.x - this.x, other.y - this.y); if (dist < minDist) { minDist = dist; closestEnemy = other; } } } this.target = closestEnemy; if (closestEnemy) { this.angle = Math.atan2(closestEnemy.y - this.y, closestEnemy.x - this.x); if (minDist > this.range) { let nx = this.x + Math.cos(this.angle) * this.speed; let ny = this.y + Math.sin(this.angle) * this.speed; let collide = obstacles.some(o => Math.hypot(o.x - nx, o.y - ny) < o.r + this.size); if (!collide) { this.x = nx; this.y = ny; } } else if (this.cooldown <= 0 && !inSmoke) { projectiles.push(new Projectile(this.x, this.y, closestEnemy, this.team, this.attackPower, this.type)); playSound(`${this.type}_shoot`); this.cooldown = this.cooldownMax; } } for (let i = mines.length - 1; i >= 0; i--) { let m = mines[i]; if (m.active && Math.hypot(m.x - this.x, m.y - this.y) < this.size + 6) { m.active = false; playSound('explosion'); this.takeDamage(130, m.team === 'red' ? 'blue' : 'red'); for (let p = 0; p < 15; p++) particles.push(new Particle(m.x, m.y, '#d97706', 3)); updateCounts(); } } if (this.cooldown > 0) this.cooldown--; } takeDamage(amount, attackerTeam) { this.hp -= amount; if (attackerTeam === 'red') redTotalDamage += amount; else if (attackerTeam === 'blue') blueTotalDamage += amount; } } class Projectile { constructor(sx, sy, targetUnit, team, damage, unitType) { this.x = sx; this.y = sy; this.team = team; this.damage = damage; this.unitType = unitType; if (unitType === 'infantry') { this.radius = 2.5; this.speed = 13; } else if (unitType === 'sniper') { this.radius = 2; this.speed = 22; } else if (unitType === 'apc') { this.radius = 3.5; this.speed = 14; } else if (unitType === 'artillery') { this.radius = 6; this.speed = 9; } else if (unitType === 'tank') { this.radius = 5; this.speed = 11; } const dx = targetUnit.x - sx; const dy = targetUnit.y - sy; const dist = Math.hypot(dx, dy) || 1; this.vx = (dx / dist) * this.speed; this.vy = (dy / dist) * this.speed; this.active = true; } update() { this.x += this.vx; this.y += this.vy; for (let i = 0; i < obstacles.length; i++) { let o = obstacles[i]; if (Math.hypot(o.x - this.x, o.y - this.y) < o.r) { this.active = false; return; } } for (let i = 0; i < units.length; i++) { let u = units[i]; if (u.team !== this.team && u.hp > 0) { if (Math.hypot(u.x - this.x, u.y - this.y) <= u.size + this.radius) { this.hit(u); return; } } } if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.active = false; } hit(directlyHitUnit) { this.active = false; if (this.unitType === 'artillery' || this.unitType === 'tank') { playSound('explosion'); const splashRadius = this.unitType === 'artillery' ? 45 : 30; for (let i = 0; i < 8; i++) particles.push(new Particle(this.x, this.y, '#ff9800', 2.5)); units.forEach(u => { if (u.team !== this.team && Math.hypot(u.x - this.x, u.y - this.y) <= splashRadius) { u.takeDamage(this.damage, this.team); } }); } else { directlyHitUnit.takeDamage(this.damage, this.team); for (let i = 0; i < 3; i++) particles.push(new Particle(this.x, this.y, '#ffffff', 1.2)); } } draw() { ctx.fillStyle = '#ffffff'; ctx.strokeStyle = this.team === 'red' ? redColor : blueColor; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); } } class Particle { constructor(x, y, color, speedMult = 1) { this.x = x; this.y = y; this.color = color; this.radius = Math.random() * 2.5 + 1; this.vx = (Math.random() - 0.5) * 4 * speedMult; this.vy = (Math.random() - 0.5) * 4 * speedMult; this.life = 14; } update() { this.x += this.vx; this.y += this.vy; this.life--; } draw() { ctx.fillStyle = this.color; ctx.globalAlpha = Math.max(0, this.life / 14); ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill(); c
