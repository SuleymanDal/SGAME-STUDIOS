<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>AstroBoom</title><style> body { margin: 0; background-color: #030308; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; touch-action: none; user-select: none; } h1 { margin: 5px 0; font-size: clamp(24px, 5vw, 36px); color: #00ffff; text-shadow: 0 0 10px rgba(0, 255, 255, 0.7), 2px 2px #ff00ff; letter-spacing: 3px; } #gameContainer { position: relative; display: flex; flex-direction: column; align-items: center; width: 100%; } canvas { background-color: #0b0b14; border: 2px solid #1f1f3a; border-radius: 8px; width: 95vw; max-width: 800px; aspect-ratio: 4 / 3; box-shadow: 0 0 25px rgba(0, 255, 255, 0.25); cursor: crosshair; } .footer { position: absolute; bottom: 10px; opacity: 0.3; font-size: clamp(10px, 3vw, 12px); user-select: none; text-align: center; width: 100%; font-family: sans-serif; } </style></head><body><h1>ASTROBOOM</h1><div id="gameContainer"><canvas id="gameCanvas" width="800" height="600"></canvas></div><div class="footer">Powered by SGame Studios -- SGame Studios ©2026</div><script> const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d'); let score = 0; let gameOver = false; let globalSpeedMultiplier = 1.0; // Her saniye artacak genel hız çarpanı let ship = { x: 400, y: 530, width: 45, height: 25, speed: 7 }; let bullets = []; let meteors = []; let particles = []; let stars = []; // Arka plan yıldızları for (let i = 0; i < 100; i++) { stars.push({ x: Math.random() * canvas.width, y: Math.random() * canvas.height, size: Math.random() * 1.5, alpha: Math.random() }); } let keys = { left: false, right: false }; window.addEventListener('keydown', e => { if (gameOver && e.key === 'Enter') resetGame(); if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true; }); window.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false; if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false; }); // Mouse ve Dokunmatik Kontroller canvas.addEventListener('mousemove', e => { let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; ship.x = (e.clientX - rect.left) * scaleX; if (ship.x < ship.width / 2) ship.x = ship.width / 2; if (ship.x > canvas.width - ship.width / 2) ship.x = canvas.width - ship.width / 2; }); canvas.addEventListener('mousedown', () => { if (gameOver) { resetGame(); return; } shoot(); }); canvas.addEventListener('touchstart', e => { e.preventDefault(); if (gameOver) { resetGame(); return; } let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; ship.x = (e.touches[0].clientX - rect.left) * scaleX; shoot(); }, { passive: false }); canvas.addEventListener('touchmove', e => { e.preventDefault(); let rect = canvas.getBoundingClientRect(); let scaleX = canvas.width / rect.width; ship.x = (e.touches[0].clientX - rect.left) * scaleX; if (ship.x < ship.width / 2) ship.x = ship.width / 2; if (ship.x > canvas.width - ship.width / 2) ship.x = canvas.width - ship.width / 2; }, { passive: false }); function createMeteor() { let radius = Math.random() * 20 + 20; let x = Math.random() * (canvas.width - radius * 2) + radius; let vert = Math.floor(Math.random() * 4) + 7; let offs = []; for (let j = 0; j < vert; j++) offs.push(Math.random() * 0.3 + 0.85); meteors.push({ x: x, y: -radius, r: radius, baseSpeed: Math.random() * 1.5 + 1.2, // Temel hız rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.03, vert: vert, offs: offs }); } function createExplosion(x, y, color) { for (let i = 0; i < 12; i++) { let angle = Math.random() * Math.PI * 2; let speed = Math.random() * 3 + 1; particles.push({ x: x, y: y, xv: Math.cos(angle) * speed, yv: Math.sin(angle) * speed, life: 25, maxLife: 25, color: color }); } } function resetGame() { score = 0; gameOver = false; globalSpeedMultiplier = 1.0; ship.x = canvas.width / 2; bullets = []; meteors = []; particles = []; } function shoot() { if (bullets.length < 8) { bullets.push({ x: ship.x, y: ship.y - ship.height / 2, speed: 10 }); } } let meteorSpawnTimer = 0; let frameCount = 0; function update() { // Her 60 karede (yaklaşık 1 saniyede) meteor hızını %1.8 artır if (!gameOver) { frameCount++; if (frameCount >= 60) { globalSpeedMultiplier *= 1.018; frameCount = 0; } } // Partiküller for (let i = particles.length - 1; i >= 0; i--) { let p = particles[i]; p.x += p.xv; p.y += p.yv; p.life--; if (p.life <= 0) particles.splice(i, 1); } if (gameOver) return; if (keys.left) ship.x -= ship.speed; if (keys.right) ship.x += ship.speed; if (ship.x < ship.width / 2) ship.x = ship.width / 2; if (ship.x > canvas.width - ship.width / 2) ship.x = canvas.width - ship.width / 2; for (let i = bullets.length - 1; i >= 0; i--) { bullets[i].y -= bullets[i].speed; if (bullets[i].y < 0) bullets.splice(i, 1); } meteorSpawnTimer++; // Hız arttıkça meteorların gelme sıklığı da orantılı olarak biraz sıklaşır let spawnInterval = Math.max(15, Math.floor(70 / globalSpeedMultiplier)); if (meteorSpawnTimer > spawnInterval) { createMeteor(); meteorSpawnTimer = 0; } // Meteorları Güncelle for (let i = meteors.length - 1; i >= 0; i--) { let m = meteors[i]; // Her saniye artan global hızı baza alarak hareket ettir m.y += m.baseSpeed * globalSpeedMultiplier; m.rot += m.rotSpeed * globalSpeedMultiplier; if (m.y + m.r >= 550) { gameOver = true; createExplosion(ship.x, ship.y, '#ff0055'); break; } for (let j = bullets.length - 1; j >= 0; j--) { let b = bullets[j]; if (Math.hypot(b.x - m.x, b.y - m.y) < m.r) { createExplosion(m.x, m.y, '#ffffff'); bullets.splice(j, 1); meteors.splice(i, 1); score += 20; break; } } } } function draw() { ctx.fillStyle = '#0b0b14'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#fff'; for (let s of stars) { ctx.globalAlpha = s.alpha; ctx.fillRect(s.x, s.y, s.size, s.size); } ctx.globalAlpha = 1.0; ctx.strokeStyle = 'rgba(255, 0, 85, 0.4)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.moveTo(0, 550); ctx.lineTo(canvas.width, 550); ctx.stroke(); ctx.setLineDash([]); for (let p of particles) { ctx.fillStyle = p.color; ctx.globalAlpha = p.life / p.maxLife; ctx.fillRect(p.x, p.y, 3, 3); } ctx.globalAlpha = 1.0; if (!gameOver) { ctx.save(); ctx.translate(ship.x, ship.y); ctx.shadowBlur = 10; ctx.shadowColor = '#00ffff'; ctx.fillStyle = '#0b0b14'; ctx.strokeStyle = '#00ffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, -ship.height / 2); ctx.lineTo(ship.width / 2, ship.height / 2); ctx.lineTo(-ship.width / 2, ship.height / 2); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle = '#ff00ff'; ctx.fillRect(-4, -4, 8, 8); ctx.restore(); } ctx.fillStyle = '#ff00ff'; ctx.shadowBlur = 8; ctx.shadowColor = '#ff00ff'; for (let b of bullets) { ctx.fillRect(b.x - 2, b.y - 8, 4, 12); } ctx.shadowBlur = 0; ctx.strokeStyle = '#b0c4de'; ctx.fillStyle = '#151528'; ctx.lineWidth = 2; for (let m of meteors) { ctx.beginPath(); for (let j = 0; j < m.vert; j++) { let ang = m.rot + (j * Math.PI * 2) / m.vert; let r = m.r * m.offs[j]; let hx = m.x + Math.cos(ang) * r; let hy = m.y + Math.sin(ang) * r; if (j === 0) ctx.moveTo(hx, hy); else ctx.lineTo(hx, hy); } ctx.closePath(); ctx.fill(); ctx.stroke(); } if (gameOver) { ctx.fillStyle = 'rgba(3, 3, 8, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 15; ctx.shadowColor = '#ff0055'; ctx.font = 'bold 50px Courier New'; ctx.textAlign = 'center'; ctx.fillText("LOSS", canvas.width / 2, canvas.height / 2 - 20); ctx.shadowBlur = 0; ctx.font = '18px Courier New'; ctx.fillStyle = '#00ffff'; ctx.fillText("Click or Press Enter to Play Again", canvas.width / 2, canvas.height / 2 + 30); ctx.textAlign = 'left'; } ctx.fillStyle = '#00ffff'; ctx.font = '18px Courier New'; ctx.fillText("SCORE: " + score, 20, 30); // Hız çarpanı göstergesi ctx.fillText("SPEED: " + globalSpeedMultiplier.toFixed(2) + "x", canvas.width - 160, 30); } function loop() { update(); draw(); requestAnimationFrame(loop); } resetGame(); loop(); </script></body></html>
